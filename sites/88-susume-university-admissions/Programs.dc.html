<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Libre+Caslon+Text:wght@400;700&family=Kaushan+Script&display=swap">
<script src="./image-slot.js"></script>
<script src="./motion.js"></script>
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#f2f2ef;color:#1c2633;font-family:"Zen Kaku Gothic New",sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#0b2b4c;text-decoration:none}
a:hover{color:#e5531c}
</style>
</helmet>
<div style="position:relative;overflow:hidden;background-color:#f2f2ef;background-image:radial-gradient(#dcdcd6 1px,transparent 1px);background-size:14px 14px">
<dc-import name="SiteHeader" current="programs" hint-size="100%,140px"></dc-import>
<dc-import name="PageHero" en="Academic Programs" title="学部・学科" lead="学問系統ごとに、学べることと将来の進路をまとめました。興味のある分野から、志望校選びを始めましょう。" img-id="programs-hero" img-label="キャンパスで学ぶ学生" hint-size="100%,520px"></dc-import>

<section data-screen-label="Programs / Fields" style="padding:70px 20px 80px">
  <div style="max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:30px">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-family:'Libre Caslon Text',serif;font-size:14px;display:flex;align-items:center;gap:8px"><span style="width:7px;height:7px;background:#e5531c"></span>Fields of Study</span>
        <h2 style="margin:0;font-size:24px;font-weight:700">学問系統から探す</h2>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
          <button onClick="{{ f.select }}" style="border:1.5px solid #0b2b4c;cursor:pointer;font:inherit;font-size:12px;font-weight:700;padding:7px 14px;border-radius:20px;background:{{ f.bg }};color:{{ f.fg }};transition:background .2s">{{ f.label }}</button>
        </sc-for>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px">
      <sc-for list="{{ fields }}" as="p" hint-placeholder-count="6">
        <article style="background:#fff;border-radius:4px;box-shadow:0 8px 24px rgba(11,43,76,.08);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s" style-hover="transform:translateY(-4px);box-shadow:0 14px 30px rgba(11,43,76,.14)">
          <div style="padding:18px 20px 0;text-align:right">
            <div style="font-size:20px;font-weight:900">{{ p.en }}</div>
            <div style="font-size:11px;font-weight:500">{{ p.ja }}</div>
          </div>
          <div style="padding:10px 0 16px;flex:1">
            <span style="display:inline-block;background:#9fd3dd;color:#0b2b4c;font-size:11px;font-weight:700;padding:4px 14px 4px 20px;margin-left:-6px">{{ p.cat }}</span>
            <p style="margin:12px 20px 0;font-size:13px;line-height:1.8;font-weight:500;text-wrap:pretty">{{ p.desc }}</p>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin:12px 20px 0">
              <sc-for list="{{ p.depts }}" as="d" hint-placeholder-count="3"><span style="font-size:11px;border:1px solid #c9ced6;border-radius:20px;padding:3px 10px">{{ d }}</span></sc-for>
            </div>
            <div style="margin:14px 20px 0;font-size:12px;line-height:1.7;color:#4a5462"><span style="font-weight:700;color:#0b2b4c">主な進路の例：</span>{{ p.careers }}</div>
          </div>
          <div style="position:relative;aspect-ratio:16/9"><image-slot id="{{ p.imgId }}" shape="rect" placeholder="{{ p.img }}"></image-slot></div>
        </article>
      </sc-for>
    </div>
  </div>
</section>

<section data-screen-label="Programs / How to choose" style="background:#0b2b4c;color:#fff;padding:80px 20px">
  <div style="max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:50px;align-items:start">
    <div style="display:flex;flex-direction:column;gap:16px">
      <span style="font-family:'Libre Caslon Text',serif;font-size:14px;display:flex;align-items:center;gap:8px"><span style="width:7px;height:7px;background:#e5531c"></span>How to Choose</span>
      <h2 style="margin:0;font-size:24px;line-height:1.6;font-weight:700">迷ったときの、<br>学部選び3つの視点。</h2>
      <p style="margin:0;font-size:13px;line-height:1.9;opacity:.9">同じ名前の学部でも、大学によって学べる内容や受験科目は異なります。複数の大学を比べてみましょう。</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <sc-for list="{{ views }}" as="v" hint-placeholder-count="3">
        <div style="background:#fff;color:#1c2633;border-radius:4px;padding:22px;display:grid;grid-template-columns:40px 1fr;gap:16px;align-items:start">
          <span style="width:34px;height:34px;background:#e5531c;color:#fff;display:grid;place-items:center;font-weight:900">{{ v.n }}</span>
          <div style="display:flex;flex-direction:column;gap:6px"><h3 style="margin:0;font-size:16px;font-weight:700">{{ v.t }}</h3><p style="margin:0;font-size:13px;line-height:1.8">{{ v.d }}</p></div>
        </div>
      </sc-for>
    </div>
  </div>
</section>

<section style="padding:70px 20px">
  <div style="max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px">
    <p style="margin:0;font-size:18px;font-weight:700;line-height:1.7">志望分野が見えてきたら、<br>入試方式と対策をチェックしましょう。</p>
    <div style="display:flex;flex-wrap:wrap;gap:10px">
      <a href="ExamPrep.dc.html" style="background:#e5531c;color:#fff;font-size:14px;font-weight:700;padding:13px 18px;border-radius:3px">受験対策を見る →</a>
      <a href="Contact.dc.html#request" style="border:1.5px solid #0b2b4c;font-size:14px;font-weight:700;padding:12px 18px;border-radius:3px">資料請求する</a>
    </div>
  </div>
</section>
<dc-import name="SiteFooter" hint-size="100%,340px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { f: 'すべて' };
  renderVals() {
    const all = [
      { en: 'Humanities', ja: '人文科学系', cat: '文系', desc: '言葉、文学、歴史、思想を通して人間と文化を深く理解する。', depts: ['文学部', '外国語学部', '教育学部'], careers: '教員、出版・メディア、一般企業', img: '文学部の講義', imgId: 'f-hum' },
      { en: 'Social Sciences', ja: '社会科学系', cat: '文系', desc: '法律、経済、経営、社会のしくみを学び、社会課題を考える。', depts: ['法学部', '経済学部', '経営学部', '社会学部'], careers: '公務員、金融、一般企業', img: 'ゼミでの議論', imgId: 'f-soc' },
      { en: 'Science', ja: '理学系', cat: '理系', desc: '数学、物理、化学、生物など、自然の原理を実験と理論で探る。', depts: ['数学科', '物理学科', '化学科', '生物学科'], careers: '研究職、教員、技術職', img: '実験室', imgId: 'f-sci' },
      { en: 'Engineering & Informatics', ja: '工学・情報系', cat: '理系', desc: 'ものづくりや情報技術を学び、社会で使われる技術を形にする。', depts: ['工学部', '情報学部', '建築学科'], careers: 'エンジニア、設計、IT企業', img: 'ものづくりの実習', imgId: 'f-eng' },
      { en: 'Health Sciences', ja: '医療・看護・福祉系', cat: '医療・福祉', desc: '専門知識と臨地実習で、命と暮らしを支える力を身につける。', depts: ['医学部', '看護学部', '薬学部', '福祉学部'], careers: '医療職、福祉職、公務員', img: '看護実習', imgId: 'f-med' },
      { en: 'Arts & Sports', ja: '芸術・体育系', cat: '芸術・体育', desc: '表現や身体活動を理論と実技の両面から学ぶ。', depts: ['芸術学部', 'デザイン学科', '体育学部'], careers: 'デザイナー、指導者、教員', img: 'アトリエ・体育館', imgId: 'f-art' }
    ];
    const cur = this.state.f;
    return {
      filters: ['すべて', '文系', '理系', '医療・福祉', '芸術・体育'].map(label => ({ label, select: () => this.setState({ f: label }), bg: label === cur ? '#0b2b4c' : '#fff', fg: label === cur ? '#fff' : '#0b2b4c' })),
      fields: cur === 'すべて' ? all : all.filter(x => x.cat === cur),
      views: [
        { n: '1', t: '「好き」から考える', d: '得意な科目や夢中になれるテーマから、関連する学問系統を探してみましょう。' },
        { n: '2', t: '「将来」から考える', d: 'なりたい職業や働き方から逆算し、必要な資格や学びを確認しましょう。' },
        { n: '3', t: '「入試科目」から考える', d: '受験科目や選抜方式は大学ごとに異なります。募集要項で必ず確認しましょう。' }
      ]
    };
  }
}
</script>
</body>
</html>
