<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="position:relative;padding:30px 20px 120px">
  <div style="position:absolute;left:0;right:0;bottom:0;height:150px;background:#e5531c"></div>
  <div style="position:absolute;right:0;bottom:150px;width:42%;height:40px;background:#e5531c"></div>
  <div style="position:relative;max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:40px;align-items:start">
    <div style="display:flex;flex-direction:column;gap:18px;padding-top:10px">
      <div style="display:flex;gap:8px;font-size:11px;color:#5a6472"><a href="University%20Admissions.dc.html" style="color:#5a6472;text-decoration:none">トップ</a><span>/</span><span style="color:#0b2b4c;font-weight:700">{{ title }}</span></div>
      <span style="font-family:'Libre Caslon Text',serif;font-size:14px;display:flex;align-items:center;gap:8px;color:#0b2b4c"><span style="width:7px;height:7px;background:#e5531c"></span>{{ en }}</span>
      <h1 style="margin:0;font-size:clamp(30px,3.8vw,48px);line-height:1.25;font-weight:900;color:#0b2b4c;letter-spacing:.02em;text-wrap:balance;word-break:keep-all">{{ title }}</h1>
      <p style="margin:0;font-size:14px;line-height:1.9;font-weight:500;max-width:440px;text-wrap:pretty">{{ lead }}</p>
    </div>
    <div style="position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(11,43,76,.12)">
      <image-slot id="{{ imgId }}" shape="rounded" radius="10" placeholder="{{ imgLabel }}"></image-slot>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:520},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Page&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ページタイトル&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;リード文&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;imgId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;page-hero&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;imgLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ページ画像&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
