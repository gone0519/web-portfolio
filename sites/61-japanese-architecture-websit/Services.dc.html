<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<link rel="stylesheet" href="./site.css">
<style>
html{scroll-behavior:smooth}
body{margin:0;font-family:'Noto Sans JP',sans-serif;color:#222;background:#fff;-webkit-font-smoothing:antialiased}
a{color:#14335a;text-decoration:none}
a:hover{color:#2d5f96}
*{box-sizing:border-box}
</style>
</helmet>
<dc-import name="SiteHeader" current="services" style="position:sticky;top:0;z-index:50" hint-size="100%,72px"></dc-import>
<main>
<section data-screen-label="Services / Page hero" style="position:relative;height:clamp(300px,40vw,440px);display:flex;align-items:center;justify-content:center;overflow:hidden;background:#2d5f96">
  <div style="position:absolute;inset:0"><image-slot id="services-hero" shape="rect" src="img/crane-scaffold.jpg" placeholder="ページヒーロー：施工中の構造体"></image-slot></div>
  <sc-if value="{{ tint }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;inset:0;pointer-events:none;background:rgba(32,82,145,.72);mix-blend-mode:multiply"></div></sc-if>
  <div style="position:absolute;inset:0;pointer-events:none;background:rgba(13,36,64,.28)"></div>
  <div style="position:relative;pointer-events:none;color:#fff;text-align:center;display:flex;flex-direction:column;gap:12px;padding:0 20px">
    <h1 style="margin:0;font-family:Montserrat,sans-serif;font-size:clamp(30px,4vw,48px);font-weight:600;letter-spacing:.16em">SERVICES</h1>
    <p style="margin:0;font-size:14px;font-weight:700;letter-spacing:.12em">事業内容</p>
  </div>
  <nav aria-label="パンくずリスト" style="position:absolute;left:clamp(16px,5vw,64px);bottom:20px;display:flex;gap:10px;font-size:11px;color:#fff;letter-spacing:.08em"><a href="Home.dc.html" style="color:#fff" style-hover="opacity:.7">TOP</a><span>›</span><span>事業内容</span></nav>
</section>

<section data-screen-label="Services / Intro" style="padding:clamp(56px,8vw,104px) clamp(16px,5vw,64px) clamp(32px,4vw,48px)">
  <div style="max-width:900px;margin:0 auto;text-align:center;display:flex;flex-direction:column;gap:22px;align-items:center">
    <h2 style="margin:0;font-family:'Shippori Mincho',serif;font-size:clamp(24px,2.8vw,36px);font-weight:600;line-height:1.7;letter-spacing:.08em;color:#0d2440">建物のはじまりから、その先まで。</h2>
    <p style="margin:0;font-size:14px;line-height:2.1;color:#444;text-wrap:pretty">設計・新築・改修から施工管理、竣工後の保守まで。建物のすべての段階をひとつのチームで担うことで、計画の意図をぶれずに最後まで届けます。</p>
    <nav aria-label="サービス一覧" style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px">
      <sc-for list="{{ services }}" as="s" hint-placeholder-count="5">
        <a href="#{{ s.id }}" style="display:flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid #0d2440;color:#0d2440;font-size:12px;font-weight:700;letter-spacing:.06em;transition:background .3s,color .3s" style-hover="background:#0d2440;color:#fff"><span style="font-family:Montserrat,sans-serif;font-size:11px;color:oklch(0.55 0.19 27)">{{ s.no }}</span>{{ s.ja }}</a>
      </sc-for>
    </nav>
  </div>
</section>

<section data-screen-label="Services / List" aria-label="サービス詳細" style="padding:clamp(24px,3vw,40px) clamp(16px,5vw,64px) clamp(64px,9vw,120px)">
  <div style="max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(56px,7vw,104px)">
    <sc-for list="{{ services }}" as="s" hint-placeholder-count="5">
      <article id="{{ s.id }}" data-reveal="" style="scroll-margin-top:96px;display:flex;flex-wrap:wrap;gap:clamp(32px,5vw,72px);align-items:center">
        <div class="svc-img" style="order:{{ s.imgOrder }};flex:1.2 1 420px;position:relative;aspect-ratio:3/2;overflow:hidden;background:#3c6a9c;clip-path:polygon(0 14%,50% 0,100% 14%,100% 100%,0 100%)">
          <image-slot id="svcp-{{ s.id }}" shape="rect" src="{{ s.img }}" placeholder="{{ s.ph }}"></image-slot>
        </div>
        <div style="order:1;flex:1 1 380px;display:flex;flex-direction:column;gap:18px">
          <span style="width:62px;height:62px;border-radius:50%;background:oklch(0.55 0.19 27);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1"><span style="font-family:Montserrat,sans-serif;font-size:8px;font-weight:700;letter-spacing:.12em">SERVICE</span><span style="font-family:Montserrat,sans-serif;font-size:21px;font-weight:700;margin-top:4px">{{ s.no }}</span></span>
          <p style="margin:6px 0 0;font-family:Montserrat,sans-serif;font-size:11px;font-weight:600;letter-spacing:.22em;color:#6a7a8c">{{ s.en }}</p>
          <h2 style="margin:0;font-family:'Shippori Mincho',serif;font-size:clamp(24px,2.6vw,32px);font-weight:600;letter-spacing:.08em;color:#0d2440">{{ s.ja }}</h2>
          <p style="margin:0;font-size:14px;line-height:2.1;color:#444;text-wrap:pretty">{{ s.desc }}</p>
          <ul style="list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border-top:1px solid #e1e5ea">
            <sc-for list="{{ s.items }}" as="it" hint-placeholder-count="4">
              <li style="display:flex;align-items:center;gap:10px;padding:14px 4px;border-bottom:1px solid #e1e5ea;font-size:13px;color:#333"><span style="width:6px;height:6px;background:#2d5f96;transform:rotate(45deg);flex-shrink:0"></span>{{ it }}</li>
            </sc-for>
          </ul>
        </div>
      </article>
    </sc-for>
  </div>
</section>

<section data-screen-label="Services / Flow" aria-labelledby="flow-h" style="background:#f2f3f5;padding:clamp(64px,9vw,120px) clamp(16px,5vw,64px)">
  <div style="max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(40px,5vw,64px)">
    <div style="text-align:center;display:flex;flex-direction:column;gap:10px">
      <h2 id="flow-h" style="margin:0;font-family:Montserrat,sans-serif;font-size:clamp(24px,2.4vw,30px);font-weight:600;letter-spacing:.14em;color:#0d2440">FLOW</h2>
      <p style="margin:0;font-size:13px;font-weight:700;letter-spacing:.1em;color:#0d2440">ご相談から竣工まで</p>
    </div>
    <ol style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px">
      <sc-for list="{{ flow }}" as="f" hint-placeholder-count="6">
        <li data-reveal="" style="background:#fff;padding:32px 20px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px">
          <span style="width:54px;height:54px;border-radius:50%;background:oklch(0.55 0.19 27);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1"><span style="font-family:Montserrat,sans-serif;font-size:8px;font-weight:700;letter-spacing:.12em">STEP</span><span style="font-family:Montserrat,sans-serif;font-size:19px;font-weight:700;margin-top:3px">{{ f.no }}</span></span>
          <h3 style="margin:0;font-size:15px;font-weight:700;color:#0d2440;letter-spacing:.04em">{{ f.t }}</h3>
          <p style="margin:0;font-size:12px;line-height:1.9;color:#555">{{ f.d }}</p>
        </li>
      </sc-for>
    </ol>
  </div>
</section>
</main>
<dc-import name="SiteFooter" tint="{{ tint }}" hint-size="100%,820px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;blueTint&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;reveal&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  componentDidMount() { this.rv(); }
  componentDidUpdate() { this.rv(); }
  componentWillUnmount() { this.io && this.io.disconnect(); }
  rv() {
    if (this.props.reveal === false) return;
    if (!this.io) this.io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'none'; this.io.unobserve(e.target); } }), { threshold: 0.12 });
    document.querySelectorAll('[data-reveal]:not([data-rv])').forEach(el => {
      el.setAttribute('data-rv', '');
      if (el.getBoundingClientRect().top < window.innerHeight) return;
      el.style.opacity = '0'; el.style.transform = 'translateY(28px)';
      el.style.transition = 'opacity 1s cubic-bezier(.2,.7,.2,1), transform 1s cubic-bezier(.2,.7,.2,1)';
      this.io.observe(el);
    });
  }
  renderVals() {
    const services = [
      { id: 'design', no: '01', ja: '建築設計', en: 'ARCHITECTURAL DESIGN', ph: '設計打ち合わせ／図面・模型', desc: '敷地条件やご予算、将来の使い方まで丁寧に伺い、機能と美しさを両立する建築をご提案します。基本計画から実施設計、各種申請まで一貫して対応します。', items: ['建築設計', '建築計画', '空間計画', 'デザインのご相談'] },
      { id: 'new', no: '02', ja: '新築工事', en: 'NEW CONSTRUCTION', ph: '新築建物の外観', desc: '住まいから商業施設、オフィス、各種施設まで。設計意図を正確に読み解き、確かな施工品質でかたちにします。', items: ['住宅', '商業施設', 'オフィス', '各種施設', '特殊建築物'] },
      { id: 'renov', no: '03', ja: 'リフォーム・改修', en: 'RENOVATION / REMODELING', ph: '改修後のインテリア', desc: '既存建物の状態を調査したうえで、性能とデザインの両面から最適な改修計画をご提案します。', items: ['建物改修', '内装リフォーム', '外装改修', '空間再生'] },
      { id: 'cm', no: '04', ja: '施工管理', en: 'CONSTRUCTION MANAGEMENT', ph: '現場の施工管理風景', desc: '工程・品質・安全・コストを一元的に管理し、関係者と密に連携しながら計画どおりの竣工へ導きます。', items: ['プロジェクト管理', '工程管理', '品質管理', '安全管理'] },
      { id: 'mt', no: '05', ja: 'メンテナンス・サポート', en: 'MAINTENANCE & SUPPORT', ph: '点検・メンテナンス作業', desc: '定期点検や修繕、設備の更新まで。竣工後も建物の価値と安心を長く守り続けます。', items: ['建物メンテナンス', '修繕工事', '長期サポート'] },
    ].map((s, i) => ({ ...s, img: 'img/' + ['design-model', 'cranes', 'houses', 'blueprint', 'site-helmet'][i] + '.jpg', imgOrder: i % 2 === 0 ? 0 : 2 }));
    return {
      tint: this.props.blueTint ?? true,
      services,
      flow: [
        { no: '01', t: 'お問い合わせ', d: 'お電話・フォームからお気軽にご連絡ください。' },
        { no: '02', t: 'ヒアリング・現地調査', d: 'ご要望や敷地・建物の状況を詳しく確認します。' },
        { no: '03', t: 'ご提案・お見積り', d: 'プランと概算費用をわかりやすくご提示します。' },
        { no: '04', t: '設計・ご契約', d: '詳細を詰め、内容にご納得いただいてからご契約。' },
        { no: '05', t: '施工', d: '工程・品質・安全を管理し、進捗をご報告します。' },
        { no: '06', t: 'お引き渡し・サポート', d: '竣工後も定期点検で長くサポートします。' },
      ],
    };
  }
}
</script>
</body>
</html>
