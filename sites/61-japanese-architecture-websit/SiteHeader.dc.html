<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="background:{{ bg }};color:#fff;display:flex;align-items:stretch;justify-content:space-between;height:72px;transition:background .5s">
  <a href="Home.dc.html" aria-label="トップページへ" style="display:flex;align-items:center;gap:12px;padding:0 clamp(16px,3vw,36px);color:#fff">
    <span style="width:38px;height:38px;border-radius:50%;background:#fff;color:#0d2440;display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho',serif;font-weight:700;font-size:19px;flex-shrink:0">建</span>
    <span style="display:flex;flex-direction:column;gap:2px;line-height:1.2">
      <span style="font-size:10px;letter-spacing:.08em;opacity:.8">総合建設業・一級建築士事務所</span>
      <span style="font-family:'Shippori Mincho',serif;font-size:clamp(16px,4.6vw,20px);font-weight:600;letter-spacing:.06em;white-space:nowrap">株式会社 〇〇建設</span>
    </span>
  </a>
  <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
    <nav aria-label="メインナビゲーション" style="display:flex;align-items:stretch">
      <ul style="display:flex;align-items:stretch;gap:clamp(14px,2vw,30px);list-style:none;margin:0;padding:0 clamp(16px,2.4vw,32px)">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
          <li style="display:flex"><a href="{{ it.href }}" aria-current="{{ it.current }}" style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#fff;font-size:13px;font-weight:500;letter-spacing:.06em" style-hover="opacity:.65">{{ it.ja }}<span style="font-family:Montserrat,sans-serif;font-size:9px;letter-spacing:.18em;opacity:.6">{{ it.en }}</span><sc-if value="{{ it.active }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:0;height:3px;background:#fff"></span></sc-if></a></li>
        </sc-for>
      </ul>
      <a href="Contact.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:104px;background:#2d5f96;color:#fff;font-size:12px;font-weight:700;letter-spacing:.06em" style-hover="background:#3a72b0;color:#fff">
        <span style="width:18px;height:12px;border:1.5px solid #fff;border-radius:1px"></span>お問い合わせ
      </a>
    </nav>
  </sc-if>
  <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{ toggleMenu }}" aria-label="メニュー" aria-expanded="{{ menuOpen }}" style="width:72px;background:#2d5f96;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer">
      <span style="display:block;width:24px;height:1.5px;background:#fff"></span>
      <span style="display:block;width:24px;height:1.5px;background:#fff"></span>
      <span style="display:block;width:24px;height:1.5px;background:#fff"></span>
      <span style="font-family:Montserrat,sans-serif;font-size:8px;letter-spacing:.2em;margin-top:2px">MENU</span>
    </button>
  </sc-if>
</header>
<sc-if value="{{ menuVisible }}" hint-placeholder-val="{{ false }}">
  <nav aria-label="モバイルナビゲーション" style="position:fixed;top:72px;left:0;right:0;bottom:0;z-index:49;background:#0d2440;color:#fff;padding:24px 24px 40px;display:flex;flex-direction:column;overflow:auto">
    <a href="Home.dc.html" style="display:flex;justify-content:space-between;align-items:center;padding:20px 4px;border-bottom:1px solid rgba(255,255,255,.15);color:#fff;font-size:16px">トップ<span style="font-family:Montserrat,sans-serif;font-size:11px;letter-spacing:.2em;opacity:.6">TOP</span></a>
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
      <a href="{{ it.href }}" style="display:flex;justify-content:space-between;align-items:center;padding:20px 4px;border-bottom:1px solid rgba(255,255,255,.15);color:#fff;font-size:16px">{{ it.ja }}<span style="font-family:Montserrat,sans-serif;font-size:11px;letter-spacing:.2em;opacity:.6">{{ it.en }}</span></a>
    </sc-for>
    <a href="Contact.dc.html" style="margin-top:32px;display:flex;align-items:center;justify-content:center;min-height:56px;background:#2d5f96;color:#fff;font-weight:700;letter-spacing:.08em">お問い合わせ</a>
    <a href="tel:0000000000" style="margin-top:12px;display:flex;align-items:center;justify-content:center;min-height:56px;border:1px solid rgba(255,255,255,.5);color:#fff;font-family:Montserrat,sans-serif;font-weight:600;letter-spacing:.06em">TEL 0120-000-000</a>
  </nav>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;72px&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;services&quot;,&quot;works&quot;,&quot;strengths&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, menuOpen: false };
  componentDidMount() {
    this.onR = () => this.setState({ w: window.innerWidth });
    this.onS = () => { const top = window.scrollY < 60; if (top !== this.state.top) this.setState({ top }); };
    window.addEventListener('resize', this.onR); window.addEventListener('scroll', this.onS, { passive: true }); this.onS();
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); window.removeEventListener('scroll', this.onS); }
  renderVals() {
    const cur = this.props.current;
    const mobile = this.state.w < 980;
    const items = [
      ['about', 'About.dc.html', '私たちについて', 'ABOUT'],
      ['services', 'Services.dc.html', '事業内容', 'SERVICES'],
      ['works', 'Works.dc.html', '施工実績', 'WORKS'],
      ['strengths', 'Strengths.dc.html', '私たちの強み', 'STRENGTHS'],
    ].map(([k, href, ja, en]) => ({ href, ja, en, active: k === cur, current: k === cur ? 'page' : undefined }));
    return {
      bg: this.props.overlay && this.state.top !== false && !this.state.menuOpen ? 'linear-gradient(180deg,rgba(8,20,36,.55),rgba(8,20,36,0))' : '#0d2440',
      items, desktop: !mobile, mobile, menuOpen: this.state.menuOpen, menuVisible: mobile && this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
    };
  }
}
</script>
</body>
</html>
