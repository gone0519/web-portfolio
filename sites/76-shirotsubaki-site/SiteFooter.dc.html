<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer id="access" style="background:#fff;padding:70px 20px 0;position:relative;scroll-margin-top:20px">
  <div style="max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:40px">
    <div style="display:flex;flex-direction:column;gap:18px">
      <div style="display:flex;align-items:center;gap:14px">
        <span style="width:50px;height:50px;border-radius:50%;border:1px solid #c9ad5a;display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho',serif;color:#9b7b22;font-size:21px">椿</span>
        <span style="display:flex;flex-direction:column;gap:3px"><span style="font-family:'Shippori Mincho',serif;font-size:22px;letter-spacing:.14em;color:#6e5512">白椿女子大学</span><span style="font-size:9px;letter-spacing:.18em;color:#a88a35">SHIROTSUBAKI WOMEN'S UNIVERSITY</span></span>
      </div>
      <p style="margin:0;font-size:12px;line-height:1.9;color:#6f5a20">〒000-0000 〇〇県〇〇市〇〇町0-0</p>
      <p style="margin:0;font-family:'Shippori Mincho',serif;font-size:22px;letter-spacing:.06em;color:#8a6a12">tel.00-0000-0000 <span style="font-size:11px">（入試課）</span></p>
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:#6f5a20"><span style="padding:3px 12px;border-radius:999px;background:#f1ede2;font-size:11px">受付</span>平日 0:00〜0:00（仮）</div>
      <nav aria-label="フッターメニュー" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 20px;margin-top:8px">
        <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="6">
          <a href="{{ n.href }}" style="font-size:12px;letter-spacing:.1em;padding:4px 0;color:#8a6a12;text-decoration:none" style-hover="color:#4f3c06">› {{ n.ja }}</a>
        </sc-for>
      </nav>
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        <sc-for list="{{ socials }}" as="s" hint-placeholder-count="4">
          <a href="#access" style="padding:7px 16px;border-radius:999px;border:1px solid #e0d3a6;font-size:11px;letter-spacing:.1em;color:#8a6a12;text-decoration:none;transition:background .3s,color .3s" style-hover="background:#a8862a;color:#fff">{{ s }}</a>
        </sc-for>
      </div>
    </div>
    <div style="min-height:280px;background:repeating-linear-gradient(135deg,#eef7f2 0 8px,#e4f1ea 8px 16px);border:1px solid #d6e9e0;display:flex;align-items:center;justify-content:center"><span style="font-family:'DM Mono',monospace;font-size:11px;color:#7f9a8e">access map</span></div>
  </div>
  <div style="margin:60px -20px 0;background:#e4f4f0;padding:0 20px 30px;display:flex;flex-direction:column;align-items:center;gap:12px">
    <a href="#top" style="margin-top:-1px;padding:8px 18px;background:#efd56a;color:#6e5512;font-family:'Shippori Mincho',serif;font-size:11px;letter-spacing:.14em;text-decoration:none;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)" style-hover="background:#e6c84a">PAGETOP</a>
    <div style="display:flex;gap:16px;font-size:11px;margin-top:10px;color:#8a6a12"><a href="#access" style="color:#8a6a12">サイトマップ</a><span>|</span><a href="#access" style="color:#8a6a12">プライバシーポリシー</a></div>
    <p style="margin:0;font-size:10px;letter-spacing:.06em;color:#6f5a20;text-align:center">※本サイトの学部名・日程・連絡先等はすべて仮の内容です。正式な情報は入学試験要項をご確認ください。</p>
    <p style="margin:0;font-size:10px;letter-spacing:.14em;color:#6f5a20">Copyright © Shirotsubaki Women's University. All rights reserved.</p>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      navItems: [
        { ja: 'トップ', href: 'Shirotsubaki%20University.dc.html' },
        { ja: '大学について', href: 'About.dc.html' },
        { ja: '学部・学科', href: 'Academics.dc.html' },
        { ja: 'キャンパスライフ', href: 'CampusLife.dc.html' },
        { ja: '入試情報', href: 'Admissions.dc.html' },
        { ja: 'オープンキャンパス', href: 'OpenCampus.dc.html' }
      ],
      socials: ['Instagram', 'X', 'YouTube', 'LINE']
    };
  }
}
</script>
</body>
</html>
