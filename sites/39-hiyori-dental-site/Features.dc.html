<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>当院の特徴 | ひより歯科クリニック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#f3efe9;color:#3a332b;font-family:'Zen Kaku Gothic New',sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#9c7547;text-decoration:none}
a:hover{color:#7d5c34}
h1,h2,h3{word-break:auto-phrase;overflow-wrap:anywhere}
main{overflow-x:clip}
</style>
</helmet>
<dc-import name="SiteHeader" current="features" hint-size="100%,84px"></dc-import>
<main>
<section data-screen-label="01 Page Hero" style="padding:clamp(32px,5vw,72px) 0 clamp(72px,9vw,140px);display:grid;grid-template-columns:{{ heroCols }};gap:clamp(32px,4vw,64px);align-items:end">
  <div data-intro="0" style="padding:0 clamp(20px,4vw,48px) 0 clamp(20px,6vw,96px);display:flex;flex-direction:column;gap:20px">
    <nav aria-label="パンくず" style="display:flex;gap:10px;font-size:11px;letter-spacing:.12em;color:#8a7e70"><a href="Hiyori%20Dental%20Clinic.dc.html" style="color:#8a7e70">HOME</a><span>/</span><span>当院の特徴</span></nav>
    <span aria-hidden="true" style="font-family:Jost,sans-serif;font-weight:300;font-size:clamp(56px,8vw,120px);line-height:1;color:#e0d3c1">Commitment</span>
    <h1 style="margin:0;font-size:clamp(28px,3.4vw,44px);font-weight:500;letter-spacing:.16em">当院が大切にしていること</h1>
    <p style="margin:0;font-size:15px;line-height:2.2;letter-spacing:.08em;color:#4a4238;max-width:30em;text-wrap:pretty">はじめての方も、久しぶりの方も。安心して通い続けていただくために、4つのことを大切にしています。</p>
  </div>
  <div data-intro="1" style="height:clamp(260px,32vw,480px);border-radius:clamp(90px,13vw,200px) 0 0 0;overflow:hidden">
    <image-slot id="ft-hero" src="images/counseling-model.jpg" shape="rect" placeholder="歯科医師と患者さまの会話"></image-slot>
  </div>
</section>

<div style="display:flex;flex-direction:column;gap:clamp(96px,12vw,180px);padding-bottom:clamp(100px,12vw,180px)">
  <sc-for list="{{ features }}" as="f" hint-placeholder-count="4">
    <section id="{{ f.id }}" data-screen-label="{{ f.label }}" style="position:relative;display:grid;grid-template-columns:{{ rowCols }};gap:clamp(36px,5vw,88px);align-items:center">
      <div data-reveal="" style="order:{{ f.imgOrder }};height:clamp(300px,36vw,540px);border-radius:{{ f.radius }};overflow:hidden">
        <image-slot id="{{ f.img }}" src="{{ f.src }}" shape="rect" placeholder="{{ f.ph }}"></image-slot>
      </div>
      <div data-reveal="" style="order:1;padding:{{ f.pad }};display:flex;flex-direction:column;gap:22px">
        <span style="font-family:Jost,sans-serif;font-weight:300;font-size:clamp(64px,8vw,120px);line-height:.9;color:#d8c7ae">{{ f.n }}</span>
        <span style="font-family:Jost,sans-serif;font-size:12px;letter-spacing:.22em;color:#9c7547">{{ f.en }}</span>
        <h2 style="margin:0;font-size:clamp(24px,2.6vw,34px);font-weight:500;letter-spacing:.14em;line-height:1.6">{{ f.title }}</h2>
        <p style="margin:0;font-size:15px;line-height:2.2;letter-spacing:.06em;color:#4a4238;text-wrap:pretty">{{ f.desc }}</p>
        <ul style="margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column">
          <sc-for list="{{ f.points }}" as="p" hint-placeholder-count="3">
            <li style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;padding:16px 0;border-top:1px solid #ddd2c3;font-size:14px;line-height:1.9;letter-spacing:.05em">
              <span style="font-weight:500;color:#9c7547;white-space:nowrap">{{ p.k }}</span>
              <span style="color:#4a4238">{{ p.v }}</span>
            </li>
          </sc-for>
        </ul>
      </div>
    </section>
  </sc-for>
</div>

<section id="flow" data-screen-label="06 Flow" style="background:#fbf8f3;border-radius:clamp(80px,12vw,200px) 0 clamp(80px,12vw,200px) 0;padding:clamp(88px,10vw,150px) clamp(20px,5vw,80px);margin-bottom:clamp(80px,10vw,140px)">
  <div data-reveal="" style="display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;margin-bottom:clamp(48px,6vw,80px)">
    <p style="margin:0;font-family:Jost,sans-serif;font-size:12px;letter-spacing:.24em;color:#9c7547">First Visit</p>
    <h2 style="margin:0;font-size:clamp(24px,2.6vw,34px);font-weight:500;letter-spacing:.16em">初診の流れ</h2>
    <p style="margin:0;font-size:14px;line-height:2;letter-spacing:.06em;color:#5c5349">はじめての方は、次のような流れで診療を進めます。</p>
  </div>
  <ol style="max-width:1200px;margin:0 auto;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:clamp(16px,2vw,24px)">
    <sc-for list="{{ flow }}" as="s" hint-placeholder-count="5">
      <li data-reveal="" style="display:flex;flex-direction:column;gap:14px;padding:28px 24px 32px;background:#fff;border:1px solid #efe7db;border-radius:0 40px 0 0">
        <span style="font-family:Jost,sans-serif;font-size:12px;letter-spacing:.2em;color:#9c7547">STEP {{ s.n }}</span>
        <h3 style="margin:0;font-size:17px;font-weight:500;letter-spacing:.12em;line-height:1.6">{{ s.t }}</h3>
        <p style="margin:0;font-size:13px;line-height:2;letter-spacing:.04em;color:#5c5349">{{ s.d }}</p>
      </li>
    </sc-for>
  </ol>
</section>
</main>
<dc-import name="SiteFooter" hint-size="100%,900px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { w: window.innerWidth };
  componentDidMount() { this.r = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.r); }
  componentWillUnmount() { window.removeEventListener('resize', this.r); }
  renderVals() {
    const m = this.state.w < 900;
    const big = 'clamp(90px,12vw,200px)';
    const data = [
      { src: 'images/hearing.jpg', en: 'Counseling', title: '丁寧なカウンセリング', ph: 'カウンセリングルーム', desc: '治療の前に、お悩みやご希望をじっくりとお伺いします。「痛いのが苦手」「なるべく通院回数を減らしたい」など、どんなことでもお聞かせください。そのうえで、一人ひとりに合った治療計画をご提案します。', points: [{ k: '個室', v: '周りを気にせず話せるカウンセリングルーム' }, { k: '時間', v: '初診時は十分な時間をとってお話を伺います' }, { k: '選択肢', v: '複数の治療方法から一緒に選びます' }] },
      { src: 'images/model-hands.jpg', en: 'Clear Explanation', title: '分かりやすい説明', ph: 'モニターで画像を説明する様子', desc: '口腔内写真やレントゲン、模型などの資料を使い、専門用語をできるだけ使わずにご説明します。治療の目的や期間、費用まで事前にお伝えし、ご納得いただいてから治療を進めます。', points: [{ k: '見える化', v: 'お口の中の写真をモニターで一緒に確認' }, { k: '書面', v: '治療計画と費用を書面でお渡し' }, { k: '確認', v: '各ステップの前に内容をあらためてご説明' }] },
      { src: 'images/microscope.jpg', en: 'Technology', title: '最新の設備・技術', ph: '歯科用CT・マイクロスコープ', desc: '精密で負担の少ない治療のために、適切な歯科設備と技術を取り入れています。診断の精度を高めることで、必要以上に歯を削らない治療につなげています。', points: [{ k: '歯科用CT', v: '立体的な画像で精密に診断' }, { k: '拡大視野', v: 'マイクロスコープによる精密治療' }, { k: '低被ばく', v: 'デジタルレントゲンを採用' }] },
      { src: 'images/interior.jpg', en: 'Comfort', title: '安心できる環境', ph: '清潔な診療室', desc: '徹底した衛生管理のもと、清潔で落ち着いた空間を整えています。小さなお子さまからご年配の方まで、どなたにも安心してお越しいただけるよう配慮しています。', points: [{ k: '衛生管理', v: '器具は患者さまごとに滅菌・交換' }, { k: 'バリアフリー', v: '段差の少ない院内、ベビーカーも入れます' }, { k: 'キッズ', v: 'お子さま連れでも通いやすい待合室' }] }
    ];
    return {
      heroCols: m ? 'minmax(0,1fr)' : 'minmax(0,5fr) minmax(0,6fr)',
      rowCols: m ? 'minmax(0,1fr)' : 'minmax(0,1fr) minmax(0,1fr)',
      features: data.map((f, i) => {
        const flip = !m && i % 2 === 1;
        return { ...f, n: String(i + 1).padStart(2, '0'), id: 'ft-' + (i + 1), img: 'ftd-' + (i + 1), label: String(i + 2).padStart(2, '0') + ' ' + f.title,
          imgOrder: flip ? 2 : 0, radius: flip ? `${big} 0 0 0` : `0 ${big} 0 0`,
          pad: m ? '0 20px' : (flip ? '0 0 0 clamp(20px,6vw,96px)' : '0 clamp(20px,6vw,96px) 0 0') };
      }),
      flow: [
        { t: 'ご予約', d: 'WEBまたはお電話でご予約ください。急な痛みの方もご相談ください。' },
        { t: '問診・カウンセリング', d: 'お悩みやご希望、全身の健康状態などを伺います。' },
        { t: '検査・診断', d: 'レントゲンや口腔内写真で、お口の状態を詳しく確認します。' },
        { t: '治療計画のご説明', d: '検査結果をもとに、治療の選択肢と期間・費用をご説明します。' },
        { t: '治療・メンテナンス', d: 'ご納得いただいた内容で治療を行い、その後は定期検診で守ります。' }
      ].map((s, i) => ({ ...s, n: String(i + 1).padStart(2, '0') }))
    };
  }
}
</script>
</body>
</html>
