<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:{{ headerH }}"></div>
<header ref="{{ hdr }}" style="position:fixed;top:0;left:0;right:0;z-index:40;height:{{ headerH }};padding:0 clamp(16px,4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:12px;background:{{ headerBg }};backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:background .4s ease, box-shadow .4s ease;box-shadow:{{ headerShadow }}">
  <a href="Hiyori%20Dental%20Clinic.dc.html" style="display:flex;align-items:center;gap:{{ logoGap }};min-width:0;color:#3a332b">
    <span style="position:relative;width:36px;height:26px;flex:none">
      <span style="position:absolute;left:0;top:2px;width:22px;height:22px;border:1.5px solid #b08a5b;border-radius:50%"></span>
      <span style="position:absolute;left:12px;top:2px;width:22px;height:22px;border:1.5px solid #b08a5b;border-radius:50%"></span>
    </span>
    <span style="display:flex;flex-direction:column;gap:2px;min-width:0">
      <span style="font-size:{{ logoFs }};font-weight:500;letter-spacing:{{ logoLs }};white-space:nowrap">ひより歯科クリニック</span>
      <span style="font-family:Jost,sans-serif;font-size:10px;letter-spacing:.22em;color:#9c7547;white-space:nowrap">Hiyori Dental Clinic</span>
    </span>
  </a>
  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;gap:clamp(20px,2.4vw,36px)">
      <nav aria-label="メインナビゲーション" style="display:flex;gap:clamp(16px,1.8vw,30px)">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
          <a href="{{ n.href }}" aria-current="{{ n.aria }}" style="font-size:13px;letter-spacing:.14em;color:{{ n.color }};font-weight:500;padding:6px 0;border-bottom:1px solid {{ n.line }};transition:color .3s, border-color .3s" style-hover="color:#9c7547;border-bottom-color:#c9a97e">{{ n.label }}</a>
        </sc-for>
      </nav>
      <sc-if value="{{ showPhone }}" hint-placeholder-val="{{ true }}">
        <a href="tel:0300000000" style="display:flex;flex-direction:column;gap:2px;color:#3a332b">
          <span style="font-size:10px;letter-spacing:.12em;color:#9c7547">お電話でのご予約</span>
          <span style="font-family:Jost,sans-serif;font-size:20px;letter-spacing:.06em">03-0000-0000</span>
        </a>
      </sc-if>
      <a href="Contact.dc.html" style="display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border-radius:999px;background:#9c7547;color:#fff;font-size:13px;font-weight:500;letter-spacing:.14em;transition:background .3s" style-hover="background:#7d5c34;color:#fff">WEB予約</a>
    </div>
  </sc-if>
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:10px;flex:none">
      <sc-if value="{{ showHeaderCta }}">
        <a href="Contact.dc.html" style="display:inline-flex;align-items:center;padding:10px 18px;min-height:44px;border-radius:999px;background:#9c7547;color:#fff;font-size:12px;font-weight:500;letter-spacing:.12em;white-space:nowrap">WEB予約</a>
      </sc-if>
      <button onClick="{{ toggleMenu }}" aria-label="メニューを開く" aria-expanded="{{ menuOpen }}" style="width:44px;height:44px;border:none;background:#e9e0d3;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer">
        <span style="width:18px;height:1.5px;background:#3a332b"></span>
        <span style="width:18px;height:1.5px;background:#3a332b"></span>
      </button>
    </div>
  </sc-if>
</header>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-label="メニュー" style="position:fixed;inset:0;z-index:60;background:#f3efe9;padding:96px 32px 40px;display:flex;flex-direction:column;gap:40px;overflow-y:auto">
    <button onClick="{{ closeMenu }}" aria-label="メニューを閉じる" style="position:absolute;top:10px;right:20px;width:44px;height:44px;border:none;background:#e9e0d3;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center">
      <span style="position:absolute;width:18px;height:1.5px;background:#3a332b;transform:rotate(45deg)"></span>
      <span style="position:absolute;width:18px;height:1.5px;background:#3a332b;transform:rotate(-45deg)"></span>
    </button>
    <nav aria-label="モバイルナビゲーション" style="display:flex;flex-direction:column">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
        <a href="{{ n.href }}" onClick="{{ closeMenu }}" style="display:flex;justify-content:space-between;align-items:baseline;padding:20px 0;border-bottom:1px solid #ddd2c3;color:{{ n.color }};font-size:18px;font-weight:500;letter-spacing:.14em">
          <span>{{ n.label }}</span>
          <span style="font-family:Jost,sans-serif;font-size:11px;letter-spacing:.2em;color:#9c7547">{{ n.en }}</span>
        </a>
      </sc-for>
    </nav>
    <div style="display:flex;flex-direction:column;gap:12px">
      <a href="Contact.dc.html" style="display:flex;justify-content:center;padding:18px;border-radius:999px;background:#9c7547;color:#fff;font-weight:500;letter-spacing:.14em">WEB予約・お問い合わせ</a>
      <a href="tel:0300000000" style="display:flex;justify-content:center;padding:17px;border-radius:999px;border:1px solid #9c7547;color:#9c7547;font-family:Jost,sans-serif;font-size:18px;letter-spacing:.08em">03-0000-0000</a>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;treatments&quot;,&quot;features&quot;,&quot;access&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;animations&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { w: window.innerWidth, menuOpen: false, scrolled: window.scrollY > 20 };
  hdr = React.createRef();
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth });
    this.onScroll = () => { const s = window.scrollY > 20; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };
    window.addEventListener('resize', this.onResize);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.t = setTimeout(() => this.setupMotion(), 120);
  }
  componentDidUpdate() {
    const lock = this.state.menuOpen && this.state.w < 1080;
    document.body.style.overflow = lock ? 'hidden' : '';
  }
  componentWillUnmount() {
    document.body.style.overflow = '';
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('scroll', this.onScroll);
    this.fallback && window.removeEventListener('scroll', this.fallback);
    if (this.onOver) { document.removeEventListener('mouseover', this.onOver); document.removeEventListener('mouseout', this.onOver); }
    clearTimeout(this.t); clearTimeout(this.t2);
    this.io && this.io.disconnect();
  }
  setupMotion() {
    if (this.props.animations === false || !('IntersectionObserver' in window)) return;
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const ease = 'cubic-bezier(.2,.7,.2,1)', wipe = 'cubic-bezier(.77,0,.18,1)';
    const hdr = this.hdr.current;
    if (hdr && window.scrollY < 20) {
      hdr.style.transform = 'translateY(-100%)'; void hdr.offsetHeight;
      hdr.style.transition += ', transform 1s ' + ease; hdr.style.transform = 'none';
    }
    const prep = (el, d, dist) => {
      const slots = [...el.querySelectorAll('image-slot')];
      const selfWrap = el.firstElementChild && el.firstElementChild.tagName === 'IMAGE-SLOT';
      el._w = slots.map((s, i) => {
        const w = s.parentElement, dd = d + (selfWrap ? 0 : 150 + i * 140);
        w.style.clipPath = 'inset(0 100% 0 0)';
        w.style.transition = [w.style.transition, 'clip-path 1.5s ' + wipe + ' ' + dd + 'ms'].filter(Boolean).join(', ');
        s.style.transform = 'scale(1.16)';
        s.style.transition = 'transform 2.4s ' + ease + ' ' + dd + 'ms';
        return [w, s];
      });
      el._h = [...el.querySelectorAll('h1,h2')].concat(el.matches('h1,h2') ? [el] : []).map(h => {
        const orig = h.style.letterSpacing, fs = parseFloat(getComputedStyle(h).fontSize);
        const ls = parseFloat(getComputedStyle(h).letterSpacing) || 0;
        h.style.letterSpacing = (ls + fs * .22) + 'px';
        h.style.transition = [h.style.transition, 'letter-spacing 1.8s ' + ease + ' ' + (d + 100) + 'ms'].filter(Boolean).join(', ');
        return [h, orig];
      });
      if (!selfWrap) {
        el.style.opacity = '0'; el.style.transform = 'translateY(' + dist + 'px)';
        el.style.transition = 'opacity 1.1s ' + ease + ' ' + d + 'ms, transform 1.1s ' + ease + ' ' + d + 'ms';
      }
      el._prepped = true;
    };
    const play = el => {
      if (!el._prepped) return; el._prepped = false; void el.offsetHeight;
      el.style.opacity = '1'; el.style.transform = 'none';
      (el._w || []).forEach(([w, s]) => { w.style.clipPath = 'inset(0 0% 0 0)'; s.style.transform = 'scale(1)'; });
      (el._h || []).forEach(([h, orig]) => { h.style.letterSpacing = orig; });
    };
    document.querySelectorAll('[data-intro]').forEach(el => { prep(el, Number(el.getAttribute('data-intro')) * 140, 20); play(el); });
    this.io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { play(e.target); this.io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
    document.querySelectorAll('[data-reveal]').forEach(el => {
      if (el.parentElement && el.parentElement.closest('[data-reveal]')) return;
      if (el.getBoundingClientRect().top < window.innerHeight) return;
      const sibs = [...el.parentElement.children].filter(c => c.hasAttribute('data-reveal'));
      const idx = Math.max(0, sibs.indexOf(el));
      prep(el, sibs.length > 1 ? (idx % 4) * 120 : 0, 36);
      this.io.observe(el);
    });
    const sweep = lim => document.querySelectorAll('[data-reveal]').forEach(el => { if (el._prepped && el.getBoundingClientRect().top < window.innerHeight * lim) play(el); });
    this.t2 = setTimeout(() => sweep(1.2), 1600);
    const para = [...document.querySelectorAll('[aria-hidden="true"]')].filter(n => parseFloat(getComputedStyle(n).fontSize) >= 48);
    const heroImgs = [...document.querySelectorAll('[data-intro]')].filter(n => n.firstElementChild && n.firstElementChild.tagName === 'IMAGE-SLOT');
    this.fallback = () => {
      sweep(1);
      const vh = window.innerHeight;
      para.forEach(n => { const r = n.getBoundingClientRect(); n.style.transform = 'translateX(' + ((r.top + r.height / 2 - vh / 2) * 0.12).toFixed(1) + 'px)'; });
      if (window.innerWidth >= 900) heroImgs.forEach((n, i) => { n.style.transform = 'translateY(' + (-window.scrollY * (0.05 + (i % 3) * 0.03)).toFixed(1) + 'px)'; });
    };
    window.addEventListener('scroll', this.fallback, { passive: true });
    this.fallback();
    this.onOver = e => {
      const a = e.target.closest && e.target.closest('a'); if (!a || (e.relatedTarget && a.contains(e.relatedTarget))) return;
      const s = a.querySelector('image-slot'); if (!s) return;
      s.style.transition = 'transform 1.2s ' + ease; s.style.transform = e.type === 'mouseover' ? 'scale(1.06)' : 'scale(1)';
    };
    document.addEventListener('mouseover', this.onOver); document.addEventListener('mouseout', this.onOver);
    document.querySelectorAll('[data-scrollline]').forEach(n => n.animate && n.animate(
      [{ transform: 'scaleY(0)', transformOrigin: 'top' }, { transform: 'scaleY(1)', transformOrigin: 'top', offset: .5 }, { transform: 'scaleY(1)', transformOrigin: 'bottom', offset: .5 }, { transform: 'scaleY(0)', transformOrigin: 'bottom' }],
      { duration: 2400, iterations: Infinity, easing: 'ease-in-out' }));
  }
  renderVals() {
    const cur = this.props.current || 'home';
    const items = [
      ['home', 'HOME', 'Home', 'Hiyori%20Dental%20Clinic.dc.html'],
      ['about', '当院について', 'About', 'About.dc.html'],
      ['treatments', '診療内容', 'Treatments', 'Treatments.dc.html'],
      ['features', '当院の特徴', 'Commitment', 'Features.dc.html'],
      ['access', 'アクセス', 'Access', 'Access.dc.html']
    ];
    const w = this.state.w, m = w < 1080;
    return {
      isMobile: m, isDesktop: !m, showPhone: w >= 1240,
      // below 600px the fixed bottom bar (SiteFooter) carries the reservation CTA
      showHeaderCta: w >= 600,
      logoFs: w < 400 ? '15px' : '17px', logoLs: w < 400 ? '.1em' : '.14em', logoGap: w < 400 ? '10px' : '12px',
      menuOpen: this.state.menuOpen && m,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
      hdr: this.hdr,
      headerH: m ? '64px' : '84px',
      headerBg: this.state.scrolled ? 'rgba(243,239,233,.9)' : 'rgba(243,239,233,0)',
      headerShadow: this.state.scrolled ? '0 1px 0 rgba(90,70,40,.08)' : 'none',
      nav: items.map(([k, label, en, href]) => ({ label, en, href, aria: k === cur ? 'page' : undefined, color: k === cur ? '#9c7547' : '#3a332b', line: k === cur ? '#c9a97e' : 'transparent' }))
    };
  }
}
</script>
</body>
</html>
