<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));background:#E60012;color:#fff;font-family:'Zen Kaku Gothic New',sans-serif">
  <div style="position:relative;min-height:420px;background:#dfe6ee">
    <image-slot id="ft-photo" src="images/ft-photo.jpg" shape="rect" placeholder="学生ポートレート"></image-slot>
    <a href="Admissions Site.dc.html" style="position:absolute;left:24px;bottom:24px;display:flex;align-items:center;gap:10px;background:#fff;padding:10px 16px 10px 10px;border-radius:6px;text-decoration:none;color:#1b1b1b;z-index:2">
      <span style="width:36px;height:36px;background:#E60012;color:#fff;display:grid;place-items:center;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:21px;border-radius:3px">朱</span>
      <span style="font-weight:700;font-size:14px;letter-spacing:.08em">朱鷺ヶ丘女子大学</span>
    </a>
  </div>
  <div style="padding:clamp(48px,5vw,72px) clamp(24px,4vw,64px) 32px;display:flex;flex-direction:column;gap:40px">
    <div style="display:flex;flex-wrap:wrap;gap:40px 64px">
      <nav aria-label="フッターナビゲーション" style="display:flex;flex-direction:column;gap:14px">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
          <a href="{{ n.href }}" style="display:flex;align-items:baseline;gap:12px;color:#fff;text-decoration:none" style-hover="color:#fff;opacity:.75"><span style="font-family:'Zilla Slab',serif;font-weight:700;font-size:18px;min-width:130px">{{ n.en }}</span><span style="font-size:11px">{{ n.ja }}</span></a>
        </sc-for>
      </nav>
      <div style="display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.9">
        <span style="font-weight:700;font-size:14px">入試課（お問い合わせ）</span>
        <span>TEL 000-000-0000（※仮）</span>
        <span>受付時間 平日 0:00–0:00（※仮）</span>
        <span>〒000-0000 ○○県○○市○○ 0-0（※仮）</span>
        <a href="Admissions.dc.html#resources" style="color:#fff;font-weight:700" style-hover="color:#fff;opacity:.75">資料請求はこちら ›</a>
      </div>
    </div>
    <ul style="list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px">
      <li><a href="#" style="display:block;padding:8px 18px;border:1.5px solid #fff;border-radius:999px;color:#fff;text-decoration:none;font-family:'Zilla Slab',serif;font-weight:700;font-size:13px" style-hover="background:#fff;color:#E60012">Instagram</a></li>
      <li><a href="#" style="display:block;padding:8px 18px;border:1.5px solid #fff;border-radius:999px;color:#fff;text-decoration:none;font-family:'Zilla Slab',serif;font-weight:700;font-size:13px" style-hover="background:#fff;color:#E60012">X</a></li>
      <li><a href="#" style="display:block;padding:8px 18px;border:1.5px solid #fff;border-radius:999px;color:#fff;text-decoration:none;font-family:'Zilla Slab',serif;font-weight:700;font-size:13px" style-hover="background:#fff;color:#E60012">YouTube</a></li>
      <li><a href="#" style="display:block;padding:8px 18px;border:1.5px solid #fff;border-radius:999px;color:#fff;text-decoration:none;font-family:'Zilla Slab',serif;font-weight:700;font-size:13px" style-hover="background:#fff;color:#E60012">LINE</a></li>
    </ul>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:11px;line-height:1.8">
      <span>※本サイトの大学名・学部構成・在学生の声・連絡先はすべてデザイン用のサンプルです。</span>
      <span style="font-family:'Zilla Slab',serif;font-weight:600">© Tokigaoka Women's University (sample)</span>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { nav: [
      { href: 'Admissions Site.dc.html', en: 'Top', ja: 'トップ' },
      { href: 'About.dc.html', en: 'About', ja: '大学について' },
      { href: 'Academics.dc.html', en: 'Academics', ja: '学部・学科' },
      { href: 'CampusLife.dc.html', en: 'Campus Life', ja: 'キャンパスライフ' },
      { href: 'Admissions.dc.html', en: 'Admissions', ja: '入試情報' },
      { href: 'OpenCampus.dc.html', en: 'Open Campus', ja: 'オープンキャンパス' }
    ] };
  }
}
</script>
</body>
</html>
