<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px clamp(16px,3vw,40px);background:{{ headerBg }};box-shadow:{{ headerShadow }};transition:background .3s, box-shadow .3s;font-family:'Zen Kaku Gothic New',sans-serif">
  <a href="Admissions Site.dc.html" style="display:flex;align-items:center;gap:{{ logoGap }};min-width:0;text-decoration:none;color:#1b1b1b">
    <span style="width:{{ logoSize }};height:{{ logoSize }};flex:none;background:#E60012;color:#fff;display:grid;place-items:center;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:{{ logoFont }};border-radius:4px">朱</span>
    <span style="display:flex;flex-direction:column;gap:2px;min-width:0">
      <span style="font-weight:700;font-size:{{ nameFont }};letter-spacing:.08em;white-space:nowrap">朱鷺ヶ丘女子大学</span>
      <sc-if value="{{ showEn }}" hint-placeholder-val="{{ true }}"><span style="font-family:'Zilla Slab',serif;font-weight:700;font-size:10px;letter-spacing:.12em;white-space:nowrap">TOKIGAOKA WOMEN'S UNIVERSITY</span></sc-if>
    </span>
  </a>
  <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
    <nav aria-label="メインナビゲーション" style="display:flex;align-items:center;gap:26px">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="4">
        <a href="{{ n.href }}" aria-current="{{ n.cur }}" style="display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:{{ n.color }};padding-bottom:4px;border-bottom:2px solid {{ n.line }}" style-hover="color:#E60012">
          <span style="font-family:'Zilla Slab',serif;font-weight:700;font-size:15px">{{ n.en }}</span>
          <span style="font-size:10px;font-weight:500">{{ n.ja }}</span>
        </a>
      </sc-for>
      <a href="OpenCampus.dc.html" style="display:flex;align-items:center;gap:8px;padding:12px 26px;border-radius:999px;background:#E60012;color:#fff;text-decoration:none;font-weight:700;font-size:14px;transition:transform .2s, background .2s" style-hover="background:#1b1b1b;color:#fff;transform:translateY(-2px)">オープンキャンパス <span aria-hidden="true">›</span></a>
    </nav>
  </sc-if>
  <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:8px;flex:none">
      <a href="OpenCampus.dc.html" style="padding:9px 14px;border-radius:999px;background:#E60012;color:#fff;text-decoration:none;font-weight:700;font-size:12px;white-space:nowrap">OC予約</a>
      <button onClick="{{ openMenu }}" aria-label="メニューを開く" aria-expanded="{{ menuOpen }}" style="display:flex;align-items:center;gap:8px;background:none;border:0;padding:8px 4px 8px 8px;font-family:'Zilla Slab',serif;font-weight:700;font-size:15px;color:#1b1b1b;cursor:pointer">
        <span style="display:flex;flex-direction:column;gap:5px"><span style="width:22px;height:2px;background:#1b1b1b"></span><span style="width:16px;height:2px;background:#1b1b1b"></span></span>Menu
      </button>
    </div>
  </sc-if>
</header>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-label="メニュー" style="position:fixed;inset:0;z-index:60;background:#E60012;color:#fff;display:flex;flex-direction:column;padding:24px 28px 40px;overflow:auto;font-family:'Zen Kaku Gothic New',sans-serif">
    <div style="display:flex;justify-content:flex-end"><button onClick="{{ closeMenu }}" aria-label="メニューを閉じる" style="background:none;border:2px solid #fff;color:#fff;border-radius:999px;padding:8px 18px;font-family:'Zilla Slab',serif;font-weight:700;font-size:15px;cursor:pointer">Close ×</button></div>
    <nav style="display:flex;flex-direction:column;gap:22px;margin-top:40px">
      <a href="Admissions Site.dc.html" style="display:flex;align-items:baseline;gap:14px;color:#fff;text-decoration:none"><span style="font-family:'Zilla Slab',serif;font-weight:700;font-size:40px">Top</span><span style="font-size:13px;font-weight:700">トップ</span></a>
      <sc-for list="{{ allNav }}" as="n" hint-placeholder-count="5">
        <a href="{{ n.href }}" style="display:flex;align-items:baseline;gap:14px;color:#fff;text-decoration:none">
          <span style="font-family:'Zilla Slab',serif;font-weight:700;font-size:40px">{{ n.en }}</span>
          <span style="font-size:13px;font-weight:700">{{ n.ja }}</span>
        </a>
      </sc-for>
    </nav>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;about&quot;,&quot;academics&quot;,&quot;campus&quot;,&quot;admissions&quot;,&quot;oc&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;solid&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, scrolled: false, menuOpen: false };
  componentDidMount() {
    this.onR = () => this.setState({ w: window.innerWidth });
    this.onS = () => { const s = window.scrollY > 40; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };
    this.onK = e => { if (e.key === 'Escape') this.setState({ menuOpen: false }); };
    window.addEventListener('resize', this.onR); window.addEventListener('scroll', this.onS, { passive: true }); window.addEventListener('keydown', this.onK);
    this.onS();
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); window.removeEventListener('scroll', this.onS); window.removeEventListener('keydown', this.onK); }
  renderVals() {
    const cur = this.props.current ?? '';
    const solid = this.props.solid ?? true;
    const items = [
      { key: 'about', href: 'About.dc.html', en: 'About', ja: '大学について' },
      { key: 'academics', href: 'Academics.dc.html', en: 'Academics', ja: '学部・学科' },
      { key: 'campus', href: 'CampusLife.dc.html', en: 'Campus Life', ja: 'キャンパスライフ' },
      { key: 'admissions', href: 'Admissions.dc.html', en: 'Admissions', ja: '入試情報' },
      { key: 'oc', href: 'OpenCampus.dc.html', en: 'Open Campus', ja: 'オープンキャンパス' }
    ].map(n => ({ ...n, cur: n.key === cur ? 'page' : undefined, color: n.key === cur ? '#E60012' : '#1b1b1b', line: n.key === cur ? '#E60012' : 'transparent' }));
    const narrow = this.state.w < 960;
    const small = this.state.w < 420;
    const on = solid || this.state.scrolled || this.state.menuOpen;
    return {
      narrow, wide: !narrow, menuOpen: this.state.menuOpen,
      showEn: !small,
      logoSize: small ? '38px' : '44px', logoFont: small ? '22px' : '26px', logoGap: small ? '10px' : '12px',
      nameFont: small ? '14px' : '15px',
      nav: items.slice(0, 4), allNav: items,
      openMenu: () => this.setState({ menuOpen: true }),
      closeMenu: () => this.setState({ menuOpen: false }),
      headerBg: on ? 'rgba(255,255,255,.95)' : 'transparent',
      headerShadow: on && this.state.scrolled ? '0 2px 16px rgba(0,0,0,.08)' : 'none'
    };
  }
}
</script>
</body>
</html>
