<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Contact CTA" style="position:relative;background:#15171d;color:#fff;overflow:hidden;padding:clamp(100px,9vw,150px) clamp(24px,8vw,160px) 0;font-family:'Zen Kaku Gothic New',sans-serif">
  <div aria-hidden="true" style="position:absolute;left:0;top:0;width:100%;height:clamp(360px,32vw,560px);background:radial-gradient(circle at 90% 60%,rgba(40,90,255,.7),transparent 30%),linear-gradient(180deg,#1c3f94,#15307a);clip-path:polygon(0 0,100% 0,100% 30%,0 72%);pointer-events:none"></div>
  <div style="position:relative;max-width:1400px;margin:0 auto">
    <div style="font:600 clamp(44px,6.4vw,110px)/.92 Outfit,sans-serif;letter-spacing:-0.035em">Let's Build<br>the Future Together<span style="color:#d0021b">.</span></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:40px 80px;margin-top:clamp(56px,5vw,80px);align-items:end">
      <div>
        <p style="margin:0;font:700 clamp(18px,1.8vw,26px)/1.6 'Zen Kaku Gothic New',sans-serif;letter-spacing:.2em">ものづくりの未来を、ともにつくる。</p>
        <p style="margin:14px 0 0;font:700 14px/2 'Zen Kaku Gothic New',sans-serif">製造に関するご相談、OEM・ODM、加工依頼など、お気軽にお問い合わせください。</p>
      </div>
      <div>
        <div style="font:700 14px 'Zen Kaku Gothic New',sans-serif;letter-spacing:.2em">お電話でのお問い合わせ</div>
        <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-top:10px">
          <a href="tel:0000000000" style="font:500 clamp(36px,3.6vw,52px)/1 Outfit,sans-serif;color:#fff;text-decoration:none">000-000-0000</a>
          <span style="font:700 12px 'Zen Kaku Gothic New',sans-serif">【受付時間】月〜金 8:30〜17:30</span>
        </div>
      </div>
    </div>
    <div style="margin-top:40px;display:flex;flex-wrap:wrap;gap:16px">
      <a href="./Factory%20Site.dc.html#contact" style="flex:2 1 420px;min-height:80px;padding:0 74px 0 32px;border-radius:999px;background:#c8001a;color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;font:700 16px 'Zen Kaku Gothic New',sans-serif;letter-spacing:.14em;transition:background .3s" style-hover="background:#e0021f;color:#fff">お問い合わせはこちら<span style="position:absolute;right:20px;width:42px;height:42px;border-radius:50%;border:1px solid #fff;display:flex;align-items:center;justify-content:center;font:500 16px Outfit">→</span></a>
      <a href="./Factory%20Site.dc.html#contact" style="flex:1 1 260px;min-height:80px;border-radius:999px;border:1px solid rgba(255,255,255,.6);color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;font:700 15px 'Zen Kaku Gothic New',sans-serif;letter-spacing:.12em;transition:background .3s" style-hover="background:rgba(255,255,255,.08);color:#fff">製造について相談する</a>
    </div>
    <footer style="margin-top:clamp(80px,7vw,120px);padding:48px 0 36px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-wrap:wrap;justify-content:space-between;gap:40px">
      <div style="display:flex;flex-direction:column;gap:14px">
        <span style="font:700 30px/1 Outfit,sans-serif;letter-spacing:-0.02em;display:flex;align-items:center">Mika<span style="display:inline-block;width:7px;height:26px;background:#d0021b;transform:skewX(-20deg);margin:0 4px"></span>ge</span>
        <span style="font-size:13px;font-weight:700;letter-spacing:.08em">株式会社 御影精工</span>
        <span style="font-size:12px;opacity:.75;line-height:1.9">〒000-0000 〇〇県〇〇市〇〇町1-2-3<br>TEL. 000-000-0000　FAX. 000-000-0001</span>
      </div>
      <nav aria-label="フッターナビゲーション" style="display:grid;grid-template-columns:repeat(2,auto);gap:12px 48px;align-content:start">
        <sc-for list="{{ links }}" as="n" hint-placeholder-count="7">
          <a href="{{ n.href }}" style="font-size:13px;font-weight:700;display:flex;gap:10px;align-items:center;color:#fff;text-decoration:none" style-hover="color:#8fb0ff"><span style="width:10px;height:1px;background:#d0021b;display:block"></span>{{ n.jp }}</a>
        </sc-for>
      </nav>
      <div style="flex-basis:100%;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding-top:28px;font:400 11px Outfit,sans-serif;opacity:.8">
        <span>© MIKAGE PRECISION WORKS Co.,Ltd.</span>
        <a href="#top" onClick="{{ toTop }}" style="display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none">PAGE TOP<span style="width:30px;height:30px;border-radius:50%;border:1px solid #fff;display:flex;align-items:center;justify-content:center">↑</span></a>
      </div>
    </footer>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1440px&quot;,&quot;height&quot;:&quot;900px&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      toTop: e => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
      links: [
        { jp: 'ホーム', href: './Factory%20Site.dc.html' },
        { jp: '会社概要', href: './About.dc.html' },
        { jp: '技術・製造', href: './Technology.dc.html' },
        { jp: '品質管理', href: './Quality.dc.html' },
        { jp: '設備一覧', href: './Equipment.dc.html' },
        { jp: '製品・実績', href: './Products.dc.html' },
        { jp: 'お問い合わせ', href: './Factory%20Site.dc.html#contact' },
      ],
    };
  }
}
</script>
</body>
</html>
