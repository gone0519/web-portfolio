<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:fixed;top:0;left:0;right:0;z-index:50;height:72px;display:flex;align-items:center;justify-content:space-between;padding-left:clamp(20px,2.5vw,40px);background:{{ headerBg }};backdrop-filter:blur(10px);transform:{{ headerY }};transition:background .4s,transform .5s cubic-bezier(.2,.7,.2,1);color:#fff;font-family:'Zen Kaku Gothic New',sans-serif">
  <a href="./Factory%20Site.dc.html" style="display:flex;flex-direction:column;gap:2px;color:#fff;text-decoration:none">
    <span style="font:700 26px/1 Outfit,sans-serif;letter-spacing:-0.02em;display:flex;align-items:center;gap:2px">Mika<span style="display:inline-block;width:6px;height:22px;background:#d0021b;transform:skewX(-20deg);margin:0 3px"></span>ge</span>
    <span style="font:500 9px/1 Outfit,sans-serif;letter-spacing:.14em;opacity:.85">MIKAGE PRECISION WORKS</span>
  </a>
  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:flex-start;height:72px">
      <nav aria-label="メインナビゲーション" style="margin-top:14px;height:40px;display:flex;align-items:center;gap:26px;padding:0 40px 0 56px;background:rgba(255,255,255,.96);clip-path:polygon(28px 0,100% 0,100% 100%,0 100%)">
        <sc-for list="{{ items }}" as="n" hint-placeholder-count="7">
          <a href="{{ n.href }}" aria-current="{{ n.aria }}" style="font:italic 500 12px Outfit,sans-serif;letter-spacing:.06em;color:{{ n.color }};text-decoration:none;display:flex;align-items:center;gap:6px" style-hover="color:#d0021b"><span style="width:5px;height:12px;background:#d0021b;transform:skewX(-24deg);display:block;opacity:{{ n.dot }}"></span>{{ n.en }}</a>
        </sc-for>
      </nav>
      <a href="./Factory%20Site.dc.html#contact" style="height:60px;display:flex;align-items:center;padding:0 40px 0 52px;background:#d0021b;color:#fff;text-decoration:none;font:700 15px 'Zen Kaku Gothic New',sans-serif;letter-spacing:.08em;clip-path:polygon(24px 0,100% 0,100% 100%,0 100%);transition:background .3s" style-hover="background:#a80016;color:#fff">お問い合わせ</a>
    </div>
  </sc-if>
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;height:72px">
      <a href="./Factory%20Site.dc.html#contact" style="height:72px;display:flex;align-items:center;padding:0 18px 0 30px;background:#d0021b;color:#fff;text-decoration:none;font:700 13px 'Zen Kaku Gothic New',sans-serif;clip-path:polygon(16px 0,100% 0,100% 100%,0 100%)">お問い合わせ</a>
      <button aria-label="メニューを開く" onClick="{{ openMenu }}" style="width:72px;height:72px;border:0;background:#0f1c48;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer">
        <span style="width:26px;height:2px;background:#fff;display:block"></span>
        <span style="width:26px;height:2px;background:#fff;display:block"></span>
        <span style="width:16px;height:2px;background:#d0021b;display:block;margin-left:10px"></span>
      </button>
    </div>
  </sc-if>
</header>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,#1c3f94 0%,#0f1c48 70%);display:flex;flex-direction:column;padding:24px;color:#fff;font-family:'Zen Kaku Gothic New',sans-serif;overflow-y:auto">
    <div style="display:flex;justify-content:flex-end">
      <button aria-label="メニューを閉じる" onClick="{{ closeMenu }}" style="width:48px;height:48px;border:1px solid rgba(255,255,255,.5);border-radius:50%;background:transparent;color:#fff;font:300 24px Outfit,sans-serif;cursor:pointer">×</button>
    </div>
    <nav style="display:flex;flex-direction:column;margin-top:24px">
      <sc-for list="{{ items }}" as="n" hint-placeholder-count="7">
        <a href="{{ n.href }}" onClick="{{ closeMenu }}" style="display:flex;align-items:baseline;gap:16px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.15);color:#fff;text-decoration:none">
          <span style="font:italic 600 30px Outfit,sans-serif">{{ n.en }}</span>
          <span style="font-size:13px;opacity:.8;letter-spacing:.1em">{{ n.jp }}</span>
        </a>
      </sc-for>
    </nav>
    <a href="./Factory%20Site.dc.html#contact" onClick="{{ closeMenu }}" style="margin-top:32px;min-height:60px;border-radius:999px;background:#d0021b;color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.1em">お問い合わせはこちら</a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1440px&quot;,&quot;height&quot;:&quot;72px&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;technology&quot;,&quot;quality&quot;,&quot;equipment&quot;,&quot;products&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { scrolled: false, hidden: false, w: typeof window !== 'undefined' ? window.innerWidth : 1440, menuOpen: false };
  lastY = 0;
  componentDidMount() {
    this.onScroll = () => {
      const y = window.scrollY, s = y > 40;
      // hide while scrolling down, show again as soon as the user scrolls up
      let hidden = this.state.hidden;
      if (y < 200 || y < this.lastY - 6) hidden = false;
      else if (y > this.lastY + 6) hidden = true;
      if (Math.abs(y - this.lastY) > 6) this.lastY = y;
      if (s !== this.state.scrolled || hidden !== this.state.hidden) this.setState({ scrolled: s, hidden });
    };
    this.onResize = () => this.setState({ w: window.innerWidth });
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onResize);
    this.onScroll();
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('resize', this.onResize);
  }
  renderVals() {
    const cur = this.props.current ?? 'home';
    const mobile = this.state.w < 1180;
    const base = [
      ['home', 'HOME', 'ホーム', './Factory%20Site.dc.html'],
      ['about', 'ABOUT', '会社概要', './About.dc.html'],
      ['technology', 'TECHNOLOGY', '技術・製造', './Technology.dc.html'],
      ['quality', 'QUALITY', '品質管理', './Quality.dc.html'],
      ['equipment', 'EQUIPMENT', '設備一覧', './Equipment.dc.html'],
      ['products', 'PRODUCTS', '製品・実績', './Products.dc.html'],
      ['contact', 'CONTACT', 'お問い合わせ', './Factory%20Site.dc.html#contact'],
    ];
    return {
      items: base.map(([k, en, jp, href]) => ({ en, jp, href, color: k === cur ? '#1c3f94' : '#0f1c48', dot: k === cur ? 1 : 0, aria: k === cur ? 'page' : undefined })),
      isDesktop: !mobile, isMobile: mobile,
      headerBg: this.state.scrolled ? 'rgba(15,28,72,.92)' : 'rgba(15,28,72,0)',
      headerY: this.state.hidden && !this.state.menuOpen ? 'translateY(-100%)' : 'none',
      menuOpen: this.state.menuOpen,
      openMenu: () => this.setState({ menuOpen: true }),
      closeMenu: () => this.setState({ menuOpen: false }),
    };
  }
}
</script>
</body>
</html>
