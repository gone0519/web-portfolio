<body>

      <span style="font-family:Quicksand,sans-serif;font-size:9px;font-weight:700;letter-spacing:.2em">HIYORI <span style="color:#1b8be0">EYE</span> CLINIC</span>
      <a href="tel:000-000-0000" style="font-family:Quicksand,sans-serif;font-size:20px;font-weight:700">☎ 000-000-0000</a>

    </div>
    <nav aria-label="フッターナビゲーション" style="display:grid;grid-template-columns:repeat(2,auto);gap:12px 40px;font-size:11px;font-weight:700;letter-spacing:.08em">

      <a href="About.dc.html">当院について</a>

      <a href="Access.dc.html">ご予約・アクセス</a>
      <a href="Access.dc.html#first">はじめての方へ</a>
    </nav>
  </div>
  <div style="max-width:880px;margin:48px auto 0;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
    <small style="font-family:Quicksand,sans-serif;font-size:10px;color:#8a929c">Copyright © Hiyori Eye Clinic All rights reserved.</small>

  </div>
</footer>
<sc-if value="{{ showFloat }}" hint-placeholder-val="{{ false }}">
  <a href="Access.dc.html#reserve" style="position:fixed;right:24px;bottom:24px;z-index:30;height:52px;padding:0 26px;border-radius:999px;background:#1d2533;color:#fff;display:flex;align-items:center;font-size:13px;font-weight:700;letter-spacing:.12em;box-shadow:0 8px 24px rgba(29,37,51,.22)" style-hover="background:#1b8be0;color:#fff">WEB予約</a>
</sc-if>
<sc-if value="{{ showBar }}" hint-placeholder-val="{{ false }}">
  <div style="height:calc(56px + env(safe-area-inset-bottom))"></div>
  <div style="position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:1fr 1fr;background:#fff;border-top:1px solid #1f2328;padding-bottom:env(safe-area-inset-bottom)">
    <a href="tel:000-000-0000" style="height:56px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;letter-spacing:.1em">☎ 電話する</a>
    <a href="Access.dc.html#reserve" style="height:56px;display:flex;align-items:center;justify-content:center;background:#1d2533;color:#fff;font-size:13px;font-weight:700;letter-spacing:.1em">WEB予約</a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;320px&quot;},&quot;stickyCTA&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280 };
  componentDidMount() {
    this.onR = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onR);
    setTimeout(() => this.motion(), 60);
    setTimeout(() => {
      if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      this.io = new IntersectionObserver(es => es.forEach(e => {
        if (e.isIntersecting) { e.target.style.opacity = 1; e.target.style.transform = 'none'; this.io.unobserve(e.target); }
      }), { threshold: 0.12 });
      document.querySelectorAll('[data-reveal]').forEach(el => {
        if (el.getBoundingClientRect().top < window.innerHeight) return;
        el.style.opacity = 0; el.style.transform = 'translateY(20px)';
        el.style.transition = 'opacity .9s ease, transform .9s ease';
        this.io.observe(el);
      });
    }, 80);
  }
  motion() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) return;
    if (!document.getElementById('hk-motion')) {
      const st = document.createElement('style');
      st.id = 'hk-motion';
      st.textContent = `
@keyframes hk-kb{from{transform:scale(1.1)}to{transform:scale(1)}}
@keyframes hk-char{from{opacity:0;transform:translateY(.7em);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes hk-float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-8deg)}}
@keyframes hk-pulse{0%{box-shadow:0 0 0 0 rgba(27,139,224,.55)}100%{box-shadow:0 0 0 7px rgba(27,139,224,0)}}
@keyframes hk-pop{0%{transform:scale(0)}65%{transform:scale(1.45)}100%{transform:scale(1)}}
@keyframes hk-ring{0%{box-shadow:0 8px 24px rgba(29,37,51,.22),0 0 0 0 rgba(27,139,224,.5)}100%{box-shadow:0 8px 24px rgba(29,37,51,.22),0 0 0 16px rgba(27,139,224,0)}}
@keyframes hk-down{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes hk-shine{from{transform:translateX(-120%) skewX(-20deg)}to{transform:translateX(320%) skewX(-20deg)}}
header{animation:hk-down .9s cubic-bezier(.2,.7,.2,1) both}
[data-m=kb]{animation:hk-kb 7s ease-out both}
[data-m=char]{display:inline-block;animation:hk-char .8s cubic-bezier(.2,.7,.2,1) both}
[data-m=card]{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .3s,opacity .8s var(--d,0s),translate .8s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
[data-m=card]:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(29,37,51,.09)}
[data-m=card][data-pre]{opacity:0;translate:0 22px}
[data-m=card][data-in]{opacity:1;translate:0 0}
[data-m=ph]{position:relative;overflow:hidden;transition:transform 6s ease-out}
[data-m=ph]::after{content:"";position:absolute;inset:0;background:var(--wb,#fff);transform-origin:100% 50%;transition:transform 1.2s cubic-bezier(.7,0,.2,1) var(--d,0s);pointer-events:none}
[data-m=ph][data-pre]::after{transform:scaleX(1)}
[data-m=ph][data-in]::after,[data-m=ph]:not([data-pre])::after{transform:scaleX(0)}
[data-m=ph]:hover{transform:scale(1.015)}
[data-m=h2]{transition:opacity .9s,letter-spacing 1.1s cubic-bezier(.2,.7,.2,1)}
[data-m=h2][data-pre]{opacity:0;letter-spacing:.45em!important}
[data-m=h2][data-in]{opacity:1}
[data-m=sch][data-pre]{transform:scale(0)}
[data-m=sch][data-in]{animation:hk-pop .55s cubic-bezier(.2,.7,.2,1) var(--d,0s) both}
[data-m=dot]{animation:hk-pulse 2.4s ease-out infinite}
[data-m=tooth]{animation:hk-float 3.2s ease-in-out infinite;transform-origin:50% 80%}
[data-m=arrow]{transition:transform .35s cubic-bezier(.2,.7,.2,1),background .3s}
a:hover [data-m=arrow]{transform:translateX(5px);background:#1b8be0!important}
[data-m=ring]{animation:hk-ring 2.2s ease-out infinite}
[data-m=shine]{position:relative;overflow:hidden}
[data-m=shine]::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:hk-shine 3.6s ease-in-out infinite;pointer-events:none}
nav a{transition:color .3s}
#hk-progress{position:fixed;left:0;top:0;height:3px;width:100%;background:#1b8be0;transform-origin:0 50%;transform:scaleX(0);z-index:100;pointer-events:none}`;
      document.head.appendChild(st);
    }
    const all = document.querySelectorAll('div,a,span,li,figure,article,h2,h1,svg');
    const pre = [];
    const groupIdx = new Map();
    const stag = (el, step, cap) => {
      const p = el.parentElement; const i = groupIdx.get(p) || 0; groupIdx.set(p, i + 1);
      el.style.setProperty('--d', Math.min(i * step, cap) + 's');
    };
    all.forEach(el => {
      if (el.dataset.m) return;
      const s = el.style;
      if (el.tagName === 'DIV' && (s.transition || '').includes('1.4s')) { el.dataset.m = 'kb'; return; }
      if (el.tagName === 'svg' && el.getAttribute('aria-hidden') === 'true') { el.dataset.m = 'tooth'; return; }
      if (el.tagName === 'H2' && !el.closest('article')) { el.dataset.m = 'h2'; pre.push(el); return; }
      if (el.tagName === 'H1') {
        let n = 0;
        [...el.childNodes].forEach(node => {
          if (node.nodeType !== 3) return;
          const frag = document.createDocumentFragment();
          [...node.textContent].forEach(ch => {
            const sp = document.createElement('span'); sp.textContent = ch; sp.dataset.m = 'char';
            sp.style.animationDelay = (0.25 + n++ * 0.05) + 's'; frag.appendChild(sp);
          });
          node.replaceWith(frag);
        });
        el.dataset.m = 'h1'; return;
      }
      if (el.getAttribute('aria-label') === '診療') { el.dataset.m = 'sch'; stag(el.closest('tr') ? el.parentElement : el, 0.05, 1); const tr = el.closest('tr'); const idx = tr ? [...tr.parentElement.children].indexOf(tr) * 7 + [...tr.children].indexOf(el.parentElement) : 0; el.style.setProperty('--d', (idx * 0.04) + 's'); pre.push(el); return; }
      if (s.width === '4px' && s.height === '4px' && s.borderRadius === '50%') { el.dataset.m = 'dot'; return; }
      if (s.width === '18px' && s.borderRadius === '50%' && el.tagName === 'SPAN') { el.dataset.m = 'arrow'; return; }
      if (s.position === 'fixed' && el.tagName === 'A') { el.dataset.m = 'ring'; return; }
      const bg = s.background || s.backgroundImage || '';
      if (bg.includes('repeating-linear-gradient') && !(s.transition || '').includes('1.4s')) { el.dataset.m = 'ph'; stag(el, 0.12, 0.6);
        let a = el.parentElement, wb = '#fff';
        while (a) { const c = getComputedStyle(a).backgroundColor; if (c && c !== 'rgba(0, 0, 0, 0)' && c !== 'transparent') { wb = c; break; } a = a.parentElement; }
        el.style.setProperty('--wb', wb); pre.push(el); return; }
      if ((s.border || '').startsWith('1px solid') && (s.borderRadius === '6px' || s.borderRadius === '999px') && ['A', 'DIV', 'LI'].includes(el.tagName) && !el.querySelector('table')) {
        el.dataset.m = 'card'; stag(el, 0.08, 0.64); pre.push(el); return;
      }
      if ((s.background === 'rgb(29, 37, 51)' || s.background === '#1d2533') && el.tagName === 'A' && s.height) { el.dataset.m = 'shine'; return; }
    });
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      requestAnimationFrame(() => { e.target.removeAttribute('data-pre'); e.target.setAttribute('data-in', '1'); });
      io.unobserve(e.target);
    }), { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
    pre.forEach(el => { el.setAttribute('data-pre', '1'); io.observe(el); });
    this.io2 = io;
    let bar = document.getElementById('hk-progress');
    if (!bar) { bar = document.createElement('div'); bar.id = 'hk-progress'; document.body.appendChild(bar); }
    this.onS = () => {
      const h = document.documentElement.scrollHeight - innerHeight;
      bar.style.transform = 'scaleX(' + (h > 0 ? scrollY / h : 0) + ')';
    };
    addEventListener('scroll', this.onS, { passive: true }); this.onS();
    this.slideObs = new MutationObserver(() => {
      document.querySelectorAll('[data-m=kb]').forEach(el => {
        const on = el.style.opacity === '1';
        if (on && !el.dataset.kbOn) { el.dataset.kbOn = '1'; el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; }
        if (!on) delete el.dataset.kbOn;
      });
    });
    document.querySelectorAll('[data-m=kb]').forEach(el => this.slideObs.observe(el, { attributes: true, attributeFilter: ['style'] }));
  }
  componentWillUnmount() {
    this.io2 && this.io2.disconnect(); this.slideObs && this.slideObs.disconnect();
    this.onS && removeEventListener('scroll', this.onS); window.removeEventListener('resize', this.onR); this.io && this.io.disconnect(); }
  renderVals() {
    const mobile = this.state.w < 900;
    const sticky = this.props.stickyCTA ?? true;
    return {
      showFloat: sticky && !mobile,
      showBar: sticky && mobile,
      toTop: () => window.scrollTo({ top: 0, behavior: 'smooth' })
    };
  }
}
</script>
