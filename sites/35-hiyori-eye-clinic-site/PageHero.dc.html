<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:0 clamp(10px,1.4vw,20px)">
  <div style="position:relative;height:clamp(240px,28vw,340px);border-radius:28px;overflow:hidden;background:repeating-linear-gradient(135deg,#8f9cab 0 12px,#98a4b2 12px 24px)">
    <sc-if value="{{ src }}"><img src="{{ src }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{ pos }}"></sc-if>
    <sc-if value="{{ !src }}"><span style="position:absolute;right:28px;top:60px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#eef2f6;background:rgba(29,37,51,.45);padding:6px 10px;border-radius:4px">{{ image }}</span></sc-if>
    <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,28,40,.55),rgba(20,28,40,0) 65%)"></div>
    <div style="position:absolute;left:clamp(20px,4vw,48px);bottom:clamp(24px,3.5vw,40px);color:#fff;display:flex;flex-direction:column;gap:8px">
      <span style="display:flex;align-items:center;gap:8px;font-family:Quicksand,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em"><span style="width:5px;height:5px;border-radius:50%;background:#fff"></span>{{ en }}</span>
      <h1 style="margin:0;font-size:clamp(24px,3vw,34px);font-weight:700;letter-spacing:.16em">{{ title }}</h1>
    </div>
  </div>
  <nav aria-label="パンくずリスト" style="max-width:960px;margin:18px auto 0;padding:0 10px;display:flex;gap:10px;font-size:10px;letter-spacing:.06em;color:#8a929c">
    <a href="Hiyori Eye Clinic.dc.html" style="color:#8a929c">トップ</a><span>›</span><span style="color:#1f2328">{{ title }}</span>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;400px&quot;},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;about&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;当院について&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;image&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;photo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pos&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;center&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
