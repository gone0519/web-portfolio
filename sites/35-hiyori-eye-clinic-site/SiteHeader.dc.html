<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
/* レスポンシブ共通ルール（全ページ共通・SiteHeader から読み込み） */
@media (max-width:640px){
  .r-span{grid-column:1/-1!important}
}
@media (max-width:600px){
  .r-split{flex:1 1 100%!important;min-width:0!important;padding:0 0 18px!important;border-right:0!important;border-bottom:1px dashed #c9cfd6}
  .r-news{flex-wrap:wrap;gap:6px 12px!important;border-radius:16px!important;padding:12px 12px 12px 18px!important}
  .r-news>span:nth-child(2){order:3;flex:1 1 100%;line-height:1.7}
  .r-tbox{padding:10px 12px!important}
  .r-table{min-width:0!important}
  .r-table th:first-child,.r-table td:first-child{white-space:nowrap;padding-right:8px!important}
  .r-equip{grid-template-columns:80px 1fr!important;gap:14px!important}
  .r-cta{width:100%;justify-content:center}
  .r-shade{background:linear-gradient(0deg,rgba(20,28,40,.7),rgba(20,28,40,.25) 55%,rgba(20,28,40,0) 80%)!important}
  .r-idx{grid-template-columns:1fr 1fr!important}
  .r-idx>a{padding:14px 12px!important;line-height:1.5}
}
@media (max-width:420px){
  .r-logo{padding:12px 16px 14px!important}
  .r-logo-name{font-size:18px!important;letter-spacing:.22em!important}
}
</style>
</helmet>
<header style="position:relative;z-index:20;height:64px;padding:0 clamp(16px,2.5vw,32px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:#fff">
  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
    <nav aria-label="メインナビゲーション" style="display:flex;gap:18px;font-size:12px;font-weight:500;letter-spacing:.06em;white-space:nowrap">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
        <a href="{{ n.href }}" aria-current="{{ n.aria }}" style="padding:6px 0;border-bottom:1px solid {{ n.line }};color:{{ n.color }}">{{ n.label }}</a>
      </sc-for>
    </nav>
  </sc-if>
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}"><div></div></sc-if>

  <a href="Hiyori Eye Clinic.dc.html" aria-label="ひより眼科 トップへ" class="r-logo" style="position:relative;align-self:start;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 40px 16px;background:#fff;border-radius:0 0 36px 36px;margin-bottom:-28px">
    <span style="display:flex;align-items:center;gap:10px">
      <span style="width:22px;height:22px;border-radius:50%;border:5px solid #1b8be0"></span>
      <span class="r-logo-name" style="font-size:22px;font-weight:500;letter-spacing:.28em;color:#1f2328;white-space:nowrap">ひより眼科</span>
    </span>
    <span style="font-family:Quicksand,sans-serif;font-size:8px;font-weight:700;letter-spacing:.2em;color:#1f2328">HIYORI <span style="color:#1b8be0">EYE</span> CLINIC</span>
  </a>

  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;justify-content:flex-end;align-items:center;gap:18px;white-space:nowrap">
      <a href="Access.dc.html#hours" style="font-size:12px;font-weight:500;letter-spacing:.06em">アクセス / 診療時間</a>
      <span style="width:1px;height:26px;background:#1f2328"></span>
      <a href="tel:000-000-0000" style="display:flex;flex-direction:column;line-height:1.2">
        <span style="font-family:Quicksand,sans-serif;font-size:18px;font-weight:700;letter-spacing:.04em">☎ 000-000-0000</span>
        <span style="font-size:9px;color:#8a929c;letter-spacing:.04em">受付時間 8:45–11:45 / 14:45–18:15</span>
      </a>
    </div>
  </sc-if>
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;justify-content:flex-end">
      <button onClick="{{ toggleMenu }}" aria-label="メニューを開く" style="width:44px;height:44px;border-radius:50%;border:0;background:#1d2533;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer">
        <span style="width:16px;height:2px;background:#fff"></span>
        <span style="width:16px;height:2px;background:#fff"></span>
      </button>
    </div>
  </sc-if>
</header>

<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:60;background:#fff;padding:24px;display:flex;flex-direction:column;gap:8px;overflow-y:auto">
    <div style="display:flex;justify-content:flex-end">
      <button onClick="{{ toggleMenu }}" aria-label="メニューを閉じる" style="width:44px;height:44px;border-radius:50%;border:1px solid #1f2328;background:#fff;font-size:18px;cursor:pointer">×</button>
    </div>
    <nav style="display:flex;flex-direction:column;margin-top:16px">
      <a href="Hiyori Eye Clinic.dc.html" style="padding:18px 4px;border-bottom:1px solid #e3e7ec;font-size:16px;font-weight:700;letter-spacing:.1em">トップ</a>
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
        <a href="{{ n.href }}" style="padding:18px 4px;border-bottom:1px solid #e3e7ec;font-size:16px;font-weight:700;letter-spacing:.1em;color:{{ n.color }}">{{ n.label }}</a>
      </sc-for>
    </nav>
    <a href="tel:000-000-0000" style="margin-top:24px;font-family:Quicksand,sans-serif;font-size:24px;font-weight:700">☎ 000-000-0000</a>
    <a href="Access.dc.html#reserve" style="margin-top:8px;height:52px;border-radius:6px;background:#1d2533;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.1em">WEB予約はこちら</a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;120px&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;about&quot;,&quot;services&quot;,&quot;doctor&quot;,&quot;facility&quot;,&quot;access&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menu: false, w: typeof window !== 'undefined' ? window.innerWidth : 1280 };
  componentDidMount() {
    this.onR = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onR);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  renderVals() {
    const cur = this.props.current ?? '';
    const items = [
      ['about', '当院について', 'About.dc.html'],
      ['services', '診療案内', 'Services.dc.html'],
      ['doctor', '医師紹介', 'Doctor.dc.html'],
      ['facility', '院内紹介', 'Facility.dc.html'],
      ['access', 'ご予約・アクセス', 'Access.dc.html']
    ];
    const mobile = this.state.w < 1200;
    return {
      isMobile: mobile,
      isDesktop: !mobile,
      menuOpen: this.state.menu,
      toggleMenu: () => this.setState(s => ({ menu: !s.menu })),
      nav: items.map(([k, label, href]) => ({
        label, href,
        aria: k === cur ? 'page' : undefined,
        color: k === cur ? '#1b8be0' : '#1f2328',
        line: k === cur ? '#1b8be0' : 'transparent'
      }))
    };
  }
}
</script>
</body>
</html>
