<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header data-hero="h" style="position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 0 0 24px;height:64px;background:{{ headerBg }};transition:background .3s;font-family:'Noto Sans JP',sans-serif">
  <a href="Top.dc.html" style="display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none">
    <span style="width:30px;height:30px;border:2px solid #fff;display:grid;place-items:center;transform:rotate(45deg)"><span style="width:10px;height:10px;background:#d7000f"></span></span>
    <span style="display:flex;flex-direction:column;line-height:1.1"><span style="font-family:Oswald;font-size:18px;letter-spacing:.06em">SEIREI</span><span style="font-size:9px;letter-spacing:.2em">清嶺大学 入試情報</span></span>
  </a>
  <sc-if value="{{ notMobile }}" hint-placeholder-val="{{ true }}">
    <nav style="display:flex;gap:26px;flex:1;padding-left:24px;height:100%">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
        <a href="{{ n.href }}" style="color:#fff;font-size:12px;font-weight:500;white-space:nowrap;display:flex;align-items:center;border-bottom:3px solid {{ n.line }};padding-top:3px;text-decoration:none;transition:opacity .2s" style-hover="opacity:.7;color:#fff">{{ n.label }}</a>
      </sc-for>
    </nav>
    <div style="display:flex;align-items:center;gap:18px;height:100%">
      <div style="color:#fff;text-align:right;line-height:1.2"><div style="font-family:Oswald;font-size:18px;letter-spacing:.06em">000-000-0000</div><div style="font-size:9px">入試課 平日 9:00〜17:00</div></div>
      <a href="Contact.dc.html?type=doc" style="height:100%;padding:0 22px;background:#d7000f;color:#fff;display:flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:.1em;text-decoration:none;transition:background .2s" style-hover="background:#a8000c;color:#fff">資料請求</a>
    </div>
  </sc-if>
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ toggleMenu }}" aria-label="メニュー" style="width:64px;height:64px;border:0;background:#d7000f;color:#fff;font-size:22px;cursor:pointer">{{ menuIcon }}</button>
  </sc-if>
</header>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:64px 0 0 0;z-index:49;background:rgba(20,20,20,.97);display:flex;flex-direction:column;padding:24px;font-family:'Noto Sans JP',sans-serif">
    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
      <a href="{{ n.href }}" style="color:#fff;padding:16px 0;border-bottom:1px solid #444;text-decoration:none">{{ n.label }}</a>
    </sc-for>
    <a href="Contact.dc.html?type=doc" style="margin-top:24px;background:#d7000f;color:#fff;padding:16px;text-align:center;font-weight:700;text-decoration:none">資料請求・お問い合わせ</a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;faculties&quot;,&quot;exam&quot;,&quot;admissions&quot;,&quot;campus&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, scrolled: false, menu: false };
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth, menu: window.innerWidth < 1200 ? this.state.menu : false });
    this.onScroll = () => { const s = window.scrollY > 40; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };
    window.addEventListener('resize', this.onResize);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onScroll();
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('scroll', this.onScroll);
  }
  renderVals() {
    const { w, scrolled, menu } = this.state;
    const mobile = w < 1200;
    const cur = this.props.current ?? 'top';
    const items = [
      ['top', 'TOP', 'Top.dc.html'], ['faculties', '学部・学科', 'Faculties.dc.html'], ['exam', '入試対策', 'Examination.dc.html'],
      ['admissions', '出願・学費', 'Admissions.dc.html'], ['campus', 'キャンパスライフ', 'CampusLife.dc.html'], ['contact', 'お問い合わせ', 'Contact.dc.html'],
    ];
    return {
      isMobile: mobile, notMobile: !mobile, menuOpen: mobile && menu,
      menuIcon: menu ? '×' : '≡',
      toggleMenu: () => this.setState(s => ({ menu: !s.menu })),
      headerBg: scrolled || menu ? 'rgba(26,26,26,.95)' : 'transparent',
      nav: items.map(([k, label, href]) => ({ label, href, line: k === cur ? '#d7000f' : 'transparent' })),
    };
  }
}
</script>
</body>
</html>
