<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>施工実績｜要建設株式会社</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="./site.css">
<script src="./image-slot.js"></script>
<script src="./projects.js"></script>
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#0c0e12;color:#f2f3f5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#f2f3f5;text-decoration:none}
a:hover{color:#8fa6ff}
button{font:inherit}
::selection{background:#2446e6;color:#fff}
</style>
</helmet>
<div id="top" style="font-family:'Noto Sans JP',sans-serif;color:#f2f3f5;background-color:#0c0e12;background-image:linear-gradient(rgba(255,255,255,.024) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);background-size:72px 36px;overflow-x:hidden;min-height:100vh">
<dc-import name="SiteHeader" current="works" hint-size="100%,0px"></dc-import>
<main>
<dc-import name="PageHero" en="WORKS" ja="施工実績" title="積み重ねた実績が、確かな品質をつくる。" slot="works-hero" img="images/excavators.jpg" placeholder="ページヘッダー写真：竣工建物の夜景" hint-size="100%,480px"></dc-import>

<section data-screen-label="Works / List" aria-label="施工実績一覧" style="max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,88px) clamp(20px,4vw,40px) clamp(96px,12vw,140px);display:flex;flex-direction:column;gap:40px">
  <div class="filters" data-reveal-children="scale" role="group" aria-label="工事区分で絞り込む" style="display:flex;flex-wrap:wrap;justify-content:center;gap:4px">
    <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
      <button type="button" onClick="{{ f.pick }}" aria-pressed="{{ f.on }}" style="min-height:48px;padding:0 22px;display:flex;align-items:center;gap:10px;border:1px solid {{ f.border }};background:{{ f.bg }};color:#fff;font-size:13px;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:background .2s,border-color .2s">{{ f.label }}<span style="font-family:Jost,sans-serif;font-size:12px;font-weight:400;opacity:.8">{{ f.count }}</span></button>
    </sc-for>
  </div>
  <p aria-live="polite" style="margin:0;text-align:center;font-size:12px;color:#c9cdd5;letter-spacing:.08em">{{ countLabel }}</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:4px">
    <sc-for list="{{ items }}" as="p" hint-placeholder-count="6">
      <a data-reveal="1" href="{{ p.href }}" style="display:flex;flex-direction:column;background:#15181e;border:1px solid rgba(255,255,255,.08);color:#f2f3f5;transition:transform .35s,border-color .35s" style-hover="transform:translateY(-6px);border-color:#2446e6;color:#f2f3f5">
        <div style="position:relative;aspect-ratio:4/3;overflow:hidden">
          <image-slot id="{{ p.slot }}" src="{{ p.img }}" shape="rect" placeholder="{{ p.ph }}"></image-slot>
          <span style="position:absolute;left:0;top:0;padding:6px 12px;background:#2446e6;color:#fff;font-size:11px;font-weight:700;letter-spacing:.1em;pointer-events:none">{{ p.cat }}</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 52px;flex:1">
          <div style="padding:20px 20px 22px;display:flex;flex-direction:column;gap:14px">
            <h2 style="margin:0;font-size:15px;font-weight:700;letter-spacing:.06em;line-height:1.6">{{ p.name }}</h2>
            <dl style="margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:11px;line-height:1.7;color:#c9cdd5">
              <dt style="font-weight:700">種別</dt><dd style="margin:0">{{ p.type }}</dd>
              <dt style="font-weight:700">所在地</dt><dd style="margin:0">{{ p.loc }}</dd>
              <dt style="font-weight:700">竣工</dt><dd style="margin:0">{{ p.year }}</dd>
            </dl>
          </div>
          <span aria-hidden="true" style="border-left:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-family:Jost,sans-serif;font-size:18px">→</span>
        </div>
      </a>
    </sc-for>
  </div>
</section>
</main>
<dc-import name="ContactCTA" hint-size="100%,420px"></dc-import>
<dc-import name="SiteFooter" hint-size="100%,480px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { filter: 'すべて' };
  componentDidMount() {
    if (!window.KANAME_PROJECTS) {
      const s = document.querySelector('script[src*="projects.js"]');
      s && s.addEventListener('load', () => this.forceUpdate());
      setTimeout(() => this.forceUpdate(), 400);
    }
  }
  renderVals() {
    const all = window.KANAME_PROJECTS || [];
    const { filter } = this.state;
    const filters = ['すべて', '建築工事', '改修・リフォーム', '土木工事', '専門工事'].map(label => {
      const on = label === filter;
      return { label, on, count: label === 'すべて' ? all.length : all.filter(p => p.cat === label).length,
        bg: on ? '#2446e6' : 'transparent', border: on ? '#2446e6' : 'rgba(255,255,255,.3)',
        pick: () => this.setState({ filter: label }) };
    });
    const items = all.filter(p => filter === 'すべて' || p.cat === filter)
      .map(p => ({ ...p, slot: 'work-' + p.id, ph: '施工写真：' + p.ph, href: 'WorkDetail.dc.html?id=' + p.id }));
    return { filters, items, countLabel: items.length + '件の施工実績' };
  }
}
</script>
</body>
</html>
