    </div>
    <div data-reveal-children="right" style="display:flex;flex-direction:column;gap:4px">
      <a href="KANAME%20Construction.dc.html#contact-form" style="display:grid;grid-template-columns:1fr 64px;min-height:96px;background:#fff;color:#0c0e12;text-decoration:none;transition:background .3s" style-hover="background:#e6eaff;color:#0c0e12">
        <span style="display:flex;flex-direction:column;justify-content:center;gap:4px;padding:20px 26px"><span style="font-family:Jost,sans-serif;font-size:11px;letter-spacing:.24em;color:#1f3fd4">WEB FORM</span><span style="font-size:clamp(16px,4.4vw,18px);font-weight:700;letter-spacing:.08em">お問い合わせはこちら</span></span>
        <span style="display:flex;align-items:center;justify-content:center;border-left:1px solid rgba(12,14,18,.15);font-family:Jost,sans-serif;font-size:22px">→</span>
      </a>
      <a href="tel:0312345678" style="display:grid;grid-template-columns:1fr 64px;min-height:96px;border:1px solid rgba(255,255,255,.7);color:#fff;text-decoration:none;transition:background .3s" style-hover="background:rgba(255,255,255,.1);color:#fff">
        <span style="display:flex;flex-direction:column;justify-content:center;gap:4px;padding:20px 26px"><span style="font-size:11px;font-weight:700;letter-spacing:.12em">お電話 平日 8:30〜17:30</span><span style="font-family:Jost,sans-serif;font-size:26px;letter-spacing:.06em">03-1234-5678</span></span>
        <span style="display:flex;align-items:center;justify-content:center;border-left:1px solid rgba(255,255,255,.4);font-family:Jost,sans-serif;font-size:22px">→</span>

  </div>
</section>
