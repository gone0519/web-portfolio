<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>私たちの強み｜あおば税理士事務所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>html{scroll-behavior:smooth}body{margin:0;background:#17457f;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:#2f8fd0;text-decoration:none}a:hover{color:#17457f}h1,h2,h3,dt,dd,li,label,button,[style*="text-align: center"] p:not([style*="text-align: left"]),p[style*="text-align: center"]{word-break:auto-phrase}[data-stat]>div{display:flex;flex-direction:column;justify-content:space-between}@media (max-width:767px){[data-stat] dd{flex-direction:column;align-items:center!important}}h1,h2,h3{text-wrap:balance}@media (max-width:1023px){[data-deco]{display:none!important}}@media (max-width:767px){[data-btns]{flex-direction:column;align-items:stretch}[data-btns]>a{justify-content:center}}</style>
</helmet>
<div lang="ja" style="font-family:'Zen Maru Gothic',sans-serif;color:#24395a;background:#17457f;padding:0 10px;min-height:100vh">
<div style="background:#fff;overflow:clip">
<dc-import name="SiteHeader" current="strengths" hint-size="100%,72px" style="position:sticky;top:0;z-index:50;display:block"></dc-import>
<main>
<dc-import name="PageHero" en="Our Strengths" title="私たちの強み" lead="数字の先にある、経営者の想いまで考える。安心してご相談いただくための、4つの約束です。" hint-size="100%,380px"></dc-import>

<div style="max-width:1080px;margin:0 auto;padding:clamp(36px,6vw,40px) clamp(16px,4vw,40px) clamp(64px,10vw,100px);display:flex;flex-direction:column;gap:clamp(64px,8vw,110px)">
  <sc-for list="{{ strengths }}" as="st" hint-placeholder-count="4">
    <article data-reveal="" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(32px,5vw,64px);align-items:center">
      <div style="position:relative">
        <div style="aspect-ratio:4/3;border-radius:10px;overflow:hidden;box-shadow:0 10px 28px rgba(23,69,127,.12)"><image-slot id="{{ st.slot }}" src="{{ st.img }}" shape="rounded" radius="10" placeholder="{{ st.ph }}"></image-slot></div>
        <span style="position:absolute;left:clamp(-10px,-1.5vw,-6px);top:clamp(-26px,-4vw,-18px);width:clamp(56px,13vw,76px);height:clamp(56px,13vw,76px);border-radius:50%;background:#fff;border:1.5px solid #eba52c;display:flex;align-items:center;justify-content:center;font-family:Quicksand,sans-serif;font-size:clamp(20px,4.6vw,26px);font-weight:700;color:#eba52c;pointer-events:none">{{ st.no }}</span>
      </div>
      <div>
        <span style="font-family:Quicksand,sans-serif;font-size:13px;font-weight:600;letter-spacing:.08em;color:#2f8fd0">{{ st.en }}</span>
        <h2 style="margin:6px 0 0;font-size:clamp(22px,2.6vw,28px);font-weight:700;letter-spacing:.14em;color:#17457f">{{ st.title }}</h2>
        <p style="margin:14px 0 0;font-size:16px;font-weight:700;line-height:1.9;letter-spacing:.08em;color:#2f8fd0;text-wrap:pretty">{{ st.lead }}</p>
        <p style="margin:14px 0 0;font-size:14.5px;line-height:2.15;letter-spacing:.04em;text-wrap:pretty">{{ st.text }}</p>
      </div>
    </article>
  </sc-for>
</div>

<section aria-labelledby="promise-title" data-screen-label="Strengths / Promise" style="position:relative;background:#e3f1f4;padding:40px clamp(16px,4vw,40px) clamp(64px,10vw,110px)">
  <svg viewBox="0 0 1000 60" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;left:0;top:-59px;display:block;width:100%;height:60px"><path d="M0 60 L0 30 Q160 -6 340 22 Q500 46 660 22 Q840 -6 1000 30 L1000 60 Z" fill="#e3f1f4"></path></svg>
  <div style="max-width:1100px;margin:0 auto">
    <div data-reveal="" style="display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center">
      <span style="font-family:Quicksand,sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;color:#2f8fd0">Our Promise</span>
      <div style="display:flex;align-items:center;gap:18px">
        <span style="width:1.5px;height:26px;background:#8cc6ea;transform:rotate(-30deg);display:block"></span>
        <h2 id="promise-title" style="margin:0;font-size:clamp(20px,2.4vw,28px);font-weight:700;letter-spacing:.16em;color:#17457f">日々の対応で大切にしていること</h2>
        <span style="width:1.5px;height:26px;background:#8cc6ea;transform:rotate(30deg);display:block"></span>
      </div>
    </div>
    <div style="margin-top:52px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px">
      <sc-for list="{{ promises }}" as="p" hint-placeholder-count="6">
        <div data-reveal="" style="background:#fff;border-radius:10px;padding:clamp(20px,4vw,26px);display:flex;gap:clamp(12px,3vw,16px);align-items:flex-start">
          <span style="flex:none;width:22px;height:22px;margin-top:2px;border-radius:50%;border:1.5px solid #3a9ad8;display:flex;align-items:center;justify-content:center;font-size:11px;color:#3a9ad8">✓</span>
          <div>
            <h3 style="margin:0;font-size:16px;font-weight:700;letter-spacing:.1em;color:#17457f">{{ p.title }}</h3>
            <p style="margin:8px 0 0;font-size:13.5px;line-height:1.95;letter-spacing:.04em;text-wrap:pretty">{{ p.text }}</p>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</section>
</main>
<dc-import name="SiteCta" hint-size="100%,440px"></dc-import>
<dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() { setTimeout(() => this.reveal(), 60); }
  componentWillUnmount() { this.io && this.io.disconnect(); }
  reveal() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const els = document.querySelectorAll('[data-reveal]');
    this.io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'none'; this.io.unobserve(e.target); } }), { threshold: 0.1 });
    els.forEach(el => { el.style.opacity = '0'; el.style.transform = 'translateY(26px)'; el.style.transition = 'opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1)'; this.io.observe(el); });
  }
  renderVals() {
    return {
      strengths: [
        { no: '01', slot: 'str-p-1', img: 'images/explaining.jpg', ph: '経営者の話に耳を傾ける税理士', en: 'Close to You', title: '経営者に寄り添う', lead: '事業の数だけ、答えがあると考えています。', text: 'ご相談ではまず、事業の現状だけでなく、ご家族のことやこれから目指したい姿まで丁寧に伺います。画一的なプランではなく、一人ひとりの状況に合わせた個別のご提案を行います。' },
        { no: '02', slot: 'str-p-2', img: 'images/notebook-pen.jpg', ph: '資料を指し示しながら説明する様子', en: 'Easy to Understand', title: '分かりやすい説明', lead: '納得して判断できることを、何より大切に。', text: '専門用語はできるだけ使わず、図や具体例を交えてご説明します。ご質問には原則1営業日以内にお返事し、チャットやオンライン面談など、ご都合に合わせた連絡方法をお選びいただけます。' },
        { no: '03', slot: 'str-p-3', img: 'images/team-table.jpg', ph: '事業計画書を一緒に確認する場面', en: 'Beyond Tax', title: '税務だけで終わらない', lead: '数字を、経営の実務に活かすために。', text: '資金繰りの見通しや事業計画の作成、金融機関への融資相談まで。試算表や決算書から読み取れることを、次の経営判断につながる具体的なアドバイスとしてお伝えします。' },
        { no: '04', slot: 'str-p-4', img: 'images/handshake.jpg', ph: '握手する経営者と税理士', en: 'Long-term Partner', title: '長期的なパートナー', lead: '事業が続く限り、変わらず相談できる存在に。', text: '創業期から成長期、そして事業承継まで。20年以上の実務経験をもとに、事業の節目ごとに必要な選択肢をご提示し、長くお付き合いできる関係を築いていきます。' }
      ],
      promises: [
        { title: '分かりやすい説明', text: '専門用語を避け、図や具体例でご説明します。' },
        { title: '個別のご相談', text: '事業やご家族の状況に合わせてご提案します。' },
        { title: '迅速なご連絡', text: 'ご質問には原則1営業日以内にお返事します。' },
        { title: '実務に即したサポート', text: '資金繰りや融資など、経営の現場で役立つ支援を行います。' },
        { title: '長いお付き合い', text: '事業の節目ごとに、継続して伴走します。' },
        { title: '確かな専門性', text: '20年以上の経験と、継続的な研鑽に基づいて対応します。' }
      ]
    };
  }
}
</script>
</body>
</html>
