<body>
<x-dc>
<section style="position:relative;background:#e3f1f4;padding:clamp(28px,6vw,72px) clamp(16px,4vw,40px) clamp(64px,11vw,110px);text-align:center;font-family:'Zen Maru Gothic',sans-serif;color:#24395a">
  <nav aria-label="パンくずリスト" style="max-width:1100px;margin:0 auto clamp(24px,5vw,36px);display:flex;gap:10px;justify-content:flex-start;font-size:12px;letter-spacing:.06em;color:#4a6a8e">
    <a href="Tax%20Office%20Website.dc.html" style="color:#2f8fd0">ホーム</a><span aria-hidden="true">›</span><span aria-current="page">{{ title }}</span>
  </nav>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
    <span style="position:relative;width:30px;height:30px;border-radius:7px;background:#17457f;display:block"><span style="position:absolute;right:5px;top:5px;width:11px;height:11px;border-radius:50%;background:#7cc4ec"></span></span>
    <span style="font-family:Quicksand,sans-serif;font-size:13px;font-weight:600;letter-spacing:.12em;color:#2f8fd0">{{ en }}</span>
    <div style="display:flex;align-items:center;gap:20px;margin-top:4px">
      <span style="width:1.5px;height:32px;background:#8cc6ea;transform:rotate(-30deg);display:block"></span>
      <h1 style="margin:0;font-size:clamp(24px,3.2vw,36px);font-weight:700;letter-spacing:.18em;color:#17457f">{{ title }}</h1>
      <span style="width:1.5px;height:32px;background:#8cc6ea;transform:rotate(30deg);display:block"></span>
    </div>
    <p style="margin:22px auto 0;max-width:34em;font-size:clamp(14px,1.4vw,16px);line-height:2.1;letter-spacing:.08em;text-wrap:pretty">{{ lead }}</p>
  </div>
  <svg viewBox="0 0 1000 60" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;left:0;bottom:-1px;display:block;width:100%;height:clamp(30px,5vw,60px)"><path d="M0 60 Q0 18 60 14 Q300 -2 500 0 Q700 -2 940 14 Q1000 18 1000 60 Z" fill="#fff"></path></svg>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;380px&quot;},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;About Our Office&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;事務所について&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
