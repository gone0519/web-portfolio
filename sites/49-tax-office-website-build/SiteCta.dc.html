<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section aria-label="無料相談のご案内" style="position:relative;background:#17457f;color:#fff;padding:clamp(64px,10vw,96px) clamp(16px,4vw,40px);overflow:hidden;font-family:'Zen Maru Gothic',sans-serif">
  <div style="position:absolute;inset:0;opacity:.26"><image-slot id="cta-bg" src="images/calc-hands.jpg" shape="rect" placeholder="背景写真：書類とペンを持つ手元（暗めに表示されます）"></image-slot></div>
  <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(23,69,127,.55),rgba(23,69,127,.85))"></div>
  <div style="position:relative;max-width:960px;margin:0 auto;text-align:center;pointer-events:none">
    <span style="font-family:Quicksand,sans-serif;font-size:13px;font-weight:600;letter-spacing:.1em;color:#bfe2f7">Let’s Talk About Your Future.</span>
    <h2 style="margin:10px 0 0;font-size:clamp(20px,2.6vw,30px);font-weight:700;letter-spacing:.16em">まずはお気軽にご相談ください。</h2>
    <p style="margin:20px 0 0;font-size:clamp(14px,1.4vw,16px);line-height:2.1;letter-spacing:.1em">初回のご相談は無料です。オンライン面談にも対応しています。</p>
    <div style="margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;pointer-events:auto">
      <a href="Contact.dc.html" style="display:flex;align-items:center;justify-content:center;gap:10px;height:68px;border-radius:999px;background:#eba52c;color:#fff;font-size:16px;font-weight:700;letter-spacing:.1em;box-shadow:0 4px 0 #cf8a17;transition:transform .2s ease,box-shadow .2s ease" style-hover="transform:translateY(3px);box-shadow:0 1px 0 #cf8a17;color:#fff">無料相談はこちら<span style="font-family:Quicksand,sans-serif">›</span></a>
      <a href="Contact.dc.html#form" style="display:flex;align-items:center;justify-content:center;gap:10px;height:68px;border-radius:999px;background:#3a9ad8;color:#fff;font-size:15px;font-weight:700;letter-spacing:.1em;box-shadow:0 4px 0 #257bb6;transition:transform .2s ease,box-shadow .2s ease" style-hover="transform:translateY(3px);box-shadow:0 1px 0 #257bb6;color:#fff"><span style="width:16px;height:12px;border:1.5px solid #fff;border-radius:2px;display:block"></span>メールフォーム</a>
      <a href="tel:0000000000" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:68px;border-radius:999px;background:#fff;color:#17457f;transition:transform .2s ease" style-hover="transform:translateY(-2px);color:#17457f">
        <span style="font-family:Quicksand,sans-serif;font-size:22px;font-weight:700;letter-spacing:.04em;line-height:1.1"><span style="font-size:13px;margin-right:6px">TEL</span>00-0000-0000</span>
        <span style="font-size:11px;letter-spacing:.06em;color:#4a6a8e;margin-top:3px">受付時間 平日 9:00〜18:00</span>
      </a>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;440px&quot;}}"></script>
</body>
</html>
