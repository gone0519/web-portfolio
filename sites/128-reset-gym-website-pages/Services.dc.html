<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="./image-slot.js"></script>
  <link rel="stylesheet" href="./responsive.css">
  <style id="__om-reset">*{box-sizing:border-box;}body{margin:0;}a{text-decoration:none;color:inherit;}a:hover{opacity:0.75;}</style>
  <title>トレーニング | RESET GYM</title>
</helmet>
<div style="fontFamily:'Noto Sans JP',sans-serif;background:#fdfdf8;color:#17170f;">
  <dc-import name="Header" current-page="services" hint-size="100%,58px"></dc-import>

  <section class="r-px r-py" style="padding:80px 28px 50px;maxWidth:900px;margin:0 auto;textAlign:center;">
    <span style="fontFamily:'Oswald',sans-serif;fontSize:13px;letterSpacing:3px;color:#a3934f;">TRAINING</span>
    <h1 style="fontSize:clamp(28px,4.5vw,40px);fontWeight:900;margin:16px 0 0;">トレーニング内容</h1>
    <p style="fontSize:15px;color:#5a584c;marginTop:16px;">目標や体力レベルに合わせて、複数のトレーニングをご用意しています。</p>
  </section>

  <sc-for list="{{ services }}" as="svc" hint-placeholder-count="4">
    <section class="r-px r-py-sm r-split" style="padding:60px 28px;maxWidth:1120px;margin:0 auto;display:flex;flexWrap:wrap;gap:56px;alignItems:center;flexDirection:{{ svc.reverse }};">
      <div class="r-fx" style="flex:1 1 380px;minWidth:300px;">
        <image-slot class="r-img-tall" id="svc-img-{{ svc.id }}" shape="rect" src="{{ svc.img }}" placeholder="{{ svc.imgLabel }}" style="width:100%;height:100%;minHeight:320px;"></image-slot>
      </div>
      <div class="r-fx" style="flex:1 1 380px;minWidth:300px;">
        <span style="fontFamily:'Oswald',sans-serif;fontSize:12px;letterSpacing:2px;color:#a3934f;">{{ svc.tag }}</span>
        <h2 style="fontSize:26px;fontWeight:900;margin:12px 0 16px;">{{ svc.title }}</h2>
        <p style="fontSize:14.5px;lineHeight:2;color:#4d4b41;margin:0 0 20px;">{{ svc.desc }}</p>
        <div style="display:flex;flexDirection:column;gap:10px;marginBottom:24px;">
          <sc-for list="{{ svc.benefits }}" as="b" hint-placeholder-count="3">
            <div style="display:flex;gap:10px;fontSize:13.5px;color:#4d4b41;alignItems:flex-start;">
              <span style="color:#f4c400;fontWeight:700;">✓</span><span>{{ b }}</span>
            </div>
          </sc-for>
        </div>
        <a href="Contact.dc.html" style="fontWeight:700;fontSize:14px;borderBottom:2px solid #17170f;paddingBottom:2px;">このトレーニングについて相談する ›</a>
      </div>
    </section>
  </sc-for>

  <section class="r-px r-py-sm" style="background:#f1efe8;padding:70px 28px;textAlign:center;">
    <p style="fontSize:12.5px;color:#8c8a7c;maxWidth:640px;margin:0 auto;lineHeight:1.9;">※トレーニング内容は目標や身体状況に合わせてご案内します。効果や結果を保証するものではありません。</p>
  </section>

  <section class="r-px r-py" style="padding:90px 28px;textAlign:center;">
    <h2 style="fontSize:24px;fontWeight:900;margin:0 0 24px;">どのトレーニングが合うか、まずは体験で。</h2>
    <a href="Contact.dc.html" style="background:#f4c400;color:#17170f;fontWeight:700;fontSize:15px;padding:16px 32px;borderRadius:2px;display:inline-block;">無料体験を予約する</a>
  </section>

  <dc-import name="Footer" hint-size="100%,340px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      services: [
        {
          id: 'personal', tag: '01 / PERSONAL', title: 'パーソナルトレーニング',
          desc: '専属トレーナーが体力測定や目標ヒアリングをもとに、完全個別のプログラムを作成します。マンツーマンで正しいフォームを身につけながら進められます。',
          benefits: ['体力・目標に応じたオーダーメイドメニュー', 'マンツーマンでの丁寧なフォーム指導', '進捗に合わせたプログラムの見直し'],
          imgLabel: 'パーソナルトレーニングの様子', img: './images/service-personal.jpg', reverse: 'row',
        },
        {
          id: 'gym', tag: '02 / GYM', title: 'ジムトレーニング',
          desc: 'マシンやフリーウエイトを使い、ご自身のペースで筋力トレーニングやカーディオに取り組めます。スタッフが必要に応じてサポートします。',
          benefits: ['充実したマシン・フリーウエイト環境', '自分のペースで通える自由度', 'スタッフによる使い方サポート'],
          imgLabel: 'マシン・フリーウエイトエリア', img: './images/service-gym.jpg', reverse: 'row-reverse',
        },
        {
          id: 'group', tag: '03 / GROUP & STUDIO', title: 'グループ・スタジオプログラム',
          desc: 'ストレッチや機能改善トレーニングなど、グループ形式のプログラムをご用意しています。柔軟性や日常動作の改善に役立ちます。',
          benefits: ['グループならではの楽しさと継続しやすさ', '柔軟性・可動域の改善', '運動が初めての方にも参加しやすい内容'],
          imgLabel: 'スタジオプログラムの様子', img: './images/service-group.jpg', reverse: 'row',
        },
        {
          id: 'nutrition', tag: '04 / NUTRITION', title: '食事・生活サポート',
          desc: '日々の食事内容や生活習慣について、トレーナーが一般的なアドバイスを行います。無理な食事制限は推奨せず、続けやすい形をご提案します。',
          benefits: ['食事内容の振り返り・アドバイス', '生活リズムに合わせた提案', '無理な制限をしない考え方'],
          imgLabel: '食事相談の様子', img: './images/service-nutrition.jpg', reverse: 'row-reverse',
        },
      ],
    };
  }
}
</script>
</body>
</html>
