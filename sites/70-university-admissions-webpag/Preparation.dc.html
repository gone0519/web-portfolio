<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Saira+Semi+Condensed:wght@600;700&family=Saira+Extra+Condensed:wght@700;800&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<script src="./motion.js"></script>
<style>
html{scroll-behavior:smooth}
body{margin:0;font-family:'Noto Sans JP',sans-serif;color:#1d2a3a;background:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden}
*{box-sizing:border-box}
a{color:#1565c0;text-decoration:none}
a:hover{color:#0a3d8f}
button,input,select,textarea{font-family:inherit}
</style>
</helmet>

<dc-import name="SiteHeader" current="prep" style="position:sticky;top:0;z-index:50" hint-size="100%,64px"></dc-import>
<dc-import name="PageHero" en="Preparation" ja="入試対策" lead="入試方式の違いを知り、早めに計画を立てることが合格への近道です。" slot="hero-prep" photo="自習する学生の写真" hint-size="100%,500px"></dc-import>

<main data-screen-label="Preparation" style="max-width:1000px;margin:0 auto;padding:32px 20px 72px">
  <h2 data-anim="fade-up" style="margin:0 0 24px;display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700;color:#0a3d8f;letter-spacing:.08em"><span style="width:6px;height:24px;background:#1b78d6;transform:skewX(-18deg)"></span>3つの入試方式</h2>
  <div data-stagger="110" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:20px">
    <sc-for list="{{ methods }}" as="m" hint-placeholder-count="3">
      <article style="border:1px solid #1b5fb8;background:#fff;display:flex;flex-direction:column">
        <div style="position:relative;background:#1b78d6;color:#fff;padding:12px 18px;font-weight:700;font-size:16px;text-align:center">
          <span style="position:absolute;left:0;top:0;width:38px;height:100%;background:#0a3d8f;clip-path:polygon(0 0,100% 0,0 100%)"></span>{{ m.name }}
        </div>
        <div style="padding:18px 20px;display:flex;flex-direction:column;gap:12px;flex:1">
          <p style="margin:0;font-size:12px;font-weight:700;color:#1b5fb8">{{ m.sub }}</p>
          <p style="margin:0;font-size:13px;line-height:1.8;text-wrap:pretty">{{ m.desc }}</p>
          <p style="margin:0;font-size:12px;color:#3a4a5e"><strong style="color:#0a3d8f">主な評価</strong>　{{ m.eval }}</p>
          <div style="margin-top:auto;background:#eef6fe;padding:10px 12px;font-size:12px;line-height:1.7"><strong style="color:#0a3d8f">対策のポイント</strong><br>{{ m.tip }}</div>
        </div>
      </article>
    </sc-for>
  </div>

  <h2 data-anim="fade-up" style="margin:64px 0 24px;display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700;color:#0a3d8f;letter-spacing:.08em"><span style="width:6px;height:24px;background:#1b78d6;transform:skewX(-18deg)"></span>合格までの学習計画</h2>
  <div data-stagger="110" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:4px">
    <sc-for list="{{ plan }}" as="p" hint-placeholder-count="4">
      <div style="display:flex;flex-direction:column">
        <div style="background:#1b5fb8;color:#fff;padding:10px 26px 10px 16px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);display:flex;align-items:baseline;gap:10px">
          <span style="font-family:'Saira Semi Condensed',sans-serif;font-weight:700;font-size:13px;color:#ffe600">STEP {{ p.n }}</span>
          <span style="font-weight:700;font-size:15px">{{ p.when }}</span>
        </div>
        <div style="padding:14px 16px 0 2px">
          <p style="margin:0 0 6px;font-size:14px;font-weight:700;color:#0a3d8f">{{ p.title }}</p>
          <p style="margin:0;font-size:13px;line-height:1.8;text-wrap:pretty">{{ p.text }}</p>
        </div>
      </div>
    </sc-for>
  </div>

  <section style="position:relative;margin-top:64px;display:flex;flex-wrap:wrap;gap:32px">
    <div style="flex:0 0 auto">
      <div data-anim="slide-left" style="background:#0a3d8f;color:#fff;padding:10px 40px 12px 30px;clip-path:polygon(16px 0,100% 0,calc(100% - 16px) 100%,0 100%);text-align:center">
        <div style="font-family:'Saira Semi Condensed',sans-serif;font-size:11px;color:#9fd0ff">Study tips</div>
        <div style="font-size:18px;font-weight:700;letter-spacing:.14em">時間の使い方</div>
      </div>
    </div>
    <div style="flex:1 1 420px;min-width:0;border-bottom:1px solid #1b5fb8;padding-bottom:24px">
      <h3 data-anim="fade-up" style="margin:0 0 20px;padding-bottom:10px;border-bottom:1px solid #1b5fb8;font-size:17px;color:#1b5fb8">毎日の学習を続けるための4つの工夫</h3>
      <ol data-stagger="90" data-child="slide-left" style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px">
        <sc-for list="{{ tips }}" as="t" hint-placeholder-count="4">
          <li style="display:grid;grid-template-columns:20px 14px minmax(0,1fr);gap:8px;align-items:start">
            <span style="font-family:'Saira Semi Condensed',sans-serif;font-weight:700;font-size:18px;color:#1b5fb8;line-height:1.3">{{ t.n }}</span>
            <span style="margin-top:6px;width:0;height:0;border-left:11px solid #ffd400;border-top:7px solid transparent;border-bottom:7px solid transparent"></span>
            <span style="font-size:13px;line-height:1.8;font-weight:500"><strong style="color:#0a3d8f">{{ t.title }}</strong>　{{ t.text }}</span>
          </li>
        </sc-for>
      </ol>
    </div>
  </section>

  <h2 data-anim="fade-up" style="margin:64px 0 20px;display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700;color:#0a3d8f;letter-spacing:.08em"><span style="width:6px;height:24px;background:#1b78d6;transform:skewX(-18deg)"></span>学習に役立つ資料</h2>
  <div data-stagger="110" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px">
    <sc-for list="{{ resources }}" as="r" hint-placeholder-count="4">
      <a href="{{ r.href }}" style="border:1px solid #1b5fb8;border-radius:28px;padding:14px 20px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:#0a3d8f;transition:background .2s" style-hover="background:#eef6fe;color:#0a3d8f">
        <span style="width:0;height:0;border-left:9px solid #ffd400;border-top:6px solid transparent;border-bottom:6px solid transparent"></span>{{ r.label }}
      </a>
    </sc-for>
  </div>
  <div data-anim="fade-up" style="display:flex;justify-content:center;margin-top:44px">
    <a href="Admissions.dc.html" style="background:#1b5fb8;color:#fff;font-weight:700;font-size:14px;padding:14px 40px" style-hover="background:#0a3d8f;color:#fff">入試日程・出願方法を確認する ›</a>
  </div>
</main>

<dc-import name="SiteFooter" hint-size="100%,260px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      methods: [
        { name: '一般選抜', sub: '学力試験で評価', desc: '大学独自の筆記試験や大学入学共通テストの成績で合否を判定します。複数の日程・方式から選べます。', eval: '学力試験', tip: '過去問題で出題形式に慣れ、基礎の取りこぼしをなくすことが重要です。' },
        { name: '学校推薦型選抜', sub: '高校からの推薦で出願', desc: '高校の評定平均や活動実績をもとに、書類審査・面接・小論文などで総合的に評価します。', eval: '調査書・面接・小論文', tip: '日頃の授業と定期考査が評価の土台。志望理由を具体的に語れるよう準備しましょう。' },
        { name: '総合型選抜', sub: '意欲と適性を多面的に評価', desc: '志望理由書、面談、プレゼンテーションなどを通して、学ぶ意欲と大学との適合性を評価します。', eval: '志望理由書・面談・課題', tip: 'オープンキャンパスで学部への理解を深め、自分の経験と学びたいことを結びつけましょう。' }
      ],
      plan: [
        { n: '01', when: '高2・冬', title: '志望分野を決める', text: '興味のある学問を調べ、入試方式と必要科目を確認します。' },
        { n: '02', when: '高3・春', title: '基礎を固める', text: '主要科目の基礎を総復習。週単位の学習計画を立てます。' },
        { n: '03', when: '高3・夏', title: '実践力をつける', text: '過去問題に取り組み、弱点分野を集中的に補強します。' },
        { n: '04', when: '高3・秋〜冬', title: '本番に備える', text: '時間配分を意識した演習と、体調管理を徹底します。' }
      ],
      tips: [
        { n: '1', title: '週単位で計画する', text: '1週間ごとに科目と時間を割り振り、週末に進み具合を見直します。' },
        { n: '2', title: '朝の時間を使う', text: '登校前の30分を暗記科目にあてると、毎日の積み重ねになります。' },
        { n: '3', title: '間違いを記録する', text: '解けなかった問題をノートにまとめ、試験前に重点的に見直します。' },
        { n: '4', title: '休む時間も決める', text: '睡眠と休憩を計画に組み込み、集中できる状態を保ちます。' }
      ],
      resources: [
        { label: '過去問題集（サンプル）', href: 'Contact.dc.html' }, { label: '科目別 出題傾向と対策', href: 'Contact.dc.html' },
        { label: '小論文・面接対策ガイド', href: 'Contact.dc.html' }, { label: 'オンライン個別相談', href: 'Contact.dc.html' }
      ]
    };
  }
}
</script>
</body>
</html>
