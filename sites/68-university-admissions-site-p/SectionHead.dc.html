<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@600;800&display=swap" rel="stylesheet">
</helmet>
<div style="display:flex;align-items:baseline;gap:22px;flex-wrap:wrap;padding-top:56px;margin-bottom:30px">
  <span style="position:relative;display:inline-block">
    <span aria-hidden="true" data-anim="fade" style="position:absolute;left:-14px;top:-0.62em;font-family:'Josefin Sans';font-weight:700;font-size:clamp(90px,12vw,140px);line-height:1;color:transparent;-webkit-text-stroke:1.5px #e3d6c4;pointer-events:none">{{ num }}</span>
    <h2 data-anim="left" style="position:relative;margin:0;font-family:'Josefin Sans';font-weight:600;font-size:clamp(40px,6vw,64px);color:#ddd0bf;line-height:1;letter-spacing:.01em">{{ en }}</h2>
  </span>
  <span style="position:relative;font-family:'Shippori Mincho B1',serif;font-size:17px;font-weight:800;letter-spacing:.3em;color:#8a7a6a"><span data-anim="line" data-delay="300" style="position:absolute;left:-8px;right:-4px;bottom:1px;height:7px;background:#e6ddd1;border-radius:10px;transform:rotate(-6deg)"></span><span style="position:relative">{{ jp }}</span></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:160},&quot;num&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Programs&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;jp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;学部・学科&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
