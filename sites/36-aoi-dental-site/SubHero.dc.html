<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;background:#fff;overflow:hidden">
  <div style="position:absolute;left:-120px;top:40px;width:360px;height:360px;border-radius:48% 52% 60% 40%;background:#e2f2fb;opacity:.8"></div>
  <div style="position:relative;margin-left:clamp(0px,9vw,180px);height:clamp(240px,30vw,380px);border-radius:0 0 0 56px;overflow:hidden;background:#eef5f9">
    <img src="{{ src }}" alt="{{ placeholder }}" style="width:100%;height:100%;object-fit:cover;display:block">
    <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,60,90,.28),rgba(20,60,90,0) 55%);pointer-events:none"></div>
  </div>
  <div style="position:absolute;left:clamp(20px,3vw,48px);right:clamp(16px,3vw,48px);bottom:clamp(24px,3vw,44px);pointer-events:none">
    <div style="display:flex;align-items:center;gap:12px;color:#fff;font-size:clamp(14px,1.3vw,17px);font-weight:700;letter-spacing:.12em;text-shadow:0 1px 10px rgba(10,40,70,.4)"><span style="width:48px;height:1px;background:#fff"></span>{{ jp }}</div>
    <h1 style="margin:6px 0 0;font-family:Jost;font-weight:400;font-size:clamp(38px,6.4vw,92px);letter-spacing:.06em;line-height:1.05;color:#fff;text-shadow:0 2px 24px rgba(20,70,110,.35)">{{ title }}</h1>
  </div>
</div>
<nav aria-label="パンくずリスト" style="background:#fff;padding:16px clamp(20px,4vw,40px)">
  <ol style="max-width:1200px;margin:0 auto;padding:0;list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13px;color:#5d6a72">
    <li><a href="Aoi%20Dental%20Clinic.dc.html" style="color:#1a6fb5;text-decoration:none">トップ</a></li>
    <li aria-hidden="true" style="width:16px;height:1px;background:#9fb3be"></li>
    <li aria-current="page" style="color:#3d3a38">{{ jp }}</li>
  </ol>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:460},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;CONCEPT&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;jp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;当院の想い&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;images/staff-greeting.jpg&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ページメイン画像&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
