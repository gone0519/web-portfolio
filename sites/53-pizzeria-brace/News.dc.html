<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お知らせ｜Pizzeria Brace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&amp;family=Noto+Sans+JP:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:#3A2E1F;font-family:'Noto Sans JP',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
*{box-sizing:border-box}
a{color:#AF1B30;text-decoration:none}
a:hover{color:#8A1224}
h1,h2,h3,p{margin:0}
:root{--gutter-left:var(--gutter-left);--gutter-right-label:var(--gutter-right-label);--label-pad:clamp(24px,4vw,40px)}
@media (max-width:767px){
  :root{--gutter-left:20px;--gutter-right-label:20px;--label-pad:0px}
  .v-label{display:none!important}
}button{font-family:inherit}
</style>
</helmet>
<dc-import name="SiteHeader" current="news" hint-size="100%,0px"></dc-import>

<main id="top" style="position:relative;overflow:hidden">
  <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;z-index:0">
    <div style="position:absolute;top:0;bottom:0;left:clamp(48px,7vw,135px);width:1px;background:#EFEDE9"></div>
    <div style="position:absolute;top:0;bottom:0;left:50%;width:1px;background:#EFEDE9"></div>
    <div style="position:absolute;top:0;bottom:0;right:10%;width:1px;background:#EFEDE9"></div>
  </div>

  <section data-screen-label="News — Hero" style="position:relative;z-index:1;padding-top:clamp(130px,13vw,200px)">
    <div aria-hidden="true" data-parallax="0.05" style="position:absolute;top:clamp(100px,9vw,150px);left:clamp(40px,14vw,260px);font-family:'Kaushan Script',cursive;font-size:clamp(56px,10vw,170px);color:#F2F0EC;white-space:nowrap;line-height:1;pointer-events:none">Notizie</div>
    <div class="v-label" style="position:absolute;left:clamp(10px,3vw,62px);top:clamp(150px,14vw,230px);writing-mode:vertical-rl;display:flex;gap:8px;z-index:3">
      <span style="font-size:clamp(13px,1vw,16px);font-weight:700;letter-spacing:.14em">NEWS</span>
      <span style="font-size:11px;letter-spacing:.18em">お店からのお知らせ</span>
    </div>
    <div data-reveal style="position:relative;padding-left:var(--gutter-left);padding-right:clamp(20px,6vw,120px)">
      <nav aria-label="パンくず" style="display:flex;gap:10px;font-size:11px;letter-spacing:.14em"><a href="Pizzeria%20Brace.dc.html" style="color:#8A7B66">HOME</a><span style="color:#8A7B66">›</span><span>NEWS</span></nav>
      <p style="font-family:'Kaushan Script',cursive;font-size:clamp(48px,6vw,96px);line-height:1.1;color:#AF1B30;margin-top:22px">News</p>
      <h1 style="font-size:clamp(26px,3.3vw,52px);font-weight:900;letter-spacing:.06em;line-height:1.45;margin-top:14px">お店からのお知らせ</h1>
    </div>
    <div style="position:relative;display:flex;flex-wrap:wrap;align-items:center;margin-top:clamp(48px,6vw,90px);padding-left:var(--gutter-left)">
      <div data-reveal style="position:relative;z-index:2;flex:0 0 clamp(380px,calc(380px + (768px - 100vw) * 999),calc(100% - 20px));margin-right:clamp(-130px,calc((768px - 100vw) * 999),0px);margin-bottom:calc(-1 * clamp(0px,calc((768px - 100vw) * 999),40px));background:#AF1B30;color:#fff;padding:clamp(28px,3vw,48px)">
        <div style="display:flex;gap:14px;align-items:center;font-size:12px;letter-spacing:.1em"><span>2026.09.20</span><span style="background:#E5C65B;color:#3A2E1F;font-weight:700;padding:2px 8px;font-size:11px">MENU</span></div>
        <p style="font-size:18px;font-weight:700;letter-spacing:.08em;color:#F2D06B;line-height:1.7;margin-top:14px">秋のきのこと栗のピッツァ、はじめました</p>
        <p style="font-size:13px;line-height:2.2;letter-spacing:.06em;margin-top:14px;text-wrap:pretty">数種のきのこと焼き栗、セージバターを合わせた秋限定のビアンカ。11月末までの期間限定でご用意しています。</p>
      </div>
      <div data-reveal="img" style="flex:1 1 0;min-width:min(100%,420px);aspect-ratio:16/9;overflow:hidden;position:relative;z-index:1">
        <image-slot id="news-feature" src="images/autumn-plate.jpg" shape="rect" placeholder="秋限定・きのこと栗のピッツァ"></image-slot>
      </div>
    </div>
  </section>

  <section data-screen-label="News — List" style="position:relative;z-index:1;padding:clamp(110px,11vw,170px) clamp(20px,6vw,120px) clamp(110px,11vw,170px) var(--gutter-left)">
    <div role="tablist" aria-label="カテゴリー" data-reveal style="display:flex;flex-wrap:wrap;gap:10px">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
        <sc-if value="{{ t.active }}" hint-placeholder-val="{{ false }}">
          <button role="tab" aria-selected="true" onClick="{{ t.pick }}" style="border:1px solid #3A2E1F;background:#3A2E1F;color:#fff;font-size:12px;font-weight:700;letter-spacing:.2em;padding:12px 22px;cursor:pointer">{{ t.label }}</button>
        </sc-if>
        <sc-if value="{{ t.inactive }}" hint-placeholder-val="{{ true }}">
          <button role="tab" aria-selected="false" onClick="{{ t.pick }}" style="border:1px solid #3A2E1F;background:#fff;color:#3A2E1F;font-size:12px;font-weight:700;letter-spacing:.2em;padding:12px 22px;cursor:pointer;transition:all .3s" style-hover="background:#F5F4F2">{{ t.label }}</button>
        </sc-if>
      </sc-for>
    </div>
    <div style="margin-top:clamp(32px,3.6vw,48px);border-top:2px solid #3A2E1F;max-width:1100px">
      <sc-for list="{{ items }}" as="n" hint-placeholder-count="6">
        <div style="border-bottom:1px solid #E2DED7">
          <button onClick="{{ n.toggle }}" aria-expanded="{{ n.openStr }}" style="width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;padding:24px 4px;background:transparent;border:0;cursor:pointer;text-align:left;color:#3A2E1F" style-hover="color:#AF1B30">
            <span style="font-size:13px;letter-spacing:.1em;min-width:92px">{{ n.date }}</span>
            <span style="font-size:10px;font-weight:700;letter-spacing:.16em;padding:3px 9px;background:#F5F4F2;color:#3A2E1F;min-width:72px;text-align:center">{{ n.cat }}</span>
            <span style="flex:1 1 280px;font-size:15px;font-weight:700;letter-spacing:.06em;line-height:1.7">{{ n.title }}</span>
            <span style="font-size:18px;color:#AF1B30;width:20px;text-align:center">{{ n.mark }}</span>
          </button>
          <sc-if value="{{ n.open }}" hint-placeholder-val="{{ false }}">
            <p style="padding:0 4px 28px clamp(4px,calc((100vw - 768px) * 999),124px);font-size:13px;line-height:2.1;letter-spacing:.06em;max-width:48em;text-wrap:pretty">{{ n.body }}</p>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </section>
</main>
<dc-import name="SiteFooter" hint-size="100%,460px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: 'ALL', open: '2026.09.20' };
  data = [
    { date: '2026.09.20', cat: 'MENU', title: '秋のきのこと栗のピッツァ、はじめました', body: '数種のきのこと焼き栗、セージバターを合わせた秋限定のビアンカです。11月末までの期間限定。テイクアウトも承ります。' },
    { date: '2026.09.01', cat: 'INFO', title: 'オンライン予約の受付を開始しました', body: 'ご予約・アクセスページより、24時間ご予約を承ります。当日のご予約はお電話にてお問い合わせください。' },
    { date: '2026.08.10', cat: 'INFO', title: '夏季休業のお知らせ（8/13〜8/16）', body: '誠に勝手ながら、8月13日（木）〜16日（日）は夏季休業とさせていただきます。17日（月）より通常営業いたします。' },
    { date: '2026.07.18', cat: 'EVENT', title: 'ナチュールワインの夕べ（7/31開催）', body: 'イタリアのナチュールワイン5種と、ワインに合わせたピッツァのペアリングの夜。定員20名、要予約です。' },
    { date: '2026.06.05', cat: 'MENU', title: '夏野菜のピッツァが登場しました', body: '契約農家から届くズッキーニ、トマト、とうもろこしを使った夏限定の一枚です。' },
    { date: '2026.05.12', cat: 'INFO', title: 'ランチタイムの営業時間を変更しました', body: '5月より、ランチタイムを11:30〜15:00（L.O. 14:30）に変更いたしました。' },
    { date: '2026.04.01', cat: 'EVENT', title: '開店7周年を迎えました', body: '日頃のご愛顧に感謝を込めて、4月中はご来店の皆さまにドルチェをひと皿サービスいたします。' }
  ];
  renderVals() {
    const { tab, open } = this.state;
    const tabs = ['ALL', 'INFO', 'MENU', 'EVENT'].map(label => ({ label, active: label === tab, inactive: label !== tab, pick: () => this.setState({ tab: label }) }));
    const items = this.data.filter(n => tab === 'ALL' || n.cat === tab).map(n => {
      const isOpen = open === n.date;
      return { ...n, open: isOpen, openStr: String(isOpen), mark: isOpen ? '−' : '+', toggle: () => this.setState({ open: isOpen ? null : n.date }) };
    });
    return { tabs, items };
  }
}
</script>
</body>
</html>
