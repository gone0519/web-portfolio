<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{overflow-x:hidden}
.nb{display:inline-block}
@media (max-width:759px){
  .hd-logo{gap:10px!important}
  .hd-mark{width:38px!important;height:38px!important}
  .hd-corp{font-size:9px!important}
  .hd-jp{font-size:15px!important;letter-spacing:.06em!important;white-space:nowrap}
  .hd-en{font-size:8.5px!important;letter-spacing:.08em!important;white-space:nowrap}
  .pg-h1{font-size:clamp(26px,7.6vw,36px)!important;letter-spacing:.1em!important}
  .pg-outline{font-size:84px!important;opacity:.55}
  .lead-c{text-align:left!important}
  .hours-wrap{padding:4px 14px!important}
  .hours-table{min-width:0!important;font-size:13px!important}
  .hours-table td{font-size:15px!important}
  .kv{grid-template-columns:72px 1fr!important;gap:12px!important}
}
</style>
</helmet>
<div id="scroll-progress" aria-hidden="true" style="position:fixed;top:0;left:0;right:0;height:2px;z-index:70;background:#bfe0c8;transform:scaleX(0);transform-origin:0 50%;pointer-events:none"></div>
<div id="page-curtain" aria-hidden="true" style="position:fixed;inset:0;z-index:100;background:#1a4d34;pointer-events:none;transform:translateY(-100%);display:flex;align-items:center;justify-content:center">
  <span style="width:56px;height:56px;border-radius:50%;background:#f6f2e6;display:grid;place-items:center"><span style="width:22px;height:22px;border-radius:50%;background:#1a4d34"></span></span>
</div>
<header id="site-header" style="position:fixed;top:0;left:0;right:0;z-index:50;background:{{ headerBg }};transition:background .5s ease, padding .5s ease;padding:{{ headerPad }};color:#f6f2e6">
  <div style="max-width:1880px;margin:0 auto;padding:0 clamp(16px,2vw,32px);display:flex;align-items:center;justify-content:space-between;gap:24px">
    <a href="Dermatology%20Clinic.dc.html" class="hd-logo" style="display:flex;align-items:center;gap:12px;color:#f6f2e6;min-width:0">
      <span class="hd-mark" style="width:44px;height:44px;border-radius:50%;background:#f6f2e6;display:grid;place-items:center;flex:none">
        <span style="width:18px;height:18px;border-radius:50%;background:#1a4d34"></span>
      </span>
      <span style="display:flex;flex-direction:column;line-height:1.25">
        <span class="hd-corp" style="font-size:10px;letter-spacing:.12em">医療法人 〇〇会</span>
        <span class="hd-jp" style="font-size:clamp(16px,1.3vw,20px);font-weight:600;letter-spacing:.14em">みどり野皮ふ科クリニック</span>
        <span class="hd-en" style="font-family:'EB Garamond',serif;font-size:10px;letter-spacing:.18em;opacity:.85">MIDORINO DERMATOLOGY CLINIC</span>
      </span>
    </a>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:12px">
        <div style="display:flex;align-items:center;gap:14px;font-size:13px;letter-spacing:.08em;font-weight:600">
          <span>電話予約</span>
          <a href="tel:000-000-0000" style="background:rgba(246,242,230,.28);padding:4px 14px;border-radius:999px;color:#f6f2e6">000-000-0000</a>
          <span style="margin-left:10px">WEB予約</span>
          <a href="Access.dc.html#reservation" style="background:rgba(246,242,230,.28);padding:4px 14px;border-radius:999px;color:#f6f2e6">24時間受付</a>
          <span style="margin-left:10px">〇〇駅から徒歩3分</span>
          <a href="Access.dc.html" style="background:rgba(246,242,230,.28);padding:4px 14px;border-radius:999px;color:#f6f2e6">アクセス</a>
        </div>
        <nav aria-label="メインメニュー" style="display:flex;gap:clamp(16px,1.8vw,30px);border-top:1px solid rgba(246,242,230,.55);padding-top:12px">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
            <a href="{{ n.href }}" aria-current="{{ n.aria }}" style="display:flex;flex-direction:column;align-items:center;gap:2px;color:#f6f2e6;transition:opacity .3s;padding-bottom:4px;border-bottom:1px solid {{ n.line }}" style-hover="opacity:.65;color:#f6f2e6">
              <span style="font-size:14px;font-weight:600;letter-spacing:.08em">{{ n.jp }}</span>
              <span style="font-family:'EB Garamond',serif;font-size:10px;letter-spacing:.2em;opacity:.8">{{ n.en }}</span>
            </a>
          </sc-for>
        </nav>
      </div>
    </sc-if>
    <sc-if value="{{ isCompact }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-label="メニューを開く" aria-expanded="{{ menuOpen }}" style="flex:none;width:48px;height:48px;border:1px solid rgba(246,242,230,.6);border-radius:50%;background:transparent;color:#f6f2e6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer">
        <span style="width:18px;height:1px;background:#f6f2e6"></span>
        <span style="width:18px;height:1px;background:#f6f2e6"></span>
        <span style="width:12px;height:1px;background:#f6f2e6"></span>
      </button>
    </sc-if>
  </div>
</header>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:60;background:#163e2a;color:#f6f2e6;padding:28px 28px 40px;display:flex;flex-direction:column;overflow:auto">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <a href="Dermatology%20Clinic.dc.html" style="font-size:17px;font-weight:600;letter-spacing:.14em;color:#f6f2e6">みどり野皮ふ科クリニック</a>
      <button onClick="{{ toggleMenu }}" aria-label="メニューを閉じる" style="width:48px;height:48px;border:1px solid rgba(246,242,230,.6);border-radius:50%;background:transparent;color:#f6f2e6;font-size:22px;cursor:pointer">×</button>
    </div>
    <nav aria-label="モバイルメニュー" style="display:flex;flex-direction:column;margin-top:36px">
      <a href="Dermatology%20Clinic.dc.html" style="display:flex;justify-content:space-between;align-items:baseline;padding:18px 0;border-bottom:1px solid rgba(246,242,230,.25);color:#f6f2e6"><span style="font-size:18px;letter-spacing:.1em">トップ</span><span style="font-family:'EB Garamond',serif;font-size:12px;letter-spacing:.2em;opacity:.8">HOME</span></a>
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
        <a href="{{ n.href }}" onClick="{{ closeMenu }}" style="display:flex;justify-content:space-between;align-items:baseline;padding:18px 0;border-bottom:1px solid rgba(246,242,230,.25);color:#f6f2e6">
          <span style="font-size:18px;letter-spacing:.1em">{{ n.jp }}</span>
          <span style="font-family:'EB Garamond',serif;font-size:12px;letter-spacing:.2em;opacity:.8">{{ n.en }}</span>
        </a>
      </sc-for>
    </nav>
    <div style="display:grid;gap:12px;margin-top:32px">
      <a href="Access.dc.html#reservation" onClick="{{ closeMenu }}" style="background:#1e7a45;color:#fff;text-align:center;padding:16px;border-radius:4px;letter-spacing:.1em">診療予約はこちら</a>
      <a href="tel:000-000-0000" style="border:1px solid rgba(246,242,230,.6);color:#f6f2e6;text-align:center;padding:16px;border-radius:4px;letter-spacing:.1em">電話 000-000-0000</a>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;services&quot;,&quot;features&quot;,&quot;doctor&quot;,&quot;access&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;reveal&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1440, scrolled: false, menuOpen: false };
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth });
    this.onScroll = () => { const s = window.scrollY > 60; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };
    window.addEventListener('resize', this.onResize);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onScroll();
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (this.props.reveal === false || reduce) return;
    this.motion();
  }
  motion() {
    const EASE = 'cubic-bezier(.2,.65,.2,1)', MASK = 'cubic-bezier(.77,0,.18,1)';
    const curtain = document.getElementById('page-curtain'), header = document.getElementById('site-header'), bar = document.getElementById('scroll-progress');
    curtain && curtain.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-100%)' }], { duration: 1000, delay: 150, easing: MASK, fill: 'both' });
    header && header.animate([{ transform: 'translateY(-100%)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 900, delay: 700, easing: EASE, fill: 'backwards' });
    const init = {
      '': ['translateY(32px)', 1], up: ['translateY(32px)', 1], left: ['translateX(-56px)', 1], right: ['translateX(56px)', 1],
      zoom: ['scale(.95)', 1], fade: ['none', 1], mask: ['none', 0],
    };
    const show = (el) => {
      el.setAttribute('data-shown', '');
      const d = +(el.getAttribute('data-delay') || 0) + (+el.getAttribute('data-stg') || 0);
      el.style.transitionDelay = d + 'ms';
      el.style.opacity = '1'; el.style.transform = 'none';
      if (el.getAttribute('data-reveal') === 'mask') el.style.clipPath = 'inset(0 0 0 0)';
      setTimeout(() => { el.style.transition = 'transform .6s ' + EASE + ', box-shadow .6s ease'; el.style.transitionDelay = '0ms'; el.style.clipPath = ''; el.setAttribute('data-done', ''); }, d + 1500);
    };
    this.pending = new Set();
    this.io = { observe: (el) => this.pending.add(el), disconnect: () => this.pending.clear() };
    const check = () => { const vh = window.innerHeight; document.querySelectorAll('[data-rv]:not([data-shown])').forEach(el => { const r = el.getBoundingClientRect(); if (r.top < vh * 0.94 && r.bottom > 0) show(el); }); };
    document.querySelectorAll('[data-rv]:not([data-done])').forEach(el => { el.removeAttribute('data-rv'); el.removeAttribute('data-shown'); });
    this.poll = setInterval(() => { try { check(); } catch (e) {} }, 250);
    setTimeout(() => { if (curtain) { curtain.getAnimations().forEach(a => a.cancel()); curtain.style.transform = 'translateY(-100%)'; } }, 1500);
    this.scan = () => {
      document.querySelectorAll('[data-reveal]:not([data-rv])').forEach(el => {
        el.setAttribute('data-rv', '');
        const v = el.getAttribute('data-reveal'), [t, fade] = init[v] || init[''];
        const sibs = el.parentElement ? [...el.parentElement.children].filter(c => c.hasAttribute('data-reveal')) : [];
        el.setAttribute('data-stg', Math.min(sibs.indexOf(el), 6) * 120);
        el.style.opacity = v === 'mask' ? '1' : '0';
        el.style.transform = t;
        if (v === 'mask') el.style.clipPath = 'inset(0 100% 0 0)';
        el.style.transition = v === 'mask' ? 'clip-path 1.4s ' + MASK : 'opacity 1.1s ease, transform 1.2s ' + EASE;
        this.io.observe(el);
      });
      document.querySelectorAll('[data-kenburns]:not([data-kb])').forEach(el => { el.setAttribute('data-kb', ''); el.animate([{ transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { duration: 7000, easing: EASE, fill: 'both' }); });
      document.querySelectorAll('[data-marquee]:not([data-mq])').forEach(el => { el.setAttribute('data-mq', ''); const t = el.firstElementChild; t && t.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-50%)' }], { duration: (+el.getAttribute('data-marquee') || 40) * 1000, iterations: Infinity }); });
      document.querySelectorAll('[data-spin]:not([data-sp])').forEach(el => { el.setAttribute('data-sp', ''); el.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: (+el.getAttribute('data-spin') || 20) * 1000, iterations: Infinity }); });
      document.querySelectorAll('[data-float]:not([data-fl])').forEach(el => { el.setAttribute('data-fl', ''); el.animate([{ translate: '0 0' }, { translate: '0 -14px' }, { translate: '0 0' }], { duration: 6000, iterations: Infinity, easing: 'ease-in-out', delay: +el.getAttribute('data-float') || 0 }); });
      document.querySelectorAll('[data-loop="scroll"]:not([data-lp])').forEach(el => { el.setAttribute('data-lp', ''); el.animate([{ transform: 'translateY(-100%)' }, { transform: 'translateY(0)', offset: .5 }, { transform: 'translateY(100%)' }], { duration: 2400, iterations: Infinity, easing: 'ease-in-out' }); });
      this.frame();
    };
    this.frame = () => {
      const vh = window.innerHeight, max = document.documentElement.scrollHeight - vh;
      check();
      if (bar) bar.style.transform = 'scaleX(' + (max > 0 ? window.scrollY / max : 0) + ')';
      document.querySelectorAll('[data-parallax]').forEach(el => {
        const p = el.parentElement.getBoundingClientRect(); if (p.bottom < -200 || p.top > vh + 200) return;
        const s = +el.getAttribute('data-parallax'), off = (p.top + p.height / 2 - vh / 2) * -s;
        const lim = p.height * 0.12; el.style.transform = 'translate3d(0,' + Math.max(-lim, Math.min(lim, off)).toFixed(1) + 'px,0)';
      });
      document.querySelectorAll('[data-drift]').forEach(el => {
        const r = el.getBoundingClientRect(); if (r.bottom < 0 || r.top > vh) return;
        el.style.transform = 'translate3d(' + ((r.top - vh / 2) * +el.getAttribute('data-drift')).toFixed(1) + 'px,0,0)';
      });
    };
    let raf = 0;
    this.onFrame = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; this.frame(); }); };
    window.addEventListener('scroll', this.onFrame, { passive: true });
    window.addEventListener('resize', this.onFrame);
    this.onOver = (e) => {
      const z = e.target.closest && e.target.closest('[data-zoom]'), l = e.target.closest && e.target.closest('[data-lift]');
      if (z !== this.hz) {
        const set = (c, on) => c && c.querySelectorAll('image-slot').forEach(im => { im.style.transition = 'transform 1.4s ' + EASE; im.style.transform = on ? 'scale(1.06)' : 'scale(1)'; });
        set(this.hz, false); set(z, true); this.hz = z;
      }
      if (l !== this.hl) {
        if (this.hl && this.hl.hasAttribute('data-done')) { this.hl.style.transform = 'none'; this.hl.style.boxShadow = ''; }
        if (l && l.hasAttribute('data-done')) { l.style.transform = 'translateY(-6px)'; l.style.boxShadow = '0 20px 44px rgba(26,77,52,.14)'; }
        this.hl = l;
      }
    };
    document.addEventListener('mouseover', this.onOver);
    this.onClick = (e) => {
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || a.target === '_blank') return;
      const url = new URL(a.getAttribute('href'), location.href);
      if (!/\.dc\.html$/.test(url.pathname) || url.pathname === location.pathname) return;
      e.preventDefault();
      if (curtain) curtain.animate([{ transform: 'translateY(100%)' }, { transform: 'translateY(0)' }], { duration: 650, easing: MASK, fill: 'forwards' }).onfinish = () => { location.href = url.href; };
      else location.href = url.href;
    };
    document.addEventListener('click', this.onClick);
    this.scan();
    this.mo = new MutationObserver(() => this.scan());
    this.mo.observe(document.body, { childList: true, subtree: true });
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('scroll', this.onScroll);
    this.io && this.io.disconnect(); this.mo && this.mo.disconnect(); clearInterval(this.poll);
    window.removeEventListener('scroll', this.onFrame); window.removeEventListener('resize', this.onFrame);
    document.removeEventListener('mouseover', this.onOver); document.removeEventListener('click', this.onClick);
  }
  renderVals() {
    const { w, scrolled, menuOpen } = this.state;
    const compact = w < 1180, cur = this.props.current;
    const nav = [
      ['about', '当院について', 'ABOUT', 'About.dc.html'],
      ['services', '診療内容', 'SERVICES', 'Services.dc.html'],
      ['features', '当院の特徴', 'FEATURES', 'Features.dc.html'],
      ['doctor', '院長紹介', 'DOCTOR', 'Doctor.dc.html'],
      ['access', 'アクセス', 'ACCESS', 'Access.dc.html'],
      ['reservation', 'ご予約', 'RESERVATION', 'Access.dc.html#reservation'],
    ].map(([k, jp, en, href]) => ({ jp, en, href, aria: k === cur ? 'page' : undefined, line: k === cur ? 'rgba(246,242,230,.9)' : 'transparent' }));
    return {
      nav, isDesktop: !compact, isCompact: compact, menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
      headerBg: scrolled || menuOpen ? 'rgba(22,62,42,.96)' : 'transparent',
      headerPad: scrolled ? '12px 0' : (compact ? '20px 0' : '26px 0'),
    };
  }
}
</script>
</body>
</html>
