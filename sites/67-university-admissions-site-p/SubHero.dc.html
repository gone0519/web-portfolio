<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@600;800&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<script src="./site-anim.js"></script>
</helmet>
<header style="background:#e8dfd2;padding:22px 20px 0;font-family:'Zen Kaku Gothic New',sans-serif">
  <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
    <div style="max-width:1000px;margin:0 auto">
      <div style="display:flex;align-items:center;justify-content:center;gap:28px;margin-bottom:18px;flex-wrap:wrap">
        <a href="Top.dc.html" style="display:flex;align-items:center;gap:10px;color:#8b7d70;text-decoration:none">
          <span style="width:28px;height:28px;border-radius:50%;border:2px solid #cdb488;display:flex;align-items:center;justify-content:center"><span style="width:8px;height:8px;border-radius:50%;background:#cdb488"></span></span>
          <span style="display:flex;flex-direction:column;line-height:1.2"><span style="font-size:19px;letter-spacing:.12em">未来キャンパス</span><span style="font-size:10px;letter-spacing:.3em;color:#a69684">大学入試ナビ</span></span>
        </a>
        <div style="display:flex;flex-direction:column;line-height:1.25;color:#fff">
          <span style="font-size:10px;letter-spacing:.08em">受験相談窓口（サンプル）</span>
          <span style="font-family:'Josefin Sans';font-size:22px;letter-spacing:.12em;font-weight:600">03-0000-0000</span>
        </div>
        <div style="display:flex;gap:10px">
          <a href="Contact.dc.html?type=docs" style="background:#f2958c;color:#fff;border-radius:999px;padding:11px 20px;font-size:12px;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;gap:8px;text-decoration:none" style-hover="background:#ea7f75;color:#fff"><span style="width:16px;height:16px;border-radius:50%;border:2px solid #fff"></span>資料請求</a>
          <a href="Contact.dc.html?type=consult" style="background:#f2958c;color:#fff;border-radius:999px;padding:11px 20px;font-size:12px;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;gap:8px;text-decoration:none" style-hover="background:#ea7f75;color:#fff"><span style="width:16px;height:16px;border-radius:50%;border:2px solid #fff"></span>入試相談</a>
        </div>
      </div>
      <div style="position:relative;height:340px">
        <div data-anim="block" data-delay="100" style="position:absolute;left:0;width:15%;top:90px;height:250px;background:#d5e9f2"></div>
        <div data-anim="block" data-delay="250" style="position:absolute;left:86.5%;width:13.5%;top:60px;height:180px;background:#d3ede4"></div>
        <div data-anim="wipe" data-delay="350" style="position:absolute;left:52%;width:40.5%;top:58px;height:215px;z-index:2;background:#d9cfc2">
          <image-slot id="{{ slotId }}" shape="rect" placeholder="{{ slotPh }}"></image-slot>
        </div>
        <div style="position:absolute;left:14.5%;width:71%;top:0;height:310px;border:4px solid #fff;z-index:3;pointer-events:none">
          <nav style="display:flex;justify-content:center;gap:30px;padding-top:17px;pointer-events:auto">
            <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
              <a href="{{ n.href }}" style="font-size:11px;font-weight:500;color:{{ n.color }};letter-spacing:.08em;text-decoration:none;transition:color .2s" style-hover="color:#f2958c">{{ n.label }}</a>
            </sc-for>
          </nav>
        </div>
        <div style="position:absolute;left:18%;top:112px;z-index:4;max-width:32%">
          <div style="position:relative">
            <span aria-hidden="true" data-anim="fade" data-delay="500" style="position:absolute;left:-18px;top:-0.32em;font-family:'Josefin Sans';font-weight:700;font-size:110px;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.9);pointer-events:none">{{ num }}</span>
            <h1 data-anim="left" data-delay="600" style="position:relative;margin:0;font-family:'Josefin Sans';font-weight:600;font-size:clamp(40px,5.4vw,62px);line-height:1;color:#fff;letter-spacing:.01em">{{ en }}</h1>
          </div>
          <div data-anim="up" data-delay="800" style="margin-top:14px;display:inline-block;background:#3b3330;color:#fff;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:20px;letter-spacing:.2em;padding:6px 12px">{{ jp }}</div>
          <p data-anim="up" data-delay="950" style="margin:14px 0 0;font-size:12.5px;line-height:1.9;color:#5b4e43;text-wrap:pretty">{{ lead }}</p>
        </div>
        <div data-parallax="0.15" style="position:absolute;left:3.4%;top:-10px;z-index:4;pointer-events:none"><div data-anim="drop" data-delay="400" style="writing-mode:vertical-rl;font-family:'Josefin Sans';font-size:58px;letter-spacing:.06em;color:#fff;line-height:1">{{ vertical }}</div></div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;padding:16px 0 22px;font-size:11px;letter-spacing:.1em;color:#fff">
        <a href="Top.dc.html" style="color:#fff;text-decoration:none;font-family:'Josefin Sans'" style-hover="color:#f2958c">HOME</a><span>／</span><span>{{ jp }}</span>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      <a href="Top.dc.html" style="display:flex;align-items:center;gap:8px;color:#8b7d70;text-decoration:none">
        <span style="width:24px;height:24px;border-radius:50%;border:2px solid #cdb488;display:flex;align-items:center;justify-content:center"><span style="width:7px;height:7px;border-radius:50%;background:#cdb488"></span></span>
        <span style="display:flex;flex-direction:column;line-height:1.2"><span style="font-size:16px;letter-spacing:.1em">未来キャンパス</span><span style="font-size:9px;letter-spacing:.3em;color:#a69684">大学入試ナビ</span></span>
      </a>
      <button onClick="{{ toggleMenu }}" aria-label="メニュー" style="width:46px;height:46px;border:0;border-radius:50%;background:#f2958c;color:#fff;font:700 11px 'Josefin Sans';cursor:pointer">{{ menuLabel }}</button>
    </div>
    <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
      <nav style="margin-top:14px;background:#fff;display:flex;flex-direction:column">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
          <a href="{{ n.href }}" style="padding:14px 18px;border-bottom:1px dotted #e1d6c8;font-size:14px;color:#6b5c4f;text-decoration:none">{{ n.label }}</a>
        </sc-for>
      </nav>
    </sc-if>
    <div style="position:relative;margin-top:26px;padding-top:30px">
      <span aria-hidden="true" style="position:absolute;left:-6px;top:0;font-family:'Josefin Sans';font-weight:700;font-size:96px;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.9)">{{ num }}</span>
      <h1 style="position:relative;margin:0;font-family:'Josefin Sans';font-weight:600;font-size:44px;line-height:1;color:#fff">{{ en }}</h1>
      <div style="margin-top:12px;display:inline-block;background:#3b3330;color:#fff;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:17px;letter-spacing:.2em;padding:5px 10px">{{ jp }}</div>
      <p style="margin:12px 0 0;font-size:12.5px;line-height:1.9;color:#5b4e43">{{ lead }}</p>
    </div>
    <div style="position:relative;height:200px;margin:18px 0 0;border:4px solid #fff;background:#d9cfc2"><image-slot id="{{ slotId }}" shape="rect" placeholder="{{ slotPh }}"></image-slot></div>
    <div style="padding:14px 0 18px;font-size:11px;color:#fff;letter-spacing:.1em"><a href="Top.dc.html" style="color:#fff;text-decoration:none">HOME</a> ／ {{ jp }}</div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:520},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;programs&quot;,&quot;prepare&quot;,&quot;admissions&quot;,&quot;campus&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;programs&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;num&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Programs&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;jp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;学部・学科&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;vertical&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;PROGRAMS&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slotId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;sub-hero&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slotPh&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ページのメイン写真&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1200, menu: false };
  componentDidMount() { this.r = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.r); this.r(); }
  componentWillUnmount() { window.removeEventListener('resize', this.r); }
  renderVals() {
    const cur = this.props.current || '';
    const items = [['HOME', 'Top.dc.html', 'top'], ['学部・学科', 'Programs.dc.html', 'programs'], ['受験対策', 'Prepare.dc.html', 'prepare'], ['入試情報', 'Admissions.dc.html', 'admissions'], ['キャンパスライフ', 'Campus.dc.html', 'campus'], ['お問い合わせ', 'Contact.dc.html', 'contact']];
    const narrow = this.state.w < 880;
    return {
      wide: !narrow, narrow,
      nav: items.map(([label, href, k]) => ({ label, href, color: k === cur ? '#f2958c' : '#fff' })),
      menuOpen: this.state.menu, menuLabel: this.state.menu ? 'CLOSE' : 'MENU',
      toggleMenu: () => this.setState({ menu: !this.state.menu }),
      num: this.props.num ?? '01', en: this.props.en ?? 'Programs', jp: this.props.jp ?? '学部・学科',
      lead: this.props.lead ?? '', vertical: this.props.vertical ?? 'PROGRAMS',
      slotId: this.props.slotId ?? 'sub-hero', slotPh: this.props.slotPh ?? 'ページのメイン写真',
    };
  }
}
</script>
</body>
</html>
