<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:{{ headerPad }};background:{{ headerBg }};border-bottom:1px solid {{ headerBorder }};backdrop-filter:blur(10px);transition:background .6s ease, padding .6s ease, border-color .6s ease">
  <a href="Sushi%20Shirase.dc.html" style="display:flex;align-items:center;gap:14px;color:#ece6db;text-decoration:none">
    <span style="width:34px;height:34px;border:1px solid #c9ad78;display:flex;align-items:center;justify-content:center;font-size:17px;color:#c9ad78">鮨</span>
    <span style="display:flex;flex-direction:column;gap:2px">
      <span style="font-size:17px;letter-spacing:.28em">しらせ</span>
      <span style="font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.34em;color:#a79e90">SUSHI SHIRASE</span>
    </span>
  </a>
  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
    <nav aria-label="Main" style="display:flex;align-items:center;gap:36px">
      <ul style="display:flex;gap:30px;list-style:none;margin:0;padding:0;font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.22em">
        <sc-for list="{{ nav }}" as="it" hint-placeholder-count="6">
          <li><a href="{{ it.href }}" aria-current="{{ it.aria }}" style="padding:6px 0;color:{{ it.color }};text-decoration:none;border-bottom:1px solid {{ it.line }}">{{ it.en }}</a></li>
        </sc-for>
      </ul>
      <a href="Access.dc.html#reserve" style="display:inline-flex;align-items:center;padding:12px 26px;border:1px solid #c9ad78;color:#c9ad78;font-size:13px;letter-spacing:.3em;text-decoration:none;transition:background .4s, color .4s" style-hover="background:#c9ad78;color:#12110f">予約する</a>
    </nav>
  </sc-if>
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <button aria-label="メニューを開く" aria-expanded="{{ menuOpen }}" onClick="{{ toggleMenu }}" style="width:48px;height:48px;background:transparent;border:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:7px;cursor:pointer;padding:0 4px">
      <span style="display:block;width:28px;height:1px;background:#ece6db"></span>
      <span style="display:block;width:18px;height:1px;background:#ece6db"></span>
    </button>
  </sc-if>
</header>

<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-label="メニュー" style="animation:shFadeIn .5s ease both;position:fixed;inset:0;z-index:60;background:#12110f;color:#ece6db;display:flex;flex-direction:column;padding:22px 24px 32px;overflow:auto">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:17px;letter-spacing:.28em">しらせ</span>
      <button aria-label="メニューを閉じる" onClick="{{ toggleMenu }}" style="height:48px;padding:0 4px;background:transparent;border:0;color:#ece6db;font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.24em;cursor:pointer">CLOSE</button>
    </div>
    <nav aria-label="Mobile" style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:32px 0">
      <sc-for list="{{ nav }}" as="it" hint-placeholder-count="6">
        <a href="{{ it.href }}" onClick="{{ closeMenu }}" style="display:flex;align-items:baseline;gap:18px;text-decoration:none;color:{{ it.color }}"><span style="font-family:'Cormorant Garamond',serif;font-size:32px;letter-spacing:.06em">{{ it.title }}</span><span style="font-size:12px;color:#a79e90;letter-spacing:.2em">{{ it.jp }}</span></a>
      </sc-for>
    </nav>
    <a href="Access.dc.html#reserve" onClick="{{ closeMenu }}" style="display:flex;justify-content:center;padding:18px;background:#c9ad78;color:#12110f;font-size:14px;letter-spacing:.3em;text-decoration:none">ご予約はこちら</a>
  </div>
</sc-if>

<sc-if value="{{ showStickyCta }}" hint-placeholder-val="{{ false }}">
  <a href="Access.dc.html#reserve" style="position:fixed;left:12px;right:12px;bottom:12px;z-index:40;display:flex;justify-content:center;align-items:center;padding:17px;background:#c9ad78;color:#12110f;font-size:14px;letter-spacing:.3em;text-decoration:none;box-shadow:0 10px 30px rgba(0,0,0,.35)">ご予約はこちら</a>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:120},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;concept&quot;,&quot;menu&quot;,&quot;craft&quot;,&quot;chef&quot;,&quot;access&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stickyCta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;reveal&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { scrolled: false, w: typeof window !== 'undefined' ? window.innerWidth : 1280, menuOpen: false };

  componentDidMount() {
    this.reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.ease = 'cubic-bezier(.2,.7,.2,1)';
    this.injectStyles();
    this.buildChrome();
    this.onScroll = () => {
      const y = window.scrollY;
      const s = y > 40;
      if (s !== this.state.scrolled) this.setState({ scrolled: s });
      const max = document.documentElement.scrollHeight - window.innerHeight;
      if (this.bar) this.bar.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, y / max) : 0) + ')';
      if (!this.reduce) document.querySelectorAll('[data-parallax]').forEach(el => {
        const r = el.parentElement.getBoundingClientRect();
        if (r.bottom < 0 || r.top > window.innerHeight) return;
        const f = parseFloat(el.dataset.parallax) || 0.1;
        el.style.transform = 'translate3d(0,' + (-r.top * f).toFixed(1) + 'px,0)';
      });
      this.revealVisible();
    };
    this.onResize = () => this.setState({ w: window.innerWidth });
    this.onClick = e => this.handleLink(e);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onResize);
    document.addEventListener('click', this.onClick);
    this.onPageShow = e => { if (e.persisted && this.veil) { this.veil.style.transition = 'none'; this.veil.style.opacity = '0'; this.veil.style.pointerEvents = 'none'; } };
    window.addEventListener('pageshow', this.onPageShow);
    this.runIntro();
    this.timers = [0, 400, 1200, 2500].map(t => setTimeout(() => { this.setupReveal(); this.onScroll(); }, t));
  }

  injectStyles() {
    if (document.getElementById('sh-anim')) return;
    const s = document.createElement('style');
    s.id = 'sh-anim';
    s.textContent = '@keyframes shKb{from{transform:scale(1.14)}to{transform:scale(1)}}' +
      '@keyframes shLine{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}' +
      '@keyframes shMark{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}' +
      '@keyframes shGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}' +
      '@keyframes shFadeIn{from{opacity:0}to{opacity:1}}';
    document.head.appendChild(s);
  }

  buildChrome() {
    if (!document.getElementById('sh-bar')) {
      const bar = document.createElement('div');
      bar.id = 'sh-bar';
      bar.style.cssText = 'position:fixed;top:0;left:0;right:0;height:1px;background:#c9ad78;transform:scaleX(0);transform-origin:left;z-index:70;pointer-events:none;transition:transform .2s linear';
      document.body.appendChild(bar);
    }
    this.bar = document.getElementById('sh-bar');
    let v = document.getElementById('sh-veil');
    if (!v) {
      v = document.createElement('div');
      v.id = 'sh-veil';
      v.style.cssText = 'position:fixed;inset:0;z-index:100;background:#12110f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#ece6db;font-family:"Shippori Mincho",serif';
      v.innerHTML = '<span data-m style="width:56px;height:56px;border:1px solid #c9ad78;display:flex;align-items:center;justify-content:center;font-size:26px;color:#c9ad78;opacity:0"></span>' +
        '<span data-m style="font-size:18px;letter-spacing:.5em;padding-left:.5em;opacity:0">しらせ</span>' +
        '<span data-l style="width:120px;height:1px;background:#c9ad78;transform:scaleX(0)"></span>';
      v.firstChild.textContent = '鮨';
      document.body.appendChild(v);
    }
    this.veil = v;
  }

  runIntro() {
    const v = this.veil;
    let full = false;
    try { full = !sessionStorage.getItem('shirase-intro'); sessionStorage.setItem('shirase-intro', '1'); } catch (e) {}
    if (this.reduce) full = false;
    const marks = v.querySelectorAll('[data-m]');
    const line = v.querySelector('[data-l]');
    let lift = 150;
    if (full) {
      marks.forEach((m, i) => { m.style.animation = 'shMark 1s ' + this.ease + ' ' + (0.15 + i * 0.25) + 's both'; });
      line.style.animation = 'shGrow 1.1s ' + this.ease + ' .6s both';
      lift = 1700;
    } else {
      marks.forEach(m => { m.style.opacity = '0'; });
    }
    this.introT = setTimeout(() => {
      v.style.transition = full ? 'transform 1.2s cubic-bezier(.76,0,.24,1)' : 'opacity .7s ease';
      if (full) v.style.transform = 'translateY(-100%)'; else v.style.opacity = '0';
      v.style.pointerEvents = 'none';
    }, lift);
    this.fvDelay = full ? lift + 350 : 250;
    this.prepFirstView();
  }

  prepFirstView() {
    const roots = document.querySelectorAll('[data-first-view]');
    if (!roots.length) { this.fvRetry = setTimeout(() => this.prepFirstView(), 150); return; }
    const els = [];
    roots.forEach(r => r.querySelectorAll('[data-reveal],h1,p').forEach(el => {
      if (els.some(p => p.contains(el))) return;
      els.push(el);
    }));
    els.forEach(el => el.setAttribute('data-rv', 'fv'));
    roots.forEach(r => r.querySelectorAll('image-slot').forEach(img => {
      if (!this.reduce) img.style.animation = 'shKb 9s cubic-bezier(.2,.6,.2,1) both';
    }));
    if (this.reduce) return;
    els.forEach(el => this.hide(el));
    setTimeout(() => els.forEach((el, i) => this.show(el, i * 140)), this.fvDelay);
  }

  hide(el) {
    const heading = /^H[12]$/.test(el.tagName);
    el.dataset.rvh = '1';
    el.style.opacity = '0';
    el.style.transform = heading ? 'translateY(44px)' : 'translateY(28px)';
    if (heading) el.style.filter = 'blur(10px)';
    el.style.transition = 'opacity 1.5s ' + this.ease + ', transform 1.5s ' + this.ease + ', filter 1.5s ' + this.ease;
    el.querySelectorAll('image-slot').forEach(img => {
      img.style.clipPath = 'inset(100% 0 0 0)';
      img.style.transform = 'scale(1.15)';
      img.style.transition = 'clip-path 1.6s cubic-bezier(.76,0,.24,1), transform 2.4s ' + this.ease;
    });
    el.querySelectorAll('span').forEach(sp => {
      const st = sp.style;
      if (st.height === '1px' && parseFloat(st.width) >= 30) {
        st.transform = 'scaleX(0)';
        st.transformOrigin = 'left';
        st.transition = 'transform 1.2s ' + this.ease;
      }
    });
  }

  show(el, delay) {
    delete el.dataset.rvh;
    const d = (delay || 0) + 'ms';
    el.style.transitionDelay = d;
    el.style.opacity = '1';
    el.style.transform = 'none';
    el.style.filter = 'none';
    el.querySelectorAll('image-slot').forEach(img => {
      img.style.transitionDelay = d;
      img.style.clipPath = 'inset(0 0 0 0)';
      img.style.transform = 'scale(1)';
    });
    el.querySelectorAll('span').forEach(sp => {
      if (sp.style.transformOrigin === 'left') { sp.style.transitionDelay = (delay || 0) + 300 + 'ms'; sp.style.transform = 'scaleX(1)'; }
    });
    setTimeout(() => { el.style.transitionDelay = '0ms'; }, (delay || 0) + 1600);
  }

  setupReveal() {
    if (this.props.reveal === false || this.reduce) return;
    if (!this.io) {
      this.io = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (!e.isIntersecting) return;
          this.io.unobserve(e.target);
          this.show(e.target, this.stagger(e.target));
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    }
    document.querySelectorAll('[data-reveal]:not([data-rv])').forEach(el => {
      el.setAttribute('data-rv', '');
      if (el.closest('[data-first-view]')) return;
      const r = el.getBoundingClientRect();
      if (r.top < window.innerHeight * 0.9) return;
      this.hide(el);
      this.io.observe(el);
    });
    document.querySelectorAll('span[data-scroll-line]').forEach(sp => { sp.style.animation = 'shLine 2.6s cubic-bezier(.6,0,.3,1) infinite'; });
  }

  stagger(el) {
    const p = el.parentElement;
    if (!p) return 0;
    const sibs = Array.from(p.children).filter(c => c.hasAttribute('data-reveal') || c.querySelector('[data-reveal]'));
    const i = Math.max(0, sibs.indexOf(el));
    const now = performance.now();
    if (!this.lastBatch || now - this.lastBatch > 120) { this.lastBatch = now; this.batchN = 0; }
    const n = this.batchN++;
    return Math.min(600, Math.max(i, n) * 120);
  }

  revealVisible() {
    const h = window.innerHeight;
    document.querySelectorAll('[data-rv=""][data-rvh]').forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.top < h * 0.94 && r.bottom > 0) {
        this.io && this.io.unobserve(el);
        this.show(el, 0);
      }
    });
  }

  handleLink(e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
    const a = e.target.closest && e.target.closest('a[href]');
    if (!a || a.target === '_blank') return;
    const href = a.getAttribute('href');
    if (!/\.dc\.html/.test(href)) return;
    const url = new URL(href, location.href);
    if (url.pathname === location.pathname) return;
    e.preventDefault();
    const v = this.veil;
    v.querySelectorAll('[data-m],[data-l]').forEach(m => { m.style.animation = 'none'; m.style.opacity = '0'; });
    v.style.transition = 'none';
    v.style.transform = 'none';
    v.style.opacity = '0';
    v.style.pointerEvents = 'auto';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      v.style.transition = 'opacity .55s ease';
      v.style.opacity = '1';
    }));
    setTimeout(() => { location.href = url.href; }, 560);
  }

  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('pageshow', this.onPageShow);
    document.removeEventListener('click', this.onClick);
    (this.timers || []).forEach(clearTimeout);
    clearTimeout(this.introT); clearTimeout(this.fvRetry);
    this.io && this.io.disconnect();
  }

  renderVals() {
    const mobile = this.state.w < 1080;
    const scrolled = this.state.scrolled;
    const cur = this.props.current || 'home';
    const pages = [
      { key: 'home', en: 'HOME', title: 'Home', jp: 'ホーム', href: 'Sushi%20Shirase.dc.html' },
      { key: 'concept', en: 'CONCEPT', title: 'Concept', jp: 'こだわり', href: 'Concept.dc.html' },
      { key: 'menu', en: 'MENU', title: 'Menu', jp: 'お品書き', href: 'Menu.dc.html' },
      { key: 'craft', en: 'CRAFTSMANSHIP', title: 'Craftsmanship', jp: '技', href: 'Craftsmanship.dc.html' },
      { key: 'chef', en: 'CHEF', title: 'Chef', jp: '大将', href: 'Chef.dc.html' },
      { key: 'access', en: 'ACCESS', title: 'Access', jp: 'ご予約・アクセス', href: 'Access.dc.html' }
    ];
    return {
      isMobile: mobile,
      isDesktop: !mobile,
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
      nav: pages.map(p => ({ ...p, color: p.key === cur ? '#c9ad78' : '#ece6db', line: p.key === cur ? '#c9ad78' : 'transparent', aria: p.key === cur ? 'page' : undefined })),
      headerBg: scrolled || this.state.menuOpen ? 'rgba(18,17,15,.92)' : 'rgba(18,17,15,0)',
      headerBorder: scrolled ? '#2e2a25' : 'rgba(46,42,37,0)',
      headerPad: scrolled ? (mobile ? '10px 20px' : '16px clamp(24px,4vw,64px)') : (mobile ? '18px 20px' : '30px clamp(24px,4vw,64px)'),
      showStickyCta: (this.props.stickyCta ?? true) && mobile && scrolled && !this.state.menuOpen && cur !== 'access'
    };
  }
}
</script>
</body>
</html>
