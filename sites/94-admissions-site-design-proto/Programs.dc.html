<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#05060b;color:#f7f3ea;font-family:"Zen Kaku Gothic New","Shippori Mincho",sans-serif;font-weight:500;-webkit-font-smoothing:antialiased;text-shadow:0 1px 10px rgba(0,0,0,0.7)}
*{box-sizing:border-box}
a{color:#f0d592;text-decoration:none}
a:hover{color:#fff}
</style>
</helmet>
<dc-import name="SiteHeader" current="programs" hint-size="100%,1px"></dc-import>
<div style="position:relative;overflow:hidden">

<section data-screen-label="01 Programs Hero" style="position:relative;overflow:hidden;background:radial-gradient(ellipse at 25% 40%,rgba(120,96,48,0.35),transparent 60%);padding:170px 24px 110px">
  <div style="position:absolute;left:-10%;right:-10%;top:70%;height:1px;background:rgba(255,255,255,0.4);transform:rotate(-10deg)"></div>
  <div style="position:relative;max-width:1140px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:56px;align-items:center">
    <div style="display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:rgba(7,8,20,0.82);padding:clamp(24px,4vw,44px);border:1px solid rgba(240,213,146,0.35)">
      <span style="font-size:14.5px;letter-spacing:0.16em;color:#dcd3c0;margin-bottom:14px"><a href="Home.dc.html" style="color:#dcd3c0">TOP</a>　/　学部・学科</span>
      <span style="font-family:'Cormorant Garamond',serif;font-weight:600;font-size:64px;line-height:1">01</span>
      <h1 style="margin:0;background:#8a7034;padding:2px 14px;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(36px,5vw,56px);letter-spacing:0.06em">Programs</h1>
      <span style="background:#8a7034;padding:2px 12px;font-size:18px;letter-spacing:0.16em">学部・学科</span>
      <p style="margin:22px 0 0;max-width:460px;font-size:17px;line-height:2.1;color:#f3eee4;text-wrap:pretty">文系・理系・医療系の6学部14学科で、「好き」を一生の学びに変える。少人数ゼミと学部横断プログラムが、専門性と広い視野を同時に育てます。<span style="color:#dcd3c0">※学部・学科構成はサンプルです</span></p>
    </div>
    <div style="position:relative;width:min(420px,84%);aspect-ratio:1;justify-self:center">
      <div style="position:absolute;left:10.40%;top:10.40%;width:79.20%;height:79.20%;border:1px solid rgba(255,255,255,0.65);transform:rotate(45deg)"></div>
      <div style="position:absolute;left:8.99%;top:8.99%;width:82.02%;height:82.02%;border:1px solid rgba(255,255,255,0.28);transform:translateX(2%) rotate(45deg)"></div>
      <div style="position:absolute;inset:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:radial-gradient(circle at 50% 30%,rgba(255,236,190,0.3),transparent 60%),repeating-linear-gradient(135deg,#6e5f45 0 8px,#7d6c50 8px 16px);display:grid;place-items:center"><span style="font-family:'JetBrains Mono',monospace;font-size:13.5px;color:#efe4cc">講義室の風景</span></div>
    </div>
  </div>
</section>

<section style="padding:40px 24px 100px">
  <div style="max-width:1140px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:rgba(217,191,127,0.35);border:1px solid rgba(217,191,127,0.35)">
    <sc-for list="{{ features }}" as="f" hint-placeholder-count="3">
      <div style="background:rgba(5,6,11,0.82);padding:36px 32px;display:flex;flex-direction:column;gap:12px">
        <span style="font-family:'Cormorant Garamond',serif;font-weight:600;font-style:italic;font-size:18px;color:#f0d592">{{ f.en }}</span>
        <span style="font-size:19px;font-weight:500;letter-spacing:0.08em">{{ f.t }}</span>
        <span style="font-size:16.5px;line-height:1.95;color:#efe9dd">{{ f.d }}</span>
      </div>
    </sc-for>
  </div>
</section>

<section data-screen-label="01 Faculties" style="padding:40px 24px 120px;background:linear-gradient(180deg,transparent,rgba(6,6,16,0.72) 50%,transparent)">
  <div style="max-width:1140px;margin:0 auto;background:rgba(7,8,20,0.88);padding:clamp(28px,5vw,64px);border:1px solid rgba(240,213,146,0.35);display:flex;flex-direction:column;gap:110px">
    <sc-for list="{{ faculties }}" as="p" hint-placeholder-count="6">
      <article style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:56px;align-items:center">
        <div style="position:relative;width:min(340px,80%);aspect-ratio:1;justify-self:center">
          <div style="position:absolute;left:9.69%;top:9.69%;width:80.61%;height:80.61%;border:1px solid rgba(255,255,255,0.45);transform:rotate(45deg)"></div>
          <div style="position:absolute;inset:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:repeating-linear-gradient(135deg,#5d5241 0 8px,#6b5f4c 8px 16px);display:grid;place-items:center"><span style="font-family:'JetBrains Mono',monospace;font-size:13.5px;color:#e8dcc2">{{ p.img }}</span></div>
          <span style="position:absolute;left:-12%;top:2%;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:44px;line-height:1">{{ p.no }}</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-start;gap:8px">
          <span style="font-family:'Cormorant Garamond',serif;font-weight:600;font-size:18px;letter-spacing:0.16em;color:#f0d592">{{ p.en }}</span>
          <h2 style="margin:0;background:#8a7034;padding:2px 14px;font-size:clamp(22px,2.6vw,28px);font-weight:500;letter-spacing:0.12em">{{ p.name }}</h2>
          <p style="margin:16px 0 8px;font-size:17px;line-height:2.05;color:#f3eee4;text-wrap:pretty">{{ p.desc }}</p>
          <div style="width:100%;border-top:1px solid rgba(255,255,255,0.22)">
            <sc-for list="{{ p.depts }}" as="d" hint-placeholder-count="2">
              <div style="display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.22);font-size:16.5px">
                <span style="font-weight:500">{{ d.n }}</span><span style="color:#dcd3c0;text-align:right">{{ d.d }}</span>
              </div>
            </sc-for>
          </div>
          <a href="Contact.dc.html#form" style="margin-top:14px;display:inline-flex;align-items:center;gap:12px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:17px;letter-spacing:0.16em;color:#fff" style-hover="color:#f0d592">VIEW MORE<span style="width:36px;height:36px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center">→</span></a>
        </div>
      </article>
    </sc-for>
  </div>
</section>

<section style="padding:40px 24px 40px;text-align:center">
  <a href="ExamPrep.dc.html" style="display:inline-flex;flex-direction:column;align-items:center;gap:10px;color:#fff" style-hover="color:#f0d592"><span style="font-size:15.5px;letter-spacing:0.2em;color:#dcd3c0">NEXT</span><span style="font-family:'Cormorant Garamond',serif;font-weight:600;font-size:36px">02 Exam Prep →</span></a>
</section>
</div>
<dc-import name="SiteFooter" cta="{{ true }}" hint-size="100%,600px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      features: [
        { en: 'Small Seminars', t: '1年次からの少人数ゼミ', d: '教員と学生の距離が近い少人数クラスで、問いを立てて議論する力を育てます。' },
        { en: 'Cross-Faculty', t: '学部横断プログラム', d: 'データサイエンスや地域連携など、所属学部を越えて履修できる副専攻を用意しています。' },
        { en: 'Global & Career', t: '留学とキャリア支援', d: '協定校への留学や、学年ごとのキャリア講座で、卒業後の進路を早くから描けます。' },
      ],
      faculties: [
        { no: 'i', name: '文学部', en: 'Literature', img: '講義風景', desc: '言葉・歴史・思想を手がかりに、人と社会を深く読み解く力を養います。原典講読やフィールドワークを通じて、自分の視点で考え、書く力を磨きます。', depts: [{ n: '日本文学科', d: '古典から現代文学、日本語学' }, { n: '史学科', d: '日本史・東洋史・西洋史' }, { n: '心理学科', d: '認知・発達・臨床心理' }] },
        { no: 'ii', name: '経済学部', en: 'Economics', img: 'ゼミ風景', desc: 'データと理論の両面から、地域や世界の経済を捉える視点を身につけます。企業や自治体と連携した課題解決型の演習も行います。', depts: [{ n: '経済学科', d: 'ミクロ・マクロ経済、計量分析' }, { n: '経営学科', d: 'マーケティング、会計、組織論' }] },
        { no: 'iii', name: '国際教養学部', en: 'Liberal Arts', img: '留学生との交流', desc: '英語で学ぶ授業と留学プログラムで、多様な価値観の中で考える力を育てます。全員が在学中に海外での学修を経験します。', depts: [{ n: '国際教養学科', d: '国際関係、文化研究、英語で学ぶ専門科目' }] },
        { no: 'iv', name: '理工学部', en: 'Science & Engineering', img: '実験室', desc: '実験と実習を重ね、ものづくりと研究の基礎を確かな手応えとともに学びます。4年次には研究室に所属し、卒業研究に取り組みます。', depts: [{ n: '機械工学科', d: '設計、材料、ロボティクス' }, { n: '電気電子工学科', d: '回路、エネルギー、通信' }, { n: '応用化学科', d: '物質化学、環境化学' }] },
        { no: 'v', name: '情報科学部', en: 'Informatics', img: 'プログラミング演習', desc: 'AIやデータサイエンスを、社会の課題解決につなげる実践的なカリキュラムです。チーム開発の演習で、実務に近い経験を積みます。', depts: [{ n: '情報科学科', d: 'アルゴリズム、AI、セキュリティ' }, { n: 'データサイエンス学科', d: '統計、機械学習、データ活用' }] },
        { no: 'vi', name: '看護学部', en: 'Nursing', img: '看護実習', desc: '附属施設での臨地実習を通して、人に寄り添う専門職としての力を磨きます。国家試験に向けた学習支援も段階的に行います。', depts: [{ n: '看護学科', d: '基礎・成人・小児・地域看護' }] },
      ],
    };
  }
}
</script>
</body>
</html>
