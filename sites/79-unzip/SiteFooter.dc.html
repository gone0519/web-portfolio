<x-dc>
<div style="font-family:'Zen Maru Gothic',sans-serif;color:#3d3a38">

          <span style="font-size:13px;line-height:1.9">よくいただくご質問をまとめました。<br>お問い合わせの前にご覧ください。</span>
        </a>
        <a href="入園案内.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;background:#fff;border:2px solid #f2b8bb;border-radius:18px;padding:40px 24px 28px;color:#3d3a38;text-decoration:none;text-align:center;transition:transform .25s,box-shadow .25s" style-hover="transform:translateY(-4px);box-shadow:0 8px 0 #f7d2d4">
          <span style="position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid #f2b8bb;display:grid;place-items:center;color:#e8555b;font-family:'Mochiy Pop One';font-size:15px">入</span>
          <strong style="font-size:18px;color:#e8555b;letter-spacing:.08em">入園案内 ›</strong>
          <span style="font-size:13px;line-height:1.9">昭和保育園に入園をご希望の方は<br>こちらをご覧ください。</span>
        </a>
      </div>
    </div>
  </sc-if>

    <div style="max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:32px">

        <span style="font-family:'Mochiy Pop One';font-size:13px;letter-spacing:.08em">認定こども園</span>
        <span style="font-family:'Mochiy Pop One';font-size:26px;letter-spacing:.14em;margin-top:-8px">昭和保育園</span>
        <span style="font-size:12px;line-height:1.8">〒466-0000 名古屋市昭和区○○町1-1<br>TEL 052-000-0000</span>
        <div style="display:flex;gap:10px;margin-top:6px">
          <a href="#" style="width:40px;height:40px;border-radius:50%;background:#fff;color:#e8555b;display:grid;place-items:center;font-size:11px;font-weight:900;text-decoration:none">IG</a>
          <a href="#" style="width:40px;height:40px;border-radius:50%;background:#fff;color:#e8555b;display:grid;place-items:center;font-size:11px;font-weight:900;text-decoration:none">LINE</a>
        </div>
      </div>
      <nav style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;align-content:start;font-size:12px;font-weight:700">

        <a href="園の特色.dc.html" style="color:#fff;text-decoration:none">園の特色</a>

        <a href="入園案内.dc.html" style="color:#fff;text-decoration:none">入園案内</a>
        <a href="お問い合わせ.dc.html" style="color:#fff;text-decoration:none">お問い合わせ</a>

  renderVals() { return { showCta: this.props.showCta ?? true }; }
}
</script>
