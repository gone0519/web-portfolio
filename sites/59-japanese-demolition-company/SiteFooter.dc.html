<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="background:#0c0c0c;color:#fff;font-family:'Noto Sans JP',sans-serif">
  <div style="position:relative;overflow:hidden;background:#8e0c12;background-image:var(--noise),linear-gradient(135deg,#5c060b 0%,#c4161f 50%,#6a070c 100%);padding:clamp(50px,7vw,80px) clamp(20px,5vw,60px)">
    <div style="max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(16px,3vw,32px)">
      <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="2">
        <a href="{{ t.href }}" style="position:relative;display:block;height:180px;border:1px solid rgba(255,255,255,.7);overflow:hidden;color:#fff;text-decoration:none;transition:transform .4s" style-hover="transform:translateY(-4px);color:#fff">
          <image-slot id="{{ t.id }}" src="{{ t.src }}" shape="rect" placeholder="{{ t.ph }}"></image-slot>
          <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.7),rgba(0,0,0,.25))"></div>
          <div style="position:absolute;right:24px;bottom:22px;pointer-events:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            <span style="font-size:13px;font-weight:700;letter-spacing:.16em">{{ t.jp }}</span>
            <span style="font-family:'Dela Gothic One',sans-serif;font-size:clamp(28px,3.4vw,42px);letter-spacing:.06em;line-height:1">{{ t.en }}</span>
          </div>
        </a>
      </sc-for>
    </div>
  </div>
  <div style="background-image:var(--noise);padding:clamp(56px,7vw,80px) clamp(20px,5vw,60px) 28px">
    <div style="max-width:1160px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:40px">
      <div style="display:flex;flex-direction:column;gap:18px">
        <a href="Top.dc.html" style="display:flex;align-items:center;gap:14px;color:#fff;text-decoration:none">
          <div style="width:32px;height:32px;transform:rotate(45deg);border:4px solid #c4161f;display:flex;align-items:center;justify-content:center">
            <div style="width:8px;height:8px;background:#fff"></div>
          </div>
          <div style="display:flex;flex-direction:column;line-height:1.3;margin-left:6px">
            <span style="font-family:'Dela Gothic One',sans-serif;font-size:clamp(15px,4.4vw,18px);letter-spacing:.14em">{{ companyEn }}</span>
            <span style="font-size:12px;font-weight:700;letter-spacing:.2em">{{ companyName }}</span>
          </div>
        </a>
        <p style="margin:0;font-size:13px;line-height:1.9;letter-spacing:.05em;color:rgba(255,255,255,.75)">{{ address }}<br>TEL {{ tel }} ／ FAX {{ fax }}</p>
      </div>
      <nav aria-label="フッターナビゲーション" style="display:grid;grid-template-columns:repeat(2,auto);gap:12px clamp(20px,6vw,48px);align-content:start">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
          <a href="{{ n.href }}" style="display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.1em;color:rgba(255,255,255,.85);text-decoration:none" style-hover="color:#ff4a52">
            <span style="width:6px;height:6px;transform:rotate(45deg);background:#c4161f"></span>
            <span>{{ n.jp }}</span>
          </a>
        </sc-for>
      </nav>
    </div>
    <p style="max-width:1160px;margin:48px auto 0;padding-top:22px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.55);text-align:center">© {{ companyEn }} All Rights Reserved.</p>
  </div>
</footer>
<a href="#top" onClick="{{ toTop }}" aria-label="ページトップへ" style="position:fixed;right:18px;bottom:18px;z-index:40;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:#c4161f;color:#fff;text-decoration:none;font-family:'Dela Gothic One',sans-serif;font-size:14px;opacity:{{ topOpacity }};pointer-events:{{ topEvents }};transition:opacity .4s,background .3s;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)" style-hover="background:#e0262f;color:#fff">↑</a>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:640},&quot;companyName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;〇〇解体工業株式会社&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;companyEn&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;MARUMARU KAITAI&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;000-000-0000&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fax&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;000-000-0001&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;address&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;〒000-0000 〇〇県〇〇市〇〇町0-0-0&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { showTop: false };
  componentDidMount() {
    this.onScroll = () => { const s = window.scrollY > 600; if (s !== this.state.showTop) this.setState({ showTop: s }); };
    window.addEventListener('scroll', this.onScroll, { passive: true });
  }
  setupReveal() {
    if (!('IntersectionObserver' in window)) return;
    this.io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.translate = '0 0'; this.io.unobserve(e.target); }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('[data-reveal]').forEach(el => {
      if (el.dataset.revealed) return;
      el.dataset.revealed = '1';
      if (el.getBoundingClientRect().top < window.innerHeight) return;
      el.style.opacity = '0';
      el.style.translate = '0 32px';
      el.style.transition = (el.style.transition ? el.style.transition + ', ' : '') + 'opacity .9s ease, translate .9s cubic-bezier(.2,.7,.2,1)';
      this.io.observe(el);
    });
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
    if (this.io) this.io.disconnect();
  }
  renderVals() {
    const p = this.props;
    return {
      tiles: [
        { id: 'tile-services', en: 'SERVICES', jp: '解体工事のサービス', href: 'Services.dc.html', ph: 'SERVICES — 重機・解体現場', src: 'images/teal-excavators.jpg' },
        { id: 'tile-works', en: 'WORKS', jp: '施工実績', href: 'Works.dc.html', ph: 'WORKS — 施工前後の写真', src: 'images/cleared-lot.jpg' }
      ],
      nav: [
        { jp: 'トップ', href: 'Top.dc.html' },
        { jp: '私たちについて', href: 'About.dc.html' },
        { jp: 'サービス', href: 'Services.dc.html' },
        { jp: '強み・安全への取り組み', href: 'Strengths.dc.html' },
        { jp: '施工実績', href: 'Works.dc.html' },
        { jp: 'お問い合わせ', href: 'Contact.dc.html' }
      ],
      topOpacity: this.state.showTop ? 1 : 0,
      topEvents: this.state.showTop ? 'auto' : 'none',
      toTop: e => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
      companyName: p.companyName ?? '〇〇解体工業株式会社',
      companyEn: p.companyEn ?? 'MARUMARU KAITAI',
      tel: p.tel ?? '000-000-0000',
      fax: p.fax ?? '000-000-0001',
      address: p.address ?? '〒000-0000 〇〇県〇〇市〇〇町0-0-0'
    };
  }
}
</script>
</body>
</html>
