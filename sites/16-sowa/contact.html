<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせ | sowa</title>
<meta name="description" content="初回のご相談と簡易診断は無料です。sowaへのお問い合わせはこちらから。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Zen+Old+Mincho:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="contact">

<!-- ===== Page hero ===== -->
<section class="phero art v1" data-photo="contact" data-label="Contact">
  <div class="veil"></div>
  <span class="ghost" data-page-en></span>
  <div class="phero-inner">
    <span class="sec-no">Get in touch</span>
    <h1 class="split" data-page-en></h1>
    <span class="pjp" data-page-jp></span>
  </div>
  <nav class="crumb"><a href="index.html">Top</a><i></i><span data-page-jp></span></nav>
</section>

<p class="page-lead" data-page-lead></p>

<!-- ===== 直接のご連絡先 ===== -->
<section class="sec wrap" id="direct" data-label="Direct" data-reveal>
  <div class="direct">
    <a data-tel-href href="#">
      <span class="k">By phone</span>
      <span class="v" data-tel></span>
      <span class="n">平日 <span data-hours></span><br>定休日：<span data-holiday></span></span>
    </a>
    <a data-mail-href href="#">
      <span class="k">By email</span>
      <span class="v" style="font-size:clamp(15px,1.9vw,20px);letter-spacing:.06em" data-email></span>
      <span class="n">2営業日以内にご返信します</span>
    </a>
    <div>
      <span class="k">Office</span>
      <span class="v" style="font-size:clamp(15px,1.9vw,19px);letter-spacing:.06em">恵比寿</span>
      <span class="n" data-address></span>
    </div>
  </div>
</section>

<!-- ===== フォーム ===== -->
<section class="sec wrap-n" id="form" data-label="Form" data-reveal style="margin-top:clamp(110px,14vw,180px)">
  <div class="sec-head">
    <span class="sec-no">01 — Form</span>
    <h2 class="sec-en split">Inquiry</h2>
    <span class="sec-jp">お問い合わせフォーム</span>
  </div>
  <div data-form></div>
</section>

<!-- ===== Process ===== -->
<section class="sec process wrap" id="process" data-label="Process" data-reveal>
  <div class="sec-head">
    <span class="sec-no">02 — Process</span>
    <h2 class="sec-en split">Process</h2>
    <span class="sec-jp">ご依頼の流れ</span>
  </div>
  <div class="steps">
    <template data-tpl="steps">
      <div class="step">
        <span class="no">Step {{ st.no }}</span>
        <h3>{{ st.title }}</h3>
        <p>{{ st.body }}</p>
      </div>
    </template>
  </div>
</section>

<!-- ===== FAQ ===== -->
<section class="sec faq wrap-n" id="faq" data-label="FAQ" data-reveal>
  <div class="sec-head">
    <span class="sec-no">03 — FAQ</span>
    <h2 class="sec-en split">FAQ</h2>
    <span class="sec-jp">よくあるご質問</span>
  </div>
  <div class="faq-list">
    <template data-tpl="faqs">
      <div class="faq-item">
        <button class="faq-btn" aria-expanded="false">
          <span class="q"><span class="qi" data-index></span><span>{{ f.q }}</span></span>
          <span class="sign"></span>
        </button>
        <div class="faq-wrap"><div><p>{{ f.a }}</p></div></div>
      </div>
    </template>
  </div>
</section>

<!-- ===== アクセス ===== -->
<section class="sec why wrap" id="access" data-label="Access" data-reveal>
  <div class="sec-head">
    <span class="sec-no">04 — Access</span>
    <h2 class="sec-en split">Access</h2>
    <span class="sec-jp">アクセス</span>
  </div>
  <div class="access-grid">
    <div class="art v4" data-photo="map" style="aspect-ratio:4/3"></div>
    <div>
      <p style="font-family:var(--sans);font-size:13px;line-height:2.3;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:26px" data-address></p>
      <dl data-access></dl>
    </div>
  </div>
</section>

<nav data-pagenav></nav>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
