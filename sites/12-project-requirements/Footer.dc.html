<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="background: #33231d; color: #e4d9d2; padding: calc(54px * var(--sy, 1)) var(--gx, 60px) 34px; font-family: 'Noto Sans JP', sans-serif;">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 30px; flex-wrap: wrap; padding-bottom: 34px; border-bottom: 1px solid rgba(255,255,255,0.1);">
    <a href="Home.dc.html" style="display: flex; align-items: center; gap: 12px; color: #e4d9d2;" style-hover="color: #ffffff;">
      <div style="width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid #d8a44e; display: flex; align-items: center; justify-content: center; color: #d8a44e; font-family: 'Shippori Mincho', serif; font-size: 18px;">R</div>
      <div>
        <div style="font-size: 9.5px; letter-spacing: 0.16em; color: #b6a096;">株式会社</div>
        <div style="font-family: 'Shippori Mincho', serif; font-size: 17px; letter-spacing: 0.06em;">ライズフィールド</div>
      </div>
    </a>
    <div style="display: flex; align-items: center; gap: 26px; flex-wrap: wrap;">
      <div>
        <div style="font-family: 'Roboto Mono', monospace; font-weight: 500; font-size: 21px; color: #ffffff;">✆ 03-6822-4510</div>
        <div style="font-size: 10.5px; color: #b6a096; margin-top: 3px;">受付 9:30〜18:30（土日祝休）</div>
      </div>
      <a href="Contact.dc.html" style="background: #5b4239; color: #ffffff; font-size: 12px; letter-spacing: 0.1em; padding: 13px 26px; border-radius: 3px; transition: background .3s;" style-hover="background: #6e5146; color: #ffffff;">お問い合わせ</a>
    </div>
  </div>
  <div class="rf-cols-2-sm" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 30px; padding: 34px 0;">
    <sc-for list="{{ cols }}" as="c" hint-placeholder-count="4">
      <div>
        <div style="font-size: 13px; letter-spacing: 0.08em; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.14); margin-bottom: 14px;">{{ c.head }}</div>
        <div style="display: flex; flex-direction: column; gap: 9px;">
          <sc-for list="{{ c.links }}" as="l" hint-placeholder-count="4">
            <a href="{{ l.href }}" style="font-size: 11.5px; color: #cfc0b8; border-left: 2px solid #c98f33; padding-left: 9px; transition: color .25s, padding-left .25s;" style-hover="color: #ffffff; padding-left: 13px;">{{ l.label }}</a>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="text-align: center; font-family: 'Roboto Mono', monospace; font-size: 9.5px; letter-spacing: 0.14em; color: #9a857b; padding-top: 22px; border-top: 1px solid rgba(255,255,255,0.08);">Copyright © 株式会社ライズフィールド All Rights Reserved.</div>
</footer>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const L = (label, href) => ({ label, href });
    return {
      cols: [
        { head: '会社情報', links: [L('会社概要', 'About.dc.html'), L('代表メッセージ', 'About.dc.html'), L('沿革', 'About.dc.html'), L('採用情報', 'About.dc.html')] },
        { head: 'サービス', links: [L('デジタルマーケティング', 'Services.dc.html'), L('SEO対策', 'Services.dc.html'), L('Google広告 / PPC', 'Services.dc.html'), L('SNSマーケティング', 'Services.dc.html'), L('Web制作・LP制作', 'Services.dc.html')] },
        { head: '実績・事例', links: [L('実績紹介', 'Cases.dc.html'), L('業種別の事例', 'Cases.dc.html'), L('お客様の声', 'Home.dc.html')] },
        { head: 'その他', links: [L('インサイト', 'Insights.dc.html'), L('お問い合わせ', 'Contact.dc.html'), L('プライバシーポリシー', 'Contact.dc.html')] }
      ]
    };
  }
}

</script>
</body>
</html>
