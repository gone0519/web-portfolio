<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<aside class="rf-nav {{ openClass }}" style="position: sticky; top: 0; width: 220px; height: 100vh; overflow-y: auto; background: #402d28; color: #f2ece8; display: flex; flex-direction: column; padding: 18px 0 10px; z-index: 20; font-family: 'Noto Sans JP', sans-serif;">
  <div class="rf-nav-bar" style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <a href="Home.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 0 18px 16px; color: #f2ece8;" style-hover="color: #f2ece8;">
      <div style="width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid #d8a44e; display: flex; align-items: center; justify-content: center; color: #d8a44e; font-family: 'Shippori Mincho', serif; font-size: 19px;">R</div>
      <div>
        <div style="font-size: 10px; letter-spacing: 0.16em; color: #bfaba1;">株式会社</div>
        <div style="font-family: 'Shippori Mincho', serif; font-size: 16px; letter-spacing: 0.02em; line-height: 1.2; white-space: nowrap;">ライズフィールド</div>
        <div style="font-family: 'Roboto Mono', monospace; font-size: 7.5px; letter-spacing: 0.22em; color: #9d8478; margin-top: 2px;">RISEFIELD INC.</div>
      </div>
    </a>
    <button type="button" class="rf-nav-toggle" onClick="{{ toggle }}" aria-label="{{ toggleLabel }}" aria-expanded="{{ open }}" style="display: none; flex-direction: column; align-items: center; justify-content: center; gap: 5px; width: 44px; height: 44px; flex: 0 0 auto; background: transparent; border: 1px solid rgba(216,164,78,0.5); border-radius: 3px; cursor: pointer; padding: 0;">
      <span style="display: block; width: 18px; height: 1.5px; background: #d8a44e; transition: transform .3s; transform: {{ bar1 }};"></span>
      <span style="display: block; width: 18px; height: 1.5px; background: #d8a44e; transition: opacity .3s; opacity: {{ bar2 }};"></span>
      <span style="display: block; width: 18px; height: 1.5px; background: #d8a44e; transition: transform .3s; transform: {{ bar3 }};"></span>
    </button>
  </div>
  <div class="rf-nav-body" style="display: flex; flex-direction: column; flex: 1 0 auto;">
    <nav style="display: flex; flex-direction: column; border-top: 1px solid rgba(255,255,255,0.09);">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
        <a href="{{ it.href }}" style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 9px 18px; border-bottom: 1px solid rgba(255,255,255,0.09); color: #f2ece8; transition: background .3s;" style-hover="background: rgba(216,164,78,0.14); color: #f2ece8;">
          <sc-if value="{{ it.active }}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #d8a44e;"></span>
          </sc-if>
          <span>
            <span style="display: block; font-size: 13px; letter-spacing: 0.08em;">{{ it.ja }}</span>
            <span style="display: block; font-family: 'Roboto Mono', monospace; font-size: 8px; letter-spacing: 0.2em; color: #9d8478; margin-top: 2px;">{{ it.en }}</span>
          </span>
          <span style="color: #d8a44e; font-size: 12px;">→</span>
        </a>
      </sc-for>
    </nav>
    <div style="padding: 14px 18px 0;">
      <div style="display: flex; align-items: center; gap: 7px; font-family: 'Roboto Mono', monospace; font-weight: 500; font-size: 15px; color: #ffffff; letter-spacing: 0.02em;">
        <span style="color: #d8a44e; font-size: 12px;">✆</span>03-6822-4510
      </div>
      <div style="font-size: 10px; color: #bfaba1; margin-top: 4px;">受付 9:30〜18:30（土日祝休）</div>
      <a href="Contact.dc.html" style="display: block; margin-top: 11px; text-align: center; background: #c98f33; color: #ffffff; font-size: 12px; letter-spacing: 0.1em; padding: 11px 0; border-radius: 3px; transition: background .3s;" style-hover="background: #dca249; color: #ffffff;">お問い合わせ</a>
    </div>
    <div style="margin-top: auto; display: flex; gap: 10px; padding: 12px 18px 0;">
      <span style="width: 22px; height: 22px; border-radius: 50%; background: #5b4239; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #d8c6bc; font-family: 'Roboto Mono', monospace;">X</span>
      <span style="width: 22px; height: 22px; border-radius: 50%; background: #5b4239; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #d8c6bc; font-family: 'Roboto Mono', monospace;">in</span>
      <span style="width: 22px; height: 22px; border-radius: 50%; background: #5b4239; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #d8c6bc; font-family: 'Roboto Mono', monospace;">n</span>
    </div>
  </div>
</aside>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;services&quot;,&quot;cases&quot;,&quot;about&quot;,&quot;insights&quot;,&quot;contact&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false };

  renderVals() {
    const active = this.props.active ?? '';
    const open = this.state.open;
    const defs = [
      ['home', 'ホーム', 'HOME', 'Home.dc.html'],
      ['services', 'サービス', 'SERVICES', 'Services.dc.html'],
      ['cases', '実績紹介', 'CASE STUDIES', 'Cases.dc.html'],
      ['about', '会社情報', 'ABOUT', 'About.dc.html'],
      ['insights', 'インサイト', 'INSIGHTS', 'Insights.dc.html'],
      ['contact', 'お問い合わせ', 'CONTACT', 'Contact.dc.html']
    ];
    return {
      items: defs.map(d => ({ key: d[0], ja: d[1], en: d[2], href: d[3], active: active === d[0] })),
      open: open ? 'true' : 'false',
      openClass: open ? 'is-open' : '',
      toggleLabel: open ? 'メニューを閉じる' : 'メニューを開く',
      bar1: open ? 'translateY(6.5px) rotate(45deg)' : 'none',
      bar2: open ? '0' : '1',
      bar3: open ? 'translateY(-6.5px) rotate(-45deg)' : 'none',
      toggle: () => this.setState(s => ({ open: !s.open }))
    };
  }
}

</script>
</body>
</html>
