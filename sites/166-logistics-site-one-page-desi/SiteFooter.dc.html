<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ cta }}" hint-placeholder-val="{{ true }}">
  <section aria-label="お問い合わせ・採用" style="background:#fff;padding:clamp(72px,8vw,120px) clamp(20px,4vw,48px)">
    <div style="max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px">
      <div data-reveal="up" style="background:#0E1E46;color:#fff;padding:clamp(36px,4vw,52px) clamp(24px,4vw,52px);display:flex;flex-direction:column;gap:22px">
        <div>
          <h2 style="margin:0;font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:clamp(20px,2vw,26px);letter-spacing:.08em">お見積り・お問い合わせ</h2>
          <p style="margin:6px 0 0;font-family:Montserrat,sans-serif;font-size:11px;letter-spacing:.16em;color:#9aa6c4">Contact Us</p>
        </div>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:20px 28px;padding-top:22px;border-top:1px solid rgba(255,255,255,.16);margin-top:auto">
          <div>
            <a href="tel:" style="font-family:Montserrat,sans-serif;font-weight:700;font-size:clamp(24px,2.6vw,30px);color:#fff">[Phone Number]</a>
            <p style="margin:4px 0 0;font-size:11px;color:#9aa6c4;letter-spacing:.06em">受付時間　[Business Hours]</p>
          </div>
          <a href="Contact.dc.html" style="display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:52px;flex:1 1 200px;background:#fff;color:#0E1E46;padding:0 28px;border-radius:999px;font-size:14px;font-weight:700;letter-spacing:.08em" style-hover="background:#FFD200">お問い合わせ<span style="font-family:Montserrat,sans-serif;font-size:11px">→</span></a>
        </div>
      </div>
      <div data-reveal="up" style="background:#FFD200;color:#0E1E46;padding:clamp(36px,4vw,52px) clamp(24px,4vw,52px);display:flex;flex-direction:column;gap:22px">
        <div>
          <h2 style="margin:0;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:clamp(20px,2vw,26px);letter-spacing:.08em">採用情報</h2>
          <p style="margin:6px 0 0;font-family:Montserrat,sans-serif;font-size:11px;font-weight:700;letter-spacing:.16em">Careers</p>
        </div>
        <p style="margin:0;font-size:13px;line-height:1.9;color:#2a3352">ともに働く仲間を募集しています。</p>
        <a href="Recruit.dc.html" style="margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:52px;background:#0E1E46;color:#fff;padding:0 28px;border-radius:999px;font-size:14px;font-weight:700;letter-spacing:.08em" style-hover="background:#1b3170">採用情報を見る<span style="font-family:Montserrat,sans-serif;font-size:11px;color:#FFD200">→</span></a>
      </div>
    </div>
  </section>
</sc-if>
<footer style="position:relative;overflow:hidden;background:#0E1E46;color:#fff;padding:clamp(56px,6vw,80px) clamp(20px,4vw,48px) 0">
  <div style="max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:40px">
    <div>
      <p style="margin:0 0 28px;font-family:Montserrat,sans-serif;font-weight:800;font-size:24px;color:#fff">[Company Name]</p>
      <nav aria-label="フッターメニュー" style="display:grid;grid-template-columns:repeat(2,max-content);gap:12px 48px;font-size:12px">
        <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="6">
          <a href="{{ n.href }}" style="color:#c9d0e2" style-hover="color:#FFD200">{{ n.ja }}</a>
        </sc-for>
      </nav>
    </div>
    <div style="font-size:12px;line-height:2;color:#c9d0e2">
      <p style="margin:0 0 8px;font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:16px;color:#fff">[Company Name]</p>
      <p style="margin:0">〒[Postal Code]　[Address]</p>
      <p style="margin:0">TEL [Phone Number]　受付 [Business Hours]</p>
    </div>
  </div>
  <div aria-hidden="true" style="text-align:center;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:clamp(18px,5.6vw,96px);line-height:1;color:#1a2d63;letter-spacing:.06em;white-space:nowrap;margin-top:clamp(48px,6vw,80px)">確かな輸送で、未来をつなぐ。</div>
  <p style="margin:0;padding:20px 0 24px;text-align:center;font-family:Montserrat,sans-serif;font-size:10px;letter-spacing:.12em;color:#7a86a8">© [Company Name] All Rights Reserved.</p>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showCta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;animate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    if (this.props.animate === false || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const ease = 'cubic-bezier(.2,.7,.2,1)';
    setTimeout(() => {
      // header drop-in
      const header = document.querySelector('header');
      if (header) {
        header.animate([{ transform: 'translateY(-100%)' }, { transform: 'none' }], { duration: 700, easing: ease });
        header.style.transition = 'transform .45s ' + ease;
      }
      // hero: slow zoom + parallax target
      this.heroImgs = [...document.querySelectorAll('[data-hero] image-slot')];
      this.heroImgs.forEach(img => {
        if (!img.parentElement.style.animation) img.animate([{ transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { duration: 2400, easing: ease });
        img.style.willChange = 'transform';
      });
      // scroll progress bar
      this.bar = document.createElement('div');
      Object.assign(this.bar.style, { position: 'fixed', left: 0, top: '64px', height: '3px', width: '100%', background: '#FFD200', transformOrigin: '0 50%', transform: 'scaleX(0)', zIndex: 51, pointerEvents: 'none' });
      document.body.appendChild(this.bar);
      // big outline words drift horizontally
      this.drift = [...document.querySelectorAll('main [aria-hidden="true"], footer [aria-hidden="true"]')]
        .filter(el => parseFloat(getComputedStyle(el).fontSize) > 40)
        .map((el, i) => ({ el, base: el.style.transform || '', dir: i % 2 ? -1 : 1 }));

      this.io = new IntersectionObserver(es => es.forEach(e => {
        if (!e.isIntersecting) return;
        const t = e.target;
        if (t.tagName === 'IMAGE-SLOT') { t.style.clipPath = 'inset(0 0 0 0)'; t.style.transform = 'scale(1)'; }
        else { t.style.opacity = '1'; t.style.transform = 'none'; }
        this.io.unobserve(t);
      }), { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

      // staggered fade/slide reveals
      document.querySelectorAll('[data-reveal]').forEach(el => {
        const r = el.getBoundingClientRect();
        const hero = el.closest('[data-hero]');
        if (r.top < innerHeight && r.bottom > 0 && !hero) return;
        const left = el.dataset.reveal === 'left';
        const sibs = [...el.parentElement.children].filter(c => c.hasAttribute('data-reveal'));
        const d = left ? .35 : Math.min(sibs.indexOf(el), 5) * .09;
        const base = el.style.transition ? el.style.transition + ',' : '';
        el.style.opacity = '0';
        el.style.transform = left ? 'translateX(-60px)' : 'translateY(32px)';
        el.style.transition = base + `opacity .9s ${ease} ${d}s, transform .9s ${ease} ${d}s`;
        this.io.observe(el);
      });
      // image wipe-in (left → right) for content photos
      document.querySelectorAll('main image-slot').forEach(img => {
        if (img.closest('[data-hero]')) return;
        const r = img.getBoundingClientRect();
        if (r.top < innerHeight && r.bottom > 0) return;
        img.style.clipPath = 'inset(0 100% 0 0)';
        img.style.transform = 'scale(1.08)';
        img.style.transition = `clip-path 1.1s ${ease} .1s, transform 1.6s ${ease} .1s`;
        this.io.observe(img);
      });

      let lastY = scrollY, ticking = false;
      const onScroll = () => {
        const y = scrollY, max = document.documentElement.scrollHeight - innerHeight;
        this.bar.style.transform = `scaleX(${max > 0 ? y / max : 0})`;
        this.heroImgs.forEach(img => { if (y < innerHeight * 1.2) img.style.transform = `translateY(${y * 0.28}px)`; });
        this.drift.forEach(({ el, base, dir }) => {
          const r = el.getBoundingClientRect();
          if (r.bottom < -200 || r.top > innerHeight + 200) return;
          el.style.transform = `${base} translateX(${dir * (r.top - innerHeight / 2) * 0.12}px)`;
        });
        if (header && !document.querySelector('nav[aria-label="モバイルメニュー"]')) {
          header.style.transform = y > 240 && y > lastY ? 'translateY(-100%)' : 'none';
          this.bar.style.top = y > 240 && y > lastY ? '0px' : '64px';
        }
        lastY = y; ticking = false;
      };
      this.onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } };
      window.addEventListener('scroll', this.onScroll, { passive: true });
      onScroll();
    }, 120);
  }
  componentWillUnmount() {
    this.io && this.io.disconnect();
    this.onScroll && window.removeEventListener('scroll', this.onScroll);
    this.bar && this.bar.remove();
  }
  renderVals() {
    return {
      cta: this.props.showCta !== false,
      navItems: [
        { href: 'Logistics%20Site.dc.html', ja: 'トップ' },
        { href: 'Company.dc.html', ja: '会社概要' },
        { href: 'Services.dc.html', ja: '事業内容' },
        { href: 'Safety.dc.html', ja: '安全への取り組み' },
        { href: 'Recruit.dc.html', ja: '採用情報' },
        { href: 'Contact.dc.html', ja: 'お問い合わせ' }
      ]
    };
  }
}
</script>
</body>
</html>
