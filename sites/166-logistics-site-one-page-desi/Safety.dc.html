<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<link href="site.css" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:#fff;color:#1b2233;font-family:'Zen Kaku Gothic New',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0E1E46;text-decoration:none}
a:hover{color:#0E1E46;opacity:.8}
*{box-sizing:border-box}
</style>
</helmet>
<dc-import name="SiteHeader" current="safety" hint-size="100%,64px"></dc-import>
<main>
<dc-import name="PageHero" ja="安全への取り組み" en="SAFETY &amp; QUALITY" slot="safety-hero" img="uploads/daily-check-wide.jpg" photo="写真：始業点検・運行前点呼" hint-size="100%,420px"></dc-import>

<section aria-labelledby="in" style="text-align:center;padding:clamp(64px,8vw,110px) clamp(20px,4vw,48px)">
  <h2 id="in" data-reveal="up" style="margin:0;font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:clamp(24px,3vw,40px);line-height:1.5;letter-spacing:.06em;color:#0E1E46;text-wrap:balance">安全を、すべての輸送の基本に。</h2>
  <p data-reveal="up" style="margin:10px 0 28px;font-family:Montserrat,sans-serif;font-size:12px;letter-spacing:.12em;color:#7a8299">Safety Is the Foundation of Everything We Deliver.</p>
  <p data-reveal="up" style="margin:0 auto;max-width:640px;font-size:15px;line-height:2.1;color:#4a5268;text-wrap:pretty">人・車両・運行の三つを日々見直し、仕組みとして安全を積み重ねています。</p>
</section>

<sc-for list="{{ pillars }}" as="p" hint-placeholder-count="4">
  <section aria-label="{{ p.name }}" style="background:{{ p.bg }};padding:clamp(56px,7vw,100px) clamp(20px,4vw,48px)">
    <div style="max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;flex-direction:{{ p.dir }};gap:clamp(28px,5vw,72px);align-items:center">
      <div data-reveal="up" style="flex:1 1 420px;position:relative;aspect-ratio:16/11;max-width:100%">
        <image-slot id="{{ p.slot }}" src="{{ p.img }}" shape="rect" placeholder="{{ p.photo }}" style="position:absolute;inset:0;width:100%;height:100%"></image-slot>
      </div>
      <div style="flex:1 1 360px">
        <div data-reveal="up" style="display:inline-flex;align-items:center;gap:14px;background:#0E1E46;color:#fff;padding:10px 20px 10px 16px;margin-bottom:24px">
          <span style="font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;color:#FFD200">{{ p.no }}</span>
          <span style="font-family:Montserrat,sans-serif;font-size:11px;font-weight:700;letter-spacing:.16em">{{ p.en }}</span>
        </div>
        <h2 data-reveal="up" style="margin:0 0 20px;font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:clamp(22px,2.4vw,30px);letter-spacing:.08em;color:#0E1E46">{{ p.name }}</h2>
        <p data-reveal="up" style="margin:0 0 24px;font-size:14px;line-height:2;color:#3b4358;text-wrap:pretty">{{ p.desc }}</p>
        <ul data-reveal="up" style="list-style:none;margin:0;padding:0;display:grid;gap:8px">
          <sc-for list="{{ p.items }}" as="it" hint-placeholder-count="3">
            <li style="display:flex;gap:12px;align-items:center;padding:14px 18px;background:#fff;border:1px solid #e3e6ec;font-size:14px;color:#1b2233"><span style="flex:none;width:6px;height:18px;background:#FFD200"></span>{{ it }}</li>
          </sc-for>
        </ul>
      </div>
    </div>
  </section>
</sc-for>

<section aria-labelledby="ce" style="position:relative;overflow:hidden;padding:clamp(80px,9vw,130px) 0 0;background:#fff">
  <div style="position:absolute;left:0;right:0;bottom:0;height:55%;background:#FFD200"></div>
  <div style="position:relative;max-width:1000px;margin:0 auto;padding:0 clamp(20px,4vw,48px)">
    <div style="text-align:center;margin-bottom:44px">
      <h2 id="ce" data-reveal="up" style="margin:0;font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:clamp(24px,2.6vw,34px);letter-spacing:.08em;color:#0E1E46">取得認証・認定</h2>
      <p data-reveal="up" style="margin:8px 0 0;font-family:Montserrat,sans-serif;font-size:12px;letter-spacing:.14em;color:#7a8299">Certifications</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px">
      <sc-for list="{{ certs }}" as="c" hint-placeholder-count="3">
        <article data-reveal="up" style="background:#fff;box-shadow:0 20px 40px -28px rgba(14,30,70,.45)">
          <h3 style="margin:0;background:#0E1E46;color:#fff;text-align:center;padding:14px;font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:15px;letter-spacing:.06em">{{ c.t }}</h3>
          <div style="padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px">
            <image-slot id="{{ c.slot }}" shape="rect" fit="contain" placeholder="認証マーク" style="width:96px;height:96px"></image-slot>
            <p style="margin:0;font-size:12px;line-height:1.8;color:#4a5268;text-align:center">{{ c.d }}</p>
          </div>
        </article>
      </sc-for>
    </div>
  </div>
  <div aria-hidden="true" style="position:relative;text-align:center;font-family:Montserrat,sans-serif;font-weight:800;font-size:clamp(44px,9vw,140px);line-height:.8;color:rgba(255,255,255,.55);white-space:nowrap;margin-top:clamp(40px,5vw,64px);transform:translateY(.12em)">SAFETY FIRST</div>
</section>
</main>
<dc-import name="SiteFooter" hint-size="100%,600px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ph = ['[具体的な取り組み 1]', '[具体的な取り組み 2]', '[具体的な取り組み 3]'];
    const p = [
      ['safety-training', '安全管理・教育', 'SAFETY TRAINING', '写真：ドライバー研修・点呼', '点呼や定期的な安全教育を通じて、ドライバー一人ひとりの安全意識を高めています。', 'roll-call'],
      ['safety-vehicle', '車両整備', 'VEHICLE MAINTENANCE', '写真：車両点検・整備作業', '日常点検と定期整備により、車両を常に良好な状態に保っています。', 'vehicle-inspection'],
      ['safety-operation', '運行管理', 'OPERATION CONTROL', '写真：配車・運行管理の様子', '運行状況を把握し、無理のない計画で確実な輸送につなげています。', 'fleet-guide'],
      ['safety-env', '環境への配慮', 'ENVIRONMENT', '写真：車両・エコドライブ関連', 'エコドライブや効率的な配車により、環境負荷の低減に努めています。', 'warehouse-exterior']
    ];
    return {
      pillars: p.map(([slot, name, en, photo, desc, img], i) => ({
        slot, name, en, photo, desc, img: 'uploads/' + img + '.jpg', items: ph, no: String(i + 1).padStart(2, '0'),
        dir: i % 2 ? 'row-reverse' : 'row', bg: i % 2 ? '#f5f6f8' : '#fff'
      })),
      certs: [
        { slot: 'cert-1', t: '[認証・認定名]', d: '[取得している認証のみ掲載してください]' },
        { slot: 'cert-2', t: '[認証・認定名]', d: '[取得している認証のみ掲載してください]' },
        { slot: 'cert-3', t: '[認証・認定名]', d: '[取得している認証のみ掲載してください]' }
      ]
    };
  }
}
</script>
</body>
</html>
