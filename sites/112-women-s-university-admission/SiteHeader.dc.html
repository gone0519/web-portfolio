<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:relative;background:rgba(255,253,246,.96);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px clamp(16px,3vw,40px);min-height:84px;font-family:'Zen Maru Gothic',sans-serif;color:#5b4a33">
  <a href="Top.dc.html" aria-label="山百合女子大学 トップへ" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#5b4a33">
    <div style="display:flex;flex-direction:column;gap:2px">
      <span style="font-size:10px;letter-spacing:.12em">学校法人 山百合学園</span>
      <span style="font-size:22px;font-weight:700;letter-spacing:.14em;line-height:1.2">山百合女子大学</span>
      <span style="font-family:Quicksand,sans-serif;font-size:9px;letter-spacing:.32em;color:#c9761f">YAMAYURI WOMEN'S UNIVERSITY</span>
    </div>
    <div style="position:relative;width:34px;height:30px;flex:none">
      <span style="position:absolute;left:0;top:8px;width:20px;height:20px;border-radius:50%;background:#f6d54a"></span>
      <span style="position:absolute;left:13px;top:6px;width:20px;height:20px;border-radius:50%;background:#e89a3c"></span>
      <span style="position:absolute;left:18px;top:0;width:10px;height:7px;border-radius:0 8px 0 8px;background:#9cc46a"></span>
    </div>
  </a>
  <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
    <nav aria-label="メインナビゲーション" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;font-size:13px;font-weight:500">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
        <a href="{{ n.href }}" aria-current="{{ n.aria }}" style="position:relative;padding:6px 12px;border-radius:999px;text-decoration:none;color:#5b4a33;background:{{ n.bg }}" style-hover="background:#f6d54a">{{ n.label }}<sc-if value="{{ n.on }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:50%;bottom:-8px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#e89a3c"></span></sc-if></a>
      </sc-for>
    </nav>
  </sc-if>
  <div style="display:flex;align-items:center;gap:10px">
    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" aria-label="メニュー" style="width:44px;height:44px;border-radius:50%;border:1.5px solid #f3df86;background:#fff;box-shadow:3px 3px 0 #fcec9b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer">
        <span style="width:16px;height:2px;background:#5b4a33;border-radius:2px"></span>
        <span style="width:16px;height:2px;background:#5b4a33;border-radius:2px"></span>
        <span style="width:16px;height:2px;background:#5b4a33;border-radius:2px"></span>
      </button>
    </sc-if>
    <a href="OpenCampus.dc.html#reserve" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:150px;height:84px;margin:-12px calc(-1 * clamp(16px,3vw,40px)) -12px 0;padding:0 16px 0 26px;background:#fcec9b;border-bottom-left-radius:64px;text-decoration:none;color:#5b4a33" style-hover="background:#f6d54a">
      <span style="font-size:14px;font-weight:700;letter-spacing:.14em">入試情報</span>
      <span style="font-family:Quicksand,sans-serif;font-size:9px;letter-spacing:.2em;color:#a8611a">Admissions</span>
      <span style="font-size:10px;background:#fff;border-radius:999px;padding:3px 9px;border:1px solid #f3df86;white-space:nowrap">{{ cta }}</span>
    </a>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav aria-label="モバイルナビゲーション" style="position:absolute;top:100%;left:12px;right:12px;background:#fff;border-radius:24px;box-shadow:6px 6px 0 #fcec9b;border:1.5px solid #f3df86;padding:12px;display:flex;flex-direction:column;gap:4px;font-weight:500">
      <a href="Top.dc.html" style="padding:14px 16px;border-radius:14px;text-decoration:none;color:#5b4a33">トップ</a>
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
        <a href="{{ n.href }}" aria-current="{{ n.aria }}" style="padding:14px 16px;border-radius:14px;text-decoration:none;color:#5b4a33;background:{{ n.bg }}">{{ n.label }}</a>
      </sc-for>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;100px&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;about&quot;,&quot;academics&quot;,&quot;campus&quot;,&quot;admissions&quot;,&quot;oc&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;headerCta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;OC予約はこちら&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { narrow: false, menu: false };
  componentDidMount() {
    this.onR = () => this.setState({ narrow: window.innerWidth < 1040 });
    this.onR();
    window.addEventListener('resize', this.onR);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  renderVals() {
    const cur = this.props.current ?? 'top';
    const items = [
      ['about', '大学について', 'About.dc.html', '#f4eedd'],
      ['academics', '学部・学科', 'Academics.dc.html', '#fcec9b'],
      ['campus', 'キャンパスライフ', 'CampusLife.dc.html', '#d3e5f2'],
      ['admissions', '入試情報', 'Admissions.dc.html', '#dbe9bf'],
      ['oc', 'オープンキャンパス', 'OpenCampus.dc.html', '#fde2c6'],
    ];
    const { narrow, menu } = this.state;
    return {
      narrow, wide: !narrow, menuOpen: narrow && menu,
      toggleMenu: () => this.setState(s => ({ menu: !s.menu })),
      cta: this.props.headerCta ?? 'OC予約はこちら',
      nav: items.map(([k, label, href, bg]) => ({ label, href, bg, on: k === cur, aria: k === cur ? 'page' : undefined })),
    };
  }
}
</script>
</body>
</html>
