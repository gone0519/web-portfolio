<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div id="contact" style="background:#1450dc;color:#fff">
  <div style="max-width:1920px;margin:0 auto;padding:40px clamp(16px,2.4vw,46px) 0">
    <sc-if value="{{ showContact }}" hint-placeholder-val="{{ true }}">
      <div data-reveal="scale" style="background:#0a36d0;border-radius:6px;padding:clamp(48px,5vw,90px) clamp(24px,5.8vw,110px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:48px">
        <div style="flex:1 1 460px;min-width:0">
          <div style="display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:#cfd9ff"><span style="width:13px;height:9px;background:#cfd9ff;border-radius:50% 50% 50% 50% / 100% 0 100% 0;transform:rotate(-30deg)"></span>お問い合わせ</div>
          <div data-reveal="mask" style="margin-top:8px;font-family:'Hanken Grotesk',sans-serif;font-size:clamp(52px,5.2vw,100px);font-weight:600;line-height:1.05">Contact</div>
          <p class="rs-phrase" data-reveal="up" style="margin:28px 0 0;font-size:16px;font-weight:500;line-height:2;color:#e6ebff;text-wrap:pretty">あなたの「学びたい」を、ここから始めよう。<br>入試・出願・学生生活について、入試課のスタッフが丁寧にお答えします。</p>
        </div>
        <div data-stagger style="flex:0 1 360px;display:flex;flex-direction:column;gap:12px;min-width:260px">
          <sc-for list="{{ ctas }}" as="c" hint-placeholder-count="3">
            <a href="{{ c.href }}" style="display:flex;align-items:center;height:70px;background:#fff;color:#232427;font-size:16px;font-weight:700;text-decoration:none;transition:background .2s" style-hover="background:#e5ecfb;color:#232427">
              <span style="flex:1;padding:0 24px">{{ c.label }}</span><span style="width:1px;height:32px;background:#d9dce2"></span><span style="width:64px;text-align:center;color:#0b3fd9;font-size:18px">→</span>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-if>
    <footer style="padding:70px 0 40px">
      <div data-reveal="up" style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:48px">
        <div style="display:flex;flex-direction:column;gap:20px">
          <div style="display:flex;align-items:center;gap:14px">
            <span style="width:36px;height:36px;background:#fff;clip-path:polygon(50% 0,100% 100%,62% 100%,50% 72%,38% 100%,0 100%)"></span>
            <span style="display:flex;flex-direction:column;line-height:1.1"><span style="font-size:28px;font-weight:700;letter-spacing:.06em">蒼稜大学</span><span style="font-family:'Hanken Grotesk',sans-serif;font-size:12px;font-weight:600;letter-spacing:.16em">SORYO UNIVERSITY</span></span>
          </div>
          <div style="font-size:15px;font-weight:500;line-height:1.9">入試課（アドミッションセンター）<br>〒000-0000 ◯◯県◯◯市◯◯町0-0-0<br>TEL 00-0000-0000（平日 9:00〜17:00）</div>
        </div>
        <div style="display:flex;gap:clamp(40px,8vw,140px);flex-wrap:wrap">
          <div data-stagger style="display:flex;flex-direction:column;gap:18px">
            <sc-for list="{{ footA }}" as="l" hint-placeholder-count="5"><a href="{{ l.href }}" style="color:#fff;font-size:17px;font-weight:700;text-decoration:none" style-hover="color:#cfd9ff">{{ l.label }}</a></sc-for>
          </div>
          <div data-stagger style="display:flex;flex-direction:column;gap:18px">
            <sc-for list="{{ footB }}" as="l" hint-placeholder-count="5"><a href="{{ l.href }}" style="color:#fff;font-size:17px;font-weight:700;text-decoration:none" style-hover="color:#cfd9ff">{{ l.label }}</a></sc-for>
          </div>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:60px"><a href="#top" style="color:#fff;font-family:'Hanken Grotesk',sans-serif;font-size:17px;font-weight:600;text-decoration:none" style-hover="color:#cfd9ff">Page Top ↑</a></div>
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;margin-top:24px;padding-top:40px;border-top:1px solid rgba(255,255,255,.35)">
        <div style="display:flex;gap:28px;font-family:'Hanken Grotesk',sans-serif;font-size:15px;font-weight:600"><span>Instagram</span><span>YouTube</span><span>X</span></div>
        <div class="rs-foot-legal" style="display:flex;flex-direction:column;align-items:flex-end;gap:14px">
          <div style="display:flex;flex-wrap:wrap;gap:28px;font-size:15px;font-weight:700"><span>サイトポリシー</span><span>プライバシーポリシー</span><span>アクセス</span></div>
          <div style="font-size:13px;color:#cfd9ff">© SORYO UNIVERSITY（サンプル）</div>
        </div>
      </div>
    </footer>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;showContact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      showContact: this.props.showContact ?? true,
      ctas: [
        { label: '資料請求', href: 'Contact.dc.html#form' },
        { label: 'オープンキャンパス予約', href: 'Campus Life.dc.html#opencampus' },
        { label: '入試に関するお問い合わせ', href: 'Contact.dc.html#form' },
      ],
      footA: [
        { label: 'トップ', href: 'University Admissions.dc.html' }, { label: '学部・学科', href: 'Programs.dc.html' },
        { label: '入試対策', href: 'Preparation.dc.html' }, { label: '入試情報', href: 'Admissions Info.dc.html' },
        { label: 'キャンパスライフ', href: 'Campus Life.dc.html' },
      ],
      footB: [
        { label: '入試日程', href: 'Admissions Info.dc.html#schedule' }, { label: '学費・奨学金', href: 'Admissions Info.dc.html#tuition' },
        { label: 'よくある質問', href: 'Admissions Info.dc.html#faq' }, { label: 'オープンキャンパス', href: 'Campus Life.dc.html#opencampus' },
        { label: 'お問い合わせ', href: 'Contact.dc.html' },
      ],
    };
  }
}
</script>
</body>
</html>
