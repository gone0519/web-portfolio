<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="background:#f3eada;padding:clamp(40px,6vw,72px) 24px clamp(56px,7vw,88px);position:relative;overflow:hidden">
  <div style="position:absolute;right:-60px;top:-60px;width:220px;height:220px;background-image:radial-gradient(#3e9a3c 2px,transparent 2.5px);background-size:16px 16px;opacity:.25;pointer-events:none"></div>
  <div style="max-width:1140px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(32px,5vw,64px);align-items:center">
    <div>
      <p style="font-size:12px;color:#666;margin-bottom:28px;display:flex;gap:8px;align-items:center"><a href="Top.dc.html" style="color:#666;text-decoration:none">TOP</a><span>／</span><span style="color:#1f1f1f;font-weight:700">{{ ja }}</span></p>
      <p style="display:flex;align-items:center;gap:10px;font-family:Montserrat,sans-serif;font-size:12px;font-weight:800;color:#3e9a3c;letter-spacing:.24em;margin-bottom:8px"><span style="width:32px;height:2px;background:#3e9a3c"></span>{{ num }}</p>
      <div class="wm" style="font-family:Montserrat,sans-serif;font-weight:900;font-size:clamp(52px,8vw,104px);line-height:.9;color:#e6dac4;letter-spacing:-.02em">{{ en }}</div>
      <h1 style="font-family:'Zen Kaku Gothic New',sans-serif;font-size:clamp(26px,3.4vw,38px);font-weight:900;margin:-20px 0 22px 4px;position:relative;line-height:1.3">{{ ja }}</h1>
      <p style="font-size:14px;line-height:2;color:#4a4a4a;max-width:520px;text-wrap:pretty">{{ lead }}</p>
    </div>
    <div style="display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:1fr 1fr;gap:12px;aspect-ratio:5/4">
      <div style="grid-row:1/3;position:relative;border-radius:999px 999px 24px 24px;overflow:hidden"><image-slot id="ph-{{ slot }}-1" shape="rect" src="{{ img1Src }}" placeholder="{{ img1 }}"></image-slot></div>
      <div style="position:relative;border-radius:24px 80px 24px 24px;overflow:hidden"><image-slot id="ph-{{ slot }}-2" shape="rect" src="{{ img2Src }}" placeholder="{{ img2 }}"></image-slot></div>
      <div style="position:relative;border-radius:24px;overflow:hidden;background:#3e9a3c;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff">
        <span class="ph-badge-en" style="font-family:Montserrat,sans-serif;font-weight:900;font-size:clamp(22px,2.6vw,30px);line-height:1">{{ badgeEn }}</span>
        <span class="phrase" style="font-size:12px;font-weight:700;margin-top:6px">{{ badgeJa }}</span>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;560px&quot;},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;PROGRAMS&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ja&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;学部・学科紹介&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;num&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;PAGE 01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slot&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;page&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;写真&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;写真&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img1Src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img2Src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;badgeEn&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;8 FACULTIES&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;badgeJa&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
