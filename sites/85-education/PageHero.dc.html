<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Page Hero" style="position:relative;height:clamp(420px,62vh,600px);overflow:hidden;background:#f8d3df">
  <div style="position:absolute;inset:0"><image-slot id="{{ img }}" shape="rect" placeholder="{{ ph }}"></image-slot></div>
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(120,50,75,.35) 0%,rgba(120,50,75,.05) 35%,rgba(130,55,85,.55) 100%);pointer-events:none"></div>
  <div style="position:absolute;left:-18vw;bottom:-50vw;width:70vw;height:70vw;border-radius:50%;border:clamp(40px,7vw,110px) solid #f8d3df;border-left-color:transparent;border-bottom-color:transparent;transform:rotate(-20deg);pointer-events:none"></div>
  <div style="position:absolute;left:0;right:0;bottom:clamp(40px,7vh,72px);padding:0 clamp(16px,4vw,40px);pointer-events:none">
    <div style="max-width:1120px;margin:0 auto;color:#fff;text-shadow:0 2px 14px rgba(90,30,50,.45)">
      <p style="display:flex;gap:8px;font-size:12px;pointer-events:auto"><a href="Hakuran%20Nursing.dc.html" style="color:#fff">トップ</a><span>/</span><span>{{ ja }}</span></p>
      <h1 style="font-family:Montserrat,sans-serif;font-weight:300;font-size:clamp(44px,6vw,80px);line-height:1.05;margin-top:14px">{{ en }}</h1>
      <p style="font-size:15px;font-weight:700;letter-spacing:.1em;margin-top:8px">✦ {{ ja }}</p>
      <p style="font-family:'Zen Old Mincho',serif;font-size:clamp(17px,1.8vw,22px);letter-spacing:.06em;line-height:1.7;margin-top:20px;max-width:560px;text-wrap:pretty">{{ lead }}</p>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;About&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ja&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;大学案内&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;hero-sub&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ph&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ページメイン写真&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
