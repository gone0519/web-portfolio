<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:relative;z-index:50;background:#fffaf3;height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3vw,56px);gap:24px;border-bottom:4px solid #f15a24;font-family:'M PLUS Rounded 1c',sans-serif">
  <a href="Top.dc.html" style="display:flex;align-items:center;gap:12px;color:#3b3530;text-decoration:none">
    <svg width="48" height="48" viewBox="0 0 100 100"><polygon points="50,4 62,38 98,38 69,59 80,94 50,73 20,94 31,59 2,38 38,38" fill="#f15a24"></polygon></svg>
    <span style="display:flex;flex-direction:column;line-height:1.3">
      <span style="font-size:20px;font-weight:800;letter-spacing:.12em">蒼陵大学 入試ガイド</span>
      <span style="font-family:Quicksand,sans-serif;font-size:13px;font-weight:700;color:#f15a24;letter-spacing:.08em">Admissions Guide</span>
    </span>
  </a>
  <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
    <nav style="display:flex;align-items:center;gap:clamp(16px,2.2vw,40px)">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
        <a href="{{ l.href }}" style="position:relative;color:#3b3530;font-size:16px;font-weight:700;text-decoration:none;padding:6px 0" style-hover="color:#f15a24">{{ l.label }}<sc-if value="{{ l.active }}"><span style="position:absolute;left:0;right:0;bottom:-4px;height:4px;border-radius:4px;background:#f15a24"></span></sc-if></a>
      </sc-for>
      <a ref="{{ ctaRef }}" href="Contact.dc.html" style="display:flex;align-items:center;gap:10px;height:50px;padding:0 28px;border-radius:999px;background:#f15a24;color:#fff;font-size:16px;font-weight:800;box-shadow:0 4px 0 #cf4517;text-decoration:none">★ 資料請求</a>
    </nav>
  </sc-if>
  <sc-if value="{{ narrow }}">
    <button onClick="{{ toggleMenu }}" aria-label="メニュー" style="width:48px;height:48px;border-radius:50%;background:#f15a24;border:0;color:#fff;font-size:22px;cursor:pointer">{{ menuIcon }}</button>
  </sc-if>
  <sc-if value="{{ menuOpen }}">
    <nav style="position:absolute;top:80px;left:0;right:0;background:#fffaf3;display:flex;flex-direction:column;padding:8px 24px 28px;box-shadow:0 12px 24px rgba(0,0,0,.12)">
      <a href="Top.dc.html" style="color:#3b3530;font-weight:700;padding:16px 0;border-bottom:2px dotted #f3c9b4;text-decoration:none">トップ</a>
      <sc-for list="{{ links }}" as="l">
        <a href="{{ l.href }}" style="color:#3b3530;font-weight:700;padding:16px 0;border-bottom:2px dotted #f3c9b4;text-decoration:none">{{ l.label }}</a>
      </sc-for>
      <a href="Contact.dc.html" style="margin-top:20px;height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:#f15a24;color:#fff;font-weight:800;text-decoration:none">★ 資料請求</a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;80px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;faculty&quot;,&quot;prepare&quot;,&quot;admissions&quot;,&quot;campus&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { narrow: false, menuOpen: false };
  ctaRef = React.createRef();
  componentDidMount() {
    this.onResize = () => this.setState({ narrow: window.innerWidth < 1100 });
    this.onResize();
    window.addEventListener('resize', this.onResize);
    this._t = setTimeout(() => { const el = this.ctaRef.current; if (el && el.animate && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.07)' }], { duration: 800, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' }); }, 100);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); clearTimeout(this._t); }
  renderVals() {
    const a = this.props.active ?? '';
    const links = [['faculty', '学部紹介', 'Faculty.dc.html'], ['prepare', '受験対策', 'Prepare.dc.html'], ['admissions', '入試情報', 'Admissions.dc.html'], ['campus', 'キャンパスライフ', 'Campus.dc.html'], ['contact', 'お問い合わせ', 'Contact.dc.html']]
      .map(([k, label, href]) => ({ label, href, active: a === k }));
    return {
      links, ctaRef: this.ctaRef,
      narrow: this.state.narrow, wide: !this.state.narrow,
      menuOpen: this.state.narrow && this.state.menuOpen,
      menuIcon: this.state.menuOpen ? '×' : '≡',
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen }))
    };
  }
}
</script>
</body>
</html>
