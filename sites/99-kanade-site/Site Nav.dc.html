<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
<aside aria-label="サイトナビゲーション" style="position:fixed;top:0;left:0;bottom:0;width:176px;background:#FCF8F3;border-right:1px solid #EFE4D8;display:flex;flex-direction:column;z-index:20;font-family:'Zen Kaku Gothic New',sans-serif">
  <a href="Kanade%20Womens%20University.dc.html" style="display:block;padding:28px 22px 0;color:#2E2A27">
    <div style="font-size:15px;font-weight:700;letter-spacing:.12em;line-height:1.5">奏女子大学</div>
    <div style="font-size:13px;font-weight:500;letter-spacing:.3em;color:#E2502F;line-height:1.6">入試サイト</div>
    <div style="font-family:Jost,sans-serif;font-size:11px;letter-spacing:.18em;margin-top:2px">KANADE <span style="color:#E2502F">W.U.</span></div>
  </a>
  <nav style="padding:44px 22px 0;display:flex;flex-direction:column;gap:14px">
    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
      <a href="{{ n.href }}" aria-current="{{ n.current }}" style="font-size:11px;letter-spacing:.06em;color:{{ n.color }};font-weight:{{ n.weight }};line-height:1.5;display:flex;gap:6px" style-hover="color:#D9482A">{{ n.label }}</a>
    </sc-for>
    <a href="#" style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#2E2A27;margin-top:6px;letter-spacing:.04em" style-hover="color:#D9482A">Instagram ↗</a>
  </nav>
  <div style="flex:1"></div>
  <a href="Kanade%20Admissions.dc.html#oc" style="display:flex;align-items:center;justify-content:space-between;gap:8px;background:#E2502F;color:#fff;padding:20px 18px;font-size:12px;font-weight:700;line-height:1.5;letter-spacing:.06em;margin-bottom:24px" style-hover="background:#C9401F;color:#fff">
    <span>オープンキャンパス<br>予約はこちら</span><span aria-hidden="true">→</span>
  </a>
</aside>
</sc-if>
<sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
<header style="position:fixed;top:0;left:0;right:0;height:60px;background:rgba(252,248,243,.96);border-bottom:1px solid #EFE4D8;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:30;font-family:'Zen Kaku Gothic New',sans-serif">
  <a href="Kanade%20Womens%20University.dc.html" style="color:#2E2A27;display:flex;align-items:baseline;gap:8px">
    <span style="font-size:15px;font-weight:700;letter-spacing:.1em">奏女子大学</span>
    <span style="font-size:11px;color:#E2502F;letter-spacing:.2em;font-weight:500">入試サイト</span>
  </a>
  <div style="display:flex;gap:8px;align-items:center">
    <a href="Kanade%20Admissions.dc.html#oc" style="background:#E2502F;color:#fff;font-size:11px;font-weight:700;padding:0 12px;height:44px;display:flex;align-items:center;border-radius:4px">OC予約</a>
    <button onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" aria-label="メニュー" style="width:44px;height:44px;border:1px solid #2E2A27;background:transparent;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#2E2A27;cursor:pointer">{{ menuLabel }}</button>
  </div>
</header>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<nav style="position:fixed;top:60px;left:0;right:0;bottom:0;background:#FCF8F3;z-index:29;padding:16px 20px;display:flex;flex-direction:column;overflow-y:auto;font-family:'Zen Kaku Gothic New',sans-serif">
  <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
    <a href="{{ n.href }}" aria-current="{{ n.current }}" style="font-size:16px;letter-spacing:.08em;color:{{ n.color }};padding:16px 0;border-bottom:1px solid #EFE4D8;display:flex;justify-content:space-between"><span>{{ n.label }}</span><span style="color:#E2502F">→</span></a>
  </sc-for>
</nav>
</sc-if>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;about&quot;,&quot;academics&quot;,&quot;campus&quot;,&quot;voices&quot;,&quot;admissions&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { wide: true, menuOpen: false };
  componentDidMount() {
    this.onResize = () => this.setState({ wide: window.innerWidth >= 900 });
    this.onResize();
    window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  renderVals() {
    const cur = this.props.current ?? 'top';
    const pages = [
      ['top', 'トップ', 'Kanade Womens University'],
      ['about', '大学について', 'Kanade About'],
      ['academics', '学部・学科', 'Kanade Academics'],
      ['campus', 'キャンパスライフ', 'Kanade Campus Life'],
      ['voices', '在学生の声', 'Kanade Voices'],
      ['admissions', '入試・オープンキャンパス', 'Kanade Admissions']
    ];
    return {
      wide: this.state.wide,
      narrow: !this.state.wide,
      menuOpen: this.state.menuOpen,
      menuLabel: this.state.menuOpen ? 'CLOSE' : 'MENU',
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      nav: pages.map(([id, label, file]) => ({
        label, href: file.replace(/ /g, '%20') + '.dc.html',
        current: id === cur ? 'page' : undefined,
        color: id === cur ? '#D9482A' : '#2E2A27',
        weight: id === cur ? 700 : 400
      }))
    };
  }
}
</script>
</body>
</html>
