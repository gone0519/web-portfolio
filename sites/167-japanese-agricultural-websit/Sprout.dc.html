<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span aria-hidden="true" ref="{{ root }}" style="position:relative;display:inline-block;width:18px;height:16px;flex-shrink:0;transform-origin:50% 100%">
  <span style="position:absolute;left:8.5px;bottom:0;width:1px;height:10px;background:{{ color }}"></span>
  <span style="position:absolute;left:1px;top:3px;width:8px;height:5px;border-radius:0 100% 0 100%;background:{{ color }};rotate:-14deg"></span>
  <span style="position:absolute;right:1px;top:1px;width:8px;height:5px;border-radius:100% 0 100% 0;background:{{ color }};rotate:14deg"></span>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;40px&quot;,&quot;height&quot;:&quot;40px&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#8a1414&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  root = React.createRef();
  componentDidMount() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || !this.root.current) return;
    this.root.current.animate([{ rotate: '-7deg' }, { rotate: '7deg' }], { duration: 2800, delay: -Math.random() * 2800, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });
  }
  renderVals() { return { root: this.root, color: this.props.color ?? '#8a1414' }; }
}
</script>
</body>
</html>
