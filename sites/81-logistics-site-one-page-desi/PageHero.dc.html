<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-hero="1" aria-label="{{ ja }}" style="position:relative;height:clamp(320px,46vh,460px);overflow:hidden;background:#0E1E46">
  <div style="position:absolute;inset:0">
    <image-slot id="{{ slot }}" src="{{ img }}" shape="rect" placeholder="{{ photo }}" style="width:100%;height:100%"></image-slot>
  </div>
  <div style="position:absolute;left:0;bottom:clamp(40px,7vh,64px);pointer-events:none;max-width:100%">
    <div data-reveal="left" style="background:#FFD200;clip-path:polygon(0 0,100% 0,calc(100% - 30px) 100%,0 100%);padding:clamp(16px,2vw,24px) clamp(56px,7vw,96px) clamp(16px,2vw,24px) clamp(20px,5vw,72px)">
      <p style="margin:0 0 8px;font-family:Montserrat,sans-serif;font-size:11px;font-weight:700;letter-spacing:.24em;color:#0E1E46">{{ en }}</p>
      <h1 style="margin:0;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:clamp(28px,4vw,52px);line-height:1.25;letter-spacing:.06em;color:#0E1E46">{{ ja }}</h1>
    </div>
  </div>
</section>
<nav aria-label="パンくずリスト" style="max-width:1180px;margin:0 auto;padding:18px clamp(20px,4vw,48px);display:flex;gap:10px;font-size:12px;color:#7a8299">
  <a href="Logistics%20Site.dc.html" style="color:#7a8299">トップ</a><span aria-hidden="true">/</span><span style="color:#0E1E46">{{ ja }}</span>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;ja&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;会社概要&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;COMPANY&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slot&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;page-hero&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;photo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ページヘッダー写真&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
