<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ curtainRef }}" aria-hidden="true" style="position:fixed;inset:0;z-index:100;background:#111;pointer-events:none;transform:scaleY(1);transform-origin:50% 0;transition:transform .75s cubic-bezier(.7,0,.2,1);display:flex;align-items:center;justify-content:center"><span style="width:120px;height:2px;background:linear-gradient(90deg,#d9622b,#f0a04b)"></span></div>
<div ref="{{ barRef }}" aria-hidden="true" style="position:fixed;top:0;left:0;right:0;height:3px;z-index:60;transform:scaleX(0);transform-origin:0 50%;background:linear-gradient(90deg,#d9622b,#f0a04b)"></div>
<header style="position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:14px clamp(16px,3vw,40px);background:{{ headerBg }};transition:background .4s ease">
  <a href="Personal%20Training%20Gym.dc.html" style="display:flex;align-items:center;gap:10px;color:#fff">
    <span style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#d9622b,#f0a04b);display:flex;align-items:center;justify-content:center;font-family:Oswald,'Noto Sans JP';font-weight:700;font-size:18px;color:#fff">A</span>
    <span style="display:flex;flex-direction:column;line-height:1"><span style="font-family:Oswald,'Noto Sans JP';font-weight:600;font-size:22px;letter-spacing:.12em;color:#fff">AXIS</span><span style="font-size:9px;letter-spacing:.3em;color:#bbb;margin-top:3px">PERSONAL TRAINING</span></span>
  </a>
  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
    <nav style="display:flex;align-items:center;gap:28px">
      <sc-for list="{{ pages }}" as="n" hint-placeholder-count="5">
        <a href="{{ n.href }}" style="color:{{ n.color }};font-size:12px;letter-spacing:.08em;padding:6px 0;border-bottom:1px solid {{ n.line }}" style-hover="color:#f0a04b">{{ n.label }}</a>
      </sc-for>
      <a href="Contact.dc.html" style="color:#fff;font-size:12px;font-weight:700;letter-spacing:.08em;padding:10px 18px;background:linear-gradient(90deg,#d9622b,#f0a04b);display:flex;gap:10px;transition:filter .3s" style-hover="filter:brightness(1.1);color:#fff">無料体験 <span>›</span></a>
    </nav>
  </sc-if>
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ toggleMenu }}" aria-label="メニュー" style="width:44px;height:44px;border:1px solid rgba(255,255,255,.4);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer">
      <span style="width:18px;height:1.5px;background:#fff"></span><span style="width:18px;height:1.5px;background:#fff"></span><span style="width:12px;height:1.5px;background:#f0a04b"></span>
    </button>
  </sc-if>
</header>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:49;background:rgba(14,14,14,.97);display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 32px">
    <a href="Personal%20Training%20Gym.dc.html" style="display:flex;align-items:baseline;gap:14px;padding:14px 0;border-bottom:1px solid #2a2a2a;color:#fff"><span style="font-family:Oswald,'Noto Sans JP';font-size:26px;letter-spacing:.08em">TOP</span><span style="font-size:12px;color:#999">トップ</span></a>
    <sc-for list="{{ pages }}" as="n" hint-placeholder-count="5">
      <a href="{{ n.href }}" style="display:flex;align-items:baseline;gap:14px;padding:14px 0;border-bottom:1px solid #2a2a2a;color:#fff"><span style="font-family:Oswald,'Noto Sans JP';font-size:26px;letter-spacing:.08em">{{ n.en }}</span><span style="font-size:12px;color:#999">{{ n.label }}</span></a>
    </sc-for>
    <a href="Contact.dc.html" style="margin-top:24px;padding:18px;text-align:center;color:#fff;font-weight:700;background:linear-gradient(90deg,#d9622b,#f0a04b)">無料体験を予約する ›</a>
  </div>
</sc-if>
<sc-if value="{{ showMobileCta }}" hint-placeholder-val="{{ false }}">
  <a href="Contact.dc.html" style="position:fixed;left:12px;right:12px;bottom:12px;z-index:40;height:54px;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(90deg,#d9622b,#f0a04b);color:#fff;font-weight:700;font-size:14px;letter-spacing:.06em;box-shadow:0 8px 24px rgba(0,0,0,.3)">無料体験を予約する ›</a>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;concept&quot;,&quot;training&quot;,&quot;results&quot;,&quot;trainers&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1200, menuOpen: false, scrolled: false };
  barRef = React.createRef();
  curtainRef = React.createRef();
  componentDidMount() {
    const D = document, EASE = 'cubic-bezier(.2,.7,.2,1)';
    this.onResize = () => this.setState({ w: window.innerWidth });
    this.parallax = [];
    this.onScroll = () => {
      const s = window.scrollY > 40; if (s !== this.state.scrolled) this.setState({ scrolled: s });
      if (this.raf) return;
      this.raf = requestAnimationFrame(() => {
        this.raf = null;
        const h = D.documentElement.scrollHeight - innerHeight;
        if (this.barRef.current) this.barRef.current.style.transform = `scaleX(${h > 0 ? scrollY / h : 0})`;
        this.parallax.forEach(el => {
          const r = el.parentElement.getBoundingClientRect();
          if (r.bottom < 0 || r.top > innerHeight) return;
          el.style.transform = `translate3d(${(r.top - innerHeight / 2) * 0.18}px,0,0)`;
        });
      });
    };
    window.addEventListener('resize', this.onResize);
    window.addEventListener('scroll', this.onScroll, { passive: true });

    // page transition
    const cur = this.curtainRef.current;
    const lift = () => { if (cur) { cur.style.transformOrigin = '50% 0'; cur.style.transform = 'scaleY(0)'; } };
    setTimeout(lift, 120);
    this.onShow = e => { if (e.persisted) lift(); };
    window.addEventListener('pageshow', this.onShow);
    this.onClick = e => {
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a || e.metaKey || e.ctrlKey || e.shiftKey || a.target === '_blank') return;
      const href = a.getAttribute('href');
      if (!/\.dc\.html$/.test(href) || !cur) return;
      e.preventDefault();
      cur.style.transformOrigin = '50% 100%'; cur.style.transform = 'scaleY(1)';
      setTimeout(() => { location.href = a.href; }, 650);
    };
    D.addEventListener('click', this.onClick);

    const play = el => {
      const fx = el.dataset.fx;
      if (fx === 'up') { el.style.opacity = '1'; el.style.transform = 'none'; }
      else if (fx === 'wipe' || fx === 'label') el.style.clipPath = 'inset(0 0 0 0)';
      else if (fx === 'count') {
        const { pre, num, dec, suf } = JSON.parse(el.dataset.cnt), node = el.firstChild, t0 = performance.now(), dur = 1600;
        const step = t => {
          const p = Math.min(1, (t - t0) / dur), v = num * (1 - Math.pow(1 - p, 3));
          node.nodeValue = pre + v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + suf;
          if (p < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }
    };
    this.io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      this.io.unobserve(e.target);
      setTimeout(() => play(e.target), +(e.target.dataset.fxDelay || 0));
    }), { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    // A fully clipped element never reports as intersecting, so wipe/label targets are watched via their unclipped parent
    const proxied = new Map();
    this.io2 = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      this.io2.unobserve(e.target);
      (proxied.get(e.target) || []).forEach(t => setTimeout(() => play(t), +(t.dataset.fxDelay || 0)));
      proxied.delete(e.target);
    }), { threshold: 0, rootMargin: '0px 0px -40px 0px' });
    const mark = (el, fx, delay) => {
      el.dataset.fx = fx; el.dataset.fxDelay = delay || 0;
      const p = el.parentElement;
      if ((fx === 'wipe' || fx === 'label') && p) {
        if (!proxied.has(p)) { proxied.set(p, []); this.io2.observe(p); }
        proxied.get(p).push(el);
      } else this.io.observe(el);
    };

    this.scan = () => {
      D.querySelectorAll('[data-reveal]:not([data-fx]), h2:not([data-fx])').forEach(el => {
        if (el.tagName === 'H2' && (el.closest('[data-reveal]') || el.closest('header'))) { el.dataset.fx = 'skip'; return; }
        const sibs = [...el.parentElement.children].filter(c => c.hasAttribute('data-reveal'));
        const i = Math.max(0, sibs.indexOf(el));
        el.style.opacity = '0'; el.style.transform = 'translateY(40px)';
        el.style.transition = `opacity 1s ease, transform 1s ${EASE}, box-shadow .4s, border-color .4s`;
        mark(el, 'up', Math.min(i, 6) * 110);
      });
      D.querySelectorAll('div:not([data-fx]), span:not([data-fx]), a:not([data-fx])').forEach(el => {
        const st = el.style, bg = st.background || st.backgroundImage || '';
        if (bg.includes('repeating-linear-gradient') && st.aspectRatio) {
          st.clipPath = 'inset(0 100% 0 0)'; st.transition = (st.transition ? st.transition + ',' : '') + `clip-path 1.3s ${EASE}`;
          mark(el, 'wipe', 200);
        } else if (el.tagName === 'SPAN' && st.display === 'inline-block' && bg.includes('linear-gradient(90deg')) {
          st.clipPath = 'inset(0 100% 0 0)'; st.transition = `clip-path .9s ${EASE}`;
          mark(el, 'label', 100);
        } else if (el.tagName === 'A' && bg.includes('linear-gradient(90deg') && !el.closest('header')) {
          el.dataset.fx = 'btn';
          if (getComputedStyle(el).position === 'static') st.position = 'relative';
          st.overflow = 'hidden';
          const sh = D.createElement('span');
          sh.style.cssText = 'position:absolute;top:0;bottom:0;left:-60%;width:40%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg)';
          el.appendChild(sh);
          el.addEventListener('mouseenter', () => { sh.style.transition = 'left .8s ease'; sh.style.left = '130%'; });
          el.addEventListener('mouseleave', () => { sh.style.transition = 'none'; sh.style.left = '-60%'; });
        } else if (el.getAttribute('aria-hidden') === 'true' && (st.webkitTextStroke || st.WebkitTextStroke)) {
          el.dataset.fx = 'px'; st.willChange = 'transform'; this.parallax.push(el);
        } else if (el.tagName === 'DIV' && (st.fontFamily || '').includes('Oswald') && /217, 98, 43|#d9622b/i.test(st.color) && el.firstChild && el.firstChild.nodeType === 3) {
          const m = el.firstChild.nodeValue.match(/^([−\-+]?)([\d,]+(?:\.(\d+))?)(.*)$/);
          if (!m) { el.dataset.fx = 'skip'; return; }
          el.dataset.cnt = JSON.stringify({ pre: m[1], num: parseFloat(m[2].replace(/,/g, '')), dec: m[3] ? m[3].length : 0, suf: m[4] });
          el.firstChild.nodeValue = m[1] + '0' + m[4];
          mark(el, 'count', 150);
        }
      });
      this.onScroll();
    };
    this.mo = new MutationObserver(() => { clearTimeout(this.mt); this.mt = setTimeout(this.scan, 30); });
    this.mo.observe(D.body, { childList: true, subtree: true });
    setTimeout(this.scan, 60);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize); window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('pageshow', this.onShow); document.removeEventListener('click', this.onClick);
    this.io && this.io.disconnect(); this.io2 && this.io2.disconnect(); this.mo && this.mo.disconnect();
  }
  renderVals() {
    const mobile = this.state.w < 860, cur = this.props.current;
    const pages = [
      { key: 'concept', en: 'CONCEPT', label: 'コンセプト', href: 'Concept.dc.html' },
      { key: 'training', en: 'TRAINING', label: 'トレーニング', href: 'Training.dc.html' },
      { key: 'results', en: 'RESULTS', label: '実績', href: 'Results.dc.html' },
      { key: 'trainers', en: 'TRAINERS', label: 'トレーナー', href: 'Trainers.dc.html' },
      { key: 'contact', en: 'ACCESS', label: 'アクセス', href: 'Contact.dc.html' }
    ].map(p => ({ ...p, color: p.key === cur ? '#f0a04b' : '#fff', line: p.key === cur ? '#f0a04b' : 'transparent' }));
    return {
      barRef: this.barRef, curtainRef: this.curtainRef,
      pages, isDesktop: !mobile, isMobile: mobile, menuOpen: mobile && this.state.menuOpen,
      showMobileCta: mobile && !this.state.menuOpen && cur !== 'contact',
      headerBg: this.state.scrolled || this.state.menuOpen ? 'rgba(16,16,16,.94)' : 'transparent',
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen }))
    };
  }
}
</script>
</body>
</html>
