<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>ヘッダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<script src="./image-slot.js"></script>
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:#3d3a33;font-family:'Zen Maru Gothic',sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#3d3a33;text-decoration:none}
a:hover{color:#b39500}
input,select,textarea,button{font-family:inherit}
@keyframes kf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes kf-morph{0%,100%{border-radius:46% 54% 42% 58%/52% 44% 56% 48%}50%{border-radius:56% 44% 54% 46%/44% 56% 44% 56%}}
@keyframes kf-pop{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
@keyframes kf-sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes kf-spin{to{transform:rotate(360deg)}}
@keyframes kf-bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-9px)}}
@keyframes kf-slide{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<header style="position:relative;background:#fff;box-shadow:0 1px 0 rgba(61,58,51,.06)">
  <div style="max-width:1200px;margin:0 auto;padding:10px clamp(16px,4vw,40px);display:flex;align-items:center;justify-content:space-between;gap:20px">
    <a href="index.dc.html" style="display:flex;align-items:center;gap:10px">
      <span style="position:relative;width:34px;height:34px;border-radius:50%;background:#e6c619;flex:none">
        <span style="position:absolute;left:7px;top:7px;width:10px;height:10px;border-radius:50%;background:#fff"></span>
        <span style="position:absolute;right:6px;bottom:8px;width:6px;height:6px;border-radius:50%;background:#8aa35a"></span>
      </span>
      <span style="display:flex;flex-direction:column;line-height:1.15">
        <span style="font-size:10px;font-weight:700;letter-spacing:.14em;color:#6b665b">認定こども園</span>
        <span style="font-size:clamp(18px,5.4vw,22px);font-weight:700;letter-spacing:.14em">こもれび幼稚園</span>
      </span>
    </a>
    <sc-if value="{{ showNav }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
        <div style="display:flex;align-items:center;gap:12px">
          <a href="tel:0354321180" style="font-family:Quicksand,sans-serif;font-size:20px;font-weight:500;color:#9a8100;letter-spacing:.02em">03-5432-1180</a>
          <span style="display:flex;flex-direction:column;font-size:10px;line-height:1.35;color:#6b665b">
            <span style="background:#e6c619;color:#3d3a33;font-weight:700;padding:0 6px;border-radius:2px;align-self:flex-start">見学随時受付中</span>
            <span>平日 8:00 – 18:00</span>
          </span>
          <a href="contact.dc.html#access" style="width:26px;height:26px;border-radius:50%;background:#e6c619;display:flex;align-items:center;justify-content:center" aria-label="アクセス">
            <span style="width:8px;height:8px;border-radius:50%;background:#fff"></span>
          </a>
        </div>
        <nav style="display:flex;align-items:center;gap:14px">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
            <a href="{{ n.href }}" style="display:flex;align-items:center;gap:14px" style-hover="color:#b39500">
              <span style="display:flex;flex-direction:column;align-items:center;line-height:1.3">
                <span style="font-family:Quicksand,sans-serif;font-size:9px;font-weight:600;letter-spacing:.12em;color:#8a8474">{{ n.en }}</span>
                <span style="font-size:12.5px;font-weight:500;color:{{ n.color }}">{{ n.label }}</span>
                <span style="width:16px;height:3px;border-radius:2px;margin-top:3px;background:{{ n.dot }}"></span>
              </span>
              <span style="font-size:18px;font-weight:300;color:#d9d2bf">{{ n.sep }}</span>
            </a>
          </sc-for>
        </nav>
      </div>
    </sc-if>
    <sc-if value="{{ showBurger }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:8px">
        <a href="tel:0354321180" style="width:44px;height:44px;border-radius:50%;border:1px solid #e6c619;display:flex;align-items:center;justify-content:center;font-family:Quicksand,sans-serif;font-size:11px;font-weight:700">TEL</a>
        <button onClick="{{ toggleMenu }}" aria-label="メニュー" style="width:44px;height:44px;border-radius:50%;border:none;background:#e6c619;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer">
          <span style="width:18px;height:2px;background:#3d3a33;border-radius:1px"></span>
          <span style="width:18px;height:2px;background:#3d3a33;border-radius:1px"></span>
          <span style="width:18px;height:2px;background:#3d3a33;border-radius:1px"></span>
        </button>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;top:100%;left:0;right:0;background:#f7f3e8;padding:12px 24px 28px;box-shadow:0 12px 24px rgba(61,58,51,.08)">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
        <a href="{{ n.href }}" onClick="{{ closeMenu }}" style="display:flex;align-items:baseline;gap:12px;padding:16px 4px;border-bottom:1px solid #e3dccb">
          <span style="font-family:Quicksand,sans-serif;font-size:11px;font-weight:600;letter-spacing:.12em;color:#9a8100;width:84px">{{ n.en }}</span>
          <span style="font-size:16px;font-weight:500">{{ n.label }}</span>
        </a>
      </sc-for>
      <a href="contact.dc.html" onClick="{{ closeMenu }}" style="margin-top:20px;display:flex;justify-content:center;background:#e6c619;padding:15px;font-weight:700;font-size:15px">› 園見学を予約する</a>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, menu: false };
  componentDidMount() { this.r = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.r); }
  componentWillUnmount() { window.removeEventListener('resize', this.r); }
  renderVals() {
    const cur = this.props.current || 'home';
    const m = this.state.w < 1000;
    const nav = [
      { key: 'home', href: 'index.dc.html', en: 'HOME', label: 'ホーム' },
      { key: 'about', href: 'about.dc.html', en: 'ABOUT', label: 'こもれびについて' },
      { key: 'daily', href: 'daily-life.dc.html', en: 'DAILY LIFE', label: '園での生活' },
      { key: 'people', href: 'teachers.dc.html', en: 'PEOPLE', label: '先生と環境' },
      { key: 'admission', href: 'admission.dc.html', en: 'ADMISSION', label: '入園案内' },
      { key: 'contact', href: 'contact.dc.html', en: 'CONTACT', label: 'お問い合わせ' }
    ];
    return {
      showNav: !m, showBurger: m, menuOpen: m && this.state.menu,
      toggleMenu: () => this.setState((s) => ({ menu: !s.menu })),
      closeMenu: () => this.setState({ menu: false }),
      nav: nav.map((n, i) => Object.assign({}, n, { sep: i < nav.length - 1 ? '/' : '', color: n.key === cur ? '#9a8100' : '#3d3a33', dot: n.key === cur ? '#e6c619' : 'transparent' }))
    };
  }
}
</script>
</body>
</html>
