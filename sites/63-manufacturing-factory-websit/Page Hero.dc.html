<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./image-slot.js"></script><script src="./reveal.js"></script><style>
@media (max-width:767px){
  .ph-img{width:100%!important;clip-path:none!important}
  .ph-ov{background:linear-gradient(180deg,rgba(14,29,74,.55) 0%,rgba(14,29,74,.8) 55%,rgba(14,29,74,.95) 100%)!important}
  .ph-body{padding-top:140px!important;padding-bottom:56px!important}
  .ph-crumb{margin-bottom:32px!important}
  .ph-lead{font-size:14px!important;margin-top:24px!important}
}
</style></helmet>
<section style="position:relative;min-height:clamp(540px,66vh,700px);background:#0e1d4a;overflow:hidden;display:flex;align-items:flex-end;color:#fff;font-family:'Plus Jakarta Sans','Noto Sans JP',sans-serif">
  <div data-reveal="zoom" class="ph-img" style="position:absolute;top:0;right:0;bottom:0;width:64%;clip-path:polygon(30% 0,100% 0,100% 100%,0 100%)">
    <image-slot id="{{ slot }}" src="{{ src }}" shape="rect" placeholder="{{ placeholder }}"></image-slot>
    <div class="ph-ov" style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,29,74,.85) 0%,rgba(14,29,74,.2) 55%,rgba(14,29,74,0) 100%);pointer-events:none"></div>
  </div>
  <div style="position:absolute;left:-12%;top:20%;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(40,100,255,.5),rgba(40,100,255,0) 68%);pointer-events:none"></div>
  <div style="position:absolute;left:40%;top:-10%;width:2px;height:130%;background:#2f6bff;transform:rotate(22deg);pointer-events:none"></div>
  <div class="ph-body" style="position:relative;z-index:2;width:100%;max-width:1440px;margin:0 auto;padding:170px clamp(20px,6vw,96px) 80px;pointer-events:none">
    <p class="ph-crumb" style="margin:0 0 48px;display:flex;gap:12px;font-size:11px;letter-spacing:.18em;font-weight:600;pointer-events:auto"><a href="Home.dc.html" style="color:rgba(255,255,255,.7);text-decoration:none">HOME</a><span style="opacity:.5">/</span><span>{{ crumb }}</span></p>
    <div data-reveal="" style="display:flex;align-items:center;gap:14px;margin-bottom:18px">
      <span style="display:block;width:22px;height:30px;background:#d0101b;transform:skewX(-28deg)"></span>
      <span style="font-size:14px;font-weight:600;letter-spacing:.1em">{{ num }}</span>
      <span style="font-family:'Noto Sans JP';font-size:14px;font-weight:700;letter-spacing:.2em">{{ jp }}</span>
    </div>
    <h1 data-reveal="" data-delay="150" style="margin:0;font-weight:700;font-size:clamp(36px,9vw,148px);line-height:.92;letter-spacing:-0.045em">{{ en }}</h1>
    <p data-reveal="" data-delay="300" class="ph-lead" style="margin:32px 0 0;max-width:540px;font-family:'Noto Sans JP';font-size:15px;line-height:2;font-weight:500;text-wrap:pretty">{{ lead }}</p>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:680},&quot;num&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Our Factory&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;crumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;OUR FACTORY&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;jp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;工場紹介&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slot&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;hero-sub&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Page hero photo&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
