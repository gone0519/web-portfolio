<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>品質・強み｜AOBA Precision Works</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Allura&display=swap">
<script src="./image-slot.js"></script>
<script src="./reveal.js"></script>
<style>
body{margin:0;background:#0e1d4a;color:#fff;font-family:'Plus Jakarta Sans','Noto Sans JP',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
*{box-sizing:border-box}
a{color:#fff;text-decoration:none}
a:hover{color:#9db8ff}
::selection{background:#d0101b;color:#fff}
</style>
</helmet>
<dc-import name="Site Header" current="quality" hint-size="100%,72px" style="position:fixed;top:0;left:0;right:0;z-index:50"></dc-import>
<main>
<div data-screen-label="01 Hero"><dc-import name="Page Hero" num="03" en="Quality You Can Trust" crumb="QUALITY" jp="品質・強み" lead="測定データに基づく品質管理と、柔軟な生産体制。お客様に選ばれ続ける理由をご紹介します。" slot="hero-quality" src="images/team-review.jpg" placeholder="Inspector measuring a part on CMM" hint-size="100%,660px"></dc-import></div>

<section data-screen-label="02 Strengths" style="position:relative;background:#0e1d4a;overflow:hidden;padding:40px 0 160px">
  <div style="position:absolute;inset:0;background:#1b47b0;clip-path:polygon(0 6%,100% 0,100% 100%,0 100%);pointer-events:none"></div>
  <div style="position:absolute;right:-12%;top:20%;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,rgba(70,130,255,.6),rgba(70,130,255,0) 66%);pointer-events:none"></div>
  <div style="position:relative;max-width:1440px;margin:0 auto;padding:120px clamp(20px,6vw,96px) 0">
    <div data-reveal="" style="display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 28px;margin-bottom:80px">
      <p style="margin:0;font-family:'Allura',cursive;font-size:clamp(56px,6vw,96px);color:#ff2a36;line-height:1">Strengths</p>
      <p style="margin:0;font-family:'Noto Sans JP';font-weight:700;font-size:clamp(22px,2.4vw,32px);letter-spacing:.14em">選ばれ続ける、4つの理由。</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:clamp(64px,7vw,110px)">
      <sc-for list="{{ strengths }}" as="q" hint-placeholder-count="4">
        <article style="display:flex;flex-wrap:wrap;flex-direction:{{ q.dir }};gap:clamp(32px,5vw,80px);align-items:center">
          <div data-reveal="img" style="flex:1 1 420px;position:relative;aspect-ratio:4/3"><image-slot id="{{ q.slot }}" src="{{ q.img }}" shape="rect" placeholder="{{ q.ph }}"></image-slot></div>
          <div data-reveal="" style="flex:1 1 400px">
            <span style="display:block;font-weight:700;font-size:clamp(88px,10vw,150px);letter-spacing:-0.06em;line-height:.8;color:rgba(255,255,255,.18)">{{ q.no }}</span>
            <p style="margin:-0.4em 0 0;font-weight:700;font-size:clamp(28px,3vw,42px);letter-spacing:-0.02em">{{ q.en }}</p>
            <p style="margin:10px 0 0;font-family:'Noto Sans JP';font-size:16px;font-weight:700;color:#bcd0ff;letter-spacing:.16em">{{ q.jp }}</p>
            <p style="margin:24px 0 0;font-size:16px;line-height:1.8;text-wrap:pretty">{{ q.text }}</p>
            <p style="margin:14px 0 0;font-family:'Noto Sans JP';font-size:14px;line-height:2;opacity:.85;text-wrap:pretty">{{ q.jpText }}</p>
          </div>
        </article>
      </sc-for>
    </div>
  </div>
</section>

<section data-screen-label="03 QC Flow" style="position:relative;background:#0e1d4a;overflow:hidden;padding:120px 0 140px">
  <div style="position:absolute;left:-10%;top:10%;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(40,100,255,.45),rgba(40,100,255,0) 68%);pointer-events:none"></div>
  <div style="position:relative;max-width:1440px;margin:0 auto;padding:0 clamp(20px,6vw,96px)">
    <div data-reveal="" style="display:flex;align-items:center;gap:14px;margin-bottom:22px"><span style="display:block;width:22px;height:30px;background:#d0101b;transform:skewX(-28deg)"></span><span style="font-size:14px;font-weight:600">Quality Control System</span></div>
    <h2 data-reveal="" style="margin:0 0 64px;font-family:'Noto Sans JP';font-weight:700;font-size:clamp(24px,2.8vw,36px);line-height:1.7;letter-spacing:.14em">4段階の検査で、不良を流さない。</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:0;border-top:1px solid rgba(255,255,255,.3)">
      <sc-for list="{{ qc }}" as="c" hint-placeholder-count="4">
        <div data-reveal="" style="position:relative;padding:40px 32px 40px 0;display:flex;flex-direction:column;gap:12px">
          <span style="position:absolute;top:-6px;left:0;width:11px;height:11px;border-radius:50%;background:#d0101b"></span>
          <span style="font-size:12px;font-weight:700;opacity:.7">CHECK {{ c.no }}</span>
          <span style="font-weight:700;font-size:24px">{{ c.en }}</span>
          <span style="font-family:'Noto Sans JP';font-weight:700;font-size:15px;color:#9db8ff;letter-spacing:.12em">{{ c.jp }}</span>
          <span style="font-family:'Noto Sans JP';font-size:13px;line-height:1.9;opacity:.85">{{ c.text }}</span>
        </div>
      </sc-for>
    </div>
  </div>
</section>

<section data-screen-label="04 Certifications" style="position:relative;background:#0e1d4a">
  <div style="background:#eef1f6;color:#12245a;clip-path:polygon(0 10%,100% 0,100% 100%,0 100%);padding:clamp(120px,12vw,170px) 0 140px;background-image:repeating-linear-gradient(-14deg,rgba(255,255,255,.9) 0 2px,rgba(210,218,232,.55) 2px 9px,rgba(255,255,255,0) 9px 38px)">
    <div style="max-width:1440px;margin:0 auto;padding:0 clamp(20px,6vw,96px)">
      <div data-reveal="" style="display:flex;flex-wrap:wrap;align-items:baseline;gap:16px 28px;margin-bottom:56px">
        <h2 style="margin:0;font-weight:700;font-size:clamp(34px,6vw,96px);letter-spacing:-0.05em;line-height:.9">Certifications</h2>
        <p style="margin:0;font-family:'Noto Sans JP';font-weight:700;font-size:15px;letter-spacing:.2em">認証取得</p>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px">
        <sc-for list="{{ certs }}" as="c" hint-placeholder-count="3">
          <div data-reveal="" style="background:#fff;padding:40px 36px;display:flex;flex-direction:column;gap:10px;transition:transform .3s,box-shadow .3s" style-hover="transform:translateY(-4px);box-shadow:0 20px 40px rgba(18,36,90,.12)">
            <span style="font-size:12px;font-weight:700;color:#d0101b">SINCE {{ c.year }}</span>
            <span style="font-weight:700;font-size:32px;letter-spacing:-0.02em">{{ c.name }}</span>
            <span style="font-family:'Noto Sans JP';font-weight:700;font-size:14px">{{ c.jp }}</span>
            <span style="font-family:'Noto Sans JP';font-size:13px;line-height:1.8;opacity:.75">{{ c.text }}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</section>
</main>
<dc-import name="Site Footer" cta="{{ true }}" top-bg="#eef1f6" hint-size="100%,900px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      strengths: [
        { en: 'High Precision', jp: '高精度', text: 'Advanced equipment and skilled technicians ensure consistent manufacturing quality.', jpText: '最新の5軸加工機と、経験を積んだ技術者の段取り・工具選定により、±2μmの寸法精度を安定して実現しています。', ph: 'High precision part / micrometer' },
        { en: 'Strict Quality Control', jp: '徹底した品質管理', text: 'Every production stage is carefully inspected to maintain stable quality.', jpText: '受入から出荷まで4段階で検査。測定データはすべて記録・保管し、ロットごとに追跡できる体制を整えています。', ph: 'Inspection records / QC team' },
        { en: 'Flexible Production', jp: '柔軟な生産体制', text: 'We support both large-scale production and customized manufacturing requirements.', jpText: '1個の試作から月産数万個の量産まで、同じ工場で対応。急な増産や仕様変更にも柔軟に対応します。', ph: 'Production planning / line' },
        { en: 'Safety & Reliability', jp: '安全と信頼', text: 'A clean and safe production environment supports stable long-term operations.', jpText: '5S活動と安全教育を継続し、無災害記録を更新中。安定した操業が、長期的なお取引の基盤になっています。', ph: 'Clean, safe factory floor' }
      ].map((q, i) => ({ ...q, no: String(i + 1).padStart(2, '0'), slot: 'q-strength-' + (i + 1), img: 'images/' + ['machine-closeup', 'team-meeting', 'partnership', 'factory-safety'][i] + '.jpg',dir: i % 2 ? 'row-reverse' : 'row' })),
      qc: [
        { no: '01', en: 'Incoming', jp: '受入検査', text: '材料ミルシートの確認と寸法・硬度チェックを行います。' },
        { no: '02', en: 'In-Process', jp: '工程内検査', text: '初品・中間品を測定し、加工条件のずれを早期に修正します。' },
        { no: '03', en: 'Final', jp: '最終検査', text: '三次元測定機で図面の全寸法を確認します。' },
        { no: '04', en: 'Shipping', jp: '出荷検査', text: '外観・数量・梱包状態を確認し、成績書を添付します。' }
      ],
      certs: [
        { year: '2006', name: 'ISO 9001', jp: '品質マネジメントシステム', text: '設計から製造・検査までの品質管理体制を認証。' },
        { year: '2016', name: 'ISO 14001', jp: '環境マネジメントシステム', text: '省エネ・廃棄物削減など環境への取り組みを認証。' },
        { year: '2021', name: 'IATF 16949', jp: '自動車産業品質マネジメント', text: '自動車部品に求められる品質要求事項への適合を認証。' }
      ]
    };
  }
}
</script>
</body>
</html>
