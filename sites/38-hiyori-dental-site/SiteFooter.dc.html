<x-dc>
<div style="font-family:'Zen Kaku Gothic New',sans-serif;color:#3b342e">
<sc-if value="{{ showCta }}" hint-placeholder-val="{{ true }}">

        <p style="margin:0;font-family:Jost,sans-serif;font-weight:300;font-size:clamp(34px,4vw,56px);line-height:1.1">Your Smile Starts Here.</p>

      </div>

      </div>
    </div>
  </section>
</sc-if>

    <a href="Dental%20Clinic.dc.html" style="color:#3b342e;text-decoration:none" style-hover="color:#a07a4a">HOME</a>
    <a href="About.dc.html" style="color:#3b342e;text-decoration:none" style-hover="color:#a07a4a">当院について</a>
    <a href="Treatments.dc.html" style="color:#3b342e;text-decoration:none" style-hover="color:#a07a4a">診療内容</a>

  </nav>
  <a href="Dental%20Clinic.dc.html" style="display:flex;align-items:center;gap:12px;color:#3b342e;text-decoration:none">

    <span style="display:flex;flex-direction:column;gap:4px">
      <span style="font-size:clamp(17px,5.4vw,21px);font-weight:700;letter-spacing:.14em;line-height:1;white-space:nowrap">ひより歯科クリニック</span>
      <span style="font-family:Jost,sans-serif;font-size:10px;letter-spacing:.24em;color:#8a6538;line-height:1">Hiyori Dental Clinic</span>
    </span>

  <p style="margin:0;font-size:12px;line-height:1.9;letter-spacing:.06em;color:#5d544c;text-align:center">〒150-0000 東京都渋谷区〇〇 1-2-3 ひよりビル2F<br>TEL 03-0000-0000 ／ 休診日 木曜・日曜・祝日</p>

</footer>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showCta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { showCta: this.props.showCta ?? true };
  }
}
</script>
