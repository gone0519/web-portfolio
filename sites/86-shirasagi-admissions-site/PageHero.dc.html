<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="position:relative;overflow:hidden;background:#fff">
  <span aria-hidden="true" data-parallax="-0.15" style="position:absolute;right:-2%;bottom:-0.18em;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(90px,16vw,240px);line-height:1;color:#f3f1ec;white-space:nowrap;pointer-events:none">{{ en }}</span>
  <div style="position:relative;max-width:1240px;margin:0 auto;padding:clamp(32px,4vw,48px) clamp(20px,4vw,40px) clamp(56px,7vw,96px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(32px,5vw,72px);align-items:center">
    <div style="display:flex;flex-direction:column;gap:22px">
      <nav aria-label="パンくず" style="display:flex;gap:10px;font-size:11px;color:#666"><a href="Home.dc.html" style="color:#666">トップ</a><span aria-hidden="true">／</span><span aria-current="page">{{ title }}</span></nav>
      <span style="display:flex;align-items:center;gap:12px;font-family:'Cormorant Garamond',serif;font-size:16px;color:#c22a2a;letter-spacing:0.1em"><span style="width:32px;height:1px;background:#c22a2a"></span>{{ no }}</span>
      <h1 style="margin:0;font-family:'Noto Serif JP',serif;font-weight:500;font-size:clamp(34px,5vw,60px);letter-spacing:0.12em;line-height:1.3">{{ title }}</h1>
      <span style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;letter-spacing:0.08em">{{ en }}</span>
      <p style="margin:0;font-family:'Noto Serif JP',serif;font-size:14px;line-height:2.2;max-width:480px;text-wrap:pretty">{{ lead }}</p>
    </div>
    <div style="position:relative;padding:0 0 40px 40px">
      <div style="aspect-ratio:4/3"><image-slot id="{{ imgId }}" shape="rounded" radius="4" placeholder="{{ imgLabel }}"></image-slot></div>
      <div style="position:absolute;left:0;bottom:0;width:32%;aspect-ratio:1/1;border:6px solid #fff;border-radius:50%"><image-slot id="{{ imgId }}-sub" shape="circle" placeholder="サブ写真"></image-slot></div>
      <svg width="64" height="18" viewBox="0 0 64 18" aria-hidden="true" data-anim="float" style="position:absolute;right:8px;top:-28px;color:#6c8fa8"><path d="M2 14 Q10 4 18 11 Q26 4 34 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path><path d="M38 8 Q44 2 50 7 Q56 2 62 5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path></svg>
    </div>
  </div>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;560px&quot;},&quot;no&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;大学を知る&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;About&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;imgId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;hero-sub&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;imgLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ページメイン写真&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
