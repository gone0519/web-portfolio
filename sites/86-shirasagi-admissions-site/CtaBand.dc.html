<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="position:relative;background:#1f1f1f;color:#fff;overflow:hidden">
  <div style="position:absolute;inset:0;opacity:0.35"><image-slot id="{{ imgId }}" shape="rect" placeholder="締めのビジュアル：夕方のキャンパス"></image-slot></div>
  <div style="position:relative;max-width:1000px;margin:0 auto;padding:clamp(64px,8vw,104px) 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:24px;pointer-events:none">
    <span style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;letter-spacing:0.14em">Your next four years</span>
    <p style="margin:0;font-family:'Noto Serif JP',serif;font-weight:300;font-size:clamp(26px,4vw,48px);letter-spacing:0.12em">あなたの4年間を、ここから。</p>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px;pointer-events:auto">
      <a href="OpenCampus.dc.html#reserve" style="background:#c22a2a;color:#fff;font-size:14px;font-weight:700;padding:17px 34px;border-radius:999px;display:flex;gap:20px" style-hover="background:#fff;color:#c22a2a">オープンキャンパス予約<span aria-hidden="true">→</span></a>
      <a href="Admissions.dc.html#materials" style="background:transparent;border:1px solid #fff;color:#fff;font-size:14px;font-weight:700;padding:16px 34px;border-radius:999px;display:flex;gap:20px" style-hover="background:#fff;color:#1f1f1f">資料請求<span aria-hidden="true">→</span></a>
    </div>
  </div>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;360px&quot;},&quot;imgId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;cta-bg&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
