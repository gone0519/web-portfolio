<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:sticky;top:0;z-index:50;background:rgba(245,243,239,.94);backdrop-filter:blur(10px);border-bottom:1px solid #D9D5CE">
  <div style="max-width:1320px;margin:0 auto;padding:0 clamp(20px,4vw,48px);height:76px;display:flex;align-items:center;gap:40px">
    <a href="Top.dc.html" style="display:flex;align-items:baseline;gap:10px;flex-shrink:0;color:#151515;text-decoration:none">
      <span style="font-family:'Barlow Condensed';font-weight:800;font-size:32px;letter-spacing:1px;line-height:1">RISE</span>
      <span style="font-family:Barlow;font-weight:600;font-size:10px;letter-spacing:2.4px;color:#6B6760">PERSONAL GYM</span>
    </a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;gap:32px;flex:1;justify-content:center">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
          <a href="{{ l.href }}" style="display:flex;flex-direction:column;gap:2px;color:#151515;text-decoration:none;transition:color .2s" style-hover="color:#E4462B">
            <span style="font-size:14px;font-weight:700">{{ l.label }}</span>
            <sc-if value="{{ l.active }}" hint-placeholder-val="{{ false }}"><span style="height:2px;background:#E4462B;margin-top:2px"></span></sc-if>
          </a>
        </sc-for>
      </nav>
      <a href="Contact.dc.html" style="display:flex;align-items:center;gap:14px;height:48px;padding:0 22px;background:#151515;color:#F5F3EF;font-size:13px;font-weight:700;text-decoration:none;transition:background .25s" style-hover="background:#E4462B;color:#fff">無料体験を予約 <span style="font-family:'Barlow Condensed';font-size:18px">↗</span></a>
    </sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <div style="flex:1"></div>
      <button onClick="{{ toggleMenu }}" aria-label="メニュー" style="height:48px;padding:0 18px;border:1px solid #151515;background:transparent;font-size:14px;font-weight:700;color:#151515;cursor:pointer">{{ menuLabel }}</button>
    </sc-if>
  </div>
  <sc-if value="{{ menuVisible }}" hint-placeholder-val="{{ false }}">
    <nav style="display:flex;flex-direction:column;padding:8px clamp(20px,4vw,48px) 28px;background:#F5F3EF">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
        <a href="{{ l.href }}" style="display:flex;align-items:baseline;gap:14px;padding:18px 0;border-bottom:1px solid #D9D5CE;color:#151515;text-decoration:none">
          <span style="font-size:22px;font-weight:900">{{ l.label }}</span>
        </a>
      </sc-for>
      <a href="Contact.dc.html" style="margin-top:24px;height:56px;display:flex;align-items:center;justify-content:center;background:#E4462B;color:#fff;font-weight:700;text-decoration:none">無料体験を予約する ↗</a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;90px&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;concept&quot;,&quot;programs&quot;,&quot;results&quot;,&quot;trainers&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;animations&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, menu: false };
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onResize);
    if (this.props.animations === false || !('IntersectionObserver' in window)) return;
    this.io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.translate = '0 0'; this.io.unobserve(e.target); }
    }), { threshold: 0.12 });
    const scan = () => document.querySelectorAll('[data-reveal]:not([data-rv])').forEach(el => {
      el.setAttribute('data-rv', '1');
      if (el.getBoundingClientRect().top < window.innerHeight) return;
      el.style.opacity = '0'; el.style.translate = '0 24px';
      el.style.transition = (el.style.transition ? el.style.transition + ',' : '') + 'opacity 1s cubic-bezier(.2,.7,.2,1), translate 1s cubic-bezier(.2,.7,.2,1)';
      this.io.observe(el);
    });
    let n = 0; this.t = setInterval(() => { scan(); if (++n > 10) clearInterval(this.t); }, 400);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); clearInterval(this.t); this.io && this.io.disconnect(); }
  renderVals() {
    const mobile = this.state.w < 1000, cur = this.props.current;
    const links = [['concept','CONCEPT','コンセプト','Concept.dc.html'],['programs','PROGRAMS','プログラム','Programs.dc.html'],['results','RESULTS','お客様の変化','Results.dc.html'],['trainers','TRAINERS','トレーナー','Trainers.dc.html'],['contact','ACCESS','予約・アクセス','Contact.dc.html']]
      .map(([k,en,label,href]) => ({ en, label, href, active: k === cur }));
    return { links, desktop: !mobile, mobile, menuVisible: mobile && this.state.menu, menuLabel: this.state.menu ? '閉じる' : 'メニュー', toggleMenu: () => this.setState(s => ({ menu: !s.menu })) };
  }
}
</script>
</body>
</html>
