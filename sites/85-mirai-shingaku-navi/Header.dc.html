<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#fff;border-bottom:1px solid #e3e9ef;display:flex;align-items:center;justify-content:space-between;height:68px;padding-left:24px;font-family:'Zen Kaku Gothic New',sans-serif;color:#141a22">
  <a href="University Admissions.dc.html" style="display:flex;align-items:center;gap:10px;color:#141a22;text-decoration:none;flex:none;white-space:nowrap">
    <div style="flex:none;width:38px;height:38px;background:#1873c9;color:#fff;font-family:Outfit;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;transform:skewX(-8deg)">MS</div>
    <div style="display:flex;flex-direction:column;line-height:1.1">
      <span style="font-weight:900;font-size:19px;letter-spacing:.04em">みらい進学ナビ</span>
      <span style="font-family:Outfit;font-weight:700;font-size:9px;letter-spacing:.2em;color:#1873c9">MIRAI SHINGAKU NAVI</span>
    </div>
  </a>
  <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:stretch;height:100%">
      <nav style="display:flex;align-items:center;gap:20px;padding:0 22px;font-size:13px;font-weight:700">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
          <a href="{{ n.href }}" style="color:{{ n.color }};text-decoration:none;padding:6px 0;border-bottom:2px solid {{ n.line }};transition:color .2s;white-space:nowrap" style-hover="color:#1873c9">{{ n.label }}</a>
        </sc-for>
      </nav>
      <sc-if value="{{ showTel }}">
        <div style="display:flex;flex-direction:column;justify-content:center;padding:0 18px;border-left:1px solid #e3e9ef;white-space:nowrap">
          <span style="font-family:Outfit;font-weight:800;font-size:16px;letter-spacing:.04em">TEL 00-0000-0000</span>
          <span style="font-size:10px;color:#5b6773">受付時間 平日 9:00–17:00（サンプル）</span>
        </div>
      </sc-if>
      <a href="Campus.dc.html#contact" style="background:#1873c9;color:#fff;width:112px;font-size:12px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;transition:background .2s" style-hover="background:#0f5596;color:#fff"><span style="font-family:Outfit;font-size:18px">✉</span>資料請求</a>
      <a href="Campus.dc.html#opencampus" style="background:#17a673;color:#fff;width:112px;font-size:12px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;transition:background .2s" style-hover="background:#0e865b;color:#fff"><span style="font-family:Outfit;font-size:18px">◎</span>OC予約</a>
    </div>
  </sc-if>
  <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ toggleMenu }}" aria-label="メニュー" style="border:0;background:#1873c9;color:#fff;width:68px;height:68px;font-family:Outfit;font-weight:800;font-size:12px;cursor:pointer">{{ menuLabel }}</button>
  </sc-if>
</div>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;top:68px;left:0;right:0;bottom:0;z-index:49;background:#1873c9;padding:28px;display:flex;flex-direction:column;gap:4px;font-family:'Zen Kaku Gothic New',sans-serif;overflow-y:auto">
    <sc-for list="{{ nav }}" as="n">
      <a href="{{ n.href }}" onClick="{{ closeMenu }}" style="color:#fff;font-size:19px;font-weight:900;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.3);text-decoration:none">{{ n.label }}</a>
    </sc-for>
    <a href="tel:0000000000" style="margin-top:20px;color:#fff;text-decoration:none;text-align:center;line-height:1.4"><span style="display:block;font-family:Outfit;font-weight:800;font-size:22px;letter-spacing:.04em">TEL 00-0000-0000</span><span style="font-size:11px;opacity:.85">受付時間 平日 9:00–17:00（サンプル）</span></a>
    <div style="display:flex;gap:10px;margin-top:16px">
      <a href="Campus.dc.html#contact" onClick="{{ closeMenu }}" style="flex:1;height:52px;border-radius:999px;background:#fff;color:#1873c9;font-weight:900;display:flex;align-items:center;justify-content:center;text-decoration:none">資料請求</a>
      <a href="Campus.dc.html#opencampus" onClick="{{ closeMenu }}" style="flex:1;height:52px;border:2px solid #fff;border-radius:999px;background:#17a673;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;text-decoration:none">OC予約</a>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:68},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;programs&quot;,&quot;prep&quot;,&quot;admissions&quot;,&quot;support&quot;,&quot;campus&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, menu: false };
  componentDidMount() { this.onR = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.onR); }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); document.body.style.overflow = ''; }
  componentDidUpdate() { document.body.style.overflow = this.state.menu && this.state.w < 1120 ? 'hidden' : ''; }
  renderVals() {
    const cur = this.props.current || 'top';
    const items = [['top', 'トップ', 'University Admissions.dc.html'], ['programs', '学部・学科', 'Programs.dc.html'], ['prep', '受験対策', 'Preparation.dc.html'], ['admissions', '入試・出願', 'Admissions.dc.html'], ['support', '学費・奨学金', 'Support.dc.html'], ['campus', 'キャンパスライフ', 'Campus.dc.html']];
    // Logo + nav + two CTA blocks need ~1000px; the phone block adds ~190px more
    const narrow = this.state.w < 1120;
    return {
      nav: items.map(([k, label, href]) => ({ label, href, color: k === cur ? '#1873c9' : '#141a22', line: k === cur ? '#1873c9' : 'transparent' })),
      wide: !narrow, narrow, showTel: this.state.w >= 1320, menuOpen: narrow && this.state.menu, menuLabel: this.state.menu ? 'CLOSE' : 'MENU',
      toggleMenu: () => this.setState(s => ({ menu: !s.menu })),
      closeMenu: () => this.setState({ menu: false }),
    };
  }
}
</script>
</body>
</html>
