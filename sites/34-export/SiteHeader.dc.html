<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="height:72px;background:rgba(255,255,255,.97);box-shadow:0 1px 12px rgba(26,33,112,.06);display:flex;align-items:center;justify-content:space-between;padding-left:clamp(16px,3vw,40px);font-family:'Noto Sans JP',sans-serif">
  <a href="Aoba%20Clinic.dc.html" style="display:flex;align-items:center;gap:12px;color:#1a2170;text-decoration:none">
    <span style="position:relative;width:38px;height:38px;border-radius:50%;background:#1a2170;display:block;flex:none">
      <span style="position:absolute;left:17px;top:10px;width:4px;height:18px;background:#fff;border-radius:2px"></span>
      <span style="position:absolute;left:10px;top:17px;width:18px;height:4px;background:#fff;border-radius:2px"></span>
    </span>
    <span style="display:flex;flex-direction:column;line-height:1.3">
      <span style="font-size:15px;font-weight:700;letter-spacing:.08em;white-space:nowrap">あおば内科クリニック</span>
      <span style="font-family:Outfit,sans-serif;font-size:10px;letter-spacing:.06em;color:#5a6090">Aoba Internal Medicine Clinic</span>
    </span>
  </a>
  <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;height:100%">
      <nav style="display:flex;gap:clamp(16px,1.8vw,30px);margin-right:28px;height:100%">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
          <a href="{{ n.href }}" style="position:relative;display:flex;align-items:center;height:100%;font-size:15px;font-weight:700;color:#222;letter-spacing:.06em;text-decoration:none;white-space:nowrap" style-hover="color:#2b45c9">{{ n.label }}<sc-if value="{{ n.active }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:18px;height:2px;background:#2b45c9"></span></sc-if></a>
        </sc-for>
      </nav>
      <a href="FirstVisit.dc.html#webq" style="width:80px;height:72px;background:#6b9fdc;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;text-decoration:none;transition:filter .25s" style-hover="filter:brightness(1.08)"><span style="font-family:'Material Symbols Rounded';font-size:22px;line-height:1;font-variation-settings:'FILL' 1">description</span>WEB問診</a>
      <a href="Access.dc.html#contact" style="width:80px;height:72px;background:#2b45c9;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;text-decoration:none;transition:filter .25s" style-hover="filter:brightness(1.12)"><span style="font-family:'Material Symbols Rounded';font-size:22px;line-height:1;font-variation-settings:'FILL' 1">smartphone</span>WEB予約</a>
      <a href="Access.dc.html#contact" style="width:80px;height:72px;background:#1a2170;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;text-decoration:none;transition:filter .25s" style-hover="filter:brightness(1.25)"><span style="font-family:'Material Symbols Rounded';font-size:22px;line-height:1;font-variation-settings:'FILL' 1">chat</span>LINE予約</a>
    </div>
  </sc-if>
  <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ toggleMenu }}" aria-label="メニュー" style="width:72px;height:72px;border:0;background:#1a2170;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="font-family:'Material Symbols Rounded';font-size:30px;line-height:1">{{ menuIcon }}</span></button>
  </sc-if>
</header>
<sc-if value="{{ menuVisible }}" hint-placeholder-val="{{ false }}">
  <nav style="position:fixed;top:72px;left:0;right:0;z-index:49;background:#fff;box-shadow:0 12px 24px rgba(26,33,112,.1);display:flex;flex-direction:column;padding:8px 24px 24px;font-family:'Noto Sans JP',sans-serif">
    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
      <a href="{{ n.href }}" style="padding:16px 4px;border-bottom:1px solid #e3e6f0;font-weight:700;color:#1a2170;text-decoration:none;display:flex;justify-content:space-between;align-items:center">{{ n.label }}<span style="font-family:'Material Symbols Rounded';font-size:20px">chevron_right</span></a>
    </sc-for>
  </nav>
</sc-if>
<sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;left:0;right:0;bottom:0;z-index:48;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 -4px 16px rgba(26,33,112,.12);font-family:'Noto Sans JP',sans-serif">
    <a href="FirstVisit.dc.html#webq" style="height:60px;background:#6b9fdc;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;text-decoration:none"><span style="font-family:'Material Symbols Rounded';font-size:22px;line-height:1;font-variation-settings:'FILL' 1">description</span>WEB問診</a>
    <a href="Access.dc.html#contact" style="height:60px;background:#2b45c9;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;text-decoration:none"><span style="font-family:'Material Symbols Rounded';font-size:22px;line-height:1;font-variation-settings:'FILL' 1">smartphone</span>WEB予約</a>
    <a href="tel:0300000000" style="height:60px;background:#1a2170;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;text-decoration:none"><span style="font-family:'Material Symbols Rounded';font-size:22px;line-height:1;font-variation-settings:'FILL' 1">call</span>電話する</a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:80},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;treatment&quot;,&quot;doctor&quot;,&quot;first&quot;,&quot;access&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, menu: false };
  componentDidMount() { this.onR = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.onR); }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  renderVals() {
    const narrow = this.state.w < 1120, cur = this.props.current ?? 'home';
    const items = [['home', 'ホーム', 'Aoba%20Clinic.dc.html'], ['about', '当院について', 'About.dc.html'], ['treatment', '診療内容', 'Treatment.dc.html'], ['doctor', '医師紹介', 'Doctor.dc.html'], ['first', '初めての方へ', 'FirstVisit.dc.html'], ['access', 'アクセス', 'Access.dc.html']];
    return {
      narrow, wide: !narrow, menuVisible: narrow && this.state.menu,
      menuIcon: this.state.menu ? 'close' : 'menu',
      toggleMenu: () => this.setState(s => ({ menu: !s.menu })),
      nav: items.map(([k, label, href]) => ({ label, href, active: k === cur })),
    };
  }
}
</script>
</body>
</html>
