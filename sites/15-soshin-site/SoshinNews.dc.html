<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新着情報 | SOSHIN 株式会社創進</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="description" content="株式会社創進の新着情報 — お知らせ・レポート・セミナー・コラム。" />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;700&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #f2f3f5; color: #14161a; font-family: "Noto Sans JP", sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: #14161a; text-decoration: none; }
  a:hover { color: #3d5f8a; }
  @keyframes so-rise { from { opacity: 0; transform: translateY(54px) scale(.985); } to { opacity: 1; transform: none; } }
  @supports (animation-timeline: view()) {
    [data-reveal] { animation: so-rise 1s cubic-bezier(.16,.84,.28,1) both; animation-timeline: view(); animation-range: entry 2% cover 26%; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</helmet>

<div style="background:#f2f3f5;overflow-x:clip">
  <dc-import name="SoshinHeader" current="news" style="position:sticky;top:0;z-index:50" hint-size="100%,77px"></dc-import>
  <dc-import name="SoshinPageHero" en="NEWS" ja="新着情報" lead="会社からのお知らせ、運用型広告のベンチマークレポート、セミナーの開催情報、現場の知見をまとめたコラムを掲載しています。" img="./images/city-street.jpg" pos="center 60%" hint-size="100%,760px"></dc-import>

  <section data-reveal="1" style="max-width:1080px;margin:0 auto;padding:40px 28px 0">
    <div style="background:#fff;box-shadow:0 18px 50px rgba(20,22,26,.07);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))">
      <div style="padding:44px 40px">
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <span style="display:inline-block;background:#3d5f8a;color:#fff;font-size:10px;letter-spacing:.14em;padding:5px 10px">PICK UP</span>
          <span style="font-family:'Cormorant Garamond',serif;letter-spacing:.1em;color:#8a929c;font-size:14px">2026/09/14</span>
        </div>
        <h2 style="margin:20px 0 0;font-family:'Shippori Mincho B1',serif;font-size:clamp(20px,2.4vw,28px);font-weight:600;line-height:1.6">2026年上半期<br />運用型広告ベンチマークレポート</h2>
        <p style="margin:16px 0 0;font-size:13px;line-height:2;color:#4a525c">支援企業のデータをもとに、業種別のクリック単価・獲得単価・商談化率の推移をまとめました。自社の数値が相場と比べてどの位置にあるかを確認いただけます。</p>
        <a href="./SoshinFlow.dc.html#form" style="display:inline-block;margin-top:26px;background:#3d5f8a;color:#fff;padding:15px 36px;font-size:12px;letter-spacing:.1em" style-hover="background:#2e4a6e;color:#fff">レポートを請求する　→</a>
      </div>
      <div style="position:relative;min-height:300px;overflow:hidden;background:#dfe4ea"><img src="./images/report-review.jpg" alt="ベンチマークレポートの資料" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" /></div>
    </div>
  </section>

  <section style="max-width:1080px;margin:0 auto;padding:88px 28px 0">
    <div style="display:flex;align-items:baseline;gap:20px;flex-wrap:wrap">
      <h2 style="margin:0;font-family:'Shippori Mincho B1',serif;font-size:clamp(22px,2.8vw,30px);font-weight:600">記事一覧</h2>
      <p style="margin:0;font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.26em;color:#9aa2ac">ALL ARTICLES</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:22px">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
        <button type="button" onclick="{{ f.pick }}" style="{{ f.style }}">{{ f.label }}</button>
      </sc-for>
    </div>
    <div style="margin-top:22px;border-top:1px solid rgba(20,22,26,.1)">
      <sc-for list="{{ shown }}" as="n" hint-placeholder-count="9">
        <article style="display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;padding:24px 4px;border-bottom:1px solid rgba(20,22,26,.1);font-size:13px">
          <span style="width:92px;font-family:'Cormorant Garamond',serif;letter-spacing:.1em;color:#8a929c;font-size:14px">{{ n.date }}</span>
          <span style="width:96px;font-size:11px;letter-spacing:.1em;color:#3d5f8a;border:1px solid rgba(61,95,138,.35);padding:5px 0;text-align:center">{{ n.tag }}</span>
          <span style="flex:1 1 320px;min-width:0">
            <span style="display:block;font-size:14px;line-height:1.8;font-weight:500">{{ n.title }}</span>
            <span style="display:block;margin-top:4px;font-size:12px;line-height:1.9;color:#6b737d">{{ n.excerpt }}</span>
          </span>
        </article>
      </sc-for>
    </div>
  </section>

  <dc-import name="SoshinFooter" cta="1" hint-size="100%,700px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tag: 'すべて' };
  }
  renderVals() {
    const cur = this.state.tag || 'すべて';
    const tags = ['すべて', 'お知らせ', 'レポート', 'セミナー', 'コラム'];
    const chip = on => 'font-family:inherit;font-size:12px;letter-spacing:.08em;padding:10px 18px;cursor:pointer;border:1px solid ' +
      (on ? '#3d5f8a;background:#3d5f8a;color:#fff' : 'rgba(20,22,26,.18);background:#fff;color:#14161a');
    const news = [
      { date: '2026/09/14', tag: 'レポート', title: '2026年上半期 運用型広告ベンチマークレポートを公開しました', excerpt: '業種別のクリック単価・獲得単価・商談化率の推移をまとめています。' },
      { date: '2026/09/02', tag: 'コラム', title: '指名検索は「育てる」もの。BtoBで比較検討に勝つための3つの指標', excerpt: '指名検索数だけを追わず、比較検討の段階で見るべき数字を整理しました。' },
      { date: '2026/08/28', tag: 'お知らせ', title: '名古屋オフィスを移転し、データ分析チームを増員しました', excerpt: '新オフィスの所在地は 愛知県名古屋市中区栄3-14-2 です。' },
      { date: '2026/08/05', tag: 'セミナー', title: '「BtoBの指名検索を育てる」無料オンラインセミナーを開催します', excerpt: 'BtoB企業のマーケティングご担当者様向けのオンラインセミナーです。' },
      { date: '2026/07/22', tag: 'コラム', title: 'GA4とCRMをつなぐ前に決めておくべき、商談データの定義', excerpt: 'ツールの連携より先に、社内で揃えておきたい言葉の定義についてまとめました。' },
      { date: '2026/06/18', tag: 'レポート', title: 'クリニック集患における地域別広告費の傾向をまとめました', excerpt: '複数院を展開する医療法人の支援データから、地域ごとの需要差を分析しています。' },
      { date: '2026/06/03', tag: 'セミナー', title: '「代理店レポートの読み方」ウェビナーのアーカイブを公開しました', excerpt: '当日ご参加いただけなかった方向けに、録画と資料を公開しています。' },
      { date: '2026/05/20', tag: 'コラム', title: 'LP改修の前に確認したい、フォーム離脱の5つの原因', excerpt: 'デザインを変える前に、計測データから確認できるポイントを紹介します。' },
      { date: '2026/04/01', tag: 'お知らせ', title: '内製化支援プランの提供を開始しました', excerpt: '運用の型と判断基準をドキュメント化し、段階的にお引き渡しするプランです。' }
    ];
    return {
      filters: tags.map(t => ({ label: t, style: chip(t === cur), pick: () => this.setState({ tag: t }) })),
      shown: cur === 'すべて' ? news : news.filter(n => n.tag === cur)
    };
  }
}
</script>
</body>
</html>
