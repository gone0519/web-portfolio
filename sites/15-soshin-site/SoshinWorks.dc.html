<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>支援実績 | SOSHIN 株式会社創進</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="description" content="株式会社創進の支援実績 — BtoB・医療・EC・不動産・物流の事例。" />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;700&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #f2f3f5; color: #14161a; font-family: "Noto Sans JP", sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: #14161a; text-decoration: none; }
  a:hover { color: #3d5f8a; }
  @keyframes so-rise { from { opacity: 0; transform: translateY(54px) scale(.985); } to { opacity: 1; transform: none; } }
  @supports (animation-timeline: view()) {
    [data-reveal] { animation: so-rise 1s cubic-bezier(.16,.84,.28,1) both; animation-timeline: view(); animation-range: entry 2% cover 26%; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</helmet>

<div style="background:#f2f3f5;overflow-x:clip">
  <dc-import name="SoshinHeader" current="works" style="position:sticky;top:0;z-index:50" hint-size="100%,77px"></dc-import>
  <dc-import name="SoshinPageHero" en="CASE STUDIES" ja="支援実績" lead="業種ごとに勝ち筋は異なります。事業の構造から設計し直した結果を、数字とともにご紹介します。掲載していない事例も、ご相談時に業種に近いものをご説明します。" img="./images/skyscrapers.jpg" pos="center 35%" hint-size="100%,760px"></dc-import>

  <section data-reveal="1" style="max-width:1080px;margin:0 auto;padding:40px 28px 0">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:rgba(20,22,26,.1)">
      <sc-for list="{{ metrics }}" as="m" hint-placeholder-count="4">
        <div style="background:#f2f3f5;padding:34px 24px;text-align:center">
          <p style="margin:0;font-family:'Cormorant Garamond',serif;font-size:44px;line-height:1;color:#3d5f8a">{{ m.value }}</p>
          <p style="margin:12px 0 0;font-size:12px;letter-spacing:.06em;color:#4a525c">{{ m.label }}</p>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="max-width:1080px;margin:0 auto;padding:88px 28px 0">
    <div style="display:flex;align-items:baseline;gap:20px;flex-wrap:wrap">
      <h2 style="margin:0;font-family:'Shippori Mincho B1',serif;font-size:clamp(22px,2.8vw,30px);font-weight:600">業種から探す</h2>
      <p style="margin:0;font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.26em;color:#9aa2ac">FILTER BY INDUSTRY</p>
      <p style="margin:0 0 0 auto;font-size:12px;color:#5c6570">{{ countLabel }}</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:22px">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="6">
        <button type="button" onclick="{{ f.pick }}" style="{{ f.style }}">{{ f.label }}</button>
      </sc-for>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:24px;margin-top:30px">
      <sc-for list="{{ shown }}" as="c" hint-placeholder-count="6">
        <article style="background:#fff;box-shadow:0 12px 34px rgba(20,22,26,.06);display:flex;flex-direction:column">
          <div style="position:relative;height:190px;overflow:hidden;background:#e7eaee"><img src="{{ c.img }}" alt="" loading="lazy" style="{{ c.imgStyle }}" /></div>
          <div style="padding:24px 26px 26px;display:flex;flex-direction:column;flex:1">
            <p style="margin:0;font-size:11px;letter-spacing:.12em;color:#3d5f8a">{{ c.industry }}</p>
            <h3 style="margin:10px 0 0;font-family:'Shippori Mincho B1',serif;font-size:18px;font-weight:600;line-height:1.7">{{ c.title }}</h3>
            <p style="margin:12px 0 0;font-size:12px;line-height:2;color:#5c6570">{{ c.body }}</p>
            <div style="flex:1;min-height:20px"></div>
            <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:18px;border-top:1px solid rgba(20,22,26,.08)">
              <span>
                <span style="display:block;font-size:10px;letter-spacing:.1em;color:#8a929c">{{ c.metric }}</span>
                <span style="display:block;font-family:'Cormorant Garamond',serif;font-size:34px;line-height:1.1;color:#14161a">{{ c.result }}</span>
              </span>
              <span style="display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px">
                <sc-for list="{{ c.tags }}" as="t" hint-placeholder-count="2">
                  <span style="font-size:10px;letter-spacing:.06em;padding:4px 8px;border:1px solid rgba(61,95,138,.35);color:#3d5f8a">{{ t }}</span>
                </sc-for>
              </span>
            </div>
          </div>
        </article>
      </sc-for>
    </div>
  </section>

  <section data-reveal="1" style="max-width:1080px;margin:0 auto;padding:100px 28px 0">
    <div style="display:flex;align-items:baseline;gap:20px;flex-wrap:wrap">
      <h2 style="margin:0;font-family:'Shippori Mincho B1',serif;font-size:clamp(22px,2.8vw,30px);font-weight:600">お客様の声</h2>
      <p style="margin:0;font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.26em;color:#9aa2ac">VOICES</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:24px;margin-top:30px">
      <sc-for list="{{ voices }}" as="v" hint-placeholder-count="3">
        <div style="background:#fff;padding:34px 32px;border-top:2px solid #3d5f8a">
          <p style="margin:0;font-family:'Shippori Mincho B1',serif;font-size:17px;line-height:2;font-weight:600">{{ v.quote }}</p>
          <p style="margin:18px 0 0;font-size:12px;color:#5c6570">{{ v.who }}</p>
        </div>
      </sc-for>
    </div>
  </section>

  <dc-import name="SoshinFooter" cta="1" hint-size="100%,700px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const cur = this.state.filter || 'all';
    const cats = [['all', 'すべて'], ['btob', 'BtoB・製造'], ['medical', '医療'], ['ec', 'EC・D2C'], ['estate', '不動産'], ['logistics', '物流']];
    const chip = on => 'font-family:inherit;font-size:12px;letter-spacing:.08em;padding:10px 18px;cursor:pointer;border:1px solid ' +
      (on ? '#3d5f8a;background:#3d5f8a;color:#fff' : 'rgba(20,22,26,.18);background:#fff;color:#14161a');
    const cases = [
      { cat: 'btob', industry: 'BtoB / 製造', title: '指名検索の育成で、商談単価を43%改善', body: '比較検討層に届くコンテンツと広告の役割を分離。年間の商談数を維持したまま、獲得コストを下げました。', metric: '商談獲得単価', result: '-43%', tags: ['広告運用', 'SEO'], img: './images/meeting-tablet.jpg' },
      { cat: 'medical', industry: '医療 / クリニック', title: '5院同時展開の予約数を2.1倍に', body: '地域別の需要差を踏まえて予算を再配分。予約フォームの改修と合わせ、離脱率を19%削減しました。', metric: 'Web予約数', result: '2.1x', tags: ['広告運用', '制作'], img: './images/smartphone.jpg' },
      { cat: 'ec', industry: 'EC / D2C', title: '広告費を据え置きで売上1.7倍', body: '既存顧客のLTVを軸に配信設計を組み直し、新規獲得と再購入の投資比率を月次で調整しました。', metric: 'EC売上', result: '1.7x', tags: ['広告運用', '分析'], img: './images/analytics-devices.jpg' },
      { cat: 'estate', industry: '不動産 / 注文住宅', title: '資料請求からの来場率を1.5倍に', body: '反響の質を見極める計測を導入し、来場につながる広告経路へ予算を集約。LPの訴求を地域別に分けました。', metric: '来場率', result: '1.5x', tags: ['分析', '制作'], img: './images/office-entrance.jpg', pos: 'center 40%' },
      { cat: 'logistics', industry: '物流 / 採用', title: '採用サイト刷新で応募数3.2倍', body: '求人媒体への依存から脱却するため、職種別の採用ページと検索広告を整備。応募単価も大きく下げました。', metric: '月間応募数', result: '3.2x', tags: ['制作', '広告運用'], img: './images/staff-duo.jpg', pos: 'center 25%' },
      { cat: 'btob', industry: 'BtoB / 精密機器', title: '海外からの問い合わせを検索経由で安定化', body: '技術資料を軸にした英語コンテンツを整備。展示会頼みだった海外の引き合いを、年間を通じて獲得できるようにしました。', metric: '海外問い合わせ', result: '4.0x', tags: ['SEO', '制作'], img: './images/building-facade.jpg' }
    ].map(c => Object.assign({}, c, {
      imgStyle: 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:' + (c.pos || 'center')
    }));
    const shown = cur === 'all' ? cases : cases.filter(c => c.cat === cur);
    return {
      countLabel: shown.length + '件の事例',
      filters: cats.map(c => ({ label: c[1], style: chip(c[0] === cur), pick: () => this.setState({ filter: c[0] }) })),
      shown,
      metrics: [
        { value: '420+', label: '支援実績社数' },
        { value: '96%', label: '年間継続率' },
        { value: '38億円', label: '累計広告運用額' },
        { value: '14年', label: '事業運営年数' }
      ],
      voices: [
        { quote: '「数字の悪い月に、いちばん丁寧に説明してくれる会社でした。」', who: 'カネヒラ食品株式会社　マーケティング部長' },
        { quote: '「レポートが社内会議の資料としてそのまま使える精度です。」', who: '株式会社トウカイ住設　取締役' },
        { quote: '「院ごとの数字の違いを、初めて説明できるようになりました。」', who: 'MEDICA CLINIC GROUP　事務長' }
      ]
    };
  }
}
</script>
</body>
</html>
