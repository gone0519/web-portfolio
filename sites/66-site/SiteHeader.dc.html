<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid #eef1f2">
  <div style="max-width:1200px;margin:0 auto;padding:0 24px;height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px">
    <a href="Asagi%20Womens%20University.dc.html" aria-label="浅葱女子大学 トップへ" style="display:flex;align-items:center;gap:10px;color:#2a3b45">
      <span style="width:34px;height:34px;background:#22b3bb;border-radius:0 12px 0 12px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Josefin Sans';font-weight:700;font-size:16px;padding-top:3px">A</span>
      <span style="display:flex;flex-direction:column;line-height:1.15">
        <span style="font-size:9px;letter-spacing:.2em;font-family:'Josefin Sans';color:#5b6b73">ASAGI WOMEN'S UNIVERSITY</span>
        <span style="font-weight:700;font-size:16px;letter-spacing:.08em">浅葱女子大学</span>
      </span>
    </a>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="メインナビゲーション" style="display:flex;align-items:center;gap:26px;font-size:13px;font-weight:500">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
          <a href="{{ l.href }}" aria-current="{{ l.aria }}" style="color:{{ l.color }};padding:6px 0;border-bottom:2px solid {{ l.line }}" style-hover="color:#0b7f88">{{ l.label }}</a>
        </sc-for>
        <a href="OpenCampus.dc.html" style="display:flex;align-items:center;gap:10px;background:#22b3bb;color:#fff;padding:8px 8px 8px 18px;border-radius:999px;font-weight:700" style-hover="background:#1d4e89;color:#fff">オープンキャンパス<span style="width:24px;height:24px;border-radius:50%;background:#e6f23c;color:#2a3b45;display:flex;align-items:center;justify-content:center;font-size:12px">→</span></a>
      </nav>
    </sc-if>
    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-label="メニューを開閉" aria-expanded="{{ menuOpen }}" style="width:44px;height:44px;border-radius:50%;border:none;background:#22b3bb;color:#fff;font-size:18px;cursor:pointer">{{ menuIcon }}</button>
    </sc-if>
  </div>
  <sc-if value="{{ showMobileMenu }}" hint-placeholder-val="{{ false }}">
    <nav aria-label="モバイルナビゲーション" style="display:flex;flex-direction:column;padding:8px 24px 24px;background:#fff;border-top:1px solid #eef1f2">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
        <a href="{{ l.href }}" style="padding:14px 0;border-bottom:1px solid #eef1f2;color:{{ l.color }};font-weight:500">{{ l.label }}</a>
      </sc-for>
      <a href="OpenCampus.dc.html" style="margin-top:16px;text-align:center;background:#22b3bb;color:#fff;padding:14px;border-radius:999px;font-weight:700">オープンキャンパス予約</a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;72px&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;about&quot;,&quot;academics&quot;,&quot;campus&quot;,&quot;admissions&quot;,&quot;opencampus&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1200, menuOpen: false };
  componentDidMount() { this.onR = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.onR); }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  renderVals() {
    const cur = this.props.current ?? '', narrow = this.state.w < 960;
    const links = [['about','About.dc.html','大学について'],['academics','Academics.dc.html','学部・学科'],['campus','Campus.dc.html','キャンパスライフ'],['admissions','Admissions.dc.html','入試情報']]
      .map(([k,href,label]) => ({ href, label, aria: k === cur ? 'page' : undefined, color: k === cur ? '#0b7f88' : '#2a3b45', line: k === cur ? '#22b3bb' : 'transparent' }));
    return { links, wide: !narrow, narrow, menuOpen: this.state.menuOpen, showMobileMenu: narrow && this.state.menuOpen,
      menuIcon: this.state.menuOpen ? '×' : '≡', toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })) };
  }
}
</script>
</body>
</html>
