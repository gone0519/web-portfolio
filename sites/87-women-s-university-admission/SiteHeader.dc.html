<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:fixed;top:0;left:0;right:0;z-index:50;transition:background .4s, box-shadow .4s;background:{{ headerBg }};backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:{{ headerShadow }};font-family:'Shippori Mincho',serif">
  <div style="max-width:1280px;margin:0 auto;padding:14px clamp(16px,4vw,40px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px">
    <nav aria-label="メインナビゲーション" style="display:flex;gap:26px;align-items:center">
      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{ leftNav }}" as="n" hint-placeholder-count="3">
          <a href="{{ n.href }}" aria-current="{{ n.aria }}" style="font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:.14em;color:{{ n.color }};padding:4px 0;white-space:nowrap;border-bottom:1px solid {{ n.line }}" style-hover="color:#c0607f">{{ n.label }}</a>
        </sc-for>
      </sc-if>
    </nav>
    <a href="Korin%20Womens%20University.dc.html" aria-label="光凛女子大学 トップへ" style="display:flex;flex-direction:column;align-items:center;gap:2px;color:#c0607f;text-decoration:none">
      <span style="font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(26px,3vw,36px);letter-spacing:.22em;line-height:1;padding-left:.22em">KORIN</span>
      <span style="font-size:10px;letter-spacing:.3em;color:#b46a8b">光凛女子大学</span>
    </a>
    <div style="display:flex;justify-content:flex-end;align-items:center;gap:26px">
      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{ rightNav }}" as="n" hint-placeholder-count="2">
          <a href="{{ n.href }}" aria-current="{{ n.aria }}" style="font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:.14em;color:{{ n.color }};padding:4px 0;white-space:nowrap;border-bottom:1px solid {{ n.line }}" style-hover="color:#c0607f">{{ n.label }}</a>
        </sc-for>
        <a href="OpenCampus.dc.html" style="display:inline-flex;align-items:center;white-space:nowrap;padding:10px 22px;border-radius:999px;background:linear-gradient(100deg,#e98aa6,#c79ae0);color:#fff;font-size:13px;letter-spacing:.12em;box-shadow:0 6px 20px rgba(201,120,170,.35);transition:transform .3s, box-shadow .3s;text-decoration:none" style-hover="color:#fff;transform:translateY(-2px);box-shadow:0 10px 26px rgba(201,120,170,.5)">オープンキャンパス</a>
      </sc-if>
      <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpenStr }}" aria-controls="mobile-menu" aria-label="メニューを開閉" style="width:48px;height:48px;border-radius:50%;border:1px solid rgba(192,96,127,.4);background:rgba(255,255,255,.6);color:#a8517a;font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.1em;cursor:pointer">{{ menuLabel }}</button>
      </sc-if>
    </div>
  </div>
  <sc-if value="{{ showMobileMenu }}" hint-placeholder-val="{{ false }}">
    <nav id="mobile-menu" aria-label="モバイルメニュー" style="display:flex;flex-direction:column;align-items:center;gap:20px;padding:28px 20px 36px;background:rgba(246,236,240,.97);border-top:1px solid rgba(192,96,127,.15)">
      <sc-for list="{{ allNav }}" as="n" hint-placeholder-count="6">
        <a href="{{ n.href }}" onClick="{{ closeMenu }}" style="display:flex;flex-direction:column;align-items:center;gap:2px;color:{{ n.color }};text-decoration:none">
          <span style="font-family:'Cormorant Garamond',serif;font-size:20px;letter-spacing:.16em">{{ n.label }}</span>
          <span style="font-size:11px;letter-spacing:.14em;color:#8a6a80">{{ n.jp }}</span>
        </a>
      </sc-for>
      <a href="OpenCampus.dc.html" style="margin-top:6px;padding:14px 32px;border-radius:999px;background:linear-gradient(100deg,#e98aa6,#c79ae0);color:#fff;font-size:14px;letter-spacing:.12em;text-decoration:none">オープンキャンパスを予約</a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;about&quot;,&quot;academics&quot;,&quot;campus&quot;,&quot;admissions&quot;,&quot;opencampus&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: 0, scrolled: false, menuOpen: false };
  componentDidMount() {
    this.onResize = () => this.forceUpdate();
    this.onScroll = () => { const s = window.scrollY > 40; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };
    if (window.ResizeObserver) { this.ro = new ResizeObserver(this.onResize); this.ro.observe(document.documentElement); }
    window.addEventListener('resize', this.onResize);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onResize(); this.onScroll();
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('scroll', this.onScroll);
    if (this.ro) this.ro.disconnect();
  }
  renderVals() {
    const cur = this.props.current || 'top';
    const w = document.documentElement.clientWidth || window.innerWidth || 1280;
    const mobile = w < 1100;
    const { scrolled, menuOpen } = this.state;
    const items = [
      { k: 'top', label: 'TOP', jp: 'トップ', href: 'Korin%20Womens%20University.dc.html' },
      { k: 'about', label: 'ABOUT', jp: '大学案内', href: 'About.dc.html' },
      { k: 'academics', label: 'ACADEMICS', jp: '学部・学科', href: 'Academics.dc.html' },
      { k: 'campus', label: 'CAMPUS LIFE', jp: 'キャンパスライフ', href: 'CampusLife.dc.html' },
      { k: 'admissions', label: 'ADMISSIONS', jp: '入試情報', href: 'Admissions.dc.html' }
    ].map(n => ({ ...n, color: n.k === cur ? '#c0607f' : '#6e4a62', line: n.k === cur ? '#c0607f' : 'transparent', aria: n.k === cur ? 'page' : undefined }));
    return {
      isDesktop: !mobile, isMobile: mobile,
      leftNav: items.slice(0, 3), rightNav: items.slice(3), allNav: items,
      menuOpenStr: menuOpen ? 'true' : 'false',
      showMobileMenu: mobile && menuOpen,
      menuLabel: menuOpen ? 'CLOSE' : 'MENU',
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
      headerBg: scrolled || menuOpen ? 'rgba(246,236,240,.86)' : 'rgba(246,236,240,0)',
      headerShadow: scrolled ? '0 4px 24px rgba(160,100,140,.12)' : 'none'
    };
  }
}
</script>
</body>
</html>
