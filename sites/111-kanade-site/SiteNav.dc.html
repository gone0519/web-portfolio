<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<aside aria-label="サイトナビゲーション" style="display: {{ railDisplay }}; position:fixed; left:0; top:0; bottom:0; width:160px; flex-direction:column; align-items:center; justify-content:space-between; gap:12px; padding: {{ railPad }}; overflow:hidden; color:#fff; z-index:20; background:#23897a">
  <a href="Kanade%20Womens%20University.dc.html" aria-label="奏女子大学 トップへ" style="display:flex; flex-direction:column; align-items:center; gap:8px; color:#fff">
    <div style="width: {{ logoSize }}; height: {{ logoSize }}; border-radius:50%; border:3px solid #fff; display:flex; align-items:center; justify-content:center"><div style="width:12px; height:12px; background:#f08a4b; border-radius:50%"></div></div>
    <div style="font-family:'M PLUS Rounded 1c'; font-weight:800; font-size:13px; letter-spacing:0.12em; line-height:1.15; text-align:center">KANADE<br><span style="font-size:9px; letter-spacing:0.08em">WOMEN'S UNIV.</span></div>
  </a>
  <nav style="display:flex; flex-direction:column; align-items:center; gap: {{ navGap }}">
    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
      <a href="{{ n.href }}" aria-current="{{ n.current }}" style="display:flex; flex-direction:column; align-items:center; gap:2px; color:#fff; opacity: {{ n.opacity }}; padding: {{ itemPad }}" style-hover="opacity:1; color:#fff">
        <span style="font-family:'M PLUS Rounded 1c'; font-weight:800; font-size:12px; letter-spacing:0.14em; text-align:center">{{ n.en }}</span>
        <span style="font-size:9px; letter-spacing:0.1em">{{ n.jp }}</span>
        <span style="width:4px; height:4px; border-radius:50%; background: {{ n.dot }}; display: {{ dotDisplay }}"></span>
      </a>
    </sc-for>
  </nav>
  <div style="display:flex; flex-direction:column; gap:8px; width:128px">
    <a href="OpenCampus.dc.html#reserve" style="display:flex; flex-direction:column; align-items:center; gap:2px; background:#fff; color:#23897a; border-radius:10px; padding: {{ btnPad }}; font-weight:700; font-size:12px" style-hover="background:#fdf1e9; color:#d9612a">
      <span style="font-family:'M PLUS Rounded 1c'; font-weight:800; font-size:10px; letter-spacing:0.12em; color:#d9612a">OPEN CAMPUS</span>
      <span>来場予約</span>
    </a>
    <a href="Admissions.dc.html#request" style="display:flex; flex-direction:column; align-items:center; gap:2px; background:#1c7065; color:#fff; border-radius:10px; padding: {{ btnPad }}; font-weight:700; font-size:12px" style-hover="background:#165d54; color:#fff">
      <span style="font-family:'M PLUS Rounded 1c'; font-weight:800; font-size:10px; letter-spacing:0.12em">REQUEST</span>
      <span>資料請求</span>
    </a>
  </div>
</aside>
<a href="Admissions.dc.html" style="display: {{ railDisplay }}; position:fixed; right:18px; top:18px; z-index:20; background:#dd6427; color:#fff; border-radius:999px; padding:10px 18px 10px 10px; align-items:center; gap:10px; font-weight:700; font-size:13px; box-shadow:0 4px 0 #b44c19" style-hover="background:#c95620; color:#fff">
  <span style="width:22px; height:22px; border-radius:50%; background:#fff; color:#dd6427; display:flex; align-items:center; justify-content:center; font-size:12px">→</span>入試情報
</a>
<header style="display: {{ barDisplay }}; position:fixed; left:0; right:0; top:0; height:60px; background:#23897a; color:#fff; align-items:center; justify-content:space-between; padding:0 14px 0 16px; z-index:30">
  <a href="Kanade%20Womens%20University.dc.html" style="display:flex; align-items:center; gap:10px; color:#fff">
    <div style="width:28px; height:28px; border-radius:50%; border:3px solid #fff; display:flex; align-items:center; justify-content:center"><div style="width:9px; height:9px; background:#f08a4b; border-radius:50%"></div></div>
    <span style="font-family:'M PLUS Rounded 1c'; font-weight:800; font-size:13px; letter-spacing:0.1em; line-height:1.1">KANADE<br><span style="font-size:8px">WOMEN'S UNIVERSITY</span></span>
  </a>
  <div style="display:flex; align-items:center; gap:8px">
    <a href="OpenCampus.dc.html#reserve" style="background:#dd6427; color:#fff; border-radius:999px; padding:9px 14px; font-size:12px; font-weight:700; min-height:44px; display:flex; align-items:center">OC予約</a>
    <button onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" aria-label="メニュー" style="width:44px; height:44px; border-radius:50%; border:2px solid #fff; background:transparent; color:#fff; font-family:'M PLUS Rounded 1c'; font-weight:800; font-size:10px; cursor:pointer">{{ menuLabel }}</button>
  </div>
</header>
<sc-if value="{{ showMenu }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed; left:0; right:0; top:60px; bottom:0; background:#23897a; z-index:29; padding:20px 24px; display:flex; flex-direction:column; overflow:auto">
    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
      <a href="{{ n.href }}" style="display:flex; justify-content:space-between; align-items:baseline; color:#fff; padding:16px 4px; border-bottom:1px solid rgba(255,255,255,0.3)">
        <span style="font-family:'M PLUS Rounded 1c'; font-weight:800; font-size:22px; letter-spacing:0.08em">{{ n.en }}</span>
        <span style="font-size:13px">{{ n.jp }}</span>
      </a>
    </sc-for>
    <a href="Admissions.dc.html#request" style="margin-top:20px; background:#fff; color:#23897a; border-radius:999px; padding:14px; text-align:center; font-weight:700">資料請求</a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;about&quot;,&quot;academics&quot;,&quot;campus&quot;,&quot;admissions&quot;,&quot;oc&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, h: typeof window !== 'undefined' ? window.innerHeight : 800, menuOpen: false };
  componentDidMount() { this.onR = () => this.setState({ w: window.innerWidth, h: window.innerHeight }); window.addEventListener('resize', this.onR); this.onR(); }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  renderVals() {
    const cur = this.props.current ?? 'top';
    const mobile = this.state.w < 900;
    const pages = [
      { id: 'top', en: 'TOP', jp: 'トップ', href: 'Kanade%20Womens%20University.dc.html' },
      { id: 'about', en: 'ABOUT', jp: '大学について', href: 'About.dc.html' },
      { id: 'academics', en: 'ACADEMICS', jp: '学部・学科', href: 'Academics.dc.html' },
      { id: 'campus', en: 'CAMPUS', jp: 'キャンパスライフ', href: 'CampusLife.dc.html' },
      { id: 'admissions', en: 'ADMISSIONS', jp: '入試情報', href: 'Admissions.dc.html' },
      { id: 'oc', en: 'OPEN CAMPUS', jp: 'オープンキャンパス', href: 'OpenCampus.dc.html' }
    ];
    return {
      railDisplay: mobile ? 'none' : 'flex',
      railPad: this.state.h < 640 ? '16px 0 14px' : '28px 0 24px',
      navGap: this.state.h < 640 ? '2px' : '14px',
      itemPad: this.state.h < 640 ? '2px 8px' : '4px 8px',
      dotDisplay: this.state.h < 640 ? 'none' : 'block',
      btnPad: this.state.h < 640 ? '6px' : '10px 6px',
      logoSize: this.state.h < 640 ? '28px' : '38px',
      barDisplay: mobile ? 'flex' : 'none',
      showMenu: mobile && this.state.menuOpen,
      menuOpen: this.state.menuOpen ? 'true' : 'false',
      menuLabel: this.state.menuOpen ? 'CLOSE' : 'MENU',
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      nav: pages.map(p => ({ ...p, current: p.id === cur ? 'page' : undefined, opacity: p.id === cur ? 1 : 0.68, dot: p.id === cur ? '#f3b23a' : 'transparent' }))
    };
  }
}
</script>
</body>
</html>
