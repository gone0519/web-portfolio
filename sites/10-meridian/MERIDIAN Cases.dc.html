<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="description" content="MERIDIAN の導入実績。SaaS、EC、人材、医療、不動産など業種別に、課題・戦略・施策・成果指標を掲載しています。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./meridian.css" />
<style>
  *{box-sizing:border-box}
  body{margin:0;background:oklch(0.985 0.005 90);color:oklch(0.28 0.02 220);font-family:'Zen Kaku Gothic New',sans-serif;-webkit-font-smoothing:antialiased;text-wrap:pretty}
  a{color:oklch(0.45 0.07 195);text-decoration:none;transition:color .25s}
  a:hover{color:oklch(0.44 0.09 62)}
  h1,h2,h3,h4{margin:0;font-weight:500}
  p{margin:0}
  [id]{scroll-margin-top:96px}
  summary::-webkit-details-marker{display:none}
  @keyframes mrd-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
</style>
</helmet>

<div style="min-height:100vh;overflow-x:clip">

<dc-import name="MeridianHeader" active="cases" hint-size="100%,120px"></dc-import>


<dc-import name="MeridianPageHero" image="images/growth-arrows.jpg" image-position="70% 50%" crumb="CASE STUDIES" en="Case Studies" jp="導入実績" lead="業種と課題の異なる 6 件を、数字の背景まで掲載しています。掲載許諾をいただいた範囲で、実際の指標を記載しました。" hint-size="100%,340px"></dc-import>
<section style="padding:clamp(56px,7vw,88px) 24px" data-reveal="1">
  <div style="max-width:1240px;margin:0 auto">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:1px;background:oklch(0.89 0.01 200);border:1px solid oklch(0.89 0.01 200)">
      <div style="background:oklch(0.99 0.004 90);padding:26px 22px"><p style="font-family:'Cormorant Garamond',serif;font-size:30px;color:oklch(0.45 0.07 195);line-height:1">48</p><p style="margin-top:8px;font-size:12px;letter-spacing:.1em;color:oklch(0.47 0.02 220)">継続支援中の企業</p></div>
      <div style="background:oklch(0.99 0.004 90);padding:26px 22px"><p style="font-family:'Cormorant Garamond',serif;font-size:30px;color:oklch(0.45 0.07 195);line-height:1">11</p><p style="margin-top:8px;font-size:12px;letter-spacing:.1em;color:oklch(0.47 0.02 220)">支援業種</p></div>
      <div style="background:oklch(0.99 0.004 90);padding:26px 22px"><p style="font-family:'Cormorant Garamond',serif;font-size:30px;color:oklch(0.45 0.07 195);line-height:1">2.8<span style="font-size:.6em">年</span></p><p style="margin-top:8px;font-size:12px;letter-spacing:.1em;color:oklch(0.47 0.02 220)">平均ご契約期間</p></div>
      <div style="background:oklch(0.99 0.004 90);padding:26px 22px"><p style="font-family:'Cormorant Garamond',serif;font-size:30px;color:oklch(0.45 0.07 195);line-height:1">96<span style="font-size:.6em">%</span></p><p style="margin-top:8px;font-size:12px;letter-spacing:.1em;color:oklch(0.47 0.02 220)">契約継続率</p></div>
    </div>
  </div>
</section>

<section style="padding:0 24px clamp(64px,8vw,104px)">
  <div style="max-width:1240px;margin:0 auto">
    <div style="display:flex;flex-wrap:wrap;gap:8px;padding-bottom:28px;border-bottom:1px solid oklch(0.89 0.01 200)">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="6">
        <button type="button" onClick="{{ f.pick }}" style="{{ f.style }}">{{ f.label }}</button>
      </sc-for>
    </div>
    <p style="margin-top:20px;font-size:12px;letter-spacing:.1em;color:oklch(0.47 0.02 220)">{{ countLabel }}</p>
    <div style="margin-top:clamp(28px,3.4vw,44px);display:flex;flex-direction:column;gap:clamp(28px,3.6vw,52px)">
      <sc-for list="{{ cases }}" as="c" hint-placeholder-count="6">
        <article style="border:1px solid oklch(0.89 0.01 200);background:oklch(0.99 0.004 90);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(288px,100%),1fr))">
          <div style="display:flex;flex-direction:column">
            <div style="aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:oklch(0.93 0.012 200)"><img src="{{ c.img }}" alt="{{ c.imgAlt }}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%" /></div>
            <div style="flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:oklch(0.89 0.01 200);border-top:1px solid oklch(0.89 0.01 200)">
              <sc-for list="{{ c.metrics }}" as="m" hint-placeholder-count="3">
                <div class="mrd-metric" style="background:oklch(0.96 0.008 200);padding:20px 14px;text-align:center"><p style="font-size:11px;letter-spacing:.08em;color:oklch(0.47 0.02 220)">{{ m.k }}</p><p class="mrd-metric-v" style="margin-top:7px;font-family:'Cormorant Garamond',serif;font-size:23px;color:oklch(0.45 0.07 195);line-height:1.1">{{ m.v }}</p></div>
              </sc-for>
            </div>
          </div>
          <div style="padding:clamp(26px,3vw,40px)">
            <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
              <span style="font-size:10.5px;letter-spacing:.14em;background:oklch(0.45 0.07 195);color:oklch(0.98 0.005 90);padding:5px 12px">{{ c.cat }}</span>
              <span style="font-size:12px;color:oklch(0.47 0.02 220)">{{ c.client }}</span>
            </div>
            <h3 style="margin-top:16px;font-family:'Shippori Mincho',serif;font-size:clamp(18px,2.2vw,23px);font-weight:600;line-height:1.65">{{ c.title }}</h3>
            <dl style="margin:24px 0 0;display:flex;flex-direction:column;gap:18px">
              <div><dt style="font-size:11.5px;letter-spacing:.16em;color:oklch(0.48 0.09 62)">CHALLENGE ／ 課題</dt><dd style="margin:8px 0 0;font-size:13px;line-height:2;color:oklch(0.4 0.015 220)">{{ c.challenge }}</dd></div>
              <div><dt style="font-size:11.5px;letter-spacing:.16em;color:oklch(0.48 0.09 62)">STRATEGY ／ 戦略</dt><dd style="margin:8px 0 0;font-size:13px;line-height:2;color:oklch(0.4 0.015 220)">{{ c.strategy }}</dd></div>
              <div><dt style="font-size:11.5px;letter-spacing:.16em;color:oklch(0.48 0.09 62)">SOLUTION ／ 施策</dt><dd style="margin:8px 0 0;font-size:13px;line-height:2;color:oklch(0.4 0.015 220)">{{ c.solution }}</dd></div>
              <div><dt style="font-size:11.5px;letter-spacing:.16em;color:oklch(0.48 0.09 62)">RESULTS ／ 成果</dt><dd style="margin:8px 0 0;font-size:13px;line-height:2;color:oklch(0.4 0.015 220)">{{ c.results }}</dd></div>
            </dl>
            <a href="MERIDIAN Contact.dc.html" style="display:inline-block;margin-top:26px;font-size:13px;letter-spacing:.08em;border-bottom:1px solid oklch(0.72 0.09 70);padding-bottom:3px">同じ業種での事例を相談する →</a>
          </div>
        </article>
      </sc-for>
    </div>
  </div>
</section>
<dc-import name="MeridianCTA" hint-size="100%,760px"></dc-import>

<dc-import name="MeridianFooter" hint-size="100%,520px"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;revealAnimations&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}">
class Component extends DCLogic {
  state = { cat: 'すべて' };
  componentDidMount() {
    if (this.props.revealAnimations === false) return;
    const nodes = Array.from(document.querySelectorAll('[data-reveal]'));
    nodes.forEach(n => { n.style.opacity = '0'; n.style.transform = 'translateY(22px)'; n.style.transition = 'opacity .8s cubic-bezier(.22,.7,.2,1), transform .8s cubic-bezier(.22,.7,.2,1)'; });
    const show = n => { n.style.opacity = '1'; n.style.transform = 'none'; };
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { show(e.target); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });
      nodes.forEach(n => io.observe(n));
    }
    this._t = setTimeout(() => nodes.forEach(show), 1600);
  }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const data = [["SaaS・BtoB","勤怠管理 SaaS","商談数 2.4 倍・獲得単価 38% 改善","指名検索に流入の 7 割が偏り、新規の母数が増えない状態でした。広告は自動入札に任せきりで、成果の良い経路が特定できていませんでした。","課題キーワード起点で検索面を再設計し、粗利ベースのコンバージョン値を送信。商談化率の高い業種に配信を寄せました。","検索広告のアカウント構成を目的別に分離、比較記事 18 本の制作、着地ページ 6 パターンの検証、営業ヒアリング内容を訴求に反映。","8 か月で商談数が 2.4 倍、獲得単価は 38% 改善。指名検索の比率は 7 割から 4 割へ下がり、新規流入が主軸になりました。",[["商談数","+140%"],["CPA","−38%"],["自然検索","+96%"]]],["EC・D2C","化粧品 D2C ブランド","定期購入の継続率を 12 ポイント改善","初回購入は取れていたものの、2 回目の継続が伸びず、広告費が回収できない構造でした。","初回購入後 30 日の体験を設計し直し、広告のターゲットを LTV 上位層に絞り込みました。","同梱物とメール 7 通の再設計、LTV 別のオーディエンス作成、定期解約理由の分類と対応、マイページの導線改善。","継続率が 12 ポイント改善し、ROAS は 318% に。広告の上限単価を引き上げられるようになり、配信量も拡大しました。",[["継続率","+12pt"],["ROAS","318%"],["LTV","+41%"]]],["人材","人材紹介サービス","応募単価を半減しながら応募数を維持","応募は集まるものの、面接通過率が低く、採用担当の工数が膨らんでいました。","職種別にランディングページを分離し、面接通過率の高い層の流入だけを残す運用に移行しました。","職種別 LP 5 本の制作、応募フォームの項目整理、通過率データを広告側に連携、低品質媒体の停止。","応募単価は 51% 下がり、応募数は維持。面接通過率は 21% 改善し、採用担当の選考工数が月 30 時間減りました。",[["応募単価","−51%"],["通過率","+21%"],["工数","−30h/月"]]],["医療・クリニック","歯科クリニック 5 院","自由診療の予約が月 42 件から 118 件へ","院ごとにサイトがばらばらで、地域検索でも競合に埋もれていました。計測もほぼ未設定でした。","5 院共通の情報設計に統一し、地域 × 診療内容で検索面を押さえる構成に切り替えました。","サイト統合と計測実装、地域ページ 24 本の制作、口コミ導線の整備、電話予約の計測、予約システムの導線改善。","9 か月で自由診療の予約が月 42 件から 118 件に増加。広告費は 1.4 倍にとどめ、予約単価を 47% 改善しました。",[["予約数","×2.8"],["予約単価","−47%"],["地域検索","1位×14語"]]],["不動産","投資用不動産の仲介","資料請求の質を上げ、受注率を 1.9 倍に","資料請求は多いが商談に至らず、営業から「見込みが薄い」と指摘が続いていました。","量から質へ指標を切り替え、検討度の高い層だけを集める訴求と、フォーム前のスクリーニングを導入しました。","訴求の絞り込みと LP 再制作、フォームに検討状況の項目を追加、除外キーワード整備、ウェビナー導線の新設。","資料請求数は 22% 減りましたが、受注率が 1.9 倍に。同じ広告費で受注件数は 1.5 倍になりました。",[["受注率","×1.9"],["受注件数","×1.5"],["商談化率","+18pt"]]],["SaaS・BtoB","建設業向け業務システム","ウェビナー経由の商談を主軸に転換","検索広告の単価が上がり続け、獲得コストが上限を超えていました。新しい経路が必要でした。","業界特化のウェビナーを定例化し、記事・広告・メールをその一点に集約しました。","ウェビナー企画と告知設計、集客用 LP と広告、事後メールの設計、参加者データの商談化分析。","6 か月でウェビナー経由が商談全体の 46% に。全体の獲得コストは 29% 下がり、営業の初回接触が短縮しました。",[["商談構成比","46%"],["獲得コスト","−29%"],["参加率","68%"]]]];
    const cats = ["すべて","SaaS・BtoB","EC・D2C","人材","医療・クリニック","不動産"];
    const cur = this.state.cat;
    const on = 'padding:11px 20px;border:1px solid oklch(0.45 0.07 195);background:oklch(0.45 0.07 195);color:oklch(0.98 0.005 90);font-family:inherit;font-size:12.5px;letter-spacing:.06em;cursor:pointer;border-radius:2px';
    const off = 'padding:11px 20px;border:1px solid oklch(0.89 0.01 200);background:oklch(0.99 0.004 90);color:oklch(0.35 0.02 220);font-family:inherit;font-size:12.5px;letter-spacing:.06em;cursor:pointer;border-radius:2px';
    const images = [['monitor-review', 'モニターで数値を確認するチーム'], ['smartphone', 'スマートフォンを操作する女性'], ['team-laptops', 'ノートPCで作業を進めるチーム'], ['city-street', 'オフィス街の大通り'], ['skyscrapers', '青空に伸びる高層ビル'], ['meeting-tablet', 'タブレットの資料を見ながら話し合う3人']];
    const list = data.map((d, i) => d.concat([images[i]])).filter(d => cur === 'すべて' || d[0] === cur);
    return {
      filters: cats.map(c => ({ label: c, style: c === cur ? on : off, pick: () => this.setState({ cat: c }) })),
      countLabel: list.length + ' 件を表示中',
      cases: list.map(d => ({
        cat: d[0], client: d[1], title: d[2], challenge: d[3], strategy: d[4], solution: d[5], results: d[6],
        img: 'images/' + d[8][0] + '.jpg', imgAlt: d[8][1],
        metrics: d[7].map(m => ({ k: m[0], v: m[1] }))
      }))
    };
  }
}
</script>
</body>
</html>
