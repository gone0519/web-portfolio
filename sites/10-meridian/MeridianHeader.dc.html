<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  /* host を消して、sticky の基準をページ全体にする */
  [data-sc-name="MeridianHeader"]{display:contents}
  .mrd-burger{display:none}
  @media (max-width:960px){
    .mrd-nav{display:none !important}
    .mrd-burger{display:flex}
  }
  @media (min-width:961px){
    .mrd-menu{display:none !important}
  }
  @media (max-width:600px){
    .mrd-topbar-tag{display:none}
    .mrd-topbar-inner{justify-content:center !important;padding:7px 20px !important}
    .mrd-header-inner{padding:10px 20px !important}
    .mrd-logo{font-size:22px !important}
  }
</style>
</helmet>

<div style="background:oklch(0.28 0.035 205);color:oklch(0.92 0.012 200);font-size:11.5px;letter-spacing:.06em">
  <div class="mrd-topbar-inner" style="max-width:1240px;margin:0 auto;padding:9px 24px;display:flex;flex-wrap:wrap;gap:8px 28px;justify-content:space-between;align-items:center">
    <p class="mrd-topbar-tag" style="margin:0">成果から逆算する、デジタルマーケティング。東京・大阪</p>
    <p style="margin:0;display:flex;gap:22px;flex-wrap:wrap"><span>受付 平日 9:30 – 18:30</span><a href="tel:0368124470" style="color:oklch(0.72 0.09 70)" style-hover="color:oklch(0.82 0.08 70)">Tel. 03-6812-4470</a></p>
  </div>
</div>

<header style="position:sticky;top:0;z-index:40;background:oklch(0.99 0.004 90 / 0.94);backdrop-filter:blur(14px);border-bottom:1px solid oklch(0.89 0.01 200)">
  <div class="mrd-header-inner" style="max-width:1240px;margin:0 auto;padding:16px 24px;display:flex;gap:20px 32px;align-items:center;justify-content:space-between">
    <a href="MERIDIAN Home.dc.html" style="display:flex;align-items:baseline;gap:11px;color:oklch(0.28 0.02 220);white-space:nowrap">
      <span class="mrd-logo" style="font-family:'Cormorant Garamond',serif;font-size:28px;letter-spacing:.2em;font-weight:500">MERIDIAN</span>
      <span style="font-size:10px;letter-spacing:.24em;color:oklch(0.47 0.02 220)">DIGITAL</span>
    </a>
    <nav class="mrd-nav" style="display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center">
      <sc-for list="{{ nav }}" as="item" hint-placeholder-count="4">
        <a href="{{ item.href }}" aria-current="{{ item.current }}" style="{{ item.style }}" style-hover="background:oklch(0.95 0.012 200);color:oklch(0.45 0.07 195)"><span style="display:block;font-size:13.5px;font-weight:500">{{ item.jp }}</span><span style="display:block;font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.14em;color:oklch(0.48 0.02 220)">{{ item.en }}</span></a>
      </sc-for>
      <a href="MERIDIAN Contact.dc.html" aria-current="{{ ctaCurrent }}" style="{{ ctaStyle }}" style-hover="background:oklch(0.36 0.06 200);color:oklch(0.985 0.005 90)">無料相談のご予約</a>
    </nav>
    <button type="button" class="mrd-burger" onClick="{{ toggleMenu }}" aria-label="{{ burgerLabel }}" aria-expanded="{{ menuExpanded }}" aria-controls="mrd-menu" style="width:44px;height:44px;flex:none;flex-direction:column;justify-content:center;align-items:center;gap:6px;background:oklch(0.28 0.035 205);border:0;border-radius:2px;cursor:pointer;padding:0">
      <span style="{{ bar1 }}"></span>
      <span style="{{ bar2 }}"></span>
      <span style="{{ bar3 }}"></span>
    </button>
  </div>

  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div id="mrd-menu" class="mrd-menu" style="position:absolute;left:0;right:0;top:100%;max-height:calc(100vh - 60px);overflow-y:auto;background:oklch(0.99 0.004 90);border-bottom:1px solid oklch(0.89 0.01 200);box-shadow:0 18px 30px oklch(0.28 0.035 205 / 0.14)">
      <nav style="max-width:1240px;margin:0 auto;padding:8px 20px 24px;display:flex;flex-direction:column">
        <sc-for list="{{ menuItems }}" as="item" hint-placeholder-count="5">
          <a href="{{ item.href }}" onClick="{{ closeMenu }}" aria-current="{{ item.current }}" style="{{ item.menuStyle }}"><span style="font-size:15px;font-weight:500">{{ item.jp }}</span><span style="font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.14em;color:oklch(0.48 0.02 220)">{{ item.en }}</span></a>
        </sc-for>
        <a href="MERIDIAN Contact.dc.html" onClick="{{ closeMenu }}" style="margin-top:20px;padding:16px;text-align:center;background:oklch(0.45 0.07 195);color:oklch(0.985 0.005 90);font-size:14px;font-weight:700;letter-spacing:.06em;border-radius:2px">無料相談のご予約</a>
        <a href="tel:0368124470" style="margin-top:10px;padding:14px;text-align:center;border:1px solid oklch(0.45 0.07 195);color:oklch(0.45 0.07 195);font-size:14px;letter-spacing:.06em;border-radius:2px">お電話 03-6812-4470</a>
      </nav>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { menuOpen: false };
  componentDidMount() {
    this._onKey = e => { if (e.key === 'Escape' && this.state.menuOpen) this.setState({ menuOpen: false }); };
    this._onResize = () => { if (this.state.menuOpen && window.innerWidth > 960) this.setState({ menuOpen: false }); };
    window.addEventListener('keydown', this._onKey);
    window.addEventListener('resize', this._onResize);
  }
  componentWillUnmount() {
    window.removeEventListener('keydown', this._onKey);
    window.removeEventListener('resize', this._onResize);
  }
  renderVals() {
    const active = this.props.active || '';
    const open = this.state.menuOpen;
    const pages = [
      { key: 'home', jp: 'トップ', en: 'Home', href: 'MERIDIAN Home.dc.html' },
      { key: 'about', jp: '会社について', en: 'About', href: 'MERIDIAN About.dc.html' },
      { key: 'services', jp: 'サービス', en: 'Services', href: 'MERIDIAN Services.dc.html' },
      { key: 'cases', jp: '導入実績', en: 'Cases', href: 'MERIDIAN Cases.dc.html' },
      { key: 'insights', jp: 'インサイト', en: 'Insights', href: 'MERIDIAN Insights.dc.html' },
      { key: 'contact', jp: 'お問い合わせ', en: 'Contact', href: 'MERIDIAN Contact.dc.html' }
    ];
    const base = 'padding:8px 14px;border-radius:2px;';
    const on = base + 'color:oklch(0.45 0.07 195);background:oklch(0.95 0.012 200);box-shadow:inset 0 -2px 0 oklch(0.72 0.09 70)';
    const off = base + 'color:oklch(0.3 0.02 220)';
    const menuBase = 'display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 4px;border-bottom:1px solid oklch(0.92 0.008 200);';
    const cta = 'margin-left:6px;padding:13px 22px;background:oklch(0.45 0.07 195);color:oklch(0.985 0.005 90);font-size:13px;font-weight:700;letter-spacing:.06em;border-radius:2px;white-space:nowrap';
    const bar = 'display:block;width:20px;height:1.5px;background:oklch(0.97 0.008 90);transition:transform .25s,opacity .25s;';
    return {
      nav: pages.filter(p => p.key !== 'home' && p.key !== 'contact').map(p => ({
        jp: p.jp, en: p.en, href: p.href,
        style: p.key === active ? on : off,
        current: p.key === active ? 'page' : undefined
      })),
      menuItems: pages.map(p => ({
        jp: p.jp, en: p.en, href: p.href,
        current: p.key === active ? 'page' : undefined,
        menuStyle: menuBase + (p.key === active ? 'color:oklch(0.45 0.07 195);box-shadow:inset 3px 0 0 oklch(0.72 0.09 70);padding-left:14px' : 'color:oklch(0.3 0.02 220)')
      })),
      ctaStyle: active === 'contact' ? cta + ';box-shadow:inset 0 -3px 0 oklch(0.72 0.09 70)' : cta,
      ctaCurrent: active === 'contact' ? 'page' : undefined,
      menuOpen: open,
      menuExpanded: open ? 'true' : 'false',
      burgerLabel: open ? 'メニューを閉じる' : 'メニューを開く',
      bar1: bar + (open ? 'transform:translateY(7.5px) rotate(45deg)' : ''),
      bar2: bar + (open ? 'opacity:0' : ''),
      bar3: bar + (open ? 'transform:translateY(-7.5px) rotate(-45deg)' : ''),
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false })
    };
  }
}
</script>
</body>
</html>
