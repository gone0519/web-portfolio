<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section id="top" style="position:relative;background:oklch(0.28 0.035 205);color:oklch(0.97 0.008 90);overflow:hidden">
  <sc-if value="{{ image }}" hint-placeholder-val="{{ false }}">
    <img src="{{ image }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{ imagePosition }};opacity:.22;filter:grayscale(.35)" />
  </sc-if>
  <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(115deg, oklch(1 0 0 / 0.045) 0 1px, transparent 1px 16px);pointer-events:none"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(120% 90% at 80% 10%, oklch(0.45 0.07 195) 0%, transparent 62%);opacity:.55;pointer-events:none"></div>
  <div style="position:relative;max-width:1240px;margin:0 auto;padding:clamp(40px,5vw,64px) 24px clamp(52px,7vw,84px)">
    <nav style="display:flex;gap:10px;font-size:11.5px;letter-spacing:.1em;color:oklch(0.86 0.012 200)"><a href="MERIDIAN Home.dc.html" style="color:oklch(0.86 0.012 200)" style-hover="color:oklch(0.82 0.08 70)">HOME</a><span>/</span><span>{{ crumb }}</span></nav>
    <p style="margin:clamp(24px,4vw,52px) 0 0;font-family:'Cormorant Garamond',serif;font-size:clamp(32px,5.4vw,64px);letter-spacing:.06em;color:oklch(0.82 0.08 70);line-height:1.1">{{ en }}</p>
    <h1 style="margin:14px 0 0;font-family:'Shippori Mincho',serif;font-size:clamp(20px,2.4vw,27px);font-weight:600;letter-spacing:.06em">{{ jp }}</h1>
    <p style="margin:24px 0 0;max-width:640px;font-size:14px;line-height:2.1;color:oklch(0.88 0.012 200)">{{ lead }}</p>
  </div>
</section>
</x-dc>
</body>
</html>
