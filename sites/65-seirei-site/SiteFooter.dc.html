<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer class="site-footer" style="position:relative;z-index:1;background:#fff;padding:90px clamp(24px,5vw,60px) 30px;font-family:'Noto Sans JP',sans-serif;color:#111">
  <div style="max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;gap:48px;justify-content:space-between">
    <div class="f-brand" style="flex:0 1 300px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center">
      <a href="Top.dc.html" style="display:flex;align-items:center;gap:12px;text-decoration:none">
        <span style="width:32px;height:32px;background:#00c8ff;transform:rotate(45deg) scale(.78);display:block"></span>
        <span style="display:flex;flex-direction:column;line-height:1.1;align-items:flex-start">
          <span style="font-weight:900;font-size:22px;letter-spacing:.08em;color:#14365a">青嶺大学</span>
          <span style="font-family:'Bebas Neue';font-size:14px;letter-spacing:.18em;color:#14365a">SEIREI UNIVERSITY</span>
        </span>
      </a>
      <span style="font-size:12px;font-weight:700;letter-spacing:.1em">入試課（アドミッションセンター）</span>
      <span style="font-size:12px;line-height:2;color:#333">〒000-0000　○○県○○市○○町0-0<br>TEL. 00-0000-0000（受付 平日9:00–17:00）<br>MAIL. admission@example.ac.jp</span>
    </div>
    <div class="f-links" style="flex:1 1 480px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 28px">
      <sc-for list="{{ links }}" as="f" hint-placeholder-count="9">
        <a href="{{ f.href }}" style="font-size:13px;display:flex;align-items:center;gap:10px;padding:4px 0;letter-spacing:.04em;color:#111;text-decoration:none" style-hover="color:#00a8d8"><span style="width:6px;height:6px;border-radius:50%;background:#00c8ff;flex:0 0 auto"></span>{{ f.t }}</a>
      </sc-for>
    </div>
  </div>
  <div style="max-width:1000px;margin:60px auto 0;display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-size:11px">
    <a href="Top.dc.html" style="color:#555;text-decoration:none">プライバシーポリシー</a><span style="color:#ccc">|</span><a href="Top.dc.html" style="color:#555;text-decoration:none">ウェブアクセシビリティ</a><span style="color:#ccc">|</span><a href="Top.dc.html" style="color:#555;text-decoration:none">サイトマップ</a>
  </div>
  <p style="margin:40px 0 0;text-align:center;font-size:10px;letter-spacing:.12em">© SEIREI UNIVERSITY（架空の大学・サンプルサイト）</p>
  <button onClick="{{ toTop }}" style="position:absolute;right:20px;bottom:40px;writing-mode:vertical-rl;font-family:'Bebas Neue';font-size:12px;letter-spacing:.2em;display:flex;gap:6px;align-items:center;border:none;background:none;cursor:pointer;color:#111"><span style="font-size:8px">▲</span>PAGE TOP</button>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1200px&quot;,&quot;height&quot;:&quot;460px&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      toTop:()=>window.scrollTo({top:0,behavior:'smooth'}),
      links:[
        {t:'トップ',href:'Top.dc.html'},{t:'学部・学科',href:'Faculties.dc.html'},{t:'入試対策',href:'Preparation.dc.html'},
        {t:'入試日程',href:'Admissions.dc.html#schedule'},{t:'出願の流れ',href:'Admissions.dc.html#apply'},{t:'学費・奨学金',href:'Admissions.dc.html#tuition'},
        {t:'よくあるご質問',href:'Admissions.dc.html#faq'},{t:'キャンパスライフ',href:'CampusLife.dc.html'},{t:'お問い合わせ・資料請求',href:'Contact.dc.html'}
      ]
    };
  }
}
</script>
</body>
</html>
