<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="background:#fff;box-shadow:0 1px 0 #e6ecdb;position:relative;font-family:'Noto Sans JP',sans-serif;color:#333">
  <div style="display:flex;align-items:stretch;justify-content:space-between;gap:16px;height:68px;padding-left:clamp(12px,3vw,40px)">
    <a href="University Admissions.dc.html" style="display:flex;align-items:center;gap:10px;color:#333;text-decoration:none">
      <div style="width:56px;height:40px;border-radius:50%;background:#8dba43;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px">ミ</div>
      <div style="display:flex;flex-direction:column;line-height:1.1;white-space:nowrap">
        <span style="font-weight:900;font-size:19px;letter-spacing:.08em">ミライ進学ナビ</span>
        <span style="font-size:10px;letter-spacing:.2em;color:#5e9e1a;font-weight:700">MIRAI SHINGAKU NAVI</span>
      </div>
    </a>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:clamp(14px,2vw,30px);font-size:13px;font-weight:700">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
          <a href="{{ n.href }}" style="color:{{ n.color }};text-decoration:none;display:flex;align-items:center;gap:4px;padding:6px 0;border-bottom:2px solid {{ n.line }};transition:all .2s;white-space:nowrap" style-hover="color:#5e9e1a;border-bottom:2px solid #8dba43">{{ n.label }}<span style="color:#8dba43;font-size:10px">▼</span></a>
        </sc-for>
      </nav>
    </sc-if>
    <div style="display:flex;align-items:stretch">
      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
        <a href="Contact.dc.html" style="text-decoration:none;background:#f0913a;color:#fff;padding:0 22px;display:flex;flex-direction:column;justify-content:center;transition:background .2s;white-space:nowrap" style-hover="background:#e27d22;color:#fff">
          <span style="font-size:20px;font-weight:900;letter-spacing:.04em;line-height:1.1">資料請求・相談</span>
          <span style="font-size:10px;font-weight:700;line-height:1.4;margin-top:2px">【受付】0120-000-000（サンプル）<br>平日10:00〜17:00</span>
        </a>
      </sc-if>
      <button onClick="{{ toggleMenu }}" aria-label="メニュー" style="width:68px;border:0;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px">
        <span style="width:28px;height:2px;background:#333;display:block"></span>
        <span style="width:28px;height:2px;background:#333;display:block"></span>
        <span style="width:28px;height:2px;background:#333;display:block"></span>
      </button>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;top:68px;right:0;width:min(340px,100%);background:#fff;border-top:4px solid #8dba43;box-shadow:0 12px 30px rgba(60,80,20,.18);padding:12px 0;z-index:60">
      <a href="University Admissions.dc.html" style="display:flex;justify-content:space-between;padding:14px 24px;color:#333;font-weight:700;font-size:14px;border-bottom:1px dashed #dfe8cf;text-decoration:none" style-hover="background:#f3f8e8;color:#5e9e1a"><span>トップ</span><span style="color:#8dba43">›</span></a>
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
        <a href="{{ n.href }}" style="display:flex;justify-content:space-between;padding:14px 24px;color:#333;font-weight:700;font-size:14px;border-bottom:1px dashed #dfe8cf;text-decoration:none" style-hover="background:#f3f8e8;color:#5e9e1a"><span>{{ n.label }}</span><span style="color:#8dba43">›</span></a>
      </sc-for>
      <div style="padding:16px 24px 8px">
        <a href="Contact.dc.html" style="display:block;text-align:center;text-decoration:none;border-radius:6px;background:#f0913a;color:#fff;font-weight:900;font-size:15px;padding:14px">資料請求・相談はこちら</a>
      </div>
    </div>
  </sc-if>
  <div style="background:#f0913a;color:#fff;display:flex;justify-content:center;align-items:center;gap:12px;padding:7px 12px;font-size:12px;font-weight:700;flex-wrap:wrap;text-align:center">
    <span style="background:#fff;color:#f0913a;border-radius:20px;padding:2px 12px;font-size:11px">受験生・保護者向け</span>
    <span>大学選びから出願・学費まで、入試情報をわかりやすく</span>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:110},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;programs&quot;,&quot;prep&quot;,&quot;admissions&quot;,&quot;campus&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, menu: false };
  componentDidMount() { this.onR = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.onR); }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  renderVals() {
    const cur = this.props.current || '';
    const nav = [['programs','大学・学部','Programs.dc.html'],['prep','受験対策','ExamPrep.dc.html'],['admissions','入試・サポート','Admissions.dc.html'],['campus','キャンパスライフ','CampusLife.dc.html'],['contact','お問い合わせ','Contact.dc.html']]
      .map(([k,label,href]) => ({ label, href, color: cur===k ? '#5e9e1a' : '#333', line: cur===k ? '#8dba43' : 'transparent' }));
    return { nav, isDesktop: this.state.w >= 1180, menuOpen: this.state.menu, toggleMenu: () => this.setState({ menu: !this.state.menu }) };
  }
}
</script>
</body>
</html>
