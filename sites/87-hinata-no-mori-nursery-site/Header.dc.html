<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:#5a4636;font-family:"Zen Maru Gothic",sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#e57f12;text-decoration:none}
a:hover{color:#c8680a}
input,select,textarea,button{font-family:inherit}
@media (max-width:767px){
  .sec{padding-top:72px!important;padding-bottom:76px!important}
  .sec-t{padding-top:72px!important}
  .sub-h{margin-top:60px!important}
  .hd-mark{width:46px!important;height:46px!important;font-size:20px!important;box-shadow:0 0 0 5px #fbd87a,0 0 0 9px #fdeec2!important}
  .hd-tel{width:46px;height:46px;border-radius:50%;background:#4bb3a6;color:#fff!important;display:flex!important;align-items:center;justify-content:center;font-size:20px!important;letter-spacing:0!important;box-shadow:0 3px 0 #36968a}
  .hd-tel-num{display:none}
  .hero-lead{border-radius:18px!important;padding:8px 16px!important;line-height:1.7}
  .val-card{grid-template-columns:96px 1fr!important;gap:14px!important;padding:16px!important}
  .kv{grid-template-columns:88px 1fr!important;gap:10px!important;padding:14px 4px!important}
  .ft-scene{height:300px!important}
  .ft-trees{bottom:118px!important;left:-20%!important;right:-20%!important;transform:scale(.72);transform-origin:center bottom}
  .ft-ground{height:160px!important}
  input,select,textarea{font-size:16px!important}
}
</style>
</helmet>
<header style="position:relative;background:#f8f3e6;padding:22px 20px 18px;overflow:hidden">
  <div style="position:absolute;left:5%;top:14px;width:150px;height:46px;border-radius:40px;background:#a9d3ef;filter:blur(6px);opacity:.75"></div>
  <div style="position:absolute;left:16%;top:70px;width:80px;height:26px;border-radius:30px;background:#bfe0f3;filter:blur(5px);opacity:.8"></div>
  <div style="position:absolute;right:6%;top:12px;width:140px;height:44px;border-radius:40px;background:#b7dbf2;filter:blur(6px);opacity:.75"></div>
  <div style="position:absolute;right:20%;top:80px;width:70px;height:22px;border-radius:30px;background:#c6e4f5;filter:blur(5px);opacity:.8"></div>
  <div style="position:absolute;left:21%;top:24px;width:12px;height:12px;background:#f2a0a8;transform:rotate(45deg);border-radius:2px"></div>
  <div style="position:absolute;right:15%;top:60px;width:12px;height:12px;background:#5fc2b4;transform:rotate(45deg);border-radius:2px"></div>
  <div style="position:absolute;right:12%;top:30px;width:9px;height:9px;background:#f5c43c;transform:rotate(45deg);border-radius:2px"></div>
  <div style="position:relative;max-width:1080px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px">
    <div style="display:flex">
      <button onClick="{{ openMenu }}" aria-label="メニューを開く" style="width:46px;height:46px;border:none;border-radius:8px;background:#f08a1c;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 3px 0 #d06f08;transition:transform .2s" style-hover="transform:translateY(-2px)">
        <span style="width:22px;height:2px;background:#fff;border-radius:2px"></span>
        <span style="width:22px;height:2px;background:#fff;border-radius:2px"></span>
        <span style="width:22px;height:2px;background:#fff;border-radius:2px"></span>
        <span style="font-size:8px;letter-spacing:.08em;font-weight:700">MENU</span>
      </button>
    </div>
    <a href="ひなたの森保育園.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:6px;color:#5a4636">
      <div class="hd-mark" style="width:58px;height:58px;border-radius:50%;background:#f8b52c;box-shadow:0 0 0 6px #fbd87a,0 0 0 11px #fdeec2;display:flex;align-items:center;justify-content:center;font-family:'Yusei Magic';color:#fff;font-size:24px">ひ</div>
      <div style="margin-top:8px;background:#f08a1c;color:#fff;font-size:9px;letter-spacing:.14em;padding:3px 16px;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);font-weight:700">HINATA NO MORI NURSERY</div>
      <div style="font-family:'Yusei Magic';font-size:clamp(20px,2.6vw,28px);letter-spacing:.12em;color:#e57f12">ひなたの森<span style="color:#5a4636">保育園</span></div>
    </a>
    <div style="display:flex;justify-content:flex-end">
      <a href="tel:0000000000" class="hd-tel" aria-label="電話する 0120-00-1234" style="font-family:'Yusei Magic';font-size:clamp(14px,1.8vw,21px);letter-spacing:.08em;color:#4bb3a6;white-space:nowrap">☎<span class="hd-tel-num"> 0120-00-1234</span></a>
    </div>
  </div>
  <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
    <nav style="position:relative;max-width:1080px;margin:18px auto 0;display:flex;justify-content:center;flex-wrap:wrap;gap:4px 8px">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
        <a href="{{ n.href }}" style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 14px;color:#5a4636;font-size:14px;font-weight:700;letter-spacing:.1em;border-bottom:3px dotted {{ n.line }};transition:color .2s" style-hover="color:#e57f12">
          <span style="font-size:9px;letter-spacing:.2em;color:#f08a1c">{{ n.en }}</span>{{ n.ja }}
        </a>
      </sc-for>
    </nav>
  </sc-if>
</header>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:60;background:#f8f3e6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:40px;overflow-y:auto">
    <button onClick="{{ closeMenu }}" aria-label="閉じる" style="position:absolute;top:22px;left:22px;width:46px;height:46px;border:none;border-radius:8px;background:#f08a1c;color:#fff;font-size:22px;cursor:pointer">×</button>
    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
      <a href="{{ n.href }}" style="font-family:'Yusei Magic';font-size:24px;letter-spacing:.1em;color:#5a4636;padding:10px 20px;display:flex;align-items:baseline;gap:14px;min-height:48px" style-hover="color:#e57f12">
        <span style="font-size:11px;color:#f08a1c;letter-spacing:.2em;width:72px;text-align:right">{{ n.en }}</span>{{ n.ja }}
      </a>
    </sc-for>
    <a href="tel:0000000000" style="margin-top:20px;font-family:'Yusei Magic';font-size:22px;color:#4bb3a6">☎ 0120-00-1234</a>
  </div>
</sc-if>
<sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
  <div style="position:fixed;right:0;top:34%;z-index:50;display:flex;flex-direction:column;gap:10px">
    <a href="contact.dc.html" style="writing-mode:vertical-rl;background:#f08a1c;color:#fff;padding:22px 12px;border-radius:14px 0 0 14px;border:3px solid #fff;border-right:none;font-weight:700;letter-spacing:.3em;font-size:14px;box-shadow:0 4px 12px rgba(90,70,54,.15);transition:padding .2s" style-hover="color:#fff;padding-right:18px">見学予約</a>
    <a href="admission.dc.html" style="writing-mode:vertical-rl;background:#4bb3a6;color:#fff;padding:22px 12px;border-radius:14px 0 0 14px;border:3px solid #fff;border-right:none;font-weight:700;letter-spacing:.3em;font-size:14px;box-shadow:0 4px 12px rgba(90,70,54,.15);transition:padding .2s" style-hover="color:#fff;padding-right:18px">入園案内</a>
  </div>
</sc-if>
<sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(248,243,230,.96);box-shadow:0 -4px 16px rgba(90,70,54,.1)">
    <a href="tel:0000000000" style="min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:30px;background:#4bb3a6;color:#fff;font-weight:700">☎ 電話する</a>
    <a href="contact.dc.html" style="min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:30px;background:#f08a1c;color:#fff;font-weight:700">見学を予約する</a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;220px&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;daily&quot;,&quot;staff&quot;,&quot;admission&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false, mobile: typeof window !== 'undefined' && window.innerWidth < 768 };
  componentDidMount() {
    this.onResize = () => this.setState({ mobile: window.innerWidth < 768 });
    window.addEventListener('resize', this.onResize);
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver(es => es.forEach(e => {
        if (e.isIntersecting) { e.target.style.opacity = 1; e.target.style.transform = 'none'; io.unobserve(e.target); }
      }), { threshold: 0.12 });
      this.io = io;
      setTimeout(() => document.querySelectorAll('[data-reveal]').forEach(el => {
        if (el.getBoundingClientRect().top < window.innerHeight) return;
        el.style.opacity = 0; el.style.transform = 'translateY(24px)';
        el.style.transition = 'opacity .8s ease, transform .8s ease';
        io.observe(el);
      }), 150);
    }
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); this.io && this.io.disconnect(); }
  renderVals() {
    const cur = this.props.current ?? 'home';
    const items = [
      ['home', 'HOME', 'ホーム', 'ひなたの森保育園.dc.html'],
      ['about', 'ABOUT', '園について', 'about.dc.html'],
      ['daily', 'DAILY', '園でのまいにち', 'daily.dc.html'],
      ['staff', 'TEACHERS', '先生と環境', 'staff.dc.html'],
      ['admission', 'ADMISSION', '入園案内', 'admission.dc.html'],
      ['contact', 'CONTACT', 'お問い合わせ', 'contact.dc.html']
    ];
    return {
      nav: items.map(([k, en, ja, href]) => ({ en, ja, href, line: k === cur ? '#f08a1c' : 'transparent' })),
      menuOpen: this.state.menuOpen,
      openMenu: () => this.setState({ menuOpen: true }),
      closeMenu: () => this.setState({ menuOpen: false }),
      mobile: this.state.mobile,
      desktop: !this.state.mobile
    };
  }
}
</script>
</body>
</html>
