<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="position:relative;background:#f4f4f4;font-family:'Noto Sans JP',sans-serif;color:#333">
  <div style="position:absolute;inset:0;background:#fff;clip-path:polygon(50% 0,100% 0,100% 100%,50% 100%,40% 70%,40% 30%)"></div>
  <div style="position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:40px;min-height:clamp(480px,36vw,620px);padding:150px clamp(20px,8vw,180px) 70px">
    <div style="flex:1 1 340px;display:flex;flex-direction:column;gap:22px;position:relative;z-index:2">
      <p style="margin:0;display:flex;gap:10px;font-size:11px;color:#888;letter-spacing:0.05em"><a href="University%20Admissions.dc.html" style="color:#888;text-decoration:none">ホーム</a><span>/</span><span style="color:#333">{{ title }}</span></p>
      <div style="position:relative;padding-top:20px">
        <span style="position:absolute;left:-0.08em;top:-0.25em;font-family:'Lexend Exa',sans-serif;font-size:clamp(56px,7vw,120px);font-weight:400;color:#e4e4e4;line-height:1;letter-spacing:-0.03em;white-space:nowrap;z-index:-1">{{ en }}</span>
        <h1 style="margin:0;font-size:clamp(28px,3vw,42px);font-weight:700;letter-spacing:0.12em;line-height:1.5;position:relative"><span style="display:inline-block;border-bottom:2px solid #1fb2c3;padding-bottom:6px">{{ title }}</span></h1>
      </div>
      <p style="margin:0;font-size:14px;line-height:2.1;letter-spacing:0.05em;max-width:460px;text-wrap:pretty">{{ lead }}</p>
    </div>
    <div style="flex:0 1 420px;width:100%;max-width:420px;aspect-ratio:1/1.1547;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:repeating-linear-gradient(45deg,#e3eef0 0 8px,#edf5f6 8px 16px);margin-left:auto">
      <img src="{{ img }}" alt="{{ title }}" style="width:100%;height:100%;object-fit:cover;display:block">
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1400,&quot;height&quot;:620},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Faculties&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;学部・学科&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
