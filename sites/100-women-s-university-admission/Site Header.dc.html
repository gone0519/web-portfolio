<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div aria-hidden="true" style="position:fixed;top:0;left:0;z-index:55;height:3px;width:{{ progress }};background:#b4442d;transition:width .1s linear"></div>
<header style="position:fixed;top:0;left:0;right:0;z-index:50;height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 clamp(16px,3vw,40px);background:{{ headerBg }};transition:background .3s">
  <a href="Top.dc.html" aria-label="白椿女子大学 トップへ" style="display:flex;align-items:center;gap:12px;color:#3b2c26;line-height:1.1">
    <span aria-hidden="true" style="width:30px;height:30px;border-radius:0 100% 0 100%;transform:rotate(-45deg);background:linear-gradient(135deg,transparent 49%,#b4442d 49.6%,#b4442d 50.4%,transparent 51%),#fff;box-shadow:0 0 0 1px #b4442d"></span>
    <span style="display:flex;flex-direction:column;gap:2px">
      <span style="font-family:'Shippori Mincho',serif;font-size:18px;letter-spacing:.16em;font-weight:600">白椿女子大学</span>
      <span style="font-family:'Cormorant Garamond',serif;font-size:11.5px;letter-spacing:.22em;font-weight:500">SHIRATSUBAKI WOMEN'S UNIVERSITY</span>
    </span>
  </a>
  <sc-if value="{{ notMobile }}" hint-placeholder-val="{{ true }}">
    <nav aria-label="メインナビゲーション" style="display:flex;align-items:center;gap:clamp(14px,2.2vw,32px)">
      <a href="About.dc.html" aria-current="{{ curAbout }}" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;color:#3b2c26;white-space:nowrap;padding-bottom:6px" style-hover="color:#b4442d"><span style="font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;letter-spacing:.1em">About</span><span style="font-size:11px;letter-spacing:.12em">大学について</span><sc-if value="{{ isAbout }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;bottom:0;left:30%;right:30%;height:2px;background:#b4442d"></span></sc-if></a>
      <a href="Academics.dc.html" aria-current="{{ curAcademics }}" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;color:#3b2c26;white-space:nowrap;padding-bottom:6px" style-hover="color:#b4442d"><span style="font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;letter-spacing:.1em">Academics</span><span style="font-size:11px;letter-spacing:.12em">学部・学び</span><sc-if value="{{ isAcademics }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;bottom:0;left:30%;right:30%;height:2px;background:#b4442d"></span></sc-if></a>
      <a href="CampusLife.dc.html" aria-current="{{ curCampus }}" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;color:#3b2c26;white-space:nowrap;padding-bottom:6px" style-hover="color:#b4442d"><span style="font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;letter-spacing:.1em">Campus Life</span><span style="font-size:11px;letter-spacing:.12em">キャンパスライフ</span><sc-if value="{{ isCampus }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;bottom:0;left:30%;right:30%;height:2px;background:#b4442d"></span></sc-if></a>
      <a href="Admissions.dc.html" aria-current="{{ curAdmissions }}" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;color:#3b2c26;white-space:nowrap;padding-bottom:6px" style-hover="color:#b4442d"><span style="font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;letter-spacing:.1em">Admissions</span><span style="font-size:11px;letter-spacing:.12em">入試情報</span><sc-if value="{{ isAdmissions }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;bottom:0;left:30%;right:30%;height:2px;background:#b4442d"></span></sc-if></a>
      <a href="OpenCampus.dc.html" style="display:flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;background:#b4442d;color:#fff;font-size:14px;letter-spacing:.1em;font-weight:700;white-space:nowrap" style-hover="background:#8f3a27;color:#fff">オープンキャンパス予約 <span aria-hidden="true">→</span></a>
    </nav>
  </sc-if>
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ toggleMenu }}" aria-label="メニューを開く" aria-expanded="{{ menuOpen }}" style="width:48px;height:48px;border:0;background:transparent;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:6px;cursor:pointer;padding:0 4px">
      <span style="display:block;width:26px;height:1.5px;background:#3b2c26"></span>
      <span style="display:block;width:18px;height:1.5px;background:#3b2c26"></span>
      <span style="display:block;width:26px;height:1.5px;background:#3b2c26"></span>
    </button>
  </sc-if>
</header>

<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-label="メニュー" style="position:fixed;inset:0;z-index:60;background:#f7dccf;display:flex;flex-direction:column;padding:24px 28px;overflow:auto">
    <div style="display:flex;justify-content:flex-end">
      <button onClick="{{ closeMenu }}" aria-label="メニューを閉じる" style="width:48px;height:48px;border:0;background:transparent;font-size:30px;color:#3b2c26;cursor:pointer;font-family:'Cormorant Garamond',serif">×</button>
    </div>
    <nav aria-label="モバイルナビゲーション" style="display:flex;flex-direction:column;margin-top:16px">
      <a href="Top.dc.html" style="display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;border-bottom:1px solid #e4b9a6;color:#3b2c26;font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600">Top<span style="font-size:14px;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500">トップ</span></a>
      <a href="About.dc.html" style="display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;border-bottom:1px solid #e4b9a6;color:#3b2c26;font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600">About<span style="font-size:14px;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500">大学について</span></a>
      <a href="Academics.dc.html" style="display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;border-bottom:1px solid #e4b9a6;color:#3b2c26;font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600">Academics<span style="font-size:14px;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500">学部・学び</span></a>
      <a href="CampusLife.dc.html" style="display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;border-bottom:1px solid #e4b9a6;color:#3b2c26;font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600">Campus Life<span style="font-size:14px;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500">キャンパスライフ</span></a>
      <a href="Admissions.dc.html" style="display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;border-bottom:1px solid #e4b9a6;color:#3b2c26;font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600">Admissions<span style="font-size:14px;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500">入試情報</span></a>
    </nav>
    <a href="OpenCampus.dc.html" style="margin-top:32px;display:flex;justify-content:center;gap:10px;padding:18px;border-radius:999px;background:#b4442d;color:#fff;font-size:15px;font-weight:700;letter-spacing:.1em">オープンキャンパス予約 →</a>
  </div>
</sc-if>

<sc-if value="{{ showBadge }}" hint-placeholder-val="{{ true }}">
  <a href="OpenCampus.dc.html" aria-label="オープンキャンパスを予約する" style="position:fixed;right:clamp(14px,3vw,44px);bottom:clamp(14px,3vw,40px);z-index:45;width:clamp(96px,9vw,124px);height:clamp(96px,9vw,124px);border-radius:50%;background:#3d706d;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(59,44,38,.18);transition:transform .3s" style-hover="transform:scale(1.06);color:#fff">
    {{ badgeRing }}
    <span style="position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'Shippori Mincho',serif;font-weight:600;font-size:14px;letter-spacing:.1em;line-height:1.4;text-align:center">見学<br>予約<span style="font-size:15px">→</span></span>
  </a>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;about&quot;,&quot;academics&quot;,&quot;campus&quot;,&quot;admissions&quot;,&quot;opencampus&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showBadge&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, menu: false, scrolled: false };
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth });
    this.onScroll = () => {
      const s = window.scrollY > 40;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const p = max > 0 ? Math.round((window.scrollY / max) * 1000) / 10 : 0;
      if (s !== this.state.scrolled || p !== this.state.p) this.setState({ scrolled: s, p });
      this.parallax && this.parallax();
    };
    window.addEventListener('resize', this.onResize);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onResize(); this.onScroll();
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) this.setupMotion();
  }
  setupMotion() {
    if (!document.getElementById('sb-motion')) {
      const st = document.createElement('style');
      st.id = 'sb-motion';
      st.textContent = `@keyframes sb-float{0%,100%{translate:0 0;rotate:0deg}50%{translate:0 -12px;rotate:6deg}}
@keyframes sb-drift{0%,100%{translate:0 0}50%{translate:10px -8px}}
@keyframes sb-spin{to{transform:rotate(360deg)}}
@keyframes sb-head{from{translate:0 -100%;opacity:0}to{translate:0 0;opacity:1}}
@keyframes sb-curtain{0%{opacity:1}70%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes sb-leaf-in{0%{opacity:0;scale:.4;rotate:-90deg}100%{opacity:1;scale:1;rotate:-45deg}}
main a span[aria-hidden="true"],footer a span[aria-hidden="true"]{display:inline-block;transition:translate .3s}
main a:hover span[aria-hidden="true"],footer a:hover span[aria-hidden="true"]{translate:5px 0}`;
      document.head.appendChild(st);
    }
    const hd = document.querySelector('header');
    if (hd) hd.style.animation = 'sb-head .9s cubic-bezier(.2,.7,.2,1) both';
    if (!sessionStorage.getItem('sb-curtain')) {
      sessionStorage.setItem('sb-curtain', '1');
      const c = document.createElement('div');
      c.setAttribute('aria-hidden', 'true');
      c.style.cssText = 'position:fixed;inset:0;z-index:100;background:#f7dccf;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:sb-curtain 1.6s ease forwards;pointer-events:none';
      c.innerHTML = '<span style="width:44px;height:44px;border-radius:0 100% 0 100%;background:linear-gradient(135deg,transparent 49%,#b4442d 49.6%,#b4442d 50.4%,transparent 51%),#fff;box-shadow:0 0 0 1px #b4442d;animation:sb-leaf-in .9s cubic-bezier(.2,.7,.2,1) both"></span><span style="font-family:\'Shippori Mincho\',serif;font-weight:600;font-size:22px;letter-spacing:.3em;color:#3b2c26">白椿女子大学</span>';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 1800);
    }
    setTimeout(() => this.scanMotion(), 350);
  }
  scanMotion() {
    const main = document.querySelector('main');
    if (!main) return;
    const ease = 'cubic-bezier(.2,.7,.2,1)';
    const reveal = [];
    // floating leaves & drifting patterns
    document.querySelectorAll('[aria-hidden="true"]').forEach((el, i) => {
      const s = el.style;
      if ((s.borderRadius || '').startsWith('0') && (s.borderRadius || '').includes('100%')) {
        el.querySelectorAll('div').length || (s.animation = `sb-float ${5 + (i % 4)}s ease-in-out ${(i % 5) * -1.1}s infinite`);
        el.querySelectorAll('div').forEach((d, j) => d.style.animation = `sb-float ${5 + j}s ease-in-out ${j * -1.4}s infinite`);
      } else if (/repeating-linear-gradient|radial-gradient\(rgb\(240, 162, 56\)|radial-gradient\(#f0a238/.test(s.background + s.backgroundImage)) {
        s.animation = `sb-drift ${7 + (i % 3)}s ease-in-out infinite`;
      }
    });
    document.querySelectorAll('main [aria-hidden="true"] div').forEach((d, j) => {
      if ((d.style.borderRadius || '').includes('100%')) d.style.animation = `sb-float ${5 + (j % 3)}s ease-in-out ${j * -1.3}s infinite`;
    });
    // parallax giant words
    this.px = [...main.querySelectorAll('[aria-hidden="true"]')].filter(el => el.style.fontStyle === 'italic' && el.style.position === 'absolute' && el.style.pointerEvents === 'none');
    this.parallax = () => {
      const vh = window.innerHeight;
      this.px.forEach((el, i) => {
        const r = el.parentElement.getBoundingClientRect();
        const k = (r.top + r.height / 2 - vh / 2) / vh;
        el.style.translate = `${(i % 2 ? 1 : -1) * k * 80}px ${k * 40}px`;
      });
    };
    this.parallax();
    // vertical titles: wipe from top
    main.querySelectorAll('h1,h2,h3').forEach(el => {
      if (el.style.writingMode === 'vertical-rl') {
        el.style.clipPath = 'inset(0 0 100% 0)';
        el.style.transition = `clip-path 1.6s ${ease}`;
        el.dataset.sbClip = '1';
        reveal.push(el);
      }
    });
    // images: zoom-settle + fade
    main.querySelectorAll('image-slot').forEach(el => {
      el.style.opacity = '0'; el.style.scale = '1.12';
      el.style.transition = `opacity 1.1s ease, scale 1.6s ${ease}`;
      reveal.push(el);
    });
    // text & cards: fade up, staggered among siblings
    main.querySelectorAll('h1,h2,h3,h4,p,article,li,dl,form,figure,blockquote,nav,a[style*="border-radius: 999px"]').forEach(el => {
      if (el.dataset.sbClip || el.closest('[data-sb-up]') || el.closest('[aria-hidden="true"]')) return;
      el.dataset.sbUp = '1';
      const idx = el.parentElement ? [...el.parentElement.children].indexOf(el) : 0;
      el.style.opacity = '0'; el.style.translate = '0 40px';
      el.style.transition = `opacity .9s ease ${Math.min(idx, 6) * 0.09}s, translate 1s ${ease} ${Math.min(idx, 6) * 0.09}s`;
      reveal.push(el);
    });
    // big decorative numbers / italic English titles: slide in from left
    main.querySelectorAll('span').forEach(el => {
      const s = el.style;
      if (s.fontStyle === 'italic' && parseFloat(s.fontSize) >= 20 && !el.closest('[data-sb-up]') && !(s.pointerEvents === 'none' && s.position === 'absolute' && el.getAttribute('aria-hidden'))) {
        if (el.closest('[aria-hidden="true"]') && s.position === 'absolute' && s.whiteSpace === 'nowrap') return;
        el.style.opacity = '0'; el.style.translate = '-40px 0';
        el.style.transition = `opacity 1s ease .15s, translate 1.2s ${ease} .15s`;
        el.dataset.sbUp = '1';
        reveal.push(el);
      }
    });
    this.pending = new Set(reveal);
    const show = el => {
      if (!this.pending.has(el)) return;
      this.pending.delete(el);
      el.style.opacity = '1'; el.style.translate = '0 0'; el.style.scale = '1';
      if (el.dataset.sbClip) el.style.clipPath = 'inset(0 0 0 0)';
      this.io && this.io.unobserve(el);
    };
    this.revealAll = () => [...this.pending].forEach(el => { el.style.transition = 'none'; show(el); });
    this.revealVisible = () => {
      const vh = window.innerHeight;
      [...this.pending].forEach(el => { const r = el.getBoundingClientRect(); if (r.top < vh - 20 && r.bottom > 0) show(el); });
    };
    if (document.hidden) { this.revealAll(); return; }
    window.addEventListener('beforeprint', this.revealAll);
    window.addEventListener('scroll', this.revealVisible, { passive: true });
    if ('IntersectionObserver' in window) {
      this.io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && show(e.target)), { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
      setTimeout(() => reveal.forEach(el => this.io.observe(el)), 50);
    }
    setTimeout(() => this.revealVisible(), 120);
    setTimeout(() => document.hidden ? this.revealAll() : this.revealVisible(), 1500);
    this.onVis = () => { if (document.hidden) this.revealAll(); };
    document.addEventListener('visibilitychange', this.onVis);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('scroll', this.onScroll);
    this.io && this.io.disconnect();
    this.revealAll && window.removeEventListener('beforeprint', this.revealAll);
    this.revealVisible && window.removeEventListener('scroll', this.revealVisible);
    this.onVis && document.removeEventListener('visibilitychange', this.onVis);
  }
  renderVals() {
    const h = React.createElement;
    const a = this.props.active ?? 'top';
    const isMobile = this.state.w < 1080;
    const cur = k => (a === k ? 'page' : undefined);
    return {
      isMobile, notMobile: !isMobile,
      menuOpen: isMobile && this.state.menu,
      toggleMenu: () => this.setState(s => ({ menu: !s.menu })),
      closeMenu: () => this.setState({ menu: false }),
      headerBg: (this.state.scrolled || a === 'opencampus') ? 'rgba(247,220,207,.95)' : 'transparent',
      progress: (this.state.p || 0) + '%',
      isAbout: a === 'about', isAcademics: a === 'academics', isCampus: a === 'campus', isAdmissions: a === 'admissions',
      curAbout: cur('about'), curAcademics: cur('academics'), curCampus: cur('campus'), curAdmissions: cur('admissions'),
      showBadge: (this.props.showBadge ?? true) && a !== 'opencampus',
      badgeRing: h('svg', { viewBox: '0 0 100 100', 'aria-hidden': true, style: { position: 'absolute', inset: 0, width: '100%', height: '100%', animation: 'sb-spin 18s linear infinite' } },
        h('defs', null, h('path', { id: 'sb-ring', d: 'M50,50 m-38,0 a38,38 0 1,1 76,0 a38,38 0 1,1 -76,0' })),
        h('text', { fill: '#fff', style: { fontFamily: "'Cormorant Garamond',serif", fontSize: 10.5, fontWeight: 600, letterSpacing: '.3em' } }, h('textPath', { href: '#sb-ring' }, 'OPEN CAMPUS · VISIT US · ')))
    };
  }
}
</script>
</body>
</html>
