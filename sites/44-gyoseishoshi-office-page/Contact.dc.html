<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Old+Mincho:wght@400;600&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<script src="./site-motion.js"></script>
<link href="./site.css" rel="stylesheet">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:#222;font-family:"Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#00a7ad;text-decoration:none}
a:hover{color:#222}
input,select,textarea,button{font-family:inherit}
</style>
</helmet>
<dc-import name="SiteHeader" current="contact" hint-size="100%,77px" style="position:sticky;top:0;z-index:50;display:block"></dc-import>
<main id="top" style="max-width:1600px;margin:0 auto;border-left:1px solid #f3f3f3;border-right:1px solid #f3f3f3;overflow:hidden">
  <dc-import name="PageHero" title="お問い合わせ・アクセス" en="CONTACT" image-id="page-contact" image-src="uploads/handshake-outdoor.jpg" placeholder="受付・エントランス" hint-size="100%,430px"></dc-import>

  <section data-screen-label="Contact / Methods" style="background:#e3fdfe;padding:clamp(64px,7vw,90px) clamp(20px,4vw,48px);display:flex;flex-direction:column;align-items:center;text-align:center">
    <h2 data-reveal="up" style="margin:0;font-size:clamp(28px,2.4vw,36px);font-weight:900;letter-spacing:0.04em"><span style="color:#00b3b8">ご相談</span>は<span style="position:relative;padding-bottom:2px">こちら<span data-reveal="bar" data-delay="500" data-origin="left" style="position:absolute;left:0;right:0;bottom:-2px;height:3px;background:#222"></span></span></h2>
    <p data-reveal="up" data-delay="200" style="margin:28px 0 0;font-size:15px;line-height:1.9;letter-spacing:0.06em">初回相談（60分）は無料です。<br>「どの手続きが必要かわからない」という段階でもお気軽にどうぞ。</p>
    <div data-stagger="150" style="margin-top:40px;width:100%;max-width:960px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:20px">
      <a data-reveal="up" href="tel:0540000000" style="background:#fff;border:3px solid #00c4c8;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#222;transition:transform .35s,box-shadow .35s" style-hover="transform:translateY(-4px);box-shadow:0 18px 32px -20px rgba(0,60,70,.35);color:#222">
        <span style="font-size:13px;font-weight:700;color:#00a7ad;letter-spacing:0.08em">お電話</span>
        <span style="font-family:Lato,sans-serif;font-weight:900;font-size:clamp(24px,2.2vw,30px)">054-000-0000</span>
        <span style="font-size:12px">平日 9:00 – 18:00</span>
      </a>
      <a data-reveal="up" href="#form" style="background:#00c4c8;border:3px solid #00c4c8;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;transition:transform .35s,background .35s" style-hover="transform:translateY(-4px);background:#1f3a5c;color:#fff">
        <span style="font-size:13px;font-weight:700;letter-spacing:0.08em">フォーム</span>
        <span style="font-size:clamp(18px,1.6vw,22px);font-weight:700;letter-spacing:0.06em">24時間受付</span>
        <span style="font-size:12px">原則1営業日以内にご返信</span>
      </a>
      <a data-reveal="up" href="mailto:info@example.jp" style="background:#fff;border:3px solid #00c4c8;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#222;transition:transform .35s,box-shadow .35s" style-hover="transform:translateY(-4px);box-shadow:0 18px 32px -20px rgba(0,60,70,.35);color:#222">
        <span style="font-size:13px;font-weight:700;color:#00a7ad;letter-spacing:0.08em">メール</span>
        <span style="font-family:Lato,sans-serif;font-weight:900;font-size:clamp(20px,1.8vw,24px)">info@example.jp</span>
        <span style="font-size:12px">資料の添付もできます</span>
      </a>
    </div>
  </section>

  <section id="form" data-screen-label="Contact / Form" style="scroll-margin-top:76px;padding:clamp(64px,7vw,96px) clamp(20px,4vw,48px);display:flex;flex-direction:column;align-items:center">
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
      <span data-reveal="bar" style="width:60px;height:3px;background:#00c4c8"></span>
      <span data-reveal="track" data-delay="200" style="margin-top:28px;font-family:Lato,sans-serif;font-size:13px;letter-spacing:0.1em">FORM</span>
      <h2 data-reveal="up" data-delay="300" style="margin:14px 0 0;font-size:clamp(26px,2.6vw,38px);font-weight:900;letter-spacing:0.06em">ご相談フォーム</h2>
    </div>
    <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
      <form data-reveal="up" data-delay="200" onSubmit="{{ submit }}" style="margin-top:48px;width:100%;max-width:860px;background:#f6f6f6;padding:clamp(28px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px 28px">
        <label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700">お名前 <span style="font-weight:400;color:#00a7ad;font-size:11px;margin-top:-6px">必須</span><input required="" name="name" autocomplete="name" placeholder="山田 太郎" style="height:50px;border:1px solid #cfd8d9;padding:0 16px;font-size:15px;background:#fff;outline-color:#00c4c8"></label>
        <label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700">会社名・屋号 <span style="font-weight:400;color:#888;font-size:11px;margin-top:-6px">任意</span><input name="company" autocomplete="organization" style="height:50px;border:1px solid #cfd8d9;padding:0 16px;font-size:15px;background:#fff;outline-color:#00c4c8"></label>
        <label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700">メールアドレス <span style="font-weight:400;color:#00a7ad;font-size:11px;margin-top:-6px">必須</span><input required="" type="email" name="email" autocomplete="email" placeholder="example@mail.jp" style="height:50px;border:1px solid #cfd8d9;padding:0 16px;font-size:15px;background:#fff;outline-color:#00c4c8"></label>
        <label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700">電話番号 <span style="font-weight:400;color:#888;font-size:11px;margin-top:-6px">任意</span><input type="tel" name="tel" autocomplete="tel" style="height:50px;border:1px solid #cfd8d9;padding:0 16px;font-size:15px;background:#fff;outline-color:#00c4c8"></label>
        <label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700">ご相談の分野<select name="topic" style="height:50px;border:1px solid #cfd8d9;padding:0 12px;font-size:15px;background:#fff;outline-color:#00c4c8"><option>法人設立・事業サポート</option><option>建設業・各種許認可</option><option>在留資格・国際業務</option><option>相続・遺言・契約書</option><option>その他・わからない</option></select></label>
        <label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700">ご希望の相談方法<select name="method" style="height:50px;border:1px solid #cfd8d9;padding:0 12px;font-size:15px;background:#fff;outline-color:#00c4c8"><option>事務所で面談</option><option>オンライン（ビデオ通話）</option><option>お電話</option></select></label>
        <label style="grid-column:1/-1;display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700">ご相談内容<textarea name="message" rows="6" placeholder="現在の状況やご希望のスケジュールなど、わかる範囲でご記入ください。" style="border:1px solid #cfd8d9;padding:14px 16px;font-size:15px;line-height:1.7;resize:vertical;background:#fff;outline-color:#00c4c8"></textarea></label>
        <label style="grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:13px;min-height:44px"><input required="" type="checkbox" style="width:20px;height:20px;accent-color:#00c4c8">個人情報の取り扱いに同意する</label>
        <div style="grid-column:1/-1;display:flex;justify-content:center">
          <button type="submit" data-loop="pulse" style="position:relative;overflow:hidden;width:100%;max-width:400px;min-height:60px;border:0;border-radius:999px;background:#00c4c8;color:#fff;font-size:17px;font-weight:700;letter-spacing:0.08em;cursor:pointer;transition:background .3s,transform .3s" style-hover="background:#1f3a5c;transform:translateY(-3px)">送信する<span data-loop="shimmer" aria-hidden="true" style="position:absolute;top:0;left:0;width:28%;height:100%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.45),rgba(255,255,255,0));pointer-events:none"></span></button>
        </div>
      </form>
    </sc-if>
    <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
      <div role="status" style="animation:menuIn .6s cubic-bezier(.2,.7,.2,1);margin-top:48px;width:100%;max-width:860px;background:#f6f6f6;padding:56px 32px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center">
        <span style="width:60px;height:3px;background:#00c4c8"></span>
        <p style="margin:8px 0 0;font-size:20px;font-weight:700;letter-spacing:0.06em">送信ありがとうございました</p>
        <p style="margin:0;font-size:14px;line-height:1.9">内容を確認のうえ、原則1営業日以内にご連絡いたします。</p>
        <button type="button" onClick="{{ reset }}" style="margin-top:8px;min-height:48px;padding:0 28px;border:2px solid #222;border-radius:999px;background:transparent;font-size:14px;cursor:pointer">フォームに戻る</button>
      </div>
    </sc-if>
  </section>

  <section id="access" data-screen-label="Contact / Access" style="scroll-margin-top:76px;background:#eeeeee;padding:clamp(64px,7vw,96px) 0 0">
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px">
      <span data-reveal="bar" style="width:60px;height:3px;background:#00c4c8"></span>
      <span data-reveal="track" data-delay="200" style="margin-top:28px;font-family:Lato,sans-serif;font-size:13px;letter-spacing:0.1em">ACCESS</span>
      <h2 data-reveal="up" data-delay="300" style="margin:14px 0 0;font-size:clamp(26px,2.6vw,38px);font-weight:900;letter-spacing:0.06em">アクセス</h2>
    </div>
    <div style="margin-top:clamp(40px,4vw,56px);padding:0 clamp(20px,5vw,80px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(24px,3vw,48px)">
      <div data-reveal="wipe" style="position:relative;aspect-ratio:4/3;overflow:hidden;background:#dfe6e7"><image-slot id="hero-exterior-2" src="uploads/buildings.jpg" shape="rect" placeholder="事務所外観"></image-slot></div>
      <div data-reveal="right" data-delay="200" style="background:#fff;padding:clamp(24px,3vw,44px);display:flex;flex-direction:column">
        <dl style="margin:0;border-top:1px solid #222">
          <sc-for list="{{ access }}" as="a" hint-placeholder-count="5">
            <div style="display:flex;flex-wrap:wrap;gap:6px 24px;padding:16px 4px;border-bottom:1px solid #ddd">
              <dt style="flex:0 0 110px;font-size:13px;font-weight:700;color:#00a7ad">{{ a.k }}</dt>
              <dd style="flex:1 1 220px;margin:0;font-size:14px;line-height:1.8">{{ a.v }}</dd>
            </div>
          </sc-for>
        </dl>
        <div style="margin-top:24px;display:flex;flex-wrap:wrap;gap:12px">
          <a href="https://maps.google.com" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border:2px solid #222;border-radius:999px;color:#222;font-size:14px;background:linear-gradient(90deg,#222 50%,transparent 50%);background-size:202% 100%;background-position:100% 0;transition:background-position .45s cubic-bezier(.7,0,.2,1),color .45s" style-hover="background-position:0 0;color:#fff">Google マップで開く</a>
        </div>
      </div>
    </div>
    <div style="margin-top:clamp(40px,4vw,56px);position:relative;height:clamp(280px,30vw,440px);background:#e5e3df"><image-slot id="access-map" shape="rect" placeholder="地図（Google Maps 埋め込み）"></image-slot></div>
  </section>
</main>
<dc-import name="SiteFooter" show-cta="{{ false }}" hint-size="100%,420px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { sent: false };
  componentDidMount() { const go = () => window.SiteMotion ? window.SiteMotion.init() : setTimeout(go, 50); go(); }
  renderVals() {
    return {
      sent: this.state.sent, notSent: !this.state.sent,
      submit: e => { e.preventDefault(); this.setState({ sent: true }); },
      reset: () => this.setState({ sent: false }),
      access: [
        { k: '所在地', v: '〒420-0000 静岡県静岡市葵区〇〇町1丁目2番3号 〇〇ビル2F' },
        { k: '電車', v: 'JR静岡駅 北口より徒歩10分' },
        { k: 'バス', v: '「〇〇町」バス停より徒歩2分' },
        { k: 'お車', v: '事務所前に専用駐車場2台（満車時は近隣コインパーキングをご利用ください）' },
        { k: '営業時間', v: '月〜金曜日 9:00 – 18:00（土・日・祝日・夜間はご予約により対応）' }
      ]
    };
  }
}
</script>
</body>
</html>
