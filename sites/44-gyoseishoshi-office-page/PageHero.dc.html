<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="font-family:'Noto Sans JP',sans-serif;color:#222">
  <div style="position:relative;height:clamp(220px,26vw,380px);overflow:hidden;background:#eef3f4">
    <div data-reveal="wipeR" class="ph-img" style="position:absolute;inset:0 0 0 clamp(0px,24vw,420px)">
      <div data-parallax="0.08" style="position:absolute;inset:-12% 0"><div data-loop="kenburns" style="position:absolute;inset:0"><image-slot id="{{ imageId }}" src="{{ imageSrc }}" shape="rect" placeholder="{{ placeholder }}"></image-slot></div></div>
    </div>
    <div class="ph-fade" style="position:absolute;inset:0;background:linear-gradient(90deg,#fff 0%,#fff 22%,rgba(255,255,255,0.85) 40%,rgba(255,255,255,0) 62%);pointer-events:none"></div>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:0 clamp(24px,6vw,100px);pointer-events:none">
      <span data-reveal="bar" data-origin="left" style="width:60px;height:3px;background:#00c4c8"></span>
      <span data-reveal="track" data-delay="200" style="font-family:Lato,sans-serif;font-size:13px;letter-spacing:0.16em;color:#00a7ad">{{ en }}</span>
      <h1 data-reveal="wipe" data-delay="300" class="ph-title" style="margin:0;font-family:'Zen Old Mincho',serif;font-weight:400;font-size:clamp(30px,3.4vw,50px);letter-spacing:0.08em;line-height:1.3">{{ title }}</h1>
      <span data-reveal="diamond" data-delay="600" class="ph-deco" style="position:absolute;right:clamp(24px,6vw,100px);bottom:28px;width:14px;height:14px;border:2px solid #00c4c8;transform:rotate(45deg)"></span>
    </div>
  </div>
  <nav aria-label="パンくずリスト" style="max-width:1600px;margin:0 auto;padding:16px clamp(24px,6vw,100px);display:flex;flex-wrap:wrap;gap:10px;font-size:12px;letter-spacing:0.04em;border-bottom:1px solid #f0f0f0">
    <a href="Top.dc.html" style="color:#00a7ad;text-decoration:none">TOP</a><span style="color:#aaa">/</span><span>{{ title }}</span>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;440px&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;事務所について&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ABOUT&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;imageId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;hero-about&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ページ見出し写真&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
