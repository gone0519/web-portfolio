<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header ref="{{ headerRef }}" style="position:fixed;top:0;left:0;right:0;z-index:50;height:44px;background:rgba(14,14,13,0.94);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,2.4vw,32px);backdrop-filter:blur(6px);font-family:'Noto Serif JP',serif;transition:transform .6s cubic-bezier(.2,.7,.2,1)">
  <div aria-hidden="true" ref="{{ progressRef }}" style="position:absolute;left:0;right:0;bottom:0;height:2px;background:#8a1414;transform:scaleX(0);transform-origin:left;pointer-events:none"></div>
  <a href="Farm%20Website.dc.html" style="display:flex;align-items:baseline;gap:12px;color:#fff;flex-shrink:0;white-space:nowrap;text-decoration:none">
    <span style="font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;letter-spacing:0.16em">SAMPLE FARM</span>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}"><span style="font-size:11px;letter-spacing:0.2em;color:#a9a69c">株式会社 ○○農園</span></sc-if>
  </a>
  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
    <nav aria-label="メインナビゲーション" style="display:flex;align-items:center;gap:clamp(16px,2.2vw,30px);font-family:'Noto Sans JP',sans-serif;font-size:11px;letter-spacing:0.14em;height:44px">
      <sc-for list="{{ items }}" as="n" hint-placeholder-count="5">
        <a href="{{ n.href }}" aria-current="{{ n.aria }}" style="color:{{ n.color }};text-decoration:none;height:44px;display:flex;align-items:center;border-bottom:2px solid {{ n.line }};transition:color .3s" style-hover="color:#fff">{{ n.label }}</a>
      </sc-for>
      <a href="Contact.dc.html" style="color:#fff;background:#8a1414;padding:7px 16px;text-decoration:none;transition:background .3s" style-hover="background:#a51c1c;color:#fff">CONTACT</a>
    </nav>
  </sc-if>
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <button aria-label="メニュー" aria-expanded="{{ open }}" onClick="{{ toggle }}" style="background:none;border:0;width:44px;height:44px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:6px;cursor:pointer;padding:0">
      <span style="display:block;width:24px;height:1px;background:#fff"></span>
      <span style="display:block;width:16px;height:1px;background:#fff"></span>
    </button>
  </sc-if>
</header>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
  <div ref="{{ menuRef }}" style="position:fixed;inset:44px 0 0 0;z-index:49;background:rgba(14,14,13,0.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;font-family:'Cormorant Garamond',serif;font-size:24px;letter-spacing:0.24em">
    <sc-for list="{{ items }}" as="n" hint-placeholder-count="5">
      <a href="{{ n.href }}" style="color:{{ n.color }};text-decoration:none">{{ n.label }}</a>
    </sc-for>
    <a href="Contact.dc.html" style="color:#fff;background:#8a1414;padding:12px 36px;font-size:18px;text-decoration:none">CONTACT</a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;44px&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;products&quot;,&quot;farming&quot;,&quot;vision&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;reveal&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { w: window.innerWidth, open: false };
  headerRef = React.createRef(); progressRef = React.createRef(); menuRef = React.createRef();
  EASE = 'cubic-bezier(.2,.7,.2,1)';
  componentDidMount() {
    this.onResize = () => { this.setState({ w: window.innerWidth }); this.measureParallax(); };
    window.addEventListener('resize', this.onResize);
    this.reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (this.reduce) return;
    this.curtain();
    setTimeout(() => {
      this.intro();
      if (this.props.reveal !== false) this.setupReveal();
      this.loops();
      this.measureParallax();
      this.onScroll();
    }, 80);
    this.lastY = window.scrollY;
    this.onScroll = this.onScroll.bind(this);
    window.addEventListener('scroll', () => { if (!this.raf) this.raf = requestAnimationFrame(() => { this.raf = 0; this.onScroll(); }); }, { passive: true });
    this.onClick = e => {
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a || e.metaKey || e.ctrlKey || e.shiftKey || a.target) return;
      const href = a.getAttribute('href');
      if (!/\.dc\.html/.test(href) || href.startsWith('#')) return;
      e.preventDefault();
      const c = this.cv; c.style.display = 'flex';
      c.animate([{ transform: 'translateY(100%)' }, { transform: 'translateY(0)' }], { duration: 520, easing: 'cubic-bezier(.7,0,.3,1)', fill: 'forwards' }).onfinish = () => { location.href = a.href; };
    };
    document.addEventListener('click', this.onClick, true);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    document.removeEventListener('click', this.onClick, true);
    this.io && this.io.disconnect();
  }
  componentDidUpdate(_, prev) {
    if (!prev.open && this.state.open && this.menuRef.current && !this.reduce) {
      [...this.menuRef.current.children].forEach((el, i) => el.animate([{ opacity: 0, transform: 'translateY(24px)', filter: 'blur(4px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 700, delay: 60 + i * 70, easing: this.EASE, fill: 'backwards' }));
    }
  }
  curtain() {
    const c = document.createElement('div');
    c.setAttribute('aria-hidden', 'true');
    c.style.cssText = 'position:fixed;inset:0;z-index:200;background:#141412;display:flex;align-items:center;justify-content:center;pointer-events:none';
    c.innerHTML = '<span style="font-family:\'Cormorant Garamond\',serif;font-weight:500;font-size:clamp(22px,3vw,34px);letter-spacing:0.4em;padding-left:0.4em;color:#fff">SAMPLE FARM</span><span style="position:absolute;left:0;bottom:0;height:2px;width:100%;background:#8a1414;transform-origin:left"></span>';
    document.body.appendChild(c);
    this.cv = c;
    const [t, bar] = c.children;
    t.animate([{ opacity: 0, letterSpacing: '0.8em' }, { opacity: 1, letterSpacing: '0.4em' }], { duration: 600, easing: this.EASE, fill: 'both' });
    bar.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 600, easing: this.EASE, fill: 'both' });
    c.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-100%)' }], { duration: 900, delay: 520, easing: 'cubic-bezier(.7,0,.2,1)', fill: 'forwards' }).onfinish = () => { c.style.display = 'none'; };
  }
  splitChars(el) {
    const out = [];
    const walk = n => [...n.childNodes].forEach(ch => {
      if (ch.nodeType === 3) {
        const frag = document.createDocumentFragment();
        [...ch.textContent].forEach(chr => {
          if (!chr.trim()) { frag.appendChild(document.createTextNode(chr)); return; }
          const s = document.createElement('span'); s.textContent = chr; s.style.display = 'inline-block'; frag.appendChild(s); out.push(s);
        });
        ch.replaceWith(frag);
      } else if (ch.nodeType === 1 && ch.tagName !== 'BR') walk(ch);
    });
    walk(el);
    return out;
  }
  intro() {
    const base = 1050;
    let t = base;
    document.querySelectorAll('[data-split]').forEach(el => {
      const chars = this.splitChars(el);
      chars.forEach((s, i) => s.animate([{ opacity: 0, transform: 'translateY(0.6em) rotate(6deg)', filter: 'blur(10px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 1000, delay: base + i * 60, easing: this.EASE, fill: 'backwards' }));
      t = Math.max(t, base + chars.length * 60);
    });
    document.querySelectorAll('[data-intro]').forEach((el, i) => {
      el.animate([{ opacity: 0, transform: 'translateY(24px)', filter: 'blur(6px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 1200, delay: (el.dataset.intro === 'first' ? base - 250 : t + i * 160), easing: this.EASE, fill: 'backwards' });
    });
    document.querySelectorAll('[data-hero-parallax] image-slot').forEach(s => s.animate([{ transform: 'scale(1.18)' }, { transform: 'scale(1)' }], { duration: 3200, delay: 400, easing: 'cubic-bezier(.2,.6,.2,1)', fill: 'backwards' }));
  }
  setupReveal() {
    if (!('IntersectionObserver' in window)) return;
    const vh = window.innerHeight, ease = this.EASE;
    const below = el => el.getBoundingClientRect().top > vh * 0.95;
    const from = { left: 'translateX(-48px)', right: 'translateX(48px)', zoom: 'scale(0.94)' };
    this.pending = new Set();
    this.io = new IntersectionObserver(es => {
      const vb = window.innerHeight * 0.9;
      es.filter(e => e.isIntersecting || e.boundingClientRect.top < vb).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top || a.boundingClientRect.left - b.boundingClientRect.left)
        .forEach((e, i) => this.reveal(e.target, Math.min(i, 6) * 110));
    }, { rootMargin: '0px 0px -10% 0px' });
    const add = (el, hide, show) => { hide(); el._show = d => setTimeout(show, d); this.pending.add(el); this.io.observe(el); };
    document.querySelectorAll('[data-reveal]').forEach(el => {
      if (!below(el)) return;
      add(el, () => { el.style.opacity = '0'; el.style.transform = from[el.dataset.reveal] || 'translateY(40px)'; },
        () => { el.style.transition = `opacity 1.2s ease, transform 1.3s ${ease}`; el.style.opacity = '1'; el.style.transform = 'none'; });
    });
    document.querySelectorAll('image-slot').forEach(slot => {
      const w = slot.parentElement;
      if (!w || slot.closest('[data-hero-parallax],[data-noanim]') || !below(w)) return;
      add(w, () => { w.style.clipPath = 'inset(100% 0 0 0)'; slot.style.transform = 'scale(1.2)'; },
        () => { w.style.transition = (w.style.transition ? w.style.transition + ',' : '') + 'clip-path 1.4s cubic-bezier(.7,0,.2,1)'; w.style.clipPath = 'inset(0 0 0 0)'; slot.style.transition = `transform 2.2s ${ease}`; slot.style.transform = 'none'; });
    });
    document.querySelectorAll('[style*="height: 1px"]').forEach(el => {
      if (el.offsetHeight > 2 || el.offsetWidth < 24 || !below(el)) return;
      const origin = getComputedStyle(el.parentElement).alignItems === 'center' ? 'center' : 'left';
      add(el, () => { el.style.transformOrigin = origin; el.style.transform = 'scaleX(0)'; },
        () => { el.style.transition = 'transform 1.4s cubic-bezier(.7,0,.2,1) .2s'; el.style.transform = 'none'; });
    });
    document.querySelectorAll('main h2, main h3').forEach(el => {
      if (!below(el) || el.closest('[data-split]')) return;
      const ls = parseFloat(getComputedStyle(el).letterSpacing) || 0;
      add(el, () => { el.style.opacity = '0'; },
        () => { el.style.opacity = '1'; el.animate([{ opacity: 0, letterSpacing: `${ls + (el.tagName === 'H2' ? 10 : 5)}px`, filter: 'blur(8px)' }, { opacity: 1, letterSpacing: `${ls}px`, filter: 'blur(0)' }], { duration: 1400, delay: 150, easing: ease, fill: 'backwards' }); });
    });
  }
  reveal(el, d) {
    if (!this.pending || !this.pending.has(el)) return;
    this.pending.delete(el); this.io.unobserve(el); el._show(d);
  }
  flushPending() {
    if (!this.pending || !this.pending.size) return;
    const vb = window.innerHeight * 0.9;
    let i = 0;
    this.pending.forEach(el => { if (el.getBoundingClientRect().top < vb) this.reveal(el, el.getBoundingClientRect().bottom < 0 ? 0 : Math.min(i++, 6) * 110); });
  }
  loops() {
    document.querySelectorAll('[data-float]').forEach(el => {
      const r = Math.random;
      el.animate([{ translate: '0 0', rotate: '0deg' }, { translate: `${(r() - 0.5) * 18}px ${6 + r() * 14}px`, rotate: `${(r() - 0.5) * 40}deg` }], { duration: 3000 + r() * 4000, delay: -r() * 4000, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });
    });
    document.querySelectorAll('[data-spin]').forEach(el => el.animate([{ rotate: '0deg' }, { rotate: '360deg' }], { duration: 40000, iterations: Infinity }));
    document.querySelectorAll('[data-anim="scrollline"]').forEach(el => el.animate([
      { transform: 'scaleY(0)', transformOrigin: 'top' }, { transform: 'scaleY(1)', transformOrigin: 'top', offset: 0.5 },
      { transform: 'scaleY(1)', transformOrigin: 'bottom', offset: 0.5 }, { transform: 'scaleY(0)', transformOrigin: 'bottom' }
    ], { duration: 2200, iterations: Infinity, easing: 'cubic-bezier(.7,0,.3,1)' }));
  }
  measureParallax() {
    this.px = [...document.querySelectorAll('[data-parallax]')].map(el => {
      el.style.translate = '0 0';
      const r = el.getBoundingClientRect();
      return { el, f: parseFloat(el.dataset.parallax) || 0.1, c: r.top + window.scrollY + r.height / 2 };
    });
    this.hp = [...document.querySelectorAll('[data-hero-parallax]')];
  }
  onScroll() {
    const y = window.scrollY, vh = window.innerHeight;
    const max = document.documentElement.scrollHeight - vh;
    if (this.progressRef.current) this.progressRef.current.style.transform = `scaleX(${max > 0 ? y / max : 0})`;
    const h = this.headerRef.current;
    if (h && !this.state.open) h.style.transform = y > this.lastY && y > 240 ? 'translateY(-100%)' : 'none';
    this.lastY = y;
    clearTimeout(this.flushT); this.flushT = setTimeout(() => this.flushPending(), 120);
    (this.px || []).forEach(p => { p.el.style.translate = `0 ${((p.c - y - vh / 2) * p.f).toFixed(1)}px`; });
    if (y < vh * 1.3) (this.hp || []).forEach(el => { el.style.translate = `0 ${(y * 0.35).toFixed(1)}px`; });
  }
  renderVals() {
    const cur = this.props.current ?? 'home';
    const w = this.state.w, isMobile = w < 860;
    const items = [['home','HOME','Farm%20Website.dc.html'],['about','ABOUT','About.dc.html'],['products','PRODUCTS','Products.dc.html'],['farming','FARMING','Farming.dc.html'],['vision','VISION','Vision.dc.html']]
      .map(([k, label, href]) => ({ label, href, aria: k === cur ? 'page' : undefined, color: k === cur ? '#fff' : '#bdbab1', line: k === cur ? '#8a1414' : 'transparent' }));
    return { headerRef: this.headerRef, progressRef: this.progressRef, menuRef: this.menuRef, items, isMobile, isDesktop: !isMobile, wide: w >= 1000, open: isMobile && this.state.open, toggle: () => this.setState(s => ({ open: !s.open })) };
  }
}
</script>
</body>
</html>
