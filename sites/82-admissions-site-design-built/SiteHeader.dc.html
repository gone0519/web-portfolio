<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ showSidebar }}" hint-placeholder-val="{{ true }}">
<nav aria-label="サイドナビゲーション" style="position:fixed;top:20px;left:clamp(-340px, calc((100vw - 1099px) * 1000), 24px);width:210px;background:#fff;border-radius:22px;padding:56px 14px 16px;z-index:40;box-shadow:0 2px 0 rgba(122,35,72,.04)">
  <a href="Top.dc.html" aria-label="トップへ" style="position:absolute;top:-6px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;padding:6px 12px;border-radius:16px">
    <span style="font-family:'Zen Old Mincho',serif;font-size:22px;line-height:1;color:#6E2A47">青葉野</span>
    <span style="font-size:8px;letter-spacing:.14em;font-weight:700;color:#6E2A47">AOBANO WOMEN'S UNIV.</span>
  </a>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px;margin-top:4px">
    <a href="About.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700" style-hover="opacity:.75">
      <span style="width:56px;height:56px;border-radius:22px;background:#FCF6F5;display:grid;place-items:center;font-family:'Zen Old Mincho',serif;font-size:22px;color:#E8A6B9">学</span>大学紹介</a>
    <a href="Academics.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700" style-hover="opacity:.75">
      <span style="width:56px;height:56px;border-radius:22px;background:#FCF6F5;display:grid;place-items:center;font-family:'Zen Old Mincho',serif;font-size:22px;color:#F1CAD4">部</span>学部・学科</a>
    <a href="CampusLife.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700" style-hover="opacity:.75">
      <span style="width:56px;height:56px;border-radius:22px;background:#FCF6F5;display:grid;place-items:center;font-family:'Zen Old Mincho',serif;font-size:22px;color:#DCD0EC">生</span>キャンパス</a>
    <a href="Admissions.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700" style-hover="opacity:.75">
      <span style="width:56px;height:56px;border-radius:22px;background:#FCF6F5;display:grid;place-items:center;font-family:'Zen Old Mincho',serif;font-size:22px;color:#6E2A47">試</span>入試情報</a>
    <a href="OpenCampus.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700" style-hover="opacity:.75">
      <span style="width:56px;height:56px;border-radius:22px;background:#FCF6F5;display:grid;place-items:center;font-family:'Zen Old Mincho',serif;font-size:22px;color:#B8925A">見</span>OC予約</a>
    <a href="About.dc.html#access" style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700" style-hover="opacity:.75">
      <span style="width:56px;height:56px;border-radius:22px;background:#FCF6F5;display:grid;place-items:center;font-family:'Zen Old Mincho',serif;font-size:22px;color:#E8A6B9">地</span>アクセス</a>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px;margin-top:18px">
    <a href="Admissions.dc.html#faq" style="display:flex;align-items:center;justify-content:space-between;background:#FCF6F5;border-radius:16px;padding:12px 12px;font-size:12px;font-weight:700" style-hover="background:#F6E6EA">よくある質問<span style="width:24px;height:16px;border-radius:8px;background:#fff;display:grid;place-items:center;font-size:10px">→</span></a>
    <a href="#footer" style="display:flex;align-items:center;justify-content:space-between;background:#FCF6F5;border-radius:16px;padding:12px 12px;font-size:12px;font-weight:700" style-hover="background:#F6E6EA">お問い合わせ<span style="width:24px;height:16px;border-radius:8px;background:#fff;display:grid;place-items:center;font-size:10px">→</span></a>
  </div>
  <div style="border-top:1px dashed #F7E3E8;margin:16px 0 14px"></div>
  <a href="OpenCampus.dc.html" style="display:block;background:#DCD0EC;border-radius:8px;padding:14px 12px;color:#6E2A47;text-align:center" style-hover="transform:translateY(-2px)">
    <span style="display:inline-block;background:#F2E2C4;color:#6E2A47;font-size:10px;font-weight:900;padding:2px 8px;border-radius:999px">参加無料</span>
    <span style="display:block;font-family:'Zen Old Mincho',serif;font-size:20px;line-height:1.2;margin-top:6px;text-shadow:none">オープン<br>キャンパス</span>
    <span style="display:inline-block;margin-top:6px;background:#fff;font-size:10px;font-weight:700;padding:3px 10px;border-radius:999px">予約受付はこちら</span>
  </a>
</nav>
</sc-if>

<div style="position:fixed;top:20px;right:clamp(12px,2vw,24px);display:flex;gap:8px;align-items:center;z-index:60">
  <a href="Admissions.dc.html" style="display:flex;align-items:center;height:44px;padding:0 18px;border-radius:999px;background:#6E2A47;color:#fff;font-size:12px;font-weight:700" style-hover="background:#8A3A5C;color:#fff">資料請求</a>
  <a href="OpenCampus.dc.html" style="display:flex;align-items:center;height:44px;padding:0 18px;border-radius:999px;background:#F2E2C4;color:#6E2A47;font-size:12px;font-weight:700" style-hover="background:#F7EBD4">OC予約はこちら</a>
  <button onClick="{{ toggleMenu }}" aria-label="メニューを開く" aria-expanded="{{ menuOpen }}" style="width:44px;height:44px;border-radius:50%;border:none;background:#E8A6B9;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px" style-hover="background:#DB8FA6" style-focus="outline:3px solid #6E2A47;outline-offset:2px">
    <span style="width:16px;height:2px;background:#fff;border-radius:2px"></span>
    <span style="width:16px;height:2px;background:#fff;border-radius:2px"></span>
    <span style="width:16px;height:2px;background:#fff;border-radius:2px"></span>
  </button>
</div>

<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-label="メニュー" style="position:fixed;inset:0;background:#F1CAD4;z-index:55;display:flex;align-items:center;justify-content:center;padding:96px 24px 40px;overflow:auto">
    <div style="background:#fff;border-radius:16px;padding:clamp(28px,5vw,56px);width:min(560px,100%);display:flex;flex-direction:column;gap:6px">
      <span style="font-family:'Cormorant Garamond',serif;font-size:36px;color:#6E2A47;font-style:italic;font-weight:500;letter-spacing:.01em">Menu</span>
      <a href="Top.dc.html" onClick="{{ closeMenu }}" style="padding:14px 0;border-bottom:1px dashed #F7E3E8;font-weight:700;display:flex;justify-content:space-between">トップ<span>→</span></a>
      <a href="About.dc.html" onClick="{{ closeMenu }}" style="padding:14px 0;border-bottom:1px dashed #F7E3E8;font-weight:700;display:flex;justify-content:space-between">大学紹介<span>→</span></a>
      <a href="Academics.dc.html" onClick="{{ closeMenu }}" style="padding:14px 0;border-bottom:1px dashed #F7E3E8;font-weight:700;display:flex;justify-content:space-between">学部・学科<span>→</span></a>
      <a href="CampusLife.dc.html" onClick="{{ closeMenu }}" style="padding:14px 0;border-bottom:1px dashed #F7E3E8;font-weight:700;display:flex;justify-content:space-between">キャンパスライフ<span>→</span></a>
      <a href="Admissions.dc.html" onClick="{{ closeMenu }}" style="padding:14px 0;border-bottom:1px dashed #F7E3E8;font-weight:700;display:flex;justify-content:space-between">入試情報<span>→</span></a>
      <a href="OpenCampus.dc.html" onClick="{{ closeMenu }}" style="padding:14px 0;border-bottom:1px dashed #F7E3E8;font-weight:700;display:flex;justify-content:space-between">オープンキャンパス<span>→</span></a>
      <a href="OpenCampus.dc.html" onClick="{{ closeMenu }}" style="margin-top:18px;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 10px 0 26px;border-radius:999px;background:#6E2A47;color:#fff;font-weight:700" style-hover="color:#fff;background:#8A3A5C">オープンキャンパスを予約する<span style="width:40px;height:22px;border-radius:11px;background:#fff;color:#6E2A47;display:grid;place-items:center">→</span></a>
    </div>
  </div>
</sc-if>


</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showSidebar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false };
  componentDidMount() {
    if (!window.__aobanoMotion && !document.querySelector('script[data-motion]')) {
      const s = document.createElement('script');
      s.src = './motion.js'; s.dataset.motion = '1';
      document.body.appendChild(s);
    }
    this.onKey = e => { if (e.key === 'Escape') this.setState({ menuOpen: false }); };
    window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); }
  renderVals() {
    return {
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
      showSidebar: this.props.showSidebar ?? true,
    };
  }
}
</script>
</body>
</html>
