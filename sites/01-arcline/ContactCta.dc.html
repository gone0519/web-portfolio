<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section class="r-cta" style="position:relative; background:#c8102e; color:#fff; padding:52px 40px;">
  <div class="r-cta-inner" style="max-width:1180px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:48px;">
    <p style="margin:0; font-size:17px; font-weight:500; line-height:1.85;">ご相談・お見積りのご依頼など、<br />お気軽にお問い合わせください</p>
    <div class="r-cta-div" style="width:1px; height:64px; background:rgba(255,255,255,0.35); transform:skewX(-18deg);"></div>
    <div>
      <span class="r-cta-tel" style="display:block; font-family:Archivo,sans-serif; font-size:38px; font-weight:700; line-height:1; letter-spacing:0.01em;">TEL.{{ tel }}</span>
      <span style="display:block; margin-top:12px; font-size:13px; color:rgba(255,255,255,0.85);">【受付時間／平日 9:00〜18:00】</span>
    </div>
    <a href="Contact.dc.html#form" style="background:#fff; color:#c8102e; font-size:15px; font-weight:700; padding:20px 42px; border-radius:999px; white-space:nowrap; transition:background .25s;" style-hover="background:#ffe9ec; color:#c8102e;">メールフォームはこちら</a>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;tel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;03-6427-1180&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;内容&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { tel: this.props.tel ?? '03-6427-1180' };
  }
}
</script>
</body>
</html>
