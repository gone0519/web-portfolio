<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @keyframes phWedge { from { transform: rotate(-6deg) translateY(100%); } to { transform: rotate(-6deg) translateY(0); } }
  @keyframes phIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
</style>
</helmet>
<section class="r-ph" style="position:relative; margin-top:76px; height:420px; background:#0d1c3a; overflow:hidden;">
  <div style="{{ bgStyle }}"></div>
  <div style="position:absolute; inset:0; background:linear-gradient(105deg, rgba(13,28,58,0.94) 0%, rgba(20,54,122,0.7) 55%, rgba(13,28,58,0.45) 100%);"></div>
  <div class="r-ph-bg" style="position:absolute; right:-2%; top:52px; font-family:Archivo,sans-serif; font-weight:700; font-size:150px; line-height:1; letter-spacing:0.02em; color:rgba(255,255,255,0.06); white-space:nowrap; pointer-events:none;">{{ en }}</div>
  <div style="position:absolute; left:-10%; bottom:-62%; width:120%; height:70%; background:#ffffff; transform:rotate(-6deg); animation:phWedge 1s cubic-bezier(.76,0,.24,1) .2s both;"></div>
  <div class="r-ph-inner" style="position:relative; max-width:1260px; margin:0 auto; padding:64px 40px 0;">
    <div style="display:flex; align-items:center; gap:12px; font-family:Archivo,sans-serif; font-size:12px; letter-spacing:0.08em; color:rgba(255,255,255,0.6); animation:phIn .9s cubic-bezier(.16,1,.3,1) .1s both;">
      <a href="Home.dc.html" style="color:rgba(255,255,255,0.6);" style-hover="color:#fff;">HOME</a>
      <span>/</span>
      <span style="color:#fff;">{{ ja }}</span>
    </div>
    <span class="r-ph-en" style="display:block; margin-top:40px; font-family:Archivo,sans-serif; font-size:14px; font-weight:600; letter-spacing:0.24em; color:#8fb4ff; animation:phIn .9s cubic-bezier(.16,1,.3,1) .2s both;">{{ en }}</span>
    <h1 class="r-ph-h1" style="margin:14px 0 0; font-size:44px; font-weight:700; line-height:1.4; letter-spacing:0.04em; color:#fff; animation:phIn .9s cubic-bezier(.16,1,.3,1) .3s both;">{{ ja }}</h1>
    <p class="r-ph-lead" style="margin:18px 0 0; max-width:600px; font-size:15px; line-height:2; color:rgba(255,255,255,0.8); animation:phIn .9s cubic-bezier(.16,1,.3,1) .42s both;">{{ lead }}</p>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;PAGE&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;内容&quot;},&quot;ja&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ページタイトル&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;内容&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;内容&quot;},&quot;image&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;内容&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const stripes = 'repeating-linear-gradient(45deg,#22345c 0 12px,#1b2c50 12px 24px)';
    const image = this.props.image;
    return {
      en: this.props.en ?? 'PAGE',
      ja: this.props.ja ?? 'ページタイトル',
      lead: this.props.lead ?? '',
      bgStyle: `position:absolute; inset:0; background:${image ? `url(images/${image}) center/cover no-repeat, ` : ''}${stripes};`,
    };
  }
}
</script>
</body>
</html>
