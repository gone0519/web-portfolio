<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>ブログ | ARCLINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
<link href="responsive.css" rel="stylesheet" />
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #ffffff; color: #10151d; font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #14367a; text-decoration: none; }
  a:hover { color: #1f5ad6; }
  * { box-sizing: border-box; }
  [data-reveal] { opacity: 0; transform: translateY(28px); transition: opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1); }
  [data-reveal].is-in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    [data-reveal] { opacity: 1; transform: none; transition: none; }
    * { animation: none !important; }
  }
</style>
</helmet>

<div id="top" style="width:100%; overflow-x:hidden;">

  <dc-import name="SiteHeader" current="insights" hint-size="100%,0px"></dc-import>
  <dc-import name="PageHero" en="INSIGHTS" ja="ブログ" lead="広告運用・SEO・分析の現場で得た知見を、実務でそのまま使える形でお届けします。" hint-size="100%,496px"></dc-import>

  <section class="r-px" style="padding:96px 40px 40px; background:#fff;">
    <div data-reveal="" style="max-width:1180px; margin:0 auto;">
      <span style="display:block; font-family:Archivo,sans-serif; font-size:13px; font-weight:600; letter-spacing:0.22em; color:#1f5ad6;">PICK UP</span>
      <a href="#" class="r-g2" style="display:grid; grid-template-columns:1.2fr 1fr; gap:56px; align-items:center; margin-top:28px;" style-hover="opacity:0.9;">
        <div class="r-pick-img" style="position:relative;overflow:hidden;height:360px; background:repeating-linear-gradient(45deg,#dfe4ec 0 11px,#e9edf3 11px 22px); display:flex; align-items:center; justify-content:center;"><img src="_filled/02-case-01.jpg" alt="記事メインビジュアル" loading="lazy" decoding="async" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block">
          <span style="font-family:ui-monospace,monospace; font-size:11px; letter-spacing:0.08em; color:#7d8794;">記事メインビジュアル</span>
        </div>
        <div>
          <div style="display:flex; align-items:center; gap:14px;">
            <span style="font-family:Archivo,sans-serif; font-size:12px; letter-spacing:0.08em; color:#8a9099;">{{ pickup.date }}</span>
            <span style="font-size:11px; letter-spacing:0.08em; color:#1f5ad6; border:1px solid #c5d5f5; padding:4px 10px;">{{ pickup.cat }}</span>
          </div>
          <h2 class="r-pick-title" style="margin:20px 0 18px; font-size:26px; font-weight:700; line-height:1.65; color:#10151d;">{{ pickup.title }}</h2>
          <p style="margin:0 0 28px; font-size:14.5px; line-height:2.05; color:#5a636e;">{{ pickup.excerpt }}</p>
          <span style="font-family:Archivo,sans-serif; font-size:12.5px; font-weight:600; letter-spacing:0.14em; color:#14367a;">READ MORE →</span>
        </div>
      </a>
    </div>
  </section>

  <section id="posts" class="r-px" style="padding:64px 40px 112px; background:#fff;">
    <div data-reveal="" style="max-width:1180px; margin:0 auto;">
      <div class="r-headrow" style="display:flex; align-items:flex-end; justify-content:space-between; gap:24px; padding-top:56px; border-top:1px solid #e2e7ee; margin-bottom:44px;">
        <div>
          <span style="display:block; font-family:Archivo,sans-serif; font-size:13px; font-weight:600; letter-spacing:0.22em; color:#1f5ad6;">ARTICLES</span>
          <h2 class="r-h2" style="margin:20px 0 0; font-size:32px; font-weight:700; line-height:1.6; letter-spacing:0.02em; color:#14367a;">記事一覧</h2>
        </div>
        <div class="r-filters" style="display:flex; flex-wrap:wrap; justify-content:flex-end; gap:10px;">
          <sc-for list="{{ filters }}" as="f" hint-placeholder-count="6">
            <button type="button" onClick="{{ f.onClick }}" style="{{ f.style }}">{{ f.label }}</button>
          </sc-for>
        </div>
      </div>
      <div class="r-g3" style="display:grid; grid-template-columns:repeat(3,1fr); gap:52px 28px;">
        <sc-for list="{{ visiblePosts }}" as="n" hint-placeholder-count="9">
          <a href="#" style="display:block;" style-hover="opacity:0.88;">
            <div style="position:relative;overflow:hidden;height:180px; background:repeating-linear-gradient(45deg,#dfe4ec 0 11px,#e9edf3 11px 22px); display:flex; align-items:center; justify-content:center;"><img src="_filled/03-staff-ads.jpg" alt="記事サムネイル" loading="lazy" decoding="async" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block">
              <span style="font-family:ui-monospace,monospace; font-size:11px; letter-spacing:0.08em; color:#7d8794;">記事サムネイル</span>
            </div>
            <div style="display:flex; align-items:center; gap:14px; margin-top:18px;">
              <span style="font-family:Archivo,sans-serif; font-size:12px; letter-spacing:0.08em; color:#8a9099;">{{ n.date }}</span>
              <span style="font-size:11px; letter-spacing:0.08em; color:#1f5ad6; border:1px solid #c5d5f5; padding:4px 10px;">{{ n.cat }}</span>
            </div>
            <h3 style="margin:14px 0 0; font-size:17px; font-weight:700; line-height:1.75; color:#10151d;">{{ n.title }}</h3>
          </a>
        </sc-for>
      </div>
    </div>
  </section>

  <dc-import name="ContactCta" hint-size="100%,168px"></dc-import>
  <dc-import name="SiteFooter" hint-size="100%,180px"></dc-import>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { filter: 'ALL' };

  componentDidMount() {
    const io = new IntersectionObserver((es) => {
      es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    document.querySelectorAll('[data-reveal]').forEach(el => io.observe(el));
    this._io = io;
  }
  componentWillUnmount() {
    if (this._io) this._io.disconnect();
  }

  renderVals() {
    const posts = [
      { date: '2026.08.18', cat: '運用型広告', title: 'P-MAXを「任せきり」にしないための、シグナル設計の実務' },
      { date: '2026.08.04', cat: 'SEO', title: '検索意図の分類を、コンテンツ制作の前工程に組み込む方法' },
      { date: '2026.07.22', cat: '分析', title: 'GA4とCRMを突合して、広告の「本当の成果」を測る' },
      { date: '2026.07.08', cat: 'SNS', title: '「保存される」投稿の共通点を、300本の分析から読み解く' },
      { date: '2026.06.24', cat: 'サイト制作', title: '表示速度の改善は、CVRにどこまで効くのか' },
      { date: '2026.06.10', cat: '運用型広告', title: 'オフラインコンバージョンの取り込みで、入札はどう変わるか' },
      { date: '2026.05.27', cat: 'SEO', title: '生成AI時代の検索流入で、指名検索を増やすための3つの施策' },
      { date: '2026.05.13', cat: '分析', title: 'ダッシュボードが「見られなくなる」理由と、その防ぎ方' },
      { date: '2026.04.30', cat: 'SNS', title: '採用広報にSNS広告を使うときの、ターゲティング設計' },
    ];
    const cats = ['ALL', '運用型広告', 'SEO', 'SNS', '分析', 'サイト制作'];
    return {
      pickup: {
        date: '2026.09.01', cat: '運用型広告',
        title: '広告費を増やす前に確認したい、アカウント診断の10項目',
        excerpt: '成果が頭打ちになったとき、最初に検討されがちなのが予算の増額です。しかし多くのアカウントでは、計測や構造の見直しだけで改善余地が見つかります。無料診断で実際に確認している10項目を公開します。',
      },
      filters: cats.map(c => ({
        label: c,
        onClick: () => this.setState({ filter: c }),
        style: `font-family:inherit; font-size:13px; padding:10px 20px; border-radius:999px; cursor:pointer; transition:all .2s; border:1px solid ${this.state.filter === c ? '#14367a' : '#dde3ec'}; background:${this.state.filter === c ? '#14367a' : '#fff'}; color:${this.state.filter === c ? '#fff' : '#5a636e'};`,
      })),
      visiblePosts: posts.filter(p => this.state.filter === 'ALL' || p.cat === this.state.filter),
    };
  }
}
</script>
</body>
</html>
