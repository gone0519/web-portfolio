<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:sticky;top:0;z-index:50;background:rgba(247,245,240,0.95);backdrop-filter:blur(8px);border-bottom:1px solid #e3ded3;font-family:'Zen Kaku Gothic New',sans-serif">
  <div style="max-width:1280px;margin:0 auto;padding:0 clamp(20px,4vw,48px);height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px">
    <a href="Admissions Site.dc.html" style="display:flex;align-items:center;gap:12px;color:#1d2433;text-decoration:none">
      <div style="width:40px;height:40px;border-radius:50%;background:#1f3a6b;color:#f7f5f0;display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho',serif;font-size:20px;font-weight:700">明</div>
      <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
        <span style="font-family:'Shippori Mincho',serif;font-size:{{ logoSize }};font-weight:700;letter-spacing:0.08em;white-space:nowrap">明翔大学 入試情報</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:{{ subSize }};letter-spacing:{{ subSpacing }};color:#6b7180;white-space:nowrap">MEISHO UNIVERSITY ADMISSIONS</span>
      </div>
    </a>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:28px">
        <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="5">
          <a href="{{ n.href }}" style="font-size:14px;font-weight:{{ n.weight }};color:{{ n.color }};letter-spacing:0.04em;text-decoration:none;padding:6px 0;border-bottom:2px solid {{ n.line }};transition:color .2s" style-hover="color:#b2832f">{{ n.label }}</a>
        </sc-for>
        <a href="#request" style="background:#1f3a6b;color:#fff;padding:12px 22px;font-size:14px;font-weight:700;letter-spacing:0.06em;text-decoration:none;transition:background .2s" style-hover="background:#162b52;color:#fff">資料請求</a>
      </nav>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-label="メニュー" style="background:none;border:1px solid #1d2433;width:56px;height:48px;cursor:pointer;font-size:13px;font-weight:700;color:#1d2433;font-family:inherit">{{ menuLabel }}</button>
    </sc-if>
  </div>
  <sc-if value="{{ showMobileMenu }}" hint-placeholder-val="{{ false }}">
    <nav style="display:flex;flex-direction:column;border-top:1px solid #e3ded3;background:#f7f5f0;padding:8px clamp(20px,4vw,48px) 24px">
      <a href="Admissions Site.dc.html" style="padding:16px 0;border-bottom:1px solid #e3ded3;font-size:16px;font-weight:500;color:#1d2433;text-decoration:none">トップ</a>
      <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="5">
        <a href="{{ n.href }}" style="padding:16px 0;border-bottom:1px solid #e3ded3;font-size:16px;font-weight:500;color:#1d2433;text-decoration:none">{{ n.label }}</a>
      </sc-for>
      <a href="#request" onClick="{{ closeMenu }}" style="margin-top:20px;background:#1f3a6b;color:#fff;padding:16px;font-size:15px;font-weight:700;text-align:center;text-decoration:none">資料請求</a>
    </nav>
  </sc-if>
</header>
<sc-if value="{{ modalOpen }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ closeModal }}" style="position:fixed;inset:0;z-index:100;background:rgba(20,26,38,0.6);display:flex;align-items:center;justify-content:center;padding:20px;font-family:'Zen Kaku Gothic New',sans-serif;color:#1d2433">
    <div onClick="{{ stop }}" style="background:#f7f5f0;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:clamp(24px,4vw,40px);display:flex;flex-direction:column;gap:20px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px">
        <h3 style="margin:0;font-family:'Shippori Mincho',serif;font-size:24px;font-weight:700">{{ modalTitle }}</h3>
        <button onClick="{{ closeModal }}" aria-label="閉じる" style="background:none;border:none;font-size:24px;cursor:pointer;width:44px;height:44px;color:#1d2433">×</button>
      </div>
      <sc-if value="{{ notSubmitted }}" hint-placeholder-val="{{ true }}">
        <form onSubmit="{{ submit }}" style="display:flex;flex-direction:column;gap:16px">
          <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700">お名前<input required="required" style="padding:14px;border:1px solid #c9c3b6;background:#fff;font-size:15px;font-family:inherit"></label>
          <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700">メールアドレス<input type="email" required="required" style="padding:14px;border:1px solid #c9c3b6;background:#fff;font-size:15px;font-family:inherit"></label>
          <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700">区分<select style="padding:14px;border:1px solid #c9c3b6;background:#fff;font-size:15px;font-family:inherit"><option>高校生・受験生</option><option>保護者</option><option>高校教員</option><option>その他</option></select></label>
          <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700">ご質問・ご要望（任意）<textarea rows="3" style="padding:14px;border:1px solid #c9c3b6;background:#fff;font-size:15px;resize:vertical;font-family:inherit"></textarea></label>
          <button type="submit" style="background:#1f3a6b;color:#fff;border:none;padding:16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">送信する</button>
          <span style="font-size:12px;color:#6b7180">※ デモ用フォームです。入力内容は送信されません。</span>
        </form>
      </sc-if>
      <sc-if value="{{ submitted }}" hint-placeholder-val="{{ false }}">
        <p style="margin:0;font-size:15px;line-height:1.9">受け付けました。ご登録のメールアドレスに確認のご案内をお送りします（デモ）。</p>
        <button onClick="{{ closeModal }}" style="align-self:flex-start;background:#1d2433;color:#fff;border:none;padding:14px 24px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">閉じる</button>
      </sc-if>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;80px&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;faculties&quot;,&quot;prep&quot;,&quot;application&quot;,&quot;tuition&quot;,&quot;campus&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: window.innerWidth, menu: false, modal: null, sent: false };
  componentDidMount() {
    this.onR = () => this.setState({ w: window.innerWidth });
    this.onH = () => { const h = location.hash.slice(1); if (['request', 'inquiry', 'oc'].includes(h)) this.setState({ modal: h, sent: false, menu: false }); };
    window.addEventListener('resize', this.onR); window.addEventListener('hashchange', this.onH); this.onH();
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); window.removeEventListener('hashchange', this.onH); }
  renderVals() {
    const s = this.state, cur = this.props.current;
    const isDesktop = s.w >= 1100;
    const items = [
      { key: 'faculties', label: '学部・学科', href: 'Faculties.dc.html' },
      { key: 'prep', label: '入試制度・対策', href: 'ExamPrep.dc.html' },
      { key: 'application', label: '入試日程・出願', href: 'Application.dc.html' },
      { key: 'tuition', label: '学費・奨学金', href: 'Tuition.dc.html' },
      { key: 'campus', label: 'キャンパスライフ', href: 'CampusLife.dc.html' },
    ];
    return {
      isDesktop, isMobile: !isDesktop, showMobileMenu: !isDesktop && s.menu,
      logoSize: s.w < 360 ? '16px' : s.w < 420 ? '18px' : '19px',
      subSize: s.w < 360 ? '8px' : s.w < 420 ? '9px' : '10px',
      subSpacing: s.w < 420 ? '0.06em' : '0.14em',
      menuLabel: s.menu ? '閉じる' : 'MENU',
      toggleMenu: () => this.setState({ menu: !s.menu }), closeMenu: () => this.setState({ menu: false }),
      navItems: items.map(i => ({ ...i, color: i.key === cur ? '#1f3a6b' : '#1d2433', weight: i.key === cur ? 700 : 500, line: i.key === cur ? '#b2832f' : 'transparent' })),
      modalOpen: !!s.modal,
      modalTitle: { request: '資料請求', inquiry: 'お問い合わせ', oc: 'オープンキャンパス予約' }[s.modal] || '',
      notSubmitted: !s.sent, submitted: s.sent,
      submit: (e) => { e.preventDefault(); this.setState({ sent: true }); },
      closeModal: () => { this.setState({ modal: null }); history.replaceState(null, '', location.pathname + location.search); },
      stop: (e) => e.stopPropagation(),
    };
  }
}
</script>
</body>
</html>
