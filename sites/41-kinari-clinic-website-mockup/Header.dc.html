<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header id="top" style="background:#fff">
  <div class="hd-inner" style="max-width:1100px;margin:0 auto;padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px">
    <a href="Home.dc.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:#0b2e7e">
      <div class="hd-logo" style="width:52px;height:52px;border-radius:50%;background:#0b2e7e;display:flex;align-items:center;justify-content:center;border:3px solid #ffe100;flex:none">
        <span style="font-weight:900;font-size:22px;color:#ffe100">K</span>
      </div>
      <div style="display:flex;flex-direction:column;line-height:1.2">
        <span class="hd-name" style="font-size:24px;font-weight:500;letter-spacing:.08em;color:#0b2e7e">きなり整骨院</span>
        <span class="hd-en" style="font-size:12px;font-weight:600;letter-spacing:.14em;color:#0b2e7e">KINARI OSTEOPATHIC CLINIC</span>
      </div>
    </a>
    <div class="hd-actions" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:3px">
        <a href="tel:0298881234" class="hd-tel" style="font-weight:900;font-size:25px;color:#0b2e7e;text-decoration:none;letter-spacing:.02em;line-height:1">☎ 029-888-1234</a>
        <span style="background:#ffe100;color:#0b2e7e;font-size:11px;font-weight:700;padding:2px 8px">茨城県つくば市春日2-14-6</span>
      </div>
      <a href="Access.dc.html#form" style="display:flex;align-items:center;gap:8px;background:#0b2e7e;color:#fff;text-decoration:none;padding:10px 16px;font-size:13px;font-weight:700;line-height:1.35;transition:background .2s" style-hover="background:#1d47a8;color:#fff">
        <span style="width:22px;height:22px;border-radius:50%;background:#ffe100;color:#0b2e7e;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900">✓</span>
        <span>WEB予約・<br>お問い合わせ</span>
      </a>
    </div>
  </div>
</header>
<nav style="position:sticky;top:0;z-index:20;background:#0b2e7e">
  <div class="gnav" style="max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">
    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
      <sc-if value="{{ n.on }}" hint-placeholder-val="{{ false }}">
        <a href="{{ n.href }}" aria-current="page" class="gnav-item" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 6px 10px;background:#1d47a8;color:#ffe100;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.04em;text-align:center">
          <span class="gnav-num" style="width:34px;height:34px;margin-top:-10px;border-radius:50%;background:#ffe100;border:3px solid #fff;display:flex;align-items:center;justify-content:center;color:#0b2e7e;font-weight:900;font-size:12px">{{ n.num }}</span>
          <span>{{ n.label }}</span>
        </a>
      </sc-if>
      <sc-if value="{{ n.off }}" hint-placeholder-val="{{ true }}">
        <a href="{{ n.href }}" class="gnav-item" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 6px 10px;color:#fff;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.04em;text-align:center;transition:background .25s,color .25s" style-hover="background:#1d47a8;color:#ffe100">
          <span class="gnav-num" style="width:34px;height:34px;margin-top:-10px;border-radius:50%;background:#ffe100;border:3px solid #fff;display:flex;align-items:center;justify-content:center;color:#0b2e7e;font-weight:900;font-size:12px">{{ n.num }}</span>
          <span>{{ n.label }}</span>
        </a>
      </sc-if>
    </sc-for>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:200},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;treat&quot;,&quot;staff&quot;,&quot;flow&quot;,&quot;access&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    this.t = setTimeout(() => {
      if (!('IntersectionObserver' in window)) return;
      this.io = new IntersectionObserver((es) => es.forEach(e => {
        if (e.isIntersecting) { e.target.style.opacity = 1; e.target.style.transform = 'none'; this.io.unobserve(e.target); }
      }), { threshold: 0.1 });
      document.querySelectorAll('[data-reveal]').forEach(el => {
        el.style.transition = 'opacity .9s ease, transform .9s ease';
        if (el.getBoundingClientRect().top > window.innerHeight) { el.style.opacity = 0; el.style.transform = 'translateY(24px)'; }
        this.io.observe(el);
      });
    }, 400);
  }
  componentWillUnmount() { clearTimeout(this.t); this.io && this.io.disconnect(); }
  renderVals() {
    const a = this.props.active ?? 'home';
    const items = [
      ['home', 'ホーム', 'Home.dc.html'], ['about', '当院について', 'About.dc.html'], ['treat', '施術内容', 'Treatments.dc.html'],
      ['staff', '施術者紹介', 'Staff.dc.html'], ['flow', '施術の流れ・料金', 'Flow.dc.html'], ['access', 'アクセス・ご予約', 'Access.dc.html']
    ];
    return { nav: items.map(([k, label, href], i) => ({ num: '0' + (i + 1), label, href, on: k === a, off: k !== a })) };
  }
}
</script>
</body>
</html>
