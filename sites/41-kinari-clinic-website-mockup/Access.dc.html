<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<link href="./site.css" rel="stylesheet">
<style>html{scroll-behavior:smooth}body{margin:0;background:#fff;color:#0b2e7e;font-family:'Zen Kaku Gothic New',sans-serif;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:#0b2e7e}a:hover{color:#1d47a8}h1,h2,h3,h4,p{word-break:auto-phrase}</style>
</helmet>
<dc-import name="Header" active="access" hint-size="100%,150px"></dc-import>
<dc-import name="PageHero" title="アクセス・ご予約" en="ACCESS &amp; RESERVATION" img-id="access-hero" src="images/signboard.jpg" placeholder="外観の写真" hint-size="100%,360px"></dc-import>

<section data-screen-label="Access" style="padding:clamp(40px,6vw,70px) 24px 0">
  <div data-reveal="" style="max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start">
    <div style="flex:1 1 420px;height:360px;position:relative"><image-slot id="access-map" shape="rect" placeholder="Googleマップ埋め込み"></image-slot></div>
    <div style="flex:1 1 320px">
      <h2 style="margin:0 0 16px;font-size:22px;font-weight:900;color:#0b2e7e;letter-spacing:.06em">きなり整骨院</h2>
      <sc-for list="{{ info }}" as="i" hint-placeholder-count="5">
        <div style="display:flex;gap:14px;padding:12px 0;border-bottom:1px solid #d5ddee;font-size:13.5px;line-height:1.8">
          <span style="flex:0 0 76px;font-weight:900;color:#0b2e7e">{{ i.k }}</span><span style="color:#0b2e7e">{{ i.v }}</span>
        </div>
      </sc-for>
    </div>
  </div>
</section>

<section id="form" style="padding:clamp(56px,8vw,90px) 24px 0">
  <div data-reveal="" style="max-width:820px;margin:0 auto">
    <div style="background:#ffe100;padding:28px 24px;text-align:center;margin-bottom:28px">
      <h2 style="margin:0 0 8px;font-size:clamp(20px,2.5vw,26px);font-weight:900;color:#0b2e7e;letter-spacing:.06em">はじめの一歩を、お手伝いします</h2>
      <p style="margin:0 0 16px;font-size:14px;line-height:1.9">お電話でのご予約・ご相談はこちら（受付時間内）</p>
      <a href="tel:0298881234" style="display:inline-flex;background:#0b2e7e;color:#fff;text-decoration:none;padding:12px 22px;font-size:22px;font-weight:900" style-hover="background:#1d47a8;color:#fff">☎ 029-888-1234</a>
    </div>
    <form onSubmit="{{ submit }}" style="background:#fff;border:2px solid #0b2e7e;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px;padding:0 clamp(18px,3vw,32px) 30px">
      <div style="grid-column:1/-1;background:#0b2e7e;color:#fff;margin:0 calc(-1 * clamp(18px,3vw,32px)) 6px;padding:12px 20px;font-size:14px;font-weight:700;letter-spacing:.1em;display:flex;align-items:center;gap:12px"><span style="width:14px;height:2px;background:#ffe100"></span>WEB予約・お問い合わせフォーム</div>
      <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
        <div style="grid-column:1/-1;padding:40px 10px;text-align:center">
          <p style="margin:0 0 8px;font-size:20px;font-weight:900;color:#0b2e7e">送信ありがとうございました</p>
          <p style="margin:0;font-size:14px;line-height:1.9;color:#0b2e7e">内容を確認のうえ、1営業日以内にご予約確定のご連絡をいたします。</p>
        </div>
      </sc-if>
      <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
        <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#0b2e7e">お名前 <span style="font-size:11px;color:#1d47a8">必須</span><input required="" name="name" style="height:48px;border:1px solid #9aabd1;background:#fff;padding:0 12px;font-size:16px"></label>
        <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#0b2e7e">電話番号 <span style="font-size:11px;color:#1d47a8">必須</span><input required="" type="tel" name="tel" style="height:48px;border:1px solid #9aabd1;background:#fff;padding:0 12px;font-size:16px"></label>
        <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#0b2e7e">メールアドレス <span style="font-size:11px;color:#1d47a8">必須</span><input required="" type="email" name="email" style="height:48px;border:1px solid #9aabd1;background:#fff;padding:0 12px;font-size:16px"></label>
        <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#0b2e7e">ご希望日 <span style="font-size:11px;color:#3d5a9e">任意</span><input type="date" name="date" style="height:48px;border:1px solid #9aabd1;background:#fff;padding:0 12px;font-size:16px"></label>
        <label style="grid-column:1/-1;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#0b2e7e">主なお悩み
          <select name="concern" style="height:48px;border:1px solid #9aabd1;background:#fff;padding:0 10px;font-size:16px"><option>肩こり・首の痛み</option><option>腰痛・骨盤</option><option>スポーツのケガ</option><option>関節の痛み</option><option>姿勢改善</option><option>交通事故</option><option>その他・わからない</option></select>
        </label>
        <label style="grid-column:1/-1;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#0b2e7e">ご相談内容 <textarea name="message" rows="5" style="border:1px solid #9aabd1;background:#fff;padding:10px 12px;font-size:16px;resize:vertical"></textarea></label>
        <button type="submit" style="grid-column:1/-1;justify-self:center;display:inline-flex;align-items:center;gap:12px;background:#0b2e7e;color:#fff;border:0;min-height:50px;padding:0 24px 0 30px;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s" style-hover="background:#1d47a8">送信する <span style="width:20px;height:20px;border-radius:50%;background:#fff;color:#0b2e7e;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900">›</span></button>
      </sc-if>
    </form>
  </div>
</section>

<dc-import name="Footer" show-cta="{{ false }}" hint-size="100%,600px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { sent: false };
  renderVals() {
    return {
      sent: this.state.sent,
      notSent: !this.state.sent,
      submit: (e) => { e.preventDefault(); this.setState({ sent: true }); },
      info: [
        { k: '住所', v: '〒305-0821 茨城県つくば市春日2-14-6 1F' },
        { k: 'アクセス', v: 'つくばエクスプレス「つくば駅」A3出口より徒歩3分' },
        { k: '駐車場', v: '専用駐車場4台（店舗前）' },
        { k: '受付時間', v: '平日 9:00〜13:00／15:00〜20:00　土曜 9:00〜17:00' },
        { k: '休診日', v: '水曜午後・日曜・祝日' },
        { k: '電話', v: '029-888-1234' },
        { k: 'WEB予約', v: '24時間受付（1営業日以内に確定のご連絡）' }
      ]
    };
  }
}
</script>
</body>
</html>
