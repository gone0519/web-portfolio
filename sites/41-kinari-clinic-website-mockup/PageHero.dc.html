<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div>
  <section style="position:relative;height:clamp(240px,28vw,340px);overflow:hidden">
    <div style="position:absolute;inset:0"><image-slot id="{{ imgId }}" shape="rect" src="{{ src }}" placeholder="{{ placeholder }}"></image-slot></div>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;pointer-events:none">
      <div style="background:#ffe100;outline:2px solid #0b2e7e;outline-offset:-8px;padding:24px clamp(28px,5vw,60px);text-align:center;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.18)">
        <p style="margin:0 0 6px;font-weight:700;font-size:12px;letter-spacing:.24em;color:#0b2e7e">{{ en }}</p>
        <h1 style="margin:0;font-size:clamp(24px,3vw,32px);font-weight:900;color:#0b2e7e;letter-spacing:.08em">{{ title }}</h1>
      </div>
    </div>
  </section>
  <div style="max-width:1100px;margin:0 auto;padding:14px 24px;font-size:12px;color:#3d5a9e;display:flex;gap:8px">
    <a href="Home.dc.html" style="color:#0b2e7e;text-decoration:none">ホーム</a><span>＞</span><span>{{ title }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:400},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;当院について&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ABOUT&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;imgId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;hero-sub&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ページ見出し写真&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
