<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お知らせ・記事 | sowa</title>
<meta name="description" content="sowaからのお知らせと、SEO・広告運用・分析の現場で得た知見をまとめた記事の一覧です。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Zen+Old+Mincho:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="news">

<!-- ===== Page hero ===== -->
<section class="phero art v5" data-photo="newsTop" data-label="News">
  <div class="veil"></div>
  <span class="ghost" data-page-en></span>
  <div class="phero-inner">
    <span class="sec-no">Journal</span>
    <h1 class="split" data-page-en></h1>
    <span class="pjp" data-page-jp></span>
  </div>
  <nav class="crumb"><a href="index.html">Top</a><i></i><span data-page-jp></span></nav>
</section>

<p class="page-lead" data-page-lead></p>

<!-- ===== 一覧 ===== -->
<section class="sec wrap-n" id="news" data-label="News" data-reveal style="margin-top:clamp(60px,7vw,90px)">
  <div data-filters></div>
  <div class="news-list">
    <template data-tpl="news">
      <a href="contact.html" class="news-item">
        <span class="d">{{ n.date }}</span>
        <span class="c">{{ n.cat }}</span>
        <span class="t">{{ n.title }}</span>
        <span class="go">→</span>
      </a>
    </template>
  </div>
  <p class="note" style="margin-top:34px">※ 記事の個別ページは今回の構成には含まれていません。<br>公開時は各記事へのリンク先を設定してください。</p>
</section>

<!-- ===== CTA ===== -->
<section class="sec cta wrap" data-reveal>
  <div class="cta-box art v3" data-photo="cta">
    <div class="veil"></div>
    <span class="ghost-c">Contact</span>
    <span class="cta-mark">Let's start</span>
    <h2>記事の内容について、詳しく聞いてみませんか？</h2>
    <p>掲載している内容は、実際の支援で使っている考え方をまとめたものです。御社の状況に当てはめたご相談も承ります。</p>
    <div class="btn-row" style="margin-top:18px">
      <a href="contact.html" class="btn solid">Contact us <span class="tip">→</span></a>
      <a class="btn" data-tel-btn href="#"></a>
    </div>
  </div>
</section>

<nav data-pagenav></nav>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
