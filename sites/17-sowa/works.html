<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>導入実績 | sowa</title>
<meta name="description" content="EC、SaaS、製造業、採用など。sowaが支援した案件と、成果に至るまでの考え方をご紹介します。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Zen+Old+Mincho:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="works">

<!-- ===== Page hero ===== -->
<section class="phero art v4" data-photo="worksTop" data-label="Works">
  <div class="veil"></div>
  <span class="ghost" data-page-en></span>
  <div class="phero-inner">
    <span class="sec-no">Case studies</span>
    <h1 class="split" data-page-en></h1>
    <span class="pjp" data-page-jp></span>
  </div>
  <nav class="crumb"><a href="index.html">Top</a><i></i><span data-page-jp></span></nav>
</section>

<p class="page-lead" data-page-lead></p>

<!-- ===== Numbers ===== -->
<section class="sec numbers" id="numbers" data-label="Numbers" data-reveal style="margin-top:clamp(80px,10vw,130px)">
  <span class="ghost">Numbers</span>
  <div class="wrap">
    <div class="sec-head">
      <span class="sec-no">01 — Numbers</span>
      <h2 class="sec-en split">Numbers</h2>
      <span class="sec-jp">数字で見る sowa</span>
    </div>
    <div class="num-grid">
      <template data-tpl="metrics">
        <div class="num">
          <b data-count="{{ m.n }}" data-prefix="{{ m.prefix }}" data-suffix="{{ m.suffix }}">{{ m.prefix }}0{{ m.suffix }}</b>
          <span>{{ m.label }}</span>
        </div>
      </template>
    </div>
  </div>
</section>

<!-- ===== 実績一覧 ===== -->
<section class="sec works" id="works" data-label="Works" data-reveal>
  <span class="ghost">Case studies</span>
  <div class="wrap">
    <div class="sec-head">
      <span class="sec-no">02 — Works</span>
      <h2 class="sec-en split">Works</h2>
      <span class="sec-jp">導入実績</span>
    </div>
    <div class="work-grid">
      <template data-tpl="works">
        <a href="contact.html" class="work">
          <div class="frame art" data-img="{{ w.img }}" data-pos="{{ w.pos }}" data-caption="{{ w.caption }}"></div>
          <span class="big" data-index></span>
          <div style="display:flex;flex-direction:column;gap:12px">
            <span class="tag">{{ w.industry }}</span>
            <h3>{{ w.title }}</h3>
            <p class="desc">{{ w.body }}</p>
            <div class="chips" data-list="tags"></div>
            <div class="metric">
              <b>{{ w.metric }}</b><span class="u">{{ w.unit }}</span>
              <span class="l">{{ w.metricLabel }}</span>
            </div>
            <span class="term">{{ w.term }}</span>
          </div>
        </a>
      </template>
    </div>
  </div>
</section>

<!-- ===== Voice ===== -->
<section class="sec voice wrap" id="voice" data-label="Voice" data-reveal>
  <div class="sec-head">
    <span class="sec-no">03 — Voice</span>
    <h2 class="sec-en split">Voice</h2>
    <span class="sec-jp">お客様の声</span>
  </div>
  <div class="voice-grid">
    <template data-tpl="voices">
      <div class="vcard">
        <span class="qm">“</span>
        <p>{{ v.quote }}</p>
        <span class="who">{{ v.name }}</span>
      </div>
    </template>
  </div>
</section>

<!-- ===== Process ===== -->
<section class="sec process wrap" id="process" data-label="Process" data-reveal>
  <div class="sec-head">
    <span class="sec-no">04 — Process</span>
    <h2 class="sec-en split">Process</h2>
    <span class="sec-jp">ご依頼の流れ</span>
  </div>
  <div class="steps">
    <template data-tpl="steps">
      <div class="step">
        <span class="no">Step {{ st.no }}</span>
        <h3>{{ st.title }}</h3>
        <p>{{ st.body }}</p>
      </div>
    </template>
  </div>
</section>

<!-- ===== CTA ===== -->
<section class="sec cta wrap" data-reveal>
  <div class="cta-box art v3" data-photo="cta">
    <div class="veil"></div>
    <span class="ghost-c">Contact</span>
    <span class="cta-mark">Let's start</span>
    <h2>同じ課題を、御社でも解けるかもしれません</h2>
    <p>まずは現状を拝見させてください。初回のご相談と簡易診断は無料です。改善余地をレポートにまとめてお渡しします。</p>
    <div class="btn-row" style="margin-top:18px">
      <a href="contact.html" class="btn solid">Contact us <span class="tip">→</span></a>
      <a class="btn" data-tel-btn href="#"></a>
    </div>
  </div>
</section>

<nav data-pagenav></nav>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
