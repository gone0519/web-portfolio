<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Craftsmanship — 鉄板焼 燈</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<script src="./image-slot.js"></script>
<script src="./akari-motion.js"></script>
<link rel="stylesheet" href="./akari.css">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#1b1713;color:#e4dccf;font-family:'Shippori Mincho',serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#cdb27a;text-decoration:none;transition:color .3s}
a:hover{color:#e8d3a2}
</style>
</helmet>
<div style="position:relative;overflow-x:hidden;background-color:#1b1713;background-image:repeating-linear-gradient(90deg, rgba(255,240,220,.018) 0 1px, transparent 1px 7px)">
<dc-import name="AkariHeader" current="craft" hint-size="100%,1px"></dc-import>
<main>
<dc-import name="AkariPageHero" num="04" en="CRAFTSMANSHIP" ja="一皿を仕上げる、職人の技。" sub="The Hands Behind Every Plate" slot="craft-band" img="images/craft-cutting.jpg" ph="CRAFT — 料理人の手元、ヘラさばきと炎（横長）" hint-size="100%,640px"></dc-import>

<section data-screen-label="Craft Intro" style="padding:clamp(100px,12vw,170px) clamp(24px,5vw,72px) clamp(70px,8vw,110px)">
  <p data-scrub="1" style="max-width:1100px;margin:0 auto;font-size:clamp(24px,3.4vw,46px);line-height:1.8;letter-spacing:.12em;text-wrap:pretty">鉄板の温度、肉の厚み、焼き上がりのわずかな香りの変化。長年の経験で見極め、素材の旨みを最大限に引き出します。</p>
</section>

<section data-screen-label="Four Elements" style="padding:0 clamp(24px,5vw,72px) clamp(90px,10vw,140px)">
  <div class="ak-pillars" style="max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(36px,4vw,56px) clamp(20px,2.4vw,32px);align-items:start">
    <sc-for list="{{ pillars }}" as="p" hint-placeholder-count="4">
      <article class="ak-stagger-1col" style="display:flex;flex-direction:column;padding-top:{{ p.mt }}">
        <div data-m="img" style="position:relative;aspect-ratio:3/4;margin-bottom:22px;background:radial-gradient(ellipse at 50% 70%, #3a2414, #17120e 72%)">
          <image-slot id="{{ p.slot }}" src="images/{{ p.slot }}.jpg" shape="rect" placeholder="{{ p.ph }}"></image-slot>
        </div>
        <span data-m="label" style="font-family:'Cormorant Garamond',serif;font-size:34px;color:#b89a5e;letter-spacing:.06em;line-height:1">{{ p.num }}</span>
        <h3 data-m="up" style="margin:14px 0 12px;font-weight:500;font-size:17px;letter-spacing:.14em">{{ p.title }}</h3>
        <p data-m="up" style="margin:0;font-size:12.5px;line-height:2.1;letter-spacing:.06em;color:#b8ad9a">{{ p.text }}</p>
      </article>
    </sc-for>
  </div>
</section>

<section data-screen-label="Chef" style="border-top:1px solid rgba(184,154,94,.14)">
  <div class="ak-chef" style="display:flex;flex-wrap:wrap-reverse;align-items:center;gap:clamp(40px,6vw,96px);padding:clamp(90px,10vw,140px) 0 clamp(90px,10vw,140px) clamp(24px,8vw,140px)">
    <div class="ak-chef-text" style="flex:1 1 360px;max-width:540px;padding-right:24px">
      <p data-m="label" style="margin:0 0 20px;font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.4em;color:#b89a5e">CHEF</p>
      <div style="display:flex;gap:28px;align-items:flex-start">
        <h2 data-m="title" style="margin:0;writing-mode:vertical-rl;font-weight:500;font-size:clamp(28px,2.8vw,38px);letter-spacing:.3em;flex:none">髙木 一真</h2>
        <div>
          <p data-m="up" style="margin:0 0 4px;font-size:12px;letter-spacing:.2em;color:#b0a592">料理長</p>
          <p data-m="up" style="margin:0 0 30px;font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:.2em;color:#b0a592">Kazuma Takagi</p>
          <p data-m="up" style="margin:0 0 32px;font-size:clamp(15px,1.5vw,19px);line-height:2;letter-spacing:.1em">「焼き加減は、素材との対話。<br>お客様の表情を見ながら、<br>最後の一秒を決めています。」</p>
          <div data-m="up" style="display:flex;flex-direction:column;gap:8px;font-size:12.5px;line-height:1.9;letter-spacing:.06em;color:#b8ad9a">
            <sc-for list="{{ career }}" as="c" hint-placeholder-count="4">
              <div style="display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px"><span style="font-family:'Cormorant Garamond',serif;font-size:14px;color:#cdb27a">{{ c.y }}</span><span>{{ c.t }}</span></div>
            </sc-for>
          </div>
        </div>
      </div>
    </div>
    <div data-m="img" style="flex:1.2 1 420px;position:relative;aspect-ratio:4/5;max-height:820px;background:radial-gradient(ellipse at 50% 60%, #3a2414, #17120e 72%)">
      <image-slot id="chef-portrait" src="images/chef-portrait.jpg" shape="rect" placeholder="CHEF — 料理長ポートレート（縦長）"></image-slot>
    </div>
  </div>
</section>
</main>
<dc-import name="AkariNext" href="Akari%20Reservation.dc.html" en="Reservation" ja="ご予約・アクセス" hint-size="100%,360px"></dc-import>
<dc-import name="AkariFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  pillars = [
    { num: '01', title: '厳選素材', text: '黒毛和牛、活きた魚介、季節の野菜。産地と生産者を訪ね、確かなものだけを仕入れています。', slot: 'pillar-ingredients', ph: '素材 — 和牛の塊・魚介' },
    { num: '02', title: '職人の技', text: '厚みや脂の具合を見極め、鉄板の温度を細かく変えながら、素材本来の味を引き出します。', slot: 'pillar-skill', ph: '技 — ヘラを操る手元' },
    { num: '03', title: '五感で楽しむ鉄板焼き', text: '焼ける音、立ちのぼる香り、炎の揺らぎ。調理のすべてが目の前で繰り広げられます。', slot: 'pillar-senses', ph: '五感 — フランベの炎' },
    { num: '04', title: '心を込めたおもてなし', text: 'お好みや苦手な食材、お祝いの趣旨まで。お一人おひとりに合わせてご用意します。', slot: 'pillar-hospitality', ph: 'おもてなし — 盛り付け・サーブ' }
  ];
  career = [
    { y: '2004', t: '都内ホテル内の鉄板焼レストランにて修業' },
    { y: '2012', t: '銀座の鉄板焼店にて料理長に就任' },
    { y: '2018', t: '和牛産地を巡り、生産者との直接取引を開始' },
    { y: '2021', t: '「鉄板焼 燈」料理長' }
  ];
  componentDidMount() { const go = () => window.AkariMotion ? window.AkariMotion.init() : setTimeout(go, 40); go(); }
  renderVals() { return { pillars: this.pillars.map((p, i) => ({ ...p, mt: i % 2 ? 'clamp(0px,6vw,90px)' : '0px' })), career: this.career }; }
}
</script>
</body>
</html>
