<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Reservation &amp; Access — 鉄板焼 燈</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<script src="./image-slot.js"></script>
<script src="./akari-motion.js"></script>
<link rel="stylesheet" href="./akari.css">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#1b1713;color:#e4dccf;font-family:'Shippori Mincho',serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#cdb27a;text-decoration:none;transition:color .3s}
a:hover{color:#e8d3a2}
</style>
</helmet>
<div style="position:relative;overflow-x:hidden;background-color:#1b1713;background-image:repeating-linear-gradient(90deg, rgba(255,240,220,.018) 0 1px, transparent 1px 7px)">
<dc-import name="AkariHeader" current="reserve" hint-size="100%,1px"></dc-import>
<main>
<dc-import name="AkariPageHero" num="05" en="RESERVATION" ja="特別な夜を、鉄板焼きとともに。" sub="An Unforgettable Dining Experience Awaits." slot="reserve-interior" img="images/staff-wine.jpg" ph="INTERIOR — 夜のカウンター席（横長）" hint-size="100%,640px"></dc-import>

<section data-screen-label="Reserve" style="padding:clamp(90px,10vw,140px) clamp(24px,5vw,72px)">
  <div style="max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:clamp(40px,6vw,96px);align-items:flex-start">
    <div style="flex:1.1 1 380px">
      <p data-m="label" style="margin:0 0 14px;font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.4em;color:#b89a5e">BOOKING</p>
      <h2 data-m="title" style="margin:0 0 28px;font-weight:500;font-size:clamp(26px,3.2vw,42px);line-height:1.7;letter-spacing:.16em">ご予約はこちら</h2>
      <p data-m="up" style="margin:0 0 32px;max-width:460px;font-size:13.5px;line-height:2.3;letter-spacing:.08em;color:#c4b9a6">ご予約は2か月前の1日より承ります。記念日のご用意やアレルギーへの対応など、ご要望はお気軽にお申し付けください。</p>
      <div data-m="up" style="display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{ occasions }}" as="o" hint-placeholder-count="5">
          <span style="font-size:11.5px;letter-spacing:.12em;color:#c4b9a6;border:1px solid rgba(184,154,94,.25);padding:7px 14px">{{ o }}</span>
        </sc-for>
      </div>
    </div>
    <div data-m="up" style="flex:1 1 360px;border:1px solid rgba(184,154,94,.4);padding:clamp(28px,3.4vw,44px);background:rgba(15,12,10,.45);display:grid;gap:12px">
      <a href="#" data-magnet="1" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;padding:12px 20px;background:#b89a5e;color:#15120f" style-hover="background:#d2b67e;color:#15120f">
        <span style="font-size:16px;letter-spacing:.2em">オンライン予約</span>
        <span style="font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.2em">24 HOURS / ONLINE</span>
      </a>
      <a href="tel:0368040000" data-magnet="1" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;padding:12px 20px;border:1px solid rgba(205,178,122,.7);color:#e4dccf" style-hover="background:rgba(184,154,94,.16);color:#fff">
        <span style="font-family:'Cormorant Garamond',serif;font-size:24px;letter-spacing:.12em">03-6804-0000</span>
        <span style="font-size:11px;letter-spacing:.16em;color:#b0a592">お電話 15:00〜22:00</span>
      </a>
    </div>
  </div>
</section>

<section id="access" data-screen-label="Access" style="position:relative;padding:clamp(40px,5vw,64px) clamp(24px,5vw,72px);background:radial-gradient(ellipse 50% 80% at 30% 50%, #3d2414, #15100c 70%);overflow:hidden">
  <div data-parallax="0.1" style="position:absolute;inset:-12% 0">
    <image-slot id="access-exterior" shape="rect" placeholder="EXTERIOR — 店舗外観・のれん（横長）"></image-slot>
  </div>
  <div style="position:absolute;inset:0;background:rgba(15,12,10,.45);pointer-events:none"></div>
  <div style="position:relative;max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:20px;align-items:stretch;pointer-events:none">
    <div data-m="up" style="flex:1 1 320px;max-width:460px;background:rgba(21,18,15,.94);padding:clamp(28px,3vw,40px);pointer-events:auto">
      <p style="margin:0 0 6px;font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.4em;color:#b89a5e">ACCESS</p>
      <h3 style="margin:0 0 24px;font-weight:500;font-size:20px;letter-spacing:.2em">鉄板焼 燈</h3>
      <dl style="margin:0;display:flex;flex-direction:column;gap:16px;font-size:12.5px;line-height:1.9;letter-spacing:.06em">
        <sc-for list="{{ info }}" as="i" hint-placeholder-count="6">
          <div style="display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px">
            <dt style="color:#cdb27a">{{ i.k }}</dt>
            <dd style="margin:0;color:#d6ccbc;white-space:pre-line">{{ i.v }}</dd>
          </div>
        </sc-for>
      </dl>
    </div>
    <div data-m="img" style="flex:1 1 380px;position:relative;min-height:400px;background:#231d18;pointer-events:auto">
      <image-slot id="access-map" shape="rect" placeholder="MAP — 地図 / Google マップを配置"></image-slot>
    </div>
  </div>
</section>
</main>
<dc-import name="AkariNext" href="Akari%20Top.dc.html" en="Back to Top" ja="トップページへ" hint-size="100%,360px"></dc-import>
<dc-import name="AkariFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() { const go = () => window.AkariMotion ? window.AkariMotion.init() : setTimeout(go, 40); go(); }
  renderVals() {
    return {
      occasions: ['カウンター 12席', '個室 最大8名', '記念日・お祝い', '接待・会食', 'アレルギー対応'],
      info: [
        { k: '住所', v: '〒106-0032\n東京都港区六本木 7-00-00 燈ビル 2F' },
        { k: '電話', v: '03-6804-0000' },
        { k: '営業時間', v: 'ディナー 17:30〜23:00（L.O. 21:30）\n土日祝ランチ 12:00〜15:00（L.O. 13:30）' },
        { k: '定休日', v: '月曜日（祝日の場合は翌平日）' },
        { k: '最寄駅', v: '東京メトロ日比谷線・都営大江戸線「六本木駅」' },
        { k: 'アクセス', v: '3番出口より徒歩4分' }
      ]
    };
  }
}
</script>
</body>
</html>
