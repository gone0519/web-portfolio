<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section id="top" data-screen-label="Page Hero" style="position:relative;height:80svh;min-height:540px;overflow:hidden;background:radial-gradient(ellipse 70% 60% at 60% 65%, #4f2a14 0%, #26180f 45%, #0f0c0a 85%);font-family:'Shippori Mincho',serif;color:#e4dccf">
  <div data-tilt="1" style="position:absolute;inset:-4%">
    <div data-m="shutter" style="position:absolute;inset:0">
      <image-slot id="{{ slot }}" src="{{ img }}" shape="rect" placeholder="{{ ph }}"></image-slot>
    </div>
  </div>
  <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg, rgba(15,12,10,.45) 0%, rgba(15,12,10,.1) 40%, rgba(15,12,10,.75) 85%, #1b1713 100%)"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;padding:200px clamp(24px,5vw,72px) clamp(44px,8vh,80px);pointer-events:none">
    <div style="max-width:1240px;margin:0 auto">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:18px">
        <span data-m="label" style="font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.4em;color:#cdb27a">{{ num }}</span>
        <span data-m="line" style="display:block;width:60px;height:1px;background:#b89a5e"></span>
        <span data-m="label" style="font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.4em;color:#cdb27a">{{ en }}</span>
      </div>
      <h1 data-m="title" style="margin:0;font-weight:500;font-size:clamp(28px,4.6vw,62px);line-height:1.5;letter-spacing:.14em;max-width:1000px">{{ ja }}</h1>
      <p data-m="up" style="margin:18px 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(17px,1.7vw,22px);letter-spacing:.06em;color:#d6ccbc">{{ sub }}</p>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;num&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;CONCEPT&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ja&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;素材と技が生み出す、特別な一皿。&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Premium Ingredients, Prepared Before Your Eyes.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slot&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;concept-hero&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ph&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;PAGE HERO&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
