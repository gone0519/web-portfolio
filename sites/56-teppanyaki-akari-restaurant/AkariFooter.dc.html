<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer class="ak-footer" style="padding:clamp(70px,8vw,110px) clamp(24px,5vw,72px) 40px;background:#110e0c;font-family:'Shippori Mincho',serif;color:#e4dccf">
  <div style="max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:48px">
    <div style="flex:1 1 300px">
      <p style="margin:0 0 6px;font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.4em;color:#b0a592">TEPPANYAKI</p>
      <p style="margin:0 0 24px;font-size:24px;letter-spacing:.35em">鉄板焼 燈</p>
      <p style="margin:0;font-size:12px;line-height:2.1;letter-spacing:.08em;color:#b0a592">〒106-0032 東京都港区六本木 7-00-00 燈ビル 2F<br>TEL 03-6804-0000<br>ディナー 17:30〜23:00（L.O. 21:30）<br>定休日 月曜日（祝日の場合は翌平日）</p>
    </div>
    <nav aria-label="フッターナビゲーション" style="flex:0 1 auto;display:grid;grid-template-columns:repeat(2,auto);gap:14px 48px;align-content:start">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
        <a href="{{ n.href }}" style="font-family:'Cormorant Garamond',serif;font-size:16px;letter-spacing:.14em;color:#d6ccbc" style-hover="color:#cdb27a">{{ n.en }}</a>
      </sc-for>
    </nav>
    <div style="flex:0 1 260px;display:flex;flex-direction:column;gap:10px">
      <a href="Akari%20Reservation.dc.html" style="display:flex;align-items:center;justify-content:center;height:52px;background:#b89a5e;color:#15120f;font-size:14px;letter-spacing:.2em" style-hover="background:#d2b67e;color:#15120f">ご予約はこちら</a>
      <a href="tel:0368040000" style="display:flex;align-items:center;justify-content:center;height:52px;border:1px solid rgba(205,178,122,.6);color:#e4dccf;font-family:'Cormorant Garamond',serif;font-size:17px;letter-spacing:.14em" style-hover="background:rgba(184,154,94,.14);color:#fff">TEL 03-6804-0000</a>
    </div>
  </div>
  <div style="max-width:1240px;margin:56px auto 0;padding-top:24px;border-top:1px solid rgba(184,154,94,.16);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px">
    <a href="#top" style="font-size:11px;letter-spacing:.14em;color:#b0a592;text-decoration:underline;text-underline-offset:4px">プライバシーポリシー</a>
    <p style="margin:0;font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.3em;color:#8a8070">© 2026 TEPPANYAKI AKARI</p>
  </div>
</footer>
<div style="position:fixed;right:clamp(12px,2vw,24px);bottom:clamp(12px,2vw,20px);z-index:40;display:flex;gap:6px">
  <a href="tel:0368040000" style="display:flex;align-items:center;height:44px;padding:0 18px;background:#b89a5e;color:#15120f;font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:.1em" style-hover="background:#d2b67e;color:#15120f">TEL 03-6804-0000</a>
  <a href="#top" aria-label="ページトップへ" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;background:#15120f;border:1px solid rgba(184,154,94,.55);color:#cdb27a;font-family:'Cormorant Garamond',serif;font-size:13px">Top</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      nav: [
        ['Top', 'Akari%20Top.dc.html'], ['Concept', 'Akari%20Concept.dc.html'], ['Menu', 'Akari%20Menu.dc.html'],
        ['Course', 'Akari%20Course.dc.html'], ['Craftsmanship', 'Akari%20Craft.dc.html'], ['Reservation', 'Akari%20Reservation.dc.html']
      ].map(([en, href]) => ({ en, href }))
    };
  }
}
</script>
</body>
</html>
