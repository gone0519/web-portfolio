<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="font-family:'Noto Sans JP',sans-serif">
<sc-if value="{{ showCta }}" hint-placeholder-val="{{ true }}">
  <section style="position:relative;overflow:hidden;background-image:radial-gradient(rgba(29,91,224,.14) 1.6px,transparent 1.8px);background-size:22px 22px;background-color:#e8f0fb;padding:clamp(56px,7vw,88px) clamp(16px,3vw,32px)">
    <div style="max-width:1000px;margin:0 auto;text-align:center">
      <h2 data-reveal="up" style="margin:0;font-family:Lexend,sans-serif;font-weight:300;font-size:clamp(36px,4.4vw,56px);color:#0b2d8c;line-height:1.05;letter-spacing:-.01em">Next Step</h2>
      <div style="font-size:12px;font-weight:700;margin-top:4px;color:#1d2433">未来への一歩を、ここから</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));margin-top:36px;border-top:1px solid #c7cfdb;border-bottom:1px solid #c7cfdb">
        <a data-reveal="up" href="Contact.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 16px;border-left:1px solid #c7cfdb;color:#0b2d8c;text-decoration:none;transition:background .2s" style-hover="background:#fff"><span style="width:44px;height:44px;border-radius:50%;border:1.5px solid #0b2d8c;display:grid;place-items:center;font-family:Lexend,sans-serif;font-size:13px">01</span><span style="font-size:13px;font-weight:700">資料請求</span></a>
        <a data-reveal="up" href="Campus.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 16px;border-left:1px solid #c7cfdb;color:#0b2d8c;text-decoration:none;transition:background .2s" style-hover="background:#fff"><span style="width:44px;height:44px;border-radius:50%;border:1.5px solid #0b2d8c;display:grid;place-items:center;font-family:Lexend,sans-serif;font-size:13px">02</span><span style="font-size:13px;font-weight:700">オープンキャンパス予約</span></a>
        <a data-reveal="up" href="Contact.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 16px;border-left:1px solid #c7cfdb;border-right:1px solid #c7cfdb;color:#0b2d8c;text-decoration:none;transition:background .2s" style-hover="background:#fff"><span style="width:44px;height:44px;border-radius:50%;border:1.5px solid #0b2d8c;display:grid;place-items:center;font-family:Lexend,sans-serif;font-size:13px">03</span><span style="font-size:13px;font-weight:700">入試相談・お問い合わせ</span></a>
      </div>
    </div>
  </section>
</sc-if>
<footer style="background:#3a3a3a;color:#d6d6d6">
  <div style="max-width:1100px;margin:0 auto;padding:56px clamp(20px,4vw,32px) 40px;display:flex;flex-wrap:wrap;gap:40px">
    <div style="flex:1 1 240px;display:flex;flex-direction:column;gap:18px">
      <div style="display:flex;align-items:center;gap:10px;color:#fff">
        <span style="width:28px;height:28px;background:linear-gradient(135deg,#fff 0 50%,#f08300 50% 100%);transform:skewX(-14deg);border-radius:3px"></span>
        <span style="font-family:Lexend,sans-serif;font-weight:600;font-size:22px;letter-spacing:.12em">NEXTGATE</span>
      </div>
      <div style="font-size:12px;line-height:1.9"><div style="color:#fff;font-weight:700;margin-bottom:4px">運営事務局</div>〒000-0000 ○○県○○市○○ 0-0-0<br>TEL 00-0000-0000（平日 9:00〜17:00）<br>MAIL info@example.jp</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;font-size:12px;flex:2 1 min(100%,420px)">
      <div style="display:flex;flex-direction:column;gap:9px"><span style="color:#fff;font-weight:700">学部・学科</span><a href="Programs.dc.html" style="color:#cfcfcf;text-decoration:none">分野から探す</a><a href="Programs.dc.html" style="color:#cfcfcf;text-decoration:none">学びの特徴</a><a href="Top.dc.html" style="color:#cfcfcf;text-decoration:none">トップページ</a></div>
      <div style="display:flex;flex-direction:column;gap:9px"><span style="color:#fff;font-weight:700">入試</span><a href="Preparation.dc.html" style="color:#cfcfcf;text-decoration:none">入試対策</a><a href="Admissions.dc.html" style="color:#cfcfcf;text-decoration:none">入試スケジュール</a><a href="Admissions.dc.html" style="color:#cfcfcf;text-decoration:none">学費・奨学金</a><a href="Admissions.dc.html" style="color:#cfcfcf;text-decoration:none">よくあるご質問</a></div>
      <div style="display:flex;flex-direction:column;gap:9px"><span style="color:#fff;font-weight:700">キャンパス</span><a href="Campus.dc.html" style="color:#cfcfcf;text-decoration:none">キャンパスライフ</a><a href="Campus.dc.html" style="color:#cfcfcf;text-decoration:none">オープンキャンパス</a><a href="Contact.dc.html" style="color:#cfcfcf;text-decoration:none">資料請求・お問い合わせ</a></div>
    </div>
  </div>
  <div aria-hidden="true" style="max-width:1100px;margin:0 auto;padding:0 clamp(20px,4vw,32px);font-family:Lexend,sans-serif;font-weight:600;font-size:clamp(56px,12vw,170px);line-height:1.05;letter-spacing:.04em;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.18);overflow:hidden;white-space:nowrap">NEXTGATE</div>
  <div style="border-top:1px solid #555;padding:18px;text-align:center;font-size:11px;color:#bdbdbd">Copyright © NEXTGATE All rights reserved.</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;700px&quot;},&quot;hideCta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() { const h = this.props.hideCta; return { showCta: !(h === true || h === 'true') }; }
}
</script>
</body>
</html>
