<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Page Hero" style="position:relative;overflow:hidden;background:#fff;font-family:'Noto Sans JP',sans-serif">
  <svg aria-hidden="true" viewBox="0 0 800 400" preserveAspectRatio="none" style="position:absolute;right:0;top:0;width:52%;height:100%;pointer-events:none">
    <path data-float="1" d="M800 0 L560 0 C480 110 520 240 680 300 C740 322 780 330 800 336 Z" fill="#1d5be0"></path>
    <path data-float="1" d="M800 120 C690 150 640 260 740 360 C770 385 790 395 800 398 Z" fill="#0b2d8c" opacity=".85"></path>
  </svg>
  <div aria-hidden="true" data-float="1" style="position:absolute;left:38%;top:30px;width:130px;height:130px;background-image:radial-gradient(#1d5be0 1.6px,transparent 1.8px);background-size:14px 14px;opacity:.3;pointer-events:none"></div>
  <div aria-hidden="true" data-float="1" style="position:absolute;left:-70px;bottom:40px;width:200px;height:200px;border:1px solid #1d5be0;border-radius:50%;opacity:.3;pointer-events:none"></div>
  <div style="position:relative;max-width:1240px;margin:0 auto;padding:clamp(40px,6vw,80px) clamp(16px,3vw,32px) clamp(48px,6vw,72px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:40px;align-items:center">
    <div style="display:flex;flex-direction:column;gap:18px">
      <div data-intro="1" style="display:flex;align-items:center;gap:12px;font-family:Lexend,sans-serif;font-size:11px;letter-spacing:.28em;color:#f08300"><span>{{ no }}</span><span style="width:36px;height:1px;background:currentColor"></span><span style="color:#1d5be0">NEXTGATE GUIDE</span></div>
      <h1 data-intro="2" style="margin:0;font-family:Lexend,sans-serif;font-weight:300;font-size:clamp(50px,7.6vw,108px);line-height:.98;letter-spacing:-.02em;color:#0b2d8c">{{ en }}</h1>
      <div data-intro="3" style="font-size:clamp(18px,2vw,24px);font-weight:700;letter-spacing:.12em;color:#1d2433"><span style="background:linear-gradient(transparent 66%,rgba(240,131,0,.38) 66%)">{{ ja }}</span></div>
      <p data-intro="4" style="margin:0;font-size:14px;line-height:2;color:#3a4356;max-width:520px;text-wrap:pretty">{{ lead }}</p>
    </div>
    <div data-reveal="mask" style="position:relative;aspect-ratio:16/11;width:100%">
      <div aria-hidden="true" style="position:absolute;left:-14px;top:-14px;width:40%;height:40%;border-left:3px solid #0b2d8c;border-top:3px solid #0b2d8c;pointer-events:none"></div>
      <image-slot id="{{ slot }}" shape="rect" placeholder="{{ ph }}"></image-slot>
    </div>
  </div>
  <div style="position:relative;background:#0b2d8c;color:#fff">
    <div style="max-width:1240px;margin:0 auto;padding:14px clamp(16px,3vw,32px);display:flex;gap:10px;font-size:12px;align-items:center;flex-wrap:wrap">
      <a href="Top.dc.html" style="color:#fff;opacity:.8;text-decoration:none;font-family:Lexend,sans-serif">TOP</a><span style="opacity:.6">/</span><span>{{ ja }}</span>
      <span style="margin-left:auto;font-family:Lexend,sans-serif;letter-spacing:.24em;font-size:10px;opacity:.7">{{ en }}</span>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;560px&quot;},&quot;no&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Programs&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ja&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;学部・学科&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slot&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;page-hero&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ph&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ページメイン画像&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
