<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid #eef1f6;font-family:'Noto Sans JP',sans-serif">
  <div style="max-width:1400px;margin:0 auto;padding:14px clamp(16px,3vw,32px);display:flex;align-items:center;justify-content:space-between;gap:16px">
    <a href="Top.dc.html" style="display:flex;align-items:center;gap:10px;color:#0b2d8c;text-decoration:none">
      <span style="width:30px;height:30px;background:linear-gradient(135deg,#1d5be0 0 50%,#f08300 50% 100%);transform:skewX(-14deg);border-radius:3px"></span>
      <span style="display:flex;flex-direction:column;line-height:1">
        <span style="font-family:Lexend,sans-serif;font-weight:600;font-size:24px;letter-spacing:.12em">NEXTGATE</span>
        <span style="font-size:10px;letter-spacing:.2em;color:#4a5670;margin-top:4px">大学受験・進学ナビ</span>
      </span>
    </a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:26px;font-size:12px;font-weight:500">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
          <a href="{{ it.href }}" style="color:{{ it.color }};padding:6px 0;border-bottom:2px solid {{ it.line }};text-decoration:none;transition:color .2s" style-hover="color:#1d5be0">{{ it.label }}</a>
        </sc-for>
        <a href="Contact.dc.html" style="background:#0b2d8c;color:#fff;padding:9px 18px;border-radius:999px;text-decoration:none;transition:background .2s" style-hover="background:#1d5be0;color:#fff">資料請求</a>
      </nav>
    </sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggle }}" aria-label="メニュー" style="width:44px;height:44px;border:0;background:#0b2d8c;border-radius:50%;color:#fff;font-size:18px;cursor:pointer">{{ icon }}</button>
    </sc-if>
  </div>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <nav style="display:flex;flex-direction:column;background:#0b2d8c;padding:8px 24px 20px">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
        <a href="{{ it.href }}" style="color:#fff;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.2);text-decoration:none">{{ it.label }}</a>
      </sc-for>
      <a href="Contact.dc.html" style="color:#fff;padding:14px 0;text-decoration:none">資料請求・お問い合わせ</a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;80px&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;programs&quot;,&quot;prep&quot;,&quot;admissions&quot;,&quot;campus&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menu: false, t: 0 };
  componentDidMount() {
    this.mq = window.matchMedia('(max-width: 859px)');
    this.on = () => this.setState({ t: Date.now() });
    this.mq.addEventListener('change', this.on);
    window.addEventListener('resize', this.on);
    requestAnimationFrame(this.on);
  }
  componentWillUnmount() { this.mq.removeEventListener('change', this.on); window.removeEventListener('resize', this.on); }
  renderVals() {
    const mobile = typeof window !== 'undefined' && window.matchMedia('(max-width: 859px)').matches;
    const cur = this.props.current;
    const items = [
      { k: 'programs', href: 'Programs.dc.html', label: '学部・学科' },
      { k: 'prep', href: 'Preparation.dc.html', label: '入試対策' },
      { k: 'admissions', href: 'Admissions.dc.html', label: '入試情報・サポート' },
      { k: 'campus', href: 'Campus.dc.html', label: 'キャンパスライフ' }
    ].map(i => ({ ...i, color: i.k === cur ? '#1d5be0' : '#2b3447', line: i.k === cur ? '#1d5be0' : 'transparent' }));
    return {
      items, desktop: !mobile, mobile, open: mobile && this.state.menu, icon: this.state.menu ? '×' : '≡',
      toggle: () => this.setState(s => ({ menu: !s.menu }))
    };
  }
}
</script>
</body>
</html>
