<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding:0 0 0 clamp(20px,4vw,40px);font-family:'Noto Sans JP',sans-serif;color:#333">
  <a href="University%20Admissions.dc.html" style="display:flex;align-items:center;gap:12px;margin-top:34px;color:#333;text-decoration:none">
    <svg width="34" height="38" viewBox="0 0 34 38"><polygon points="17,2 32,10.5 32,27.5 17,36 2,27.5 2,10.5" fill="none" stroke="#1fb2c3" stroke-width="3"></polygon><polygon points="17,11 24,15 24,23 17,27 10,23 10,15" fill="#1fb2c3"></polygon></svg>
    <span style="display:flex;flex-direction:column;gap:2px">
      <span style="font-size:19px;font-weight:500;letter-spacing:0.12em">翠陵大学</span>
      <span style="font-family:'Lexend Exa',sans-serif;font-size:8px;letter-spacing:0.08em;color:#777">SUIRYO UNIVERSITY · ADMISSIONS</span>
    </span>
  </a>
  <div style="display:flex;align-items:flex-start;gap:clamp(12px,3vw,40px)">
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;gap:22px">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
          <a href="{{ n.href }}" style="position:relative;writing-mode:vertical-rl;font-size:12px;font-weight:500;letter-spacing:0.2em;padding-top:46px;line-height:1.3;text-decoration:none;color:{{ n.color }}" style-hover="color:#1fb2c3">
            <span style="position:absolute;top:0;left:50%;width:1px;height:36px;background:#1fb2c3;opacity:{{ n.lineOp }}"></span>{{ n.label }}
          </a>
        </sc-for>
      </nav>
    </sc-if>
    <button onClick="{{ toggleMenu }}" aria-label="メニュー" style="width:72px;height:72px;border:0;background:#1fb2c3;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px" style-hover="background:#169aaa">
      <span style="width:22px;height:2px;background:#fff"></span><span style="width:22px;height:2px;background:#fff"></span><span style="width:22px;height:2px;background:#fff"></span>
    </button>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:50;background:rgba(255,255,255,0.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px">
      <button onClick="{{ toggleMenu }}" aria-label="閉じる" style="position:absolute;top:0;right:0;width:72px;height:72px;border:0;background:#333;color:#fff;font-size:26px;cursor:pointer">×</button>
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
        <a href="{{ n.href }}" style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:20px;font-weight:500;letter-spacing:0.15em;text-decoration:none;color:{{ n.color }}" style-hover="color:#1fb2c3">
          <span style="font-family:'Lexend Exa',sans-serif;font-size:10px;color:#1fb2c3;letter-spacing:0.1em">{{ n.en }}</span>{{ n.label }}
        </a>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1400,&quot;height&quot;:200},&quot;active&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:5}}">
class Component extends DCLogic {
  state = { menuOpen: false, w: typeof window !== 'undefined' ? window.innerWidth : 1400 };
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onResize);
    this.onImgErr = e => { if (e.target && e.target.tagName === 'IMG') e.target.style.visibility = 'hidden'; };
    document.addEventListener('error', this.onImgErr, true);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); document.removeEventListener('error', this.onImgErr, true); }
  renderVals() {
    const active = this.props.active ?? 0;
    return {
      wide: this.state.w >= 900,
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      nav: [
        ['ホーム', 'Home', 'University%20Admissions.dc.html'], ['学部・学科', 'Faculties', 'Faculties.dc.html'], ['入試対策', 'Prepare', 'Preparation.dc.html'],
        ['入試・出願', 'Admissions', 'Admissions.dc.html'], ['キャンパスライフ', 'Campus Life', 'CampusLife.dc.html'], ['お問い合わせ', 'Contact', 'Contact.dc.html'],
      ].map(([label, en, href], i) => ({ label, en, href, color: i === active ? '#1fb2c3' : '#333', lineOp: i === active ? 1 : 0 })),
    };
  }
}
</script>
</body>
</html>
