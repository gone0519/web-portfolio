<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Caveat:wght@500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Noto Sans JP',sans-serif;color:#333;background:#fff;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:#5e9e1a;text-decoration:none}a:hover{color:#f0913a}button,input,select,textarea{font-family:inherit}</style>
<link rel="stylesheet" href="site.css">
<script src="anim.js"></script>
</helmet>
<div style="min-height:100vh;overflow-x:clip">
<dc-import name="SiteHeader" current="contact" style="position:sticky;top:0;z-index:50" hint-size="100%,100px"></dc-import>

<div data-screen-label="Contact Hero" style="position:relative;background:#eef5e1;height:clamp(200px,20vw,260px);overflow:hidden;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
  <div style="background:#e3ecd2 url(img/p02.jpg) center/cover no-repeat"></div>
  <div style="background:#e3ecd2 url(img/p27.jpg) center/cover no-repeat"></div>
  <div style="background:#e3ecd2 url(img/p22.jpg) center/cover no-repeat"></div>
  <div style="position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(255,255,255,.96);border-radius:50%/40%;padding:20px clamp(32px,6vw,72px);text-align:center;z-index:2;white-space:nowrap">
    <div style="font-weight:900;font-size:clamp(13px,1.4vw,16px);letter-spacing:.06em">お気軽にご相談ください</div>
    <h1 style="margin:0;font-weight:900;font-size:clamp(24px,3.4vw,40px);color:#6aa82a;letter-spacing:.06em;line-height:1.3">お問い合わせ</h1>
    <div style="font-family:'Caveat',cursive;color:#8dba43;font-size:20px;line-height:1">◆ Contact</div>
  </div>
  <div style="position:absolute;left:-5%;right:-5%;bottom:-2px;height:56px;background:#8dba43;border-radius:50% 50% 0 0 / 100% 100% 0 0;z-index:1"></div>
  <div style="position:absolute;left:-5%;right:-5%;bottom:-24px;height:56px;background:#fff;border-radius:50% 50% 0 0 / 100% 100% 0 0;z-index:1"></div>
</div>
<div style="max-width:1000px;margin:0 auto;padding:18px 16px 0;font-size:12px;color:#777;display:flex;gap:8px"><a href="University Admissions.dc.html">TOP</a><span>›</span><span>お問い合わせ</span></div>

<section style="padding:36px 16px 80px">
  <div style="max-width:1000px;margin:0 auto">
    <div class="types" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:36px">
      <sc-for list="{{ types }}" as="t" hint-placeholder-count="3">
        <button onClick="{{ t.pick }}" style="border:2px solid {{ t.border }};background:{{ t.bg }};color:{{ t.fg }};border-radius:6px;padding:18px 16px;cursor:pointer;text-align:center;transition:all .2s">
          <div style="font-weight:900;font-size:16px">{{ t.label }}</div>
          <div style="font-size:12px;margin-top:4px;opacity:.9">{{ t.sub }}</div>
        </button>
      </sc-for>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start">
      <div style="flex:2 1 420px;background:#fff;border:1px solid #3b3b3b;border-radius:4px;overflow:hidden">
        <div style="background:#6aa82a;color:#fff;padding:12px 22px;font-weight:900;font-size:16px;letter-spacing:.06em">{{ formTitle }}</div>
        <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
          <div style="text-align:center;padding:48px 24px">
            <img src="img/il-yay.png" alt="" class="illust" style="width:150px;margin:0 auto 12px">
            <div style="font-weight:900;font-size:18px">送信が完了しました</div>
            <p style="font-size:13px;line-height:1.9;color:#555">お問い合わせありがとうございます。※デモ画面のため、実際には送信されていません。</p>
            <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
              <button onClick="{{ reset }}" style="border:2px solid #8dba43;background:#fff;color:#5e9e1a;font-weight:700;padding:10px 24px;border-radius:30px;cursor:pointer">続けて入力する</button>
              <a href="University Admissions.dc.html" style="background:#f0913a;color:#fff;font-weight:700;padding:12px 24px;border-radius:30px">トップへ戻る</a>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
          <form onSubmit="{{ submit }}" style="display:flex;flex-direction:column;gap:16px;padding:24px clamp(18px,3vw,28px)">
            <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700"><span>お名前 <span style="background:#e24a2a;color:#fff;font-size:10px;padding:1px 6px;border-radius:2px;margin-left:4px">必須</span></span><input required="" placeholder="例）未来 花子" style="height:44px;border:1px solid #c8d2b6;border-radius:4px;padding:0 12px;font-size:14px"></label>
            <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700"><span>メールアドレス <span style="background:#e24a2a;color:#fff;font-size:10px;padding:1px 6px;border-radius:2px;margin-left:4px">必須</span></span><input type="email" required="" placeholder="例）example@example.jp" style="height:44px;border:1px solid #c8d2b6;border-radius:4px;padding:0 12px;font-size:14px"></label>
            <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700">ご関係
              <select style="height:44px;border:1px solid #c8d2b6;border-radius:4px;padding:0 10px;font-size:14px;background:#fff"><option>受験生（高校3年生）</option><option>受験生（高校1・2年生）</option><option>保護者</option><option>高校教員</option><option>その他</option></select>
            </label>
            <sc-if value="{{ isOC }}" hint-placeholder-val="{{ false }}">
              <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700">参加人数
                <select style="height:44px;border:1px solid #c8d2b6;border-radius:4px;padding:0 10px;font-size:14px;background:#fff"><option>1名</option><option>2名（保護者同伴）</option><option>3名以上</option></select>
              </label>
            </sc-if>
            <sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700">ご希望の資料
                <div style="display:flex;flex-wrap:wrap;gap:8px">
                  <sc-for list="{{ docs }}" as="d" hint-placeholder-count="4">
                    <button type="button" onClick="{{ d.toggle }}" style="border:1.5px solid #8dba43;background:{{ d.bg }};color:{{ d.fg }};font-size:12px;font-weight:700;padding:7px 14px;border-radius:30px;cursor:pointer">{{ d.label }}</button>
                  </sc-for>
                </div>
              </div>
            </sc-if>
            <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700">ご質問・ご要望（任意）<textarea rows="4" style="border:1px solid #c8d2b6;border-radius:4px;padding:10px 12px;font-size:14px;resize:vertical"></textarea></label>
            <label style="display:flex;align-items:center;gap:8px;font-size:12px"><input type="checkbox" required="">プライバシーポリシーに同意する</label>
            <button type="submit" style="border:0;background:#f0913a;color:#fff;font-weight:900;font-size:15px;padding:15px;border-radius:30px;cursor:pointer;box-shadow:0 3px 0 #cf7322" style-hover="background:#e27d22">送信する ›</button>
          </form>
        </sc-if>
      </div>
      <aside style="flex:1 1 260px;display:flex;flex-direction:column;gap:16px">
        <div style="background:#fff;border:2px solid #8dba43;border-radius:6px;padding:20px;text-align:center">
          <div style="font-weight:700;font-size:13px">お電話でのお問い合わせ</div>
          <div style="font-weight:900;font-size:28px;color:#f0913a;letter-spacing:.04em;margin:6px 0 2px">0120-000-000</div>
          <div style="font-size:11px;color:#666">【受付】平日10:00〜17:00（番号はサンプルです）</div>
        </div>
        <div style="background:#f6f9ee;border-radius:6px;padding:20px">
          <img src="img/il-worry.png" alt="" class="illust" style="width:130px;margin:0 auto 10px">
          <div style="font-weight:900;font-size:14px;margin-bottom:10px">ご相談の例</div>
          <sc-for list="{{ examples }}" as="e" hint-placeholder-count="4">
            <div style="display:flex;gap:8px;font-size:12px;line-height:1.9"><span style="color:#8dba43">●</span><span>{{ e }}</span></div>
          </sc-for>
        </div>
      </aside>
    </div>
  </div>
</section>

<dc-import name="SiteFooter" show-cta="{{ false }}" hint-size="100%,300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { type: 'form', sent: false, docs: {} };
  componentDidMount() {
    const t = new URLSearchParams(window.location.search).get('type');
    if (t === 'oc' || t === 'consult' || t === 'form') this.setState({ type: t });
  }
  renderVals() {
    const s = this.state;
    const types = [['form','資料請求','大学案内・募集要項など'],['oc','オープンキャンパス予約','見学・説明会への参加'],['consult','入試相談','入試・学費・奨学金など']];
    const titles = { form:'資料請求フォーム', oc:'オープンキャンパス参加予約フォーム', consult:'入試相談フォーム' };
    const docList = ['大学案内パンフレット','募集要項','奨学金のご案内','保護者向けガイド'];
    return {
      types: types.map(([k,label,sub]) => ({ label, sub, bg: s.type===k ? '#8dba43' : '#fff', fg: s.type===k ? '#fff' : '#333', border: s.type===k ? '#8dba43' : '#cfd8c0', pick: () => this.setState({ type:k, sent:false }) })),
      formTitle: titles[s.type], isOC: s.type === 'oc', isForm: s.type === 'form',
      docs: docList.map((label,i) => ({ label, bg: s.docs[i] ? '#8dba43' : '#fff', fg: s.docs[i] ? '#fff' : '#5e9e1a', toggle: () => this.setState({ docs: { ...s.docs, [i]: !s.docs[i] } }) })),
      sent: s.sent, notSent: !s.sent,
      submit: (e) => { e.preventDefault(); this.setState({ sent: true }); window.scrollTo({ top: 0, behavior: 'smooth' }); },
      reset: () => this.setState({ sent: false }),
      examples: ['志望校・学部の選び方がわからない','推薦・総合型選抜の準備について','学費や奨学金について知りたい','保護者として何をサポートすればよいか'],
    };
  }
}
</script>
</body>
</html>
