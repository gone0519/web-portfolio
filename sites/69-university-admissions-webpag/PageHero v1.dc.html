<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div>
  <div style="position:relative;background:#1b6fc6;display:flex;flex-wrap:wrap;overflow:hidden;min-height:300px">
    <div data-stagger="140" data-child="slide-right" style="flex:1 1 380px;padding:48px clamp(20px,5vw,72px);color:#fff;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1">
      <p style="margin:0;font-family:'Saira Semi Condensed',sans-serif;font-weight:700;font-size:clamp(44px,5.4vw,76px);line-height:1;color:#cfe6ff">{{ en }}</p>
      <h1 style="margin:14px 0 0;padding-bottom:8px;border-bottom:1px solid #fff;font-size:24px;font-weight:700;letter-spacing:.12em;max-width:460px">{{ ja }}</h1>
      <p style="margin:12px 0 0;font-size:14px;line-height:1.9;max-width:460px;text-wrap:pretty">{{ lead }}</p>
    </div>
    <div style="flex:1.2 1 420px;position:relative;min-height:260px">
      <div data-anim="from-right" data-dur="1200" style="position:absolute;inset:0;clip-path:polygon(18% 0,100% 0,100% 100%,0 100%)"><image-slot data-loop="kenburns" id="{{ slot }}" shape="rect" placeholder="{{ photo }}"></image-slot></div>
      <div data-anim="stripe" data-delay="500" data-dur="1000" style="position:absolute;inset:0;background:#ffe600;clip-path:polygon(15% 0,17.4% 0,-0.6% 100%,-3% 100%);pointer-events:none"></div>
    </div>
  </div>
  <nav data-anim="fade" data-delay="600" style="max-width:1000px;margin:0 auto;padding:14px 20px;display:flex;gap:10px;align-items:center;font-size:12px;color:#4a5a6e">
    <a href="Top.dc.html" style="color:#1b5fb8;text-decoration:none">HOME</a><span>›</span><span>{{ ja }}</span>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:360},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Faculties&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ja&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;学部・学科&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slot&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;page-hero&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;photo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ページ写真&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
