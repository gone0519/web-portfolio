<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="background:#fff;box-shadow:0 1px 0 rgba(10,61,143,.08)">
  <div style="display:flex;align-items:stretch;justify-content:space-between;height:64px">
    <a data-anim="from-left" data-dur="900" href="Top.dc.html" style="display:flex;align-items:center;gap:12px;background:#1b5fb8;color:#fff;padding:0 56px 0 24px;clip-path:polygon(0 0,100% 0,calc(100% - 28px) 100%,0 100%);text-decoration:none">
      <div style="width:30px;height:30px;background:#fff;clip-path:polygon(50% 0,100% 100%,62% 100%,50% 70%,20% 100%,0 100%)"></div>
      <div style="display:flex;flex-direction:column;line-height:1.15">
        <span style="font-size:10px;letter-spacing:.12em;font-family:'Saira Semi Condensed',sans-serif">SOSHO UNIVERSITY</span>
        <span style="font-size:17px;font-weight:700;letter-spacing:.08em">蒼翔大学 入試情報</span>
      </div>
    </a>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:stretch">
        <nav data-stagger="60" data-child="fade-down" style="display:flex;align-items:center;gap:22px;padding:0 24px;font-size:12px;letter-spacing:.06em">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
            <a href="{{ n.href }}" style="color:#1565c0;padding:6px 0;border-bottom:2px solid {{ n.line }};font-weight:{{ n.weight }};text-decoration:none;transition:border-color .2s" style-hover="border-bottom-color:#1565c0">{{ n.label }}</a>
          </sc-for>
        </nav>
        <a href="Contact.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:84px;background:#0a3d8f;color:#fff;font-size:11px;font-weight:700;text-decoration:none;transition:background .2s" style-hover="background:#072d6b">
          <span style="width:14px;height:10px;border:2px solid #fff;border-top-width:4px"></span>資料請求
        </a>
        <a href="Contact.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:96px;background:#ffe600;color:#0a3d8f;font-size:11px;font-weight:700;text-decoration:none;transition:background .2s" style-hover="background:#f5d800">
          <span style="width:14px;height:10px;border:2px solid #0a3d8f"></span>お問い合わせ
        </a>
      </div>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-label="メニュー" style="width:64px;border:0;background:#0a3d8f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer">
        <span style="width:22px;height:2px;background:#fff"></span><span style="width:22px;height:2px;background:#fff"></span><span style="width:22px;height:2px;background:#fff"></span>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav style="display:flex;flex-direction:column;background:#fff;border-top:1px solid #dbe7f5;padding:8px 24px 20px">
      <sc-for list="{{ nav }}" as="n">
        <a href="{{ n.href }}" style="padding:14px 0;border-bottom:1px solid #e6eef8;font-size:15px;color:#0a3d8f;text-decoration:none;font-weight:{{ n.weight }}">{{ n.label }}</a>
      </sc-for>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px">
        <a href="Contact.dc.html" style="background:#0a3d8f;color:#fff;text-align:center;padding:14px;font-weight:700;font-size:14px;text-decoration:none">資料請求</a>
        <a href="Contact.dc.html" style="background:#ffe600;color:#0a3d8f;text-align:center;padding:14px;font-weight:700;font-size:14px;text-decoration:none">お問い合わせ</a>
      </div>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:64},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;faculties&quot;,&quot;prep&quot;,&quot;admissions&quot;,&quot;campus&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: window.innerWidth, menuOpen: false };
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  renderVals() {
    const cur = this.props.current ?? 'top';
    const isMobile = this.state.w < 1000;
    const items = [
      ['top', 'HOME', 'Top.dc.html'], ['faculties', '学部・学科', 'Faculties.dc.html'],
      ['prep', '入試対策', 'Preparation.dc.html'], ['admissions', '入試日程・出願・学費', 'Admissions.dc.html'],
      ['campus', 'キャンパスライフ', 'CampusLife.dc.html'], ['contact', 'お問い合わせ', 'Contact.dc.html']
    ];
    return {
      isMobile, isDesktop: !isMobile, menuOpen: isMobile && this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      nav: items.map(([k, label, href]) => ({ label, href, line: k === cur ? '#1565c0' : 'transparent', weight: k === cur ? 700 : 400 }))
    };
  }
}
</script>
</body>
</html>
