<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<a href="Home.dc.html" aria-label="Tabi no Ma トップへ" style="position:fixed;top:0;left:0;z-index:60;width:clamp(104px,9.5vw,140px);aspect-ratio:140/104;background:#dceae7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#34393a">
  <span style="font-size:9px;letter-spacing:.2em">ひと息つく、旅の間</span>
  <span style="font-family:'Shippori Mincho',serif;font-size:clamp(17px,1.5vw,22px);letter-spacing:.06em;line-height:1.2">Tabi no Ma</span>
  <span style="font-family:'Sacramento',cursive;font-size:clamp(15px,1.3vw,19px);line-height:1;color:#5f9e95">[ your region ]</span>
</a>
<sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
  <nav aria-label="メインナビゲーション" style="position:fixed;top:20px;right:24px;z-index:60;display:flex;align-items:center;gap:4px;padding:6px 6px 6px 18px;background:rgba(255,255,255,.94);border:1px solid #e3ebe9;border-radius:999px;box-shadow:{{ navShadow }};transition:box-shadow .4s">
    <sc-for list="{{ navLinks }}" as="l" hint-placeholder-count="5">
      <a href="{{ l.href }}" aria-current="{{ l.cur }}" style="padding:10px 12px;font-size:11px;letter-spacing:.18em;color:{{ l.color }};text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px">{{ l.en }}<span style="display:block;width:4px;height:4px;border-radius:50%;background:{{ l.dot }}"></span></a>
    </sc-for>
    <a href="Access.dc.html#reservation" style="margin-left:6px;display:flex;align-items:center;gap:10px;height:40px;padding:0 20px;border-radius:999px;background:#34393a;color:#fff;font-size:11px;letter-spacing:.18em;text-decoration:none" style-hover="background:#5f9e95;color:#fff">RESERVATION<span>→</span></a>
  </nav>
</sc-if>
<sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;top:14px;right:14px;z-index:60;display:flex;gap:8px;align-items:center">
    <a href="Access.dc.html#reservation" style="display:flex;align-items:center;height:48px;padding:0 20px;border-radius:999px;background:#34393a;color:#fff;font-size:13px;letter-spacing:.14em;text-decoration:none">予約する</a>
    <button aria-label="メニューを開く" aria-expanded="{{ menuOpen }}" onClick="{{ openMenu }}" style="width:48px;height:48px;border-radius:50%;border:1px solid #34393a;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer">
      <span style="display:block;width:18px;height:1px;background:#34393a"></span>
      <span style="display:block;width:18px;height:1px;background:#34393a"></span>
    </button>
  </div>
</sc-if>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-label="メニュー" style="position:fixed;inset:0;z-index:80;background:#dceae7;display:flex;flex-direction:column;padding:88px 32px 40px;overflow:auto;color:#34393a">
    <button aria-label="メニューを閉じる" onClick="{{ closeMenu }}" style="position:absolute;top:14px;right:14px;width:48px;height:48px;border-radius:50%;border:1px solid #34393a;background:#fff;font-size:18px;cursor:pointer">×</button>
    <span style="font-family:'Sacramento',cursive;font-size:56px;color:#5f9e95;line-height:1">Menu</span>
    <nav style="display:flex;flex-direction:column;margin-top:24px;border-top:1px solid #b9d3ce">
      <sc-for list="{{ menuLinks }}" as="m" hint-placeholder-count="6">
        <a href="{{ m.href }}" onClick="{{ closeMenu }}" style="display:flex;justify-content:space-between;align-items:baseline;padding:18px 4px;border-bottom:1px solid #b9d3ce;font-size:14px;letter-spacing:.2em;color:{{ m.color }};text-decoration:none"><span>{{ m.en }}</span><span style="font-size:12px;letter-spacing:.1em">{{ m.jp }}</span></a>
      </sc-for>
    </nav>
    <a href="Access.dc.html#reservation" onClick="{{ closeMenu }}" style="margin-top:32px;display:flex;justify-content:center;align-items:center;gap:12px;height:60px;border-radius:999px;background:#34393a;color:#fff;font-size:15px;letter-spacing:.16em;text-decoration:none">予約はこちら <span style="font-size:11px">Book Now</span></a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;concept&quot;,&quot;experiences&quot;,&quot;facilities&quot;,&quot;season&quot;,&quot;access&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const LINKS = [
  { key: 'home', href: 'Home.dc.html', en: 'TOP', jp: 'トップ' },
  { key: 'concept', href: 'Concept.dc.html', en: 'CONCEPT', jp: 'コンセプト' },
  { key: 'experiences', href: 'Experiences.dc.html', en: 'EXPERIENCES', jp: '体験・アクティビティ' },
  { key: 'facilities', href: 'Facilities.dc.html', en: 'FACILITIES', jp: '施設案内' },
  { key: 'season', href: 'Season.dc.html', en: 'SEASON', jp: '季節の楽しみ方' },
  { key: 'access', href: 'Access.dc.html', en: 'ACCESS', jp: 'アクセス・ご予約' },
];
class Component extends DCLogic {
  state = { narrow: false, menuOpen: false, scrolled: false };
  componentDidMount() {
    this.onResize = () => this.setState({ narrow: window.innerWidth < 1000 });
    this.onScroll = () => { const s = window.scrollY > 40; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };
    this.onResize(); this.onScroll();
    window.addEventListener('resize', this.onResize);
    window.addEventListener('scroll', this.onScroll, { passive: true });
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('scroll', this.onScroll);
  }
  renderVals() {
    const cur = this.props.current || 'home';
    const mk = l => ({ ...l, cur: l.key === cur ? 'page' : undefined, color: l.key === cur ? '#5f9e95' : '#34393a', dot: l.key === cur ? '#7fb9b0' : 'transparent' });
    return {
      wide: !this.state.narrow, narrow: this.state.narrow, menuOpen: this.state.menuOpen,
      navShadow: this.state.scrolled ? '0 6px 24px rgba(52,57,58,.08)' : 'none',
      navLinks: LINKS.slice(1).map(mk), menuLinks: LINKS.map(mk),
      openMenu: () => this.setState({ menuOpen: true }),
      closeMenu: () => this.setState({ menuOpen: false }),
    };
  }
}
</script>
</body>
</html>
