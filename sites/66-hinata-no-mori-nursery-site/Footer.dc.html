<!DOCTYPE html>

<x-dc>
<footer style="background:#f8f3e6;padding:0 20px">
  <div style="max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:36px 60px;padding:70px 0 40px">
    <div style="display:grid;gap:12px;align-content:start">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="width:42px;height:42px;border-radius:50%;background:#f8b52c;box-shadow:0 0 0 5px #fbd87a;display:flex;align-items:center;justify-content:center;font-family:'Yusei Magic';color:#fff;font-size:18px">ひ</div>
        <div style="font-family:'Yusei Magic';font-size:26px;letter-spacing:.12em;color:#5a4636"><span style="color:#e57f12">ひなたの森</span>保育園</div>
      </div>
      <a href="tel:0000000000" style="font-family:'Yusei Magic';font-size:24px;letter-spacing:.08em;color:#5a4636">☎ 0120-00-1234</a>
      <div style="font-size:13px;line-height:1.9;letter-spacing:.05em;color:#5a4636">〒000-0000 ○○県○○市ひなた町1-2-3<br>○○線「森の台駅」徒歩7分／駐輪場あり<br>開園 月〜土 7:00〜19:00（日祝・年末年始休園）<br>info@hinatanomori.example</div>
      <div style="display:flex;gap:10px;margin-top:4px">
        <a href="#" style="padding:8px 16px;border-radius:30px;background:#fff;font-size:12px;font-weight:700;color:#5a4636" style-hover="color:#e57f12">Instagram</a>
        <a href="#" style="padding:8px 16px;border-radius:30px;background:#fff;font-size:12px;font-weight:700;color:#5a4636" style-hover="color:#e57f12">LINE</a>
        <a href="#" style="padding:8px 16px;border-radius:30px;background:#fff;font-size:12px;font-weight:700;color:#5a4636" style-hover="color:#e57f12">YouTube</a>
      </div>
    </div>
    <nav style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px;align-content:start;font-size:13px;letter-spacing:.06em">
      <a href="ひなたの森保育園.dc.html" style="color:#5a4636" style-hover="color:#e57f12">ホーム</a>
      <a href="about.dc.html" style="color:#5a4636" style-hover="color:#e57f12">園について</a>
      <a href="daily.dc.html" style="color:#5a4636" style-hover="color:#e57f12">園でのまいにち</a>
      <a href="staff.dc.html" style="color:#5a4636" style-hover="color:#e57f12">先生と環境</a>
      <a href="admission.dc.html" style="color:#5a4636" style-hover="color:#e57f12">入園案内</a>
      <a href="contact.dc.html" style="color:#5a4636" style-hover="color:#e57f12">お問い合わせ</a>
    </nav>
  </div>
  <div class="ft-scene" style="position:relative;margin:0 -20px;height:230px;overflow:hidden">
    <div class="ft-trees" style="position:absolute;left:0;right:0;bottom:70px;display:flex;justify-content:space-around;align-items:flex-end;padding:0 4%">
      <div style="display:flex;flex-direction:column;align-items:center"><div style="width:90px;height:90px;border-radius:50%;background:#8cc760;opacity:.9"></div><div style="width:10px;height:30px;background:#a07a5a"></div></div>
      <div style="display:flex;flex-direction:column;align-items:center"><div style="width:74px;height:40px;background:#f2a0a8;clip-path:polygon(50% 0,100% 100%,0 100%)"></div><div style="width:62px;height:48px;background:#fdf8ee"></div></div>
      <div style="display:flex;flex-direction:column;align-items:center"><div style="width:50px;height:70px;border-radius:50%;background:#5fc2b4;opacity:.85"></div><div style="width:8px;height:22px;background:#a07a5a"></div></div>
      <div style="display:flex;flex-direction:column;align-items:center"><div style="width:84px;height:44px;background:#f5c43c;clip-path:polygon(50% 0,100% 100%,0 100%)"></div><div style="width:70px;height:56px;background:#fdf8ee"></div></div>
      <div style="display:flex;flex-direction:column;align-items:center"><div style="width:70px;height:40px;background:#7cc3e6;clip-path:polygon(50% 0,100% 100%,0 100%)"></div><div style="width:58px;height:44px;background:#fdf8ee"></div></div>
      <div style="display:flex;flex-direction:column;align-items:center"><div style="width:100px;height:100px;border-radius:50%;background:#9ccf5a;opacity:.9"></div><div style="width:12px;height:30px;background:#a07a5a"></div></div>
    </div>
    <svg class="ft-ground" viewBox="0 0 1440 90" preserveAspectRatio="none" style="position:absolute;left:0;bottom:0;width:100%;height:90px;display:block"><path d="M0 22Q360 0 720 18T1440 16V90H0Z" fill="#9ccf5a"></path></svg>
    <div style="position:absolute;left:0;right:0;bottom:calc(16px + {{ barPad }}px);text-align:center;font-size:12px;color:#fff;letter-spacing:.08em;font-weight:500">© Hinata no Mori Nursery School ｜ プライバシーポリシー</div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;520px&quot;}}">
class Component extends DCLogic {
  state = { mobile: typeof window !== 'undefined' && window.innerWidth < 768 };
  componentDidMount() { this.r = () => this.setState({ mobile: window.innerWidth < 768 }); window.addEventListener('resize', this.r); }
  componentWillUnmount() { window.removeEventListener('resize', this.r); }
  renderVals() { return { barPad: this.state.mobile ? 70 : 0 }; }
}
</script>
</body>
</html>
