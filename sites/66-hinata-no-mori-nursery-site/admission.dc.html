<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<dc-import name="Header" current="admission" hint-size="100%,220px"></dc-import>
<main>
<section data-screen-label="Admission Hero" style="position:relative">
  <div style="background:#f8f3e6;padding:36px 20px 40px;display:flex;flex-direction:column;align-items:center;text-align:center">
    <div style="background:#5aa9dd;color:#fff;font-weight:700;font-size:12px;letter-spacing:.24em;padding:6px 44px;clip-path:polygon(0 0,100% 0,92% 50%,100% 100%,0 100%,8% 50%)">ADMISSION</div>
    <h1 style="margin:16px 0 0;font-family:'Yusei Magic';font-weight:400;font-size:clamp(28px,4vw,40px);letter-spacing:.14em">入園案内</h1>
  </div>
  <div style="position:relative;overflow:hidden;height:clamp(200px,24vw,320px);background:#e9dfc9">
    <img src="images/picturebook-group.jpg" alt="先生と絵本を読む子どもたち" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%">
    <svg viewBox="0 0 1440 60" preserveAspectRatio="none" style="position:absolute;top:-1px;left:0;width:100%;height:36px;display:block"><path d="M0 0H1440V20Q720 60 0 20Z" fill="#f8f3e6"></path></svg>
    <svg viewBox="0 0 1440 60" preserveAspectRatio="none" style="position:absolute;bottom:-1px;left:0;width:100%;height:40px;display:block"><path d="M0 60H1440V30Q720 -10 0 30Z" fill="#fff"></path></svg>
  </div>
  <div style="max-width:1080px;margin:0 auto;padding:14px 20px 0;font-size:12px;color:#8e7a63;letter-spacing:.06em"><a href="ひなたの森保育園.dc.html" style="color:#8e7a63">ホーム</a> › 入園案内</div>
</section>

<section class="sec" data-screen-label="Requirements" style="padding:70px 20px 100px">
  <div style="max-width:900px;margin:0 auto">
    <div data-reveal="1" style="text-align:center">
      <h2 style="margin:0 0 20px;font-family:'Yusei Magic';font-weight:400;font-size:clamp(24px,3.2vw,32px);letter-spacing:.14em">募集要項（令和9年度）</h2>
      <div style="width:min(300px,80%);height:8px;margin:0 auto;background:radial-gradient(circle,#f08a1c 2px,transparent 2.6px) 0 0/16px 8px repeat-x,radial-gradient(circle,#f5c43c 1.6px,transparent 2.2px) 8px 0/16px 8px repeat-x"></div>
    </div>
    <dl data-reveal="1" style="margin:40px 0 0;border-top:2px dotted #e3d8c3">
      <sc-for list="{{ admission }}" as="a" hint-placeholder-count="7">
        <div class="kv" style="display:grid;grid-template-columns:minmax(90px,160px) 1fr;gap:16px;padding:18px 8px;border-bottom:2px dotted #e3d8c3;font-size:14px;letter-spacing:.05em">
          <dt style="font-weight:700;color:#e57f12">{{ a.k }}</dt><dd style="margin:0;line-height:1.8">{{ a.v }}</dd>
        </div>
      </sc-for>
    </dl>
    <p data-reveal="1" style="margin:16px 0 0;font-size:13px;color:#8e7a63;line-height:1.9">※ 入園の申込みは、お住まいの市区町村の窓口となります。保育料は世帯の所得に応じて自治体が決定します（3〜5歳児クラスは無償化の対象）。</p>
  </div>
</section>

<section class="sec" data-screen-label="Flow" style="position:relative;background:#f8f3e6;padding:110px 20px">
  <svg viewBox="0 0 1440 60" preserveAspectRatio="none" style="position:absolute;top:-1px;left:0;width:100%;height:44px;display:block"><path d="M0 0H1440V30Q720 -10 0 30Z" fill="#fff"></path></svg>
  <div style="max-width:1080px;margin:0 auto">
    <h2 data-reveal="1" style="margin:0 0 34px;text-align:center;font-family:'Yusei Magic';font-weight:400;font-size:clamp(24px,3.2vw,32px);letter-spacing:.14em">入園までの流れ</h2>
    <ol style="margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:18px">
      <sc-for list="{{ flow }}" as="f" hint-placeholder-count="5">
        <li data-reveal="1" style="background:#fff;border-radius:20px;padding:26px 22px">
          <div style="width:46px;height:46px;border-radius:50%;background:#fde0bd;color:#e57f12;font-family:'Yusei Magic';font-size:20px;display:flex;align-items:center;justify-content:center">{{ f.no }}</div>
          <div style="margin-top:14px;font-size:12px;color:#8e7a63;letter-spacing:.1em">{{ f.when }}</div>
          <div style="margin-top:4px;font-family:'Yusei Magic';font-size:19px;letter-spacing:.1em">{{ f.title }}</div>
          <p style="margin:10px 0 0;font-size:13px;line-height:1.9;letter-spacing:.04em;color:#6a5544">{{ f.text }}</p>
        </li>
      </sc-for>
    </ol>
    <div data-reveal="1" style="margin-top:36px;display:flex;justify-content:center">
      <a href="contact.dc.html" style="display:inline-flex;align-items:center;gap:12px;background:#f08a1c;color:#fff;padding:15px 34px;border-radius:40px;font-weight:700;letter-spacing:.1em;font-size:15px;box-shadow:0 3px 0 #d06f08;transition:transform .2s" style-hover="color:#fff;transform:translateY(-2px)">園見学を予約する ➜</a>
    </div>
  </div>
</section>

<section class="sec" data-screen-label="FAQ" style="position:relative;padding:110px 20px">
  <svg viewBox="0 0 1440 60" preserveAspectRatio="none" style="position:absolute;top:-1px;left:0;width:100%;height:44px;display:block"><path d="M0 0H1440V30Q720 -10 0 30Z" fill="#f8f3e6"></path></svg>
  <div style="max-width:820px;margin:0 auto">
    <h2 data-reveal="1" style="margin:0 0 30px;text-align:center;font-family:'Yusei Magic';font-weight:400;font-size:clamp(24px,3.2vw,32px);letter-spacing:.14em">よくあるご質問</h2>
    <div style="display:grid;gap:12px">
      <sc-for list="{{ faq }}" as="q" hint-placeholder-count="5">
        <div data-reveal="1" style="background:#fbf7ee;border-radius:18px;overflow:hidden">
          <button onClick="{{ q.toggle }}" aria-expanded="{{ q.open }}" style="width:100%;min-height:60px;display:grid;grid-template-columns:32px 1fr 24px;gap:12px;align-items:center;padding:16px 20px;border:none;background:transparent;text-align:left;cursor:pointer;color:#5a4636;font-size:15px;font-weight:700;letter-spacing:.06em">
            <span style="font-family:'Yusei Magic';font-size:20px;color:#f08a1c">Q</span><span>{{ q.q }}</span><span style="font-size:20px;color:#f08a1c">{{ q.icon }}</span>
          </button>
          <sc-if value="{{ q.open }}" hint-placeholder-val="{{ false }}">
            <div style="display:grid;grid-template-columns:32px 1fr;gap:12px;padding:0 20px 20px 20px;font-size:14px;line-height:2;letter-spacing:.04em">
              <span style="font-family:'Yusei Magic';font-size:20px;color:#4bb3a6">A</span><span>{{ q.a }}</span>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>
</section>
</main>
<dc-import name="Footer" hint-size="100%,520px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { open: 0 };
  renderVals() {
    const faq = [
      ['慣らし保育はありますか？', '入園後1〜2週間ほど、短い時間から少しずつ園で過ごす時間をのばしていきます。お仕事の状況に合わせてご相談ください。'],
      ['持ち物はどのくらいありますか？', '着替え、タオル、午睡用の布団カバーなどです。入園説明会で一覧をお渡しします。紙おむつは園で処分します。'],
      ['食物アレルギーに対応していますか？', '医師の指示書にもとづき、除去食で対応しています。入園前の面談で栄養士と詳しくお話しします。'],
      ['急な発熱のときはどうなりますか？', '37.5℃以上の発熱の場合、保護者の方にご連絡し、お迎えをお願いしています。お迎えまでは看護師が付き添います。'],
      ['途中入園はできますか？', '空きがある場合は年度途中の入園も可能です。空き状況は市区町村の窓口、または園にお問い合わせください。']
    ];
    return {
      faq: faq.map(([q, a], i) => ({ q, a, open: this.state.open === i, icon: this.state.open === i ? '−' : '+', toggle: () => this.setState(s => ({ open: s.open === i ? -1 : i })) })),
      admission: [
        { k: '対象', v: '0歳児（生後57日）〜5歳児' },
        { k: '定員', v: '0歳 6名／1歳 12名／2歳 14名／3〜5歳 各19名' },
        { k: '保育時間', v: '標準時間 7:00〜18:00／短時間 8:30〜16:30' },
        { k: '延長保育', v: '18:00〜19:00（要申込・別途料金）' },
        { k: '給食', v: '自園調理（3〜5歳児は主食持参なし）・アレルギー対応あり' },
        { k: '一時保育', v: '1日 定員3名（事前登録制）' },
        { k: '説明会', v: '10月・11月の土曜日に開催（要予約）' }
      ],
      flow: [
        { no: '1', when: '随時', title: '園見学', text: 'まずはお気軽にご連絡ください。所要時間は30分ほどです。' },
        { no: '2', when: '10〜11月', title: '入園説明会', text: '園の方針や持ち物について説明します。個別相談も承ります。' },
        { no: '3', when: '自治体の定める期間', title: '市区町村へ申込み', text: '必要書類は各自治体の窓口・ウェブサイトでご確認ください。' },
        { no: '4', when: '2月頃', title: '内定・面談', text: 'お子さまの生活リズムや健康状態をうかがいます。' },
        { no: '5', when: '4月', title: '入園', text: '慣らし保育からスタート。少しずつ園に慣れていきます。' }
      ]
    };
  }
}
</script>
</body>
</html>
