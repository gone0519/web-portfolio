<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div>
  <div style="position:relative;background:#0b3a8c;overflow:hidden;min-height:clamp(380px,34vw,480px);display:flex;align-items:center">
    <div data-anim="from-right" data-dur="1300" style="position:absolute;inset:0;clip-path:polygon(52% 0,100% 0,100% 100%,36% 100%)"><image-slot data-loop="kenburns" id="{{ slot }}" shape="rect" placeholder="{{ photo }}"></image-slot></div>
    <div data-anim="from-left" data-delay="250" data-dur="1200" style="position:absolute;inset:0;background:rgba(90,168,236,.32);clip-path:polygon(44% 0,52% 0,36% 100%,28% 100%);pointer-events:none"></div>
    <div data-anim="stripe" data-delay="500" data-dur="1000" style="position:absolute;inset:0;background:#ffe600;clip-path:polygon(52.6% 0,53.8% 0,37.8% 100%,36.6% 100%);pointer-events:none"></div>
    <div data-parallax="0.1" style="position:absolute;left:-1vw;bottom:-3.4vw;pointer-events:none">
      <span data-anim="slide-left" data-delay="300" data-dur="1500" style="display:block;font-family:'Saira Extra Condensed','Saira Semi Condensed',sans-serif;font-weight:800;font-size:15vw;line-height:.8;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.22);white-space:nowrap;text-transform:uppercase">{{ en }}</span>
    </div>
    <div style="position:relative;z-index:1;padding:56px clamp(20px,6vw,96px);color:#fff;max-width:min(620px,92vw)">
      <p data-anim="wipe" data-delay="200" style="margin:0;display:flex;align-items:center;gap:14px;font-family:'Saira Semi Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.3em;color:#ffe600;text-transform:uppercase"><span style="width:44px;height:2px;background:#ffe600"></span>{{ en }}</p>
      <div style="overflow:hidden;margin-top:14px"><h1 data-anim="rise" data-delay="400" data-dur="1100" style="margin:0;font-size:clamp(34px,4.6vw,60px);font-weight:900;letter-spacing:.08em;line-height:1.25;text-shadow:0 4px 20px rgba(0,20,60,.35)">{{ ja }}</h1></div>
      <p data-anim="fade-up" data-delay="700" style="margin:18px 0 0;font-size:15px;line-height:1.9;max-width:460px;text-wrap:pretty;text-shadow:0 2px 10px rgba(0,20,60,.5)">{{ lead }}</p>
    </div>
  </div>
  <div style="position:relative;z-index:3;overflow:hidden;padding:20px 0;margin:-26px 0 -14px">
    <div style="background:#ffe600;transform:rotate(-1.5deg);margin:0 -4%;padding:10px 0">
      <div data-loop="marquee" data-speed="36000" style="display:flex;width:max-content;font-family:'Saira Extra Condensed','Saira Semi Condensed',sans-serif;font-weight:800;font-size:26px;letter-spacing:.08em;color:#0a3d8f;white-space:nowrap;text-transform:uppercase">
        <span style="padding-right:40px">{{ en }} ◆ SOSHO UNIVERSITY ◆ ADMISSIONS 2027 ◆ {{ en }} ◆ SOSHO UNIVERSITY ◆ ADMISSIONS 2027 ◆</span>
        <span style="padding-right:40px">{{ en }} ◆ SOSHO UNIVERSITY ◆ ADMISSIONS 2027 ◆ {{ en }} ◆ SOSHO UNIVERSITY ◆ ADMISSIONS 2027 ◆</span>
      </div>
    </div>
  </div>
  <nav data-anim="fade" data-delay="600" style="max-width:1000px;margin:0 auto;padding:22px 20px 8px;display:flex;gap:10px;align-items:center;font-size:12px;color:#4a5a6e">
    <a href="Top.dc.html" style="color:#1b5fb8;text-decoration:none">HOME</a><span>›</span><span>{{ ja }}</span>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:520},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Faculties&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ja&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;学部・学科&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slot&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;page-hero&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;photo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ページ写真&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
