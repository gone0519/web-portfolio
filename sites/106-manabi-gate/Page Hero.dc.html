<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Page Hero" style="position:relative;overflow:hidden">
  <div style="position:relative;height:{{ h }}">
    <p style="position:absolute;right:-1.5vw;bottom:-5vw;margin:0;font-family:Michroma,sans-serif;font-size:30vw;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(42,42,42,.13);pointer-events:none;user-select:none">{{ no }}</p>
    <div style="position:absolute;left:0;top:0;width:{{ imgW }};height:86%;background:#2e2e30">
      <image-slot id="{{ img1 }}" shape="rect" placeholder="{{ ph1 }}"></image-slot>
    </div>
    <div style="position:absolute;left:0;top:0;width:{{ imgW }};height:86%;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.45) 100%);pointer-events:none"></div>
    <div style="position:absolute;left:14px;top:28px;display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff;pointer-events:none">
      <span style="writing-mode:vertical-rl;font-family:Marcellus,serif;font-size:12px;letter-spacing:.2em">page</span>
      <span style="width:18px;height:18px;border:1px solid #fff;border-radius:50%;font-size:7px;display:flex;align-items:center;justify-content:center">{{ no }}</span>
      <span style="writing-mode:vertical-rl;font-size:10px;letter-spacing:.24em">{{ ja }}</span>
    </div>
    <div style="position:absolute;left:clamp(40px,5vw,96px);bottom:calc(14% + clamp(28px,3vw,56px));right:{{ titleR }};color:#fff;pointer-events:none">
      <p style="margin:0 0 14px;font-family:Marcellus,serif;font-size:12px;letter-spacing:.24em">( {{ no }} )　{{ crumbEn }}</p>
      <h1 style="margin:0;font-family:Marcellus,serif;font-weight:400;font-size:clamp(40px,6vw,116px);line-height:1;letter-spacing:.01em;text-wrap:balance">{{ en }}</h1>
    </div>
    <sc-if value="{{ desk }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;right:3%;top:11%;display:flex;align-items:flex-start;gap:24px">
        <div style="width:17vw;aspect-ratio:3/4;background:#6a645c;box-shadow:0 30px 60px rgba(0,0,0,.12)">
          <image-slot id="{{ img2 }}" shape="rect" placeholder="{{ ph2 }}"></image-slot>
        </div>
        <p style="margin:0;flex:0 0 auto;writing-mode:vertical-rl;font-family:'Shippori Mincho',serif;font-size:clamp(16px,1.4vw,26px);line-height:2.1;letter-spacing:.34em;color:#2a2a2a">{{ v1 }}<br>{{ v2 }}</p>
      </div>
      <div style="position:absolute;left:{{ imgW }};top:62%;width:9%;height:1px;background:#2a2a2a;opacity:.4"></div>
      <div style="position:absolute;left:calc(62% - 66px);top:calc(86% - 66px);z-index:4"><dc-import name="Circle Badge" href="#main" size="132px" dark="{{ true }}" text="SCROLL • MANABI GATE • SCROLL • " hint-size="132px,132px"></dc-import></div>
    </sc-if>
    <div style="position:absolute;left:clamp(40px,5vw,96px);bottom:0;height:14%;display:flex;align-items:center;gap:14px">
      <span style="width:1px;height:100%;background:#2a2a2a;opacity:.5"></span>
      <span style="font-family:Marcellus,serif;font-size:11px;letter-spacing:.24em;color:#555">Scroll</span>
    </div>
  </div>
  <div id="main" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(32px,5vw,100px);padding:clamp(60px,7vw,140px) {{ padR }} 0 {{ pad }}">
    <div>
      <p style="margin:0 0 18px;font-size:10px;letter-spacing:.14em;color:#777"><a href="Manabi%20Gate.dc.html" style="color:#777">TOP</a>　›　{{ ja }}</p>
      <p style="margin:0;font-family:'Shippori Mincho',serif;font-size:clamp(22px,2.2vw,40px);line-height:1.5;letter-spacing:.2em">{{ ja }}</p>
      <div style="margin-top:22px;width:48px;height:1px;background:#2d3a78"></div>
    </div>
    <div style="padding-top:clamp(0px,4vw,80px)">
      <h2 style="margin:0 0 24px;font-family:'Shippori Mincho',serif;font-weight:500;font-size:clamp(18px,1.6vw,30px);line-height:1.7;letter-spacing:.18em">{{ lead1 }}<br>{{ lead2 }}</h2>
      <p style="margin:0;font-size:13px;line-height:2.3;letter-spacing:.08em;color:#444;text-wrap:pretty">{{ body }}</p>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1440px&quot;,&quot;height&quot;:&quot;1100px&quot;},&quot;no&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Academic Fields&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ja&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;学部・学科&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;crumbEn&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;MANABI GATE&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;v1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;興味の先に&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;v2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;学びがある&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ph-1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ph-2&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ph1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;メインビジュアル&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ph2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;サブビジュアル&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: (document.documentElement.clientWidth || document.body.clientWidth || window.innerWidth) };
  componentDidMount() { this.r = () => this.setState({ w: (document.documentElement.clientWidth || document.body.clientWidth || window.innerWidth) }); window.addEventListener('resize', this.r); this.r(); this.t = setTimeout(this.r, 300); this.ro = new ResizeObserver(this.r); this.ro.observe(document.documentElement); }
  componentWillUnmount() { window.removeEventListener('resize', this.r); this.ro && this.ro.disconnect(); }
  renderVals() {
    const mob = this.state.w < 820; const p = this.props;
    return {
      desk: !mob, h: mob ? '78vh' : 'clamp(620px, 50vw, 980px)', imgW: mob ? '100%' : '62%', titleR: mob ? '20px' : '40%',
      pad: mob ? '20px' : '20.8vw', padR: mob ? '20px' : '10vw',
      no: p.no ?? '01', en: p.en ?? 'Academic Fields', ja: p.ja ?? '学部・学科', crumbEn: p.crumbEn ?? 'MANABI GATE',
      v1: p.v1 ?? '興味の先に', v2: p.v2 ?? '学びがある', lead1: p.lead1 ?? '', lead2: p.lead2 ?? '', body: p.body ?? '',
      img1: p.img1 ?? 'ph-1', img2: p.img2 ?? 'ph-2', ph1: p.ph1 ?? 'メインビジュアル', ph2: p.ph2 ?? 'サブビジュアル'
    };
  }
}
</script>
</body>
</html>
