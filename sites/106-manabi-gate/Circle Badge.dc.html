<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<a href="{{ href }}" style="position:relative;display:block;width:{{ size }};height:{{ size }};color:{{ fg }};border-radius:50%;transition:scale .4s" style-hover="scale:1.08">
  <div ref="{{ ring }}" style="position:absolute;inset:0;will-change:transform">
    <svg viewBox="0 0 200 200" width="100%" height="100%" style="display:block;overflow:visible">
      <defs><path id="{{ pid }}" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0"></path></defs>
      <text style="font-family:Marcellus,serif;font-size:15px;letter-spacing:4.2px;fill:currentColor"><textPath ref="{{ tp }}" href="#{{ pid }}"></textPath></text>
    </svg>
  </div>
  <span style="position:absolute;inset:26%;border-radius:50%;background:{{ bg }};display:flex;align-items:center;justify-content:center;font-size:18px;color:{{ ic }}">{{ icon }}</span>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;200px&quot;,&quot;height&quot;:&quot;200px&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;MANABI GATE • ADMISSIONS GUIDE • &quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;150px&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;↓&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  ring = React.createRef();
  pid = 'cb' + Math.random().toString(36).slice(2, 8);
  tp = React.createRef();
  setText() { if (this.tp.current) this.tp.current.textContent = this.props.text ?? 'MANABI GATE • ADMISSIONS GUIDE • '; }
  componentDidUpdate() { this.setText(); }
  componentDidMount() {
    this.setText(); setTimeout(() => this.setText(), 100);
    let a = 0; const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const tick = () => { a += 0.25 + Math.min(Math.abs(window.__mgVel || 0) * 0.08, 4); if (this.ring.current) this.ring.current.style.transform = `rotate(${a}deg)`; this.raf = requestAnimationFrame(tick); };
    if (!reduce) this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }
  renderVals() {
    const p = this.props, dark = p.dark ?? false;
    return { ring: this.ring, tp: this.tp, pid: this.pid, href: p.href ?? '#', size: p.size ?? '150px', text: p.text ?? 'MANABI GATE • ADMISSIONS GUIDE • ', icon: p.icon ?? '↓',
      fg: dark ? '#2a2a2a' : '#fff', bg: dark ? '#2a2a2a' : '#fff', ic: dark ? '#fff' : '#2a2a2a' };
  }
}
</script>
</body>
</html>
