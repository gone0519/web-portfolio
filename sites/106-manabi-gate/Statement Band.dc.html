<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#f5f4f1;overflow:hidden;padding:20px 0;white-space:nowrap;border-top:1px solid #e3e2de;border-bottom:1px solid #e3e2de">
  <div ref="{{ track }}" style="display:inline-flex;align-items:center;gap:40px;will-change:transform">
    <sc-for list="{{ words }}" as="r" hint-placeholder-count="8">
      <span style="display:inline-flex;align-items:center;gap:40px;font-family:'Shippori Mincho',serif;font-size:clamp(22px,2.6vw,50px);color:#2a2a2a">{{ r.t }}<span style="display:inline-block;width:2.2em;height:1em;border-radius:999px;background:{{ r.c }}"></span><span style="font-family:'Zen Kaku Gothic New';font-size:.55em;color:#999">→</span></span>
    </sc-for>
  </div>
</div>
<div style="position:relative;min-height:clamp(460px,42vw,820px);background:#2f3440;color:#fff;overflow:hidden">
  <div style="position:absolute;inset:0"><image-slot id="{{ img }}" shape="rect" placeholder="{{ ph }}"></image-slot></div>
  <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(24,28,38,.72) 0%,rgba(24,28,38,.35) 55%,rgba(24,28,38,.15) 100%);pointer-events:none"></div>
  <div style="position:relative;min-height:inherit;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:40px;padding:clamp(60px,7vw,140px) clamp(24px,8vw,160px);pointer-events:none">
    <div style="max-width:640px">
      <p style="margin:0 0 20px;font-family:Marcellus,serif;font-size:12px;letter-spacing:.3em;opacity:.85">( {{ label }} )</p>
      <p style="margin:0;font-family:'Shippori Mincho',serif;font-size:clamp(20px,2.8vw,54px);line-height:1.7;letter-spacing:.16em">{{ q1 }}<br>{{ q2 }}</p>
      <p style="margin:28px 0 0;font-size:12.5px;line-height:2.2;letter-spacing:.1em;opacity:.9">{{ note }}</p>
    </div>
    <p style="margin:0;font-family:Marcellus,serif;font-size:clamp(60px,10vw,200px);line-height:.9;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.55)">{{ big }}</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1440px&quot;,&quot;height&quot;:&quot;820px&quot;},&quot;words&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Learn,未来をひらく学び,Challenge,自分の道を選ぶ&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;sb-1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ph&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;背景ビジュアル&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Message&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;big&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Future&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;q1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;迷う時間も、&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;q2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;未来をつくる時間。&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;reverse&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  track = React.createRef();
  componentDidMount() {
    let x = 0; const dir = this.props.reverse ? 1 : -1;
    const tick = () => {
      const el = this.track.current;
      if (el) { const half = el.scrollWidth / 2 || 1; x += 0.5 + Math.min(Math.abs(window.__mgVel || 0) * 0.15, 10); const o = x % half; el.style.transform = `translateX(${dir < 0 ? -o : o - half}px)`; }
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }
  renderVals() {
    const p = this.props;
    const base = (p.words || 'Learn,未来をひらく学び,Challenge,自分の道を選ぶ').split(',');
    const cols = ['#8a7a62', '#5f7d5a', '#7a8698', '#b39a76'];
    const one = base.map((t, i) => ({ t, c: cols[i % 4] }));
    return {
      track: this.track, words: [...one, ...one, ...one, ...one],
      img: p.img ?? 'sb-1', ph: p.ph ?? '背景ビジュアル', label: p.label ?? 'Message', big: p.big ?? 'Future',
      q1: p.q1 ?? '迷う時間も、', q2: p.q2 ?? '未来をつくる時間。', note: p.note ?? ''
    };
  }
}
</script>
</body>
</html>
