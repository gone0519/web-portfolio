<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:sticky;top:0;z-index:50;background:#1846a6;box-shadow:0 2px 0 rgba(0,0,0,0.08);font-family:'M PLUS Rounded 1c',sans-serif;letter-spacing:0.04em">
  <div style="max-width:1120px;margin:0 auto;padding:0 clamp(16px,3vw,32px);height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px">
    <a href="Top.dc.html" style="display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none">
      <span style="width:34px;height:34px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span data-motion="pulse" style="width:10px;height:10px;border-radius:50%;background:#f5e35a"></span></span>
      <span style="display:flex;flex-direction:column;line-height:1.2">
        <span style="font-weight:800;font-size:17px;letter-spacing:0.14em;white-space:nowrap">白鷺女子大学</span>
        <span style="font-size:9px;letter-spacing:0.12em;white-space:nowrap;opacity:0.85">SHIRASAGI WOMEN'S UNIVERSITY</span>
      </span>
    </a>
    <sc-if value="{{ isWide }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="メインナビゲーション" style="display:flex;align-items:center;gap:clamp(14px,2.2vw,32px)">
        <a href="About.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;color:#fff;line-height:1.4;padding:6px 0;white-space:nowrap;text-decoration:none" style-hover="color:#f5e35a"><span style="font-weight:700;font-size:13px">大学について</span><span style="font-size:10px">About</span><sc-if value="{{ curAbout }}"><span style="position:absolute;bottom:-4px;left:20%;right:20%;height:3px;border-radius:2px;background:#f5e35a"></span></sc-if></a>
        <a href="Academics.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;color:#fff;line-height:1.4;padding:6px 0;white-space:nowrap;text-decoration:none" style-hover="color:#f5e35a"><span style="font-weight:700;font-size:13px">学部・学び</span><span style="font-size:10px">Academics</span><sc-if value="{{ curAcademics }}"><span style="position:absolute;bottom:-4px;left:20%;right:20%;height:3px;border-radius:2px;background:#f5e35a"></span></sc-if></a>
        <a href="CampusLife.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;color:#fff;line-height:1.4;padding:6px 0;white-space:nowrap;text-decoration:none" style-hover="color:#f5e35a"><span style="font-weight:700;font-size:13px">キャンパスライフ</span><span style="font-size:10px">Campus life</span><sc-if value="{{ curLife }}"><span style="position:absolute;bottom:-4px;left:20%;right:20%;height:3px;border-radius:2px;background:#f5e35a"></span></sc-if></a>
        <a href="Admissions.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;color:#fff;line-height:1.4;padding:6px 0;white-space:nowrap;text-decoration:none" style-hover="color:#f5e35a"><span style="font-weight:700;font-size:13px">入試情報</span><span style="font-size:10px">Admissions</span><sc-if value="{{ curAdmissions }}"><span style="position:absolute;bottom:-4px;left:20%;right:20%;height:3px;border-radius:2px;background:#f5e35a"></span></sc-if></a>
        <a data-motion="glow" href="OpenCampus.dc.html" style="display:flex;flex-direction:column;align-items:center;background:#f5e35a;color:#123b93;line-height:1.4;padding:8px 18px;border-radius:999px;white-space:nowrap;text-decoration:none" style-hover="background:#fff;color:#123b93"><span style="font-weight:800;font-size:13px">オープンキャンパス</span><span style="font-size:10px">Open campus</span></a>
      </nav>
    </sc-if>
    <sc-if value="{{ isNarrow }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" aria-label="メニュー" style="width:46px;height:46px;border:2px solid #fff;border-radius:8px;background:transparent;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer">
        <span style="width:20px;height:2px;background:#fff;border-radius:2px"></span>
        <span style="width:20px;height:2px;background:#fff;border-radius:2px"></span>
        <span style="width:20px;height:2px;background:#fff;border-radius:2px"></span>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ mobileMenu }}" hint-placeholder-val="{{ false }}">
    <nav aria-label="モバイルナビゲーション" style="display:flex;flex-direction:column;padding:4px 20px 24px;background:#1846a6;border-top:1px solid #3a63bb">
      <a href="Top.dc.html" style="padding:14px 4px;border-bottom:1px dashed #5b80c8;color:#fff;font-weight:700;text-decoration:none">トップ <span style="font-size:11px;font-weight:400;opacity:0.8">Home</span></a>
      <a href="About.dc.html" style="padding:14px 4px;border-bottom:1px dashed #5b80c8;color:#fff;font-weight:700;text-decoration:none">大学について <span style="font-size:11px;font-weight:400;opacity:0.8">About</span></a>
      <a href="Academics.dc.html" style="padding:14px 4px;border-bottom:1px dashed #5b80c8;color:#fff;font-weight:700;text-decoration:none">学部・学び <span style="font-size:11px;font-weight:400;opacity:0.8">Academics</span></a>
      <a href="CampusLife.dc.html" style="padding:14px 4px;border-bottom:1px dashed #5b80c8;color:#fff;font-weight:700;text-decoration:none">キャンパスライフ <span style="font-size:11px;font-weight:400;opacity:0.8">Campus life</span></a>
      <a href="Admissions.dc.html" style="padding:14px 4px;border-bottom:1px dashed #5b80c8;color:#fff;font-weight:700;text-decoration:none">入試情報 <span style="font-size:11px;font-weight:400;opacity:0.8">Admissions</span></a>
      <a data-motion="glow" href="OpenCampus.dc.html" style="margin-top:18px;background:#f5e35a;color:#123b93;padding:14px;text-align:center;font-weight:800;border-radius:999px;text-decoration:none">オープンキャンパス予約</a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1200px&quot;,&quot;height&quot;:&quot;80px&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;about&quot;,&quot;academics&quot;,&quot;life&quot;,&quot;admissions&quot;,&quot;opencampus&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, menuOpen: false };
  componentDidMount() {
    this.onResize = () => this.setState(s => ({ w: window.innerWidth, menuOpen: window.innerWidth >= 1000 ? false : s.menuOpen }));
    window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  renderVals() {
    const isWide = this.state.w >= 1000;
    const c = this.props.current ?? 'top';
    return {
      isWide, isNarrow: !isWide,
      menuOpen: this.state.menuOpen,
      mobileMenu: !isWide && this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      curAbout: c === 'about', curAcademics: c === 'academics', curLife: c === 'life', curAdmissions: c === 'admissions',
    };
  }
}
</script>
</body>
</html>
