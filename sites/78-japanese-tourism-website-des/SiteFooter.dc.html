<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ showCta }}" hint-placeholder-val="{{ true }}">
  <div style="position:relative;margin:clamp(88px,9vw,140px) clamp(0px,3vw,60px) 0;background:#dceae7;padding:clamp(64px,7vw,104px) 24px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;color:#34393a">
    <span style="font-family:'Sacramento',cursive;font-size:clamp(48px,4.5vw,68px);line-height:1;color:#5f9e95">Reservation</span>
    <h2 style="margin:0;font-family:'Shippori Mincho',serif;font-weight:500;font-size:clamp(22px,2.2vw,32px);letter-spacing:.22em;line-height:1.7">次の休日を、ここから。</h2>
    <p style="margin:0;font-size:12px;letter-spacing:.16em;color:#4a5153">Your Next Adventure Starts Here.</p>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:16px">
      <a href="Access.dc.html#reservation" style="display:inline-flex;align-items:center;justify-content:space-between;gap:28px;min-width:min(100%,300px);height:64px;padding:0 30px 0 38px;border-radius:999px;background:#34393a;color:#fff;font-size:15px;letter-spacing:.16em;text-decoration:none" style-hover="background:#5f9e95;color:#fff"><span>予約はこちら <span style="font-size:11px;letter-spacing:.1em;opacity:.8">Book Now</span></span><span>→</span></a>
      <a href="Access.dc.html" style="display:inline-flex;align-items:center;justify-content:space-between;gap:28px;min-width:min(100%,300px);height:64px;padding:0 30px 0 38px;border-radius:999px;border:1px solid #34393a;background:#fff;color:#34393a;font-size:14px;letter-spacing:.14em;text-decoration:none" style-hover="background:#34393a;color:#fff"><span>アクセスを見る <span style="font-size:10px">View Access</span></span><span>→</span></a>
    </div>
  </div>
</sc-if>
<footer style="position:relative;margin-top:clamp(88px,9vw,140px);color:#34393a">
  <svg aria-hidden="true" viewBox="0 0 1440 80" preserveAspectRatio="none" style="display:block;width:100%;height:clamp(40px,5vw,80px)"><path d="M0 80 C 360 0, 1080 0, 1440 60 L1440 80 Z" fill="#dceae7"></path></svg>
  <div style="background:#dceae7;padding:24px 24px max(40px,calc(130px - 8vw));display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center">
    <nav aria-label="フッターナビゲーション" style="display:flex;flex-wrap:wrap;justify-content:center;gap:6px 28px">
      <a href="Home.dc.html" style="padding:8px 0;font-size:12px;letter-spacing:.14em;color:#34393a;text-decoration:none">トップ</a>
      <a href="Concept.dc.html" style="padding:8px 0;font-size:12px;letter-spacing:.14em;color:#34393a;text-decoration:none">コンセプト</a>
      <a href="Experiences.dc.html" style="padding:8px 0;font-size:12px;letter-spacing:.14em;color:#34393a;text-decoration:none">体験・アクティビティ</a>
      <a href="Facilities.dc.html" style="padding:8px 0;font-size:12px;letter-spacing:.14em;color:#34393a;text-decoration:none">施設案内</a>
      <a href="Season.dc.html" style="padding:8px 0;font-size:12px;letter-spacing:.14em;color:#34393a;text-decoration:none">季節の楽しみ方</a>
      <a href="Access.dc.html" style="padding:8px 0;font-size:12px;letter-spacing:.14em;color:#34393a;text-decoration:none">アクセス・ご予約</a>
    </nav>
    <div style="font-size:12px;line-height:2;letter-spacing:.08em">[事業者名]<br>〒000-0000 [住所が入ります]<br>TEL 000-000-0000</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
      <span style="font-size:9px;letter-spacing:.2em">ひと息つく、旅の間</span>
      <span style="font-family:'Shippori Mincho',serif;font-size:24px;letter-spacing:.06em">Tabi no Ma</span>
      <span style="font-family:'Sacramento',cursive;font-size:20px;line-height:1;color:#5f9e95">[ your region ]</span>
    </div>
    <small style="font-size:10px;letter-spacing:.14em;color:#4a5153">© [Company Name]. All Rights Reserved.</small>
  </div>
  <a href="#" onClick="{{ toTop }}" aria-label="ページの先頭へ" style="position:absolute;right:clamp(16px,3vw,48px);bottom:32px;width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;color:#34393a;text-decoration:none">↑</a>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;cta&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;on&quot;,&quot;off&quot;],&quot;default&quot;:&quot;on&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      showCta: this.props.cta !== 'off',
      toTop: e => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
    };
  }
}
</script>
</body>
</html>
