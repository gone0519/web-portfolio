<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="position:relative">
  <div aria-hidden="true" style="position:absolute;right:-280px;top:-60px;width:380px;height:380px;border-radius:50%;border:60px solid {{ ring }};z-index:0"></div>
  <div style="position:relative;z-index:1;background:#f8ece8;border-radius:48px;padding:clamp(32px,5vw,56px) clamp(24px,5vw,56px) clamp(32px,5vw,56px) clamp(48px,6vw,80px);display:flex;flex-wrap:wrap;gap:32px;align-items:center">
    <div style="position:absolute;left:-28px;top:-20px;width:60px;padding:16px 0 18px;border-radius:14px;background:{{ color }};color:#4a3f3a;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:'Zen Maru Gothic',sans-serif;font-weight:900">
      <span style="writing-mode:vertical-rl;font-size:20px;letter-spacing:.12em">{{ tab }}</span>
      <span style="writing-mode:vertical-rl;font-size:9px;letter-spacing:.2em">{{ en }}</span>
    </div>
    <img class="deco" src="images/deco/sakura-bouquet.png" alt="" aria-hidden="true" style="right:-30px;top:-70px;width:170px;z-index:2">
    <div style="flex:1 1 min(100%,320px);display:flex;flex-direction:column;gap:16px">
      <nav aria-label="パンくずリスト" style="display:flex;gap:8px;font-size:12px;color:#5d5650">
        <a href="Sumika%20Womens%20University.dc.html" style="color:#5d5650;text-decoration:underline">トップ</a><span aria-hidden="true">＞</span><span aria-current="page">{{ tab }}</span>
      </nav>
      <h1 style="margin:0;font-family:'Shippori Mincho',serif;font-weight:700;font-size:clamp(24px,6.2vw,46px);line-height:1.45;letter-spacing:.04em;white-space:pre-line;text-wrap:pretty">{{ title }}</h1>
      <p style="margin:0;font-size:14px;line-height:2;color:#5d5650;text-wrap:pretty">{{ lead }}</p>
    </div>
    <div style="flex:1 1 min(100%,320px);height:clamp(240px,28vw,340px);border-radius:32px;overflow:hidden">
      <image-slot id="{{ imgId }}" shape="rect" placeholder="{{ ph }}" src="{{ img }}"></image-slot>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#f6d384&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ring&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#fbe6ae&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tab&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;大学紹介&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ABOUT&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;imgId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;hero&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ph&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
