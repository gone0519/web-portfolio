<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
  <header style="position:fixed;left:0;top:0;z-index:20;width:216px;height:100vh;padding:28px 18px 24px 26px;display:flex;flex-direction:column;gap:20px;overflow-y:auto">
    <a href="Sumika%20Womens%20University.dc.html" aria-label="澄花女子大学 トップへ" style="display:flex;flex-direction:column;gap:6px;color:#4a3f3a">
      <span style="font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:68px;line-height:.9;letter-spacing:-.02em">澄花</span>
      <span style="font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:30px;line-height:1;letter-spacing:.04em">女子大学</span>
      <span style="font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:10px;letter-spacing:.18em;color:#5d5650;margin-top:4px">SUMIKA WOMEN'S UNIVERSITY</span>
    </a>
    <nav aria-label="メインナビゲーション" style="background:#fffdf8;border-radius:14px;padding:10px 6px;display:flex;flex-direction:column">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
        <a href="{{ n.href }}" aria-current="{{ n.cur }}" style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:{{ n.weight }};background:{{ n.bg }};color:#4a3f3a" style-hover="background:#fcf7f2;color:#4a3f3a">
          <span style="width:9px;height:9px;border-radius:50%;background:{{ n.color }};flex:none"></span>
          <span>{{ n.ja }}</span>
        </a>
      </sc-for>
    </nav>
    <div style="display:flex;flex-direction:column;gap:8px">
      <a href="OpenCampus.dc.html" style="display:flex;align-items:center;justify-content:space-between;gap:8px;background:#f4a8a1;color:#4a3f3a;border-radius:12px;padding:13px 12px;font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:13px;white-space:nowrap" style-hover="background:#ec958d;color:#4a3f3a">オープンキャンパス<span style="width:20px;height:20px;border-radius:50%;background:#fff;color:#c2615a;display:grid;place-items:center;font-size:11px">→</span></a>
      <a href="Admissions.dc.html" style="display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fffdf8;color:#4a3f3a;border:2px solid #4a3f3a;border-radius:12px;padding:11px 14px;font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:14px" style-hover="background:#cdb8e6;color:#4a3f3a">入試情報<span style="font-size:11px">→</span></a>
    </div>
  </header>
</sc-if>
<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
  <header style="position:fixed;top:0;left:0;right:0;z-index:30;background:rgba(252,247,242,.96);backdrop-filter:blur(8px);border-bottom:1px solid #f0e2dc">
    <div style="height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px">
      <a href="Sumika%20Womens%20University.dc.html" style="display:flex;align-items:baseline;gap:4px;color:#4a3f3a;font-family:'Zen Maru Gothic',sans-serif;font-weight:900">
        <span style="font-size:30px;line-height:1">澄花</span><span style="font-size:15px">女子大学</span>
      </a>
      <div style="display:flex;align-items:center;gap:8px">
        <a href="OpenCampus.dc.html" style="background:#f4a8a1;color:#4a3f3a;border-radius:999px;padding:9px 14px;font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:12px">OC予約</a>
        <button type="button" onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpenStr }}" aria-label="メニュー" style="width:44px;height:44px;border-radius:12px;border:none;background:#cdb8e6;color:#4a3f3a;font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:11px;cursor:pointer">{{ menuLabel }}</button>
      </div>
    </div>
    <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
      <nav aria-label="メインナビゲーション" style="padding:4px 16px 20px;display:flex;flex-direction:column;gap:4px">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
          <a href="{{ n.href }}" style="display:flex;align-items:center;gap:12px;padding:14px 12px;background:#fffdf8;border-radius:12px;font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:15px;color:#4a3f3a">
            <span style="width:10px;height:10px;border-radius:50%;background:{{ n.color }}"></span>{{ n.ja }}<span style="margin-left:auto;font-size:10px;letter-spacing:.14em;color:#5d5650">{{ n.en }}</span>
          </a>
        </sc-for>
      </nav>
    </sc-if>
  </header>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;about&quot;,&quot;academics&quot;,&quot;campus&quot;,&quot;admissions&quot;,&quot;oc&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: window.innerWidth, menuOpen: false };
  componentDidMount() { this.r = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.r); }
  componentWillUnmount() { window.removeEventListener('resize', this.r); }
  renderVals() {
    const d = this.state.w >= 900, cur = this.props.current ?? 'top';
    const items = [
      ['top', 'トップ', 'TOP', 'Sumika%20Womens%20University.dc.html', '#4a3f3a'],
      ['about', '大学紹介', 'ABOUT', 'About.dc.html', '#f6d384'],
      ['academics', '学部・学科', 'ACADEMICS', 'Academics.dc.html', '#9ad8bd'],
      ['campus', 'キャンパスライフ', 'CAMPUS LIFE', 'CampusLife.dc.html', '#f4a8a1'],
      ['admissions', '入試情報', 'ADMISSIONS', 'Admissions.dc.html', '#a9c8ee'],
      ['oc', 'オープンキャンパス', 'OPEN CAMPUS', 'OpenCampus.dc.html', '#cdb8e6'],
    ];
    const nav = items.map(([k, ja, en, href, color]) => ({ ja, en, href, color, cur: k === cur ? 'page' : undefined, bg: k === cur ? '#fcf7f2' : 'transparent', weight: k === cur ? 700 : 500 }));
    return {
      isDesktop: d, isMobile: !d, nav, menuOpen: this.state.menuOpen, menuOpenStr: String(this.state.menuOpen),
      menuLabel: this.state.menuOpen ? '閉じる' : 'MENU', toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
    };
  }
}
</script>
</body>
</html>
