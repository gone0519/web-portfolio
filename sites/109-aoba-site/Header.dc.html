<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header id="pagetop" style="background:#FFF8EA;border-bottom:2px solid #2B2B2B;font-family:'Zen Maru Gothic',sans-serif;color:#2B2B2B">
  <div style="max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px">
    <a href="Aoba%20Womens%20University.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#2B2B2B">
      <span style="display:flex;gap:3px"><span style="width:14px;height:14px;border-radius:50%;border:2px solid #2B2B2B;background:#89C2C1"></span><span style="width:14px;height:14px;border-radius:50%;border:2px solid #2B2B2B;background:#C5D97F"></span></span>
      <span style="display:flex;flex-direction:column;line-height:1.1">
        <span style="font-weight:900;font-size:18px;letter-spacing:.08em">青葉女子大学</span>
        <span style="font-family:Quicksand,sans-serif;font-weight:700;font-size:10px;letter-spacing:.12em">aoba women's university</span>
      </span>
    </a>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="メインナビゲーション" style="display:flex;align-items:center;gap:22px">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="4">
          <sc-if value="{{ n.active }}" hint-placeholder-val="{{ false }}">
            <a href="{{ n.href }}" aria-current="page" style="font-size:14px;font-weight:700;color:#1D5641;text-decoration:underline;text-decoration-thickness:3px;text-decoration-color:#89C2C1;text-underline-offset:6px">{{ n.label }}</a>
          </sc-if>
          <sc-if value="{{ n.inactive }}" hint-placeholder-val="{{ true }}">
            <a href="{{ n.href }}" style="font-size:14px;font-weight:700;color:#2B2B2B;text-decoration:none" style-hover="color:#1D5641;text-decoration:underline">{{ n.label }}</a>
          </sc-if>
        </sc-for>
        <a href="OpenCampus.dc.html" style="display:flex;align-items:center;height:40px;padding:0 20px;border-radius:999px;border:2px solid #2B2B2B;background:#1D5641;color:#fff;font-size:13px;font-weight:700;letter-spacing:.08em;text-decoration:none" style-hover="background:#2B2B2B;color:#fff">オープンキャンパス</a>
      </nav>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" aria-controls="mnav" aria-label="メニュー" style="width:46px;height:46px;border-radius:50%;border:2px solid #2B2B2B;background:#89C2C1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer">
        <span style="width:18px;height:2px;background:#2B2B2B"></span><span style="width:18px;height:2px;background:#2B2B2B"></span><span style="width:18px;height:2px;background:#2B2B2B"></span>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ showMobileMenu }}" hint-placeholder-val="{{ false }}">
    <nav id="mnav" aria-label="モバイルナビゲーション" style="border-top:2px solid #2B2B2B;background:#FFF8EA;padding:12px 20px 20px;display:flex;flex-direction:column;gap:4px">
      <a href="Aoba%20Womens%20University.dc.html" style="padding:12px 4px;font-weight:700;color:#2B2B2B;text-decoration:none;border-bottom:1px dashed #C9C2B2">トップ</a>
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="4">
        <a href="{{ n.href }}" style="padding:12px 4px;font-weight:700;color:#2B2B2B;text-decoration:none;border-bottom:1px dashed #C9C2B2">{{ n.label }}</a>
      </sc-for>
      <a href="OpenCampus.dc.html" style="margin-top:12px;display:flex;align-items:center;justify-content:center;height:48px;border-radius:999px;border:2px solid #2B2B2B;background:#1D5641;color:#fff;font-weight:700;letter-spacing:.08em;text-decoration:none">オープンキャンパス</a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:80},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;about&quot;,&quot;academics&quot;,&quot;campus&quot;,&quot;admissions&quot;,&quot;opencampus&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false, w: typeof window !== 'undefined' ? window.innerWidth : 1200 };
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  renderVals() {
    const cur = this.props.current;
    const items = [
      ['about', '大学紹介', 'About.dc.html'],
      ['academics', '学部・学科', 'Academics.dc.html'],
      ['campus', 'キャンパスライフ', 'Campus.dc.html'],
      ['admissions', '入試情報', 'Admissions.dc.html'],
    ];
    const isMobile = this.state.w < 860;
    return {
      nav: items.map(([k, label, href]) => ({ label, href, active: k === cur, inactive: k !== cur })),
      isMobile, isDesktop: !isMobile,
      menuOpen: this.state.menuOpen,
      showMobileMenu: isMobile && this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
    };
  }
}
</script>
</body>
</html>
