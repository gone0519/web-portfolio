<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section aria-label="オープンキャンパス・資料請求のご案内" style="background:#1D5641;font-family:'Zen Maru Gothic',sans-serif">
  <dc-import name="Marquee" hint-size="100%,50px"></dc-import>
  <div style="max-width:820px;margin:0 auto;padding:56px 20px 40px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center">
    <p style="margin:0;font-size:clamp(20px,3vw,24px);font-weight:900;color:#fff;line-height:1.6;letter-spacing:.06em"><span style="display:inline-block">キャンパスで、</span><span style="display:inline-block">あなたに会える日を</span><br><span style="display:inline-block">楽しみにしています。</span></p>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px">
      <a href="OpenCampus.dc.html#reserve" style="display:flex;align-items:center;height:50px;padding:0 30px;border-radius:999px;border:2px solid #2B2B2B;background:#F2A93B;color:#2B2B2B;font-size:15px;font-weight:700;letter-spacing:.08em;text-decoration:none" style-hover="background:#F7C46F;color:#2B2B2B">オープンキャンパスを予約</a>
      <a href="Admissions.dc.html#documents" style="display:flex;align-items:center;height:50px;padding:0 30px;border-radius:999px;border:2px solid #fff;background:transparent;color:#fff;font-size:15px;font-weight:700;letter-spacing:.08em;text-decoration:none" style-hover="background:#fff;color:#1D5641">資料を請求する</a>
    </div>
  </div>
  <div aria-hidden="true" style="position:relative;height:80px;overflow:hidden;pointer-events:none">
    <span style="position:absolute;left:-2%;bottom:0;width:36%;height:72px;background:#3E7560;clip-path:polygon(0 100%,22% 35%,36% 55%,58% 5%,80% 60%,100% 100%)"></span>
    <span style="position:absolute;left:30%;bottom:0;width:30%;height:52px;background:#57A6A6;clip-path:polygon(0 100%,45% 10%,60% 30%,100% 100%)"></span>
    <span style="position:absolute;right:-2%;bottom:0;width:42%;height:76px;background:#3E7560;clip-path:polygon(0 100%,25% 40%,40% 55%,62% 0,100% 100%)"></span>
    <span style="position:absolute;right:30%;bottom:0;display:flex;align-items:flex-start"><span style="width:4px;height:44px;background:#7A4A2A"></span><span style="width:32px;height:20px;background:#EF9E92;clip-path:polygon(0 0,100% 15%,85% 50%,100% 85%,0 100%)"></span></span>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:340}}"></script>
</body>
</html>
