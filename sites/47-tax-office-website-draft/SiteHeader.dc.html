<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="background:#fff;box-shadow:0 1px 0 rgba(22,64,126,0.08);font-family:'Noto Sans JP',sans-serif">
  <div style="height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 clamp(16px,3vw,40px)">
    <a href="Tax%20Office%20Website.dc.html" style="display:flex;align-items:center;gap:10px;color:#16407e;text-decoration:none">
      <span style="position:relative;width:28px;height:28px;flex:none">
        <span style="position:absolute;left:0;top:0;width:20px;height:20px;background:#16407e;border-radius:4px"></span>
        <span style="position:absolute;right:0;bottom:0;width:16px;height:16px;background:#3d9ae0;border-radius:4px;border:2px solid #fff"></span>
      </span>
      <span style="display:flex;flex-direction:column;line-height:1.2">
        <span style="font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:18px;letter-spacing:0.06em">みなと税理士事務所</span>
        <span style="font-family:Quicksand,sans-serif;font-size:9.5px;font-weight:600;letter-spacing:0.06em;color:#3d9ae0">Minato Tax Accounting Office</span>
      </span>
    </a>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="メインナビゲーション" style="display:flex;align-items:center;gap:clamp(14px,1.8vw,28px)">
        <a href="Tax%20Office%20Website.dc.html" style="display:flex;align-items:center;gap:6px;color:#16407e;text-decoration:none;font-family:Quicksand,sans-serif;font-weight:700;font-size:13px;letter-spacing:0.08em" style-hover="color:#3d9ae0"><sc-if value="{{ aHome }}" hint-placeholder-val="{{ false }}"><span style="width:7px;height:7px;border-radius:50%;background:#3d9ae0"></span></sc-if>HOME</a>
        <a href="About.dc.html" style="display:flex;align-items:center;gap:6px;color:#16407e;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:0.06em" style-hover="color:#3d9ae0"><sc-if value="{{ aAbout }}" hint-placeholder-val="{{ false }}"><span style="width:7px;height:7px;border-radius:50%;background:#3d9ae0"></span></sc-if>私たちについて</a>
        <a href="Services.dc.html" style="display:flex;align-items:center;gap:6px;color:#16407e;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:0.06em" style-hover="color:#3d9ae0"><sc-if value="{{ aServices }}" hint-placeholder-val="{{ false }}"><span style="width:7px;height:7px;border-radius:50%;background:#3d9ae0"></span></sc-if>サービス</a>
        <a href="Why-Choose-Us.dc.html" style="display:flex;align-items:center;gap:6px;color:#16407e;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:0.06em" style-hover="color:#3d9ae0"><sc-if value="{{ aWhy }}" hint-placeholder-val="{{ false }}"><span style="width:7px;height:7px;border-radius:50%;background:#3d9ae0"></span></sc-if>選ばれる理由</a>
        <a href="Pricing.dc.html" style="display:flex;align-items:center;gap:6px;color:#16407e;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:0.06em" style-hover="color:#3d9ae0"><sc-if value="{{ aPricing }}" hint-placeholder-val="{{ false }}"><span style="width:7px;height:7px;border-radius:50%;background:#3d9ae0"></span></sc-if>料金プラン</a>
        <a href="Tax%20Office%20Website.dc.html#contact" style="display:flex;align-items:center;gap:6px;color:#16407e;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:0.06em" style-hover="color:#3d9ae0">お問い合わせ</a>
        <a href="Tax%20Office%20Website.dc.html#contact" style="display:flex;align-items:center;gap:8px;background:#eba028;color:#fff;text-decoration:none;font-weight:700;font-size:13px;letter-spacing:0.08em;padding:11px 22px;border-radius:999px;box-shadow:0 3px 0 #c9831a;transition:transform .2s, box-shadow .2s" style-hover="color:#fff;transform:translateY(2px);box-shadow:0 1px 0 #c9831a"><span style="font-family:'Material Symbols Outlined';font-size:18px">mail</span>無料相談</a>
      </nav>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-label="メニュー" aria-expanded="{{ menuOpen }}" style="width:48px;height:48px;border:none;background:#16407e;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer">
        <span style="width:20px;height:2px;background:#fff;border-radius:2px"></span>
        <span style="width:20px;height:2px;background:#fff;border-radius:2px"></span>
        <span style="width:20px;height:2px;background:#fff;border-radius:2px"></span>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ showMobileMenu }}" hint-placeholder-val="{{ false }}">
    <nav aria-label="モバイルナビゲーション" style="display:flex;flex-direction:column;padding:8px 20px 24px;background:#fff;border-top:1px solid #e3edf3">
      <a href="Tax%20Office%20Website.dc.html" onClick="{{ closeMenu }}" style="padding:16px 4px;border-bottom:1px solid #e3edf3;color:#16407e;text-decoration:none;font-family:Quicksand,sans-serif;font-weight:700;font-size:15px">HOME</a>
      <a href="About.dc.html" style="padding:16px 4px;border-bottom:1px solid #e3edf3;color:#16407e;text-decoration:none;font-size:15px;font-weight:500">私たちについて</a>
      <a href="Services.dc.html" style="padding:16px 4px;border-bottom:1px solid #e3edf3;color:#16407e;text-decoration:none;font-size:15px;font-weight:500">サービス</a>
      <a href="Why-Choose-Us.dc.html" style="padding:16px 4px;border-bottom:1px solid #e3edf3;color:#16407e;text-decoration:none;font-size:15px;font-weight:500">選ばれる理由</a>
      <a href="Pricing.dc.html" style="padding:16px 4px;border-bottom:1px solid #e3edf3;color:#16407e;text-decoration:none;font-size:15px;font-weight:500">料金プラン</a>
      <a href="Tax%20Office%20Website.dc.html#contact" onClick="{{ closeMenu }}" style="padding:16px 4px;color:#16407e;text-decoration:none;font-size:15px;font-weight:500">お問い合わせ</a>
      <a href="Tax%20Office%20Website.dc.html#contact" onClick="{{ closeMenu }}" style="margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;background:#eba028;color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:15px;border-radius:999px;box-shadow:0 3px 0 #c9831a">無料相談</a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:72},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;services&quot;,&quot;why&quot;,&quot;pricing&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, menuOpen: false };
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  renderVals() {
    const c = this.props.current ?? 'home';
    const isMobile = this.state.w < 1080;
    return {
      isMobile, isDesktop: !isMobile, menuOpen: this.state.menuOpen,
      showMobileMenu: isMobile && this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
      aHome: c === 'home', aAbout: c === 'about', aServices: c === 'services', aWhy: c === 'why', aPricing: c === 'pricing',
    };
  }
}
</script>
</body>
</html>
