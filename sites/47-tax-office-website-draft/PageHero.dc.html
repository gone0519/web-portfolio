<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="font-family:'Noto Sans JP',sans-serif">
  <section style="position:relative;height:clamp(240px,30vw,360px);overflow:hidden;background:#16407e">
    <div data-zoom="" style="position:absolute;inset:0">
      <image-slot id="{{ slotId }}" shape="rect" src="{{ src }}" placeholder="{{ placeholder }}"></image-slot>
    </div>
    <div style="position:absolute;inset:0;background:rgba(14,44,92,0.5);pointer-events:none"></div>
    <div style="position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:0 20px 24px;pointer-events:none;box-sizing:border-box">
      <span data-reveal="" style="position:relative;width:24px;height:24px"><span style="position:absolute;left:0;top:0;width:16px;height:16px;background:#fff;border-radius:3px"></span><span style="position:absolute;right:0;bottom:0;width:13px;height:13px;background:#3d9ae0;border-radius:3px;border:2px solid #fff"></span></span>
      <span data-reveal="" style="font-family:Quicksand,sans-serif;font-weight:600;font-size:14px;letter-spacing:0.1em;color:#fff">{{ en }}</span>
      <h1 data-reveal="" style="margin:0;display:flex;align-items:center;gap:22px;font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:clamp(26px,3.4vw,38px);letter-spacing:0.16em;color:#fff"><span style="width:1.5px;height:30px;background:#fff;transform:rotate(-28deg)"></span>{{ ja }}<span style="width:1.5px;height:30px;background:#fff;transform:rotate(28deg)"></span></h1>
    </div>
    <svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;left:0;bottom:-1px;display:block;width:100%;height:clamp(20px,3.5vw,44px);pointer-events:none"><path d="M0 10 L0 0 Q28 1 50 10 Q72 1 100 0 L100 10 Z" fill="#fff"></path></svg>
  </section>
  <nav aria-label="パンくずリスト" style="max-width:1160px;margin:0 auto;padding:16px clamp(16px,3vw,40px) 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:#4a5d78">
    <a href="Tax%20Office%20Website.dc.html" style="color:#3d9ae0;text-decoration:none;font-family:Quicksand,sans-serif;font-weight:700">HOME</a>
    <span style="font-family:'Material Symbols Outlined';font-size:14px;color:#9fb3c8">chevron_right</span>
    <sc-if value="{{ parentLabel }}" hint-placeholder-val="{{ false }}">
      <a href="{{ parentHref }}" style="color:#3d9ae0;text-decoration:none">{{ parentLabel }}</a>
      <span style="font-family:'Material Symbols Outlined';font-size:14px;color:#9fb3c8">chevron_right</span>
    </sc-if>
    <span>{{ ja }}</span>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:420},&quot;en&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;About Us&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ja&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;私たちについて&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slotId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;page-hero&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Page header photo (横長)&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;parentLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;parentHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
