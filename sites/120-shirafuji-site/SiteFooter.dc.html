<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer id="footer" style="background:#373c44;color:#fff;padding:clamp(70px,7vw,110px) 0 40px;font-family:'Zen Kaku Gothic New',sans-serif">
  <div style="max-width:1360px;margin:0 auto;padding:0 clamp(20px,4vw,40px)">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:40px">
      <sc-for list="{{ cols }}" as="col" hint-placeholder-count="4">
        <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px">
          <sc-for list="{{ col.items }}" as="it" hint-placeholder-count="5">
            <li><a href="{{ it.href }}" style="color:#fff;text-decoration:none;font-size:{{ it.size }};font-weight:{{ it.weight }};letter-spacing:.08em;padding-left:{{ it.pad }}" style-hover="color:#f3a6c4">{{ it.label }}</a></li>
          </sc-for>
        </ul>
      </sc-for>
      <div style="display:flex;flex-direction:column;gap:14px">
        <p style="margin:0;font-size:18px;font-weight:700;letter-spacing:.08em">白藤女子大学</p>
        <p style="margin:0;font-size:13px;line-height:1.9;letter-spacing:.06em;color:#d9dde2">〒000-0000 住所は確定後に掲載<br>TEL 000-000-0000（入試広報課）</p>
        <span style="width:40px;height:1px;background:#6c737c;margin:6px 0"></span>
        <p style="margin:0;font-size:13px;font-weight:700;letter-spacing:.1em">公式SNS</p>
        <div style="display:flex;gap:12px">
          <sc-for list="{{ sns }}" as="s" hint-placeholder-count="4">
            <a href="#footer" aria-label="{{ s.label }}" style="width:36px;height:36px;border-radius:50%;background:#fff;color:#373c44;text-decoration:none;display:flex;align-items:center;justify-content:center;font-family:Barlow,sans-serif;font-weight:600;font-size:12px;transition:background .2s" style-hover="background:#d63672;color:#fff">{{ s.short }}</a>
          </sc-for>
        </div>
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px;margin-top:70px;padding-top:30px;border-top:1px solid #565d66">
      <div style="display:flex;flex-wrap:wrap;gap:12px 28px;font-size:12px">
        <a href="#footer" style="color:#fff;text-decoration:none" style-hover="color:#f3a6c4">プライバシーポリシー</a>
        <a href="#footer" style="color:#fff;text-decoration:none" style-hover="color:#f3a6c4">サイトポリシー</a>
        <a href="#footer" style="color:#fff;text-decoration:none" style-hover="color:#f3a6c4">情報公開</a>
        <a href="#footer" style="color:#fff;text-decoration:none" style-hover="color:#f3a6c4">アクセシビリティ</a>
      </div>
      <p style="margin:0;font-family:Barlow,sans-serif;font-size:12px;letter-spacing:.08em">© SHIRAFUJI WOMEN'S UNIVERSITY ALL RIGHTS RESERVED.</p>
    </div>
  </div>
</footer>
<sc-if value="{{ stickyCta }}" hint-placeholder-val="{{ true }}">
  <a href="Admissions.dc.html#oc" style="position:fixed;right:0;bottom:0;z-index:40;display:flex;align-items:center;gap:12px;background:#fff;color:#222;text-decoration:none;padding:16px 24px;border-radius:6px 0 0 0;box-shadow:0 -2px 18px rgba(30,40,60,.14);font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;font-weight:700;letter-spacing:.06em" style-hover="color:#d63672">
    <span style="width:10px;height:10px;border-radius:50%;background:#d63672;animation:pulse 1.8s ease-out infinite"></span>受験生の方へ｜資料請求・オープンキャンパス
  </a>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1440px&quot;,&quot;height&quot;:&quot;640px&quot;},&quot;stickyCta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const T = 'Shirafuji%20Admissions.dc.html', A = 'About.dc.html', AC = 'Academics.dc.html', C = 'CampusLife.dc.html', V = 'Voices.dc.html', AD = 'Admissions.dc.html';
    const cols = [
      [{ label: 'サイトトップ', href: T }, { label: '理念・特色', href: A }, { label: '学長メッセージ', href: A + '#message', sub: 1 }, { label: '教育理念', href: A + '#philosophy', sub: 1 }, { label: '学部・学科', href: AC },
       { label: '文学部', href: AC + '#f-lit', sub: 1 }, { label: '国際コミュニケーション学部', href: AC + '#f-intl', sub: 1 }, { label: '人間科学部', href: AC + '#f-hum', sub: 1 },
       { label: '生活科学部', href: AC + '#f-life', sub: 1 }, { label: '教育学部', href: AC + '#f-edu', sub: 1 }, { label: '情報デザイン学部', href: AC + '#f-info', sub: 1 }],
      [{ label: 'キャンパスライフ', href: C }, { label: '施設・キャンパス', href: C + '#facilities', sub: 1 }, { label: '年間行事', href: C + '#events', sub: 1 },
       { label: 'クラブ・サークル', href: C + '#clubs', sub: 1 }, { label: 'キャリア支援', href: C + '#career', sub: 1 }, { label: '先輩の声', href: V }],
      [{ label: '入試情報（受験生の方へ）', href: AD }, { label: '入試区分', href: AD + '#types', sub: 1 }, { label: '入試スケジュール', href: AD + '#schedule', sub: 1 },
       { label: 'オープンキャンパス', href: AD + '#oc', sub: 1 }, { label: '資料請求', href: AD + '#request', sub: 1 }, { label: 'よくある質問', href: AD + '#faq' }],
      [{ label: 'お問い合わせ', href: AD + '#contact' }, { label: '在学生・保護者の方へ', href: '#footer' }, { label: '卒業生の方へ', href: '#footer' }, { label: '交通アクセス', href: '#footer' }]
    ];
    return {
      cols: cols.map(items => ({ items: items.map(i => ({ ...i, size: i.sub ? '14px' : '15px', weight: i.sub ? 400 : 700, pad: i.sub ? '16px' : '0' })) })),
      sns: [{ label: 'X', short: 'X' }, { label: 'Instagram', short: 'IG' }, { label: 'YouTube', short: 'YT' }, { label: 'LINE', short: 'LN' }],
      stickyCta: this.props.stickyCta ?? true
    };
  }
}
</script>
</body>
</html>
