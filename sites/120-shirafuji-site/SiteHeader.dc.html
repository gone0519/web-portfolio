<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:fixed;top:0;left:0;right:0;z-index:50;height:84px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 clamp(16px,3vw,44px);background:{{ headerBg }};box-shadow:{{ headerShadow }};transition:background .3s,box-shadow .3s;font-family:'Zen Kaku Gothic New',sans-serif">
  <a href="Shirafuji%20Admissions.dc.html" aria-label="白藤女子大学 トップへ" style="display:flex;align-items:center;gap:12px;color:#222;text-decoration:none">
    <span aria-hidden="true" style="position:relative;width:34px;height:34px;flex:none">
      <span style="position:absolute;left:4px;top:4px;width:22px;height:22px;background:#d63672;transform:rotate(45deg);border-radius:3px"></span>
      <span style="position:absolute;left:14px;top:12px;width:16px;height:16px;background:#2a86c9;transform:rotate(45deg);border-radius:2px;opacity:.9"></span>
    </span>
    <span style="display:flex;flex-direction:column;line-height:1.15">
      <span style="font-size:22px;font-weight:700;letter-spacing:.06em">白藤女子大学</span>
      <span style="font-family:Barlow,sans-serif;font-size:10px;letter-spacing:.18em;color:#555">SHIRAFUJI WOMEN'S UNIVERSITY</span>
    </span>
  </a>
  <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
    <nav aria-label="メインナビゲーション" style="display:flex;align-items:center;gap:clamp(16px,2vw,30px)">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
        <a href="{{ n.href }}" aria-current="{{ n.aria }}" style="position:relative;font-size:14px;font-weight:700;letter-spacing:.08em;padding:8px 0;color:{{ n.color }};text-decoration:none" style-hover="color:#d63672">{{ n.label }}<span aria-hidden="true" style="position:absolute;left:0;bottom:0;height:2px;background:#d63672;width:{{ n.bar }};transition:width .3s"></span></a>
      </sc-for>
      <a href="Admissions.dc.html#oc" style="display:flex;align-items:center;gap:10px;background:#d63672;color:#fff;font-size:14px;font-weight:700;letter-spacing:.08em;padding:12px 22px;border-radius:999px;transition:background .2s;text-decoration:none" style-hover="background:#b8235a;color:#fff">オープンキャンパス予約
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </nav>
  </sc-if>
  <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" aria-label="メニューを開く" style="width:48px;height:48px;border-radius:50%;border:none;background:#d63672;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer">
      <span style="width:18px;height:2px;background:#fff"></span>
      <span style="width:18px;height:2px;background:#fff"></span>
      <span style="width:18px;height:2px;background:#fff"></span>
    </button>
  </sc-if>
</header>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-label="メニュー" style="position:fixed;inset:0;z-index:60;background:#fff;display:flex;flex-direction:column;padding:24px 28px;font-family:'Zen Kaku Gothic New',sans-serif;overflow:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;height:60px">
      <span style="font-size:20px;font-weight:700;letter-spacing:.06em">白藤女子大学</span>
      <button onClick="{{ toggleMenu }}" aria-label="メニューを閉じる" style="width:48px;height:48px;border-radius:50%;border:1px solid #ddd;background:#fff;font-size:22px;cursor:pointer">×</button>
    </div>
    <nav style="display:flex;flex-direction:column;margin-top:24px">
      <a href="Shirafuji%20Admissions.dc.html" style="display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid #e6e9ed;font-size:17px;font-weight:700;letter-spacing:.08em;color:#222;text-decoration:none">トップ<span style="font-family:Barlow,sans-serif;font-size:11px;color:#d63672;letter-spacing:.14em">TOP</span></a>
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
        <a href="{{ n.href }}" style="display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid #e6e9ed;font-size:17px;font-weight:700;letter-spacing:.08em;color:{{ n.color }};text-decoration:none">{{ n.label }}<span style="font-family:Barlow,sans-serif;font-size:11px;color:#d63672;letter-spacing:.14em">{{ n.en }}</span></a>
      </sc-for>
    </nav>
    <a href="Admissions.dc.html#oc" onClick="{{ closeMenu }}" style="margin-top:32px;text-align:center;background:#d63672;color:#fff;font-weight:700;letter-spacing:.08em;padding:18px;border-radius:999px;text-decoration:none">オープンキャンパス予約</a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1440px&quot;,&quot;height&quot;:&quot;120px&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;about&quot;,&quot;academics&quot;,&quot;campus&quot;,&quot;voices&quot;,&quot;admissions&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: window.innerWidth, scrolled: false, menuOpen: false };
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth });
    this.onScroll = () => { const s = window.scrollY > 40; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };
    window.addEventListener('resize', this.onResize);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onScroll();
    // Shared motion engine: scroll reveal + parallax for every page that mounts the header
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      const el = e.target; this.io.unobserve(el);
      el.style.opacity = '1'; el.style.translate = '0 0'; el.style.clipPath = 'inset(0 0 0 0)';
    }), { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    this.scan = () => {
      if (reduce) return;
      document.querySelectorAll('[data-reveal]:not([data-rv])').forEach(el => {
        el.setAttribute('data-rv', '');
        const kind = el.getAttribute('data-reveal');
        const sibs = el.parentElement ? [...el.parentElement.children].filter(c => c.hasAttribute('data-reveal')) : [el];
        const delay = (Math.max(0, sibs.indexOf(el)) % 4) * 110;
        const ez = 'cubic-bezier(.2,.7,.2,1)';
        el.style.transition = `opacity .9s ${ez} ${delay}ms, translate .9s ${ez} ${delay}ms, clip-path 1.2s cubic-bezier(.7,0,.2,1) ${delay}ms`;
        el.style.opacity = '0';
        if (kind === 'wipeR') { el.style.opacity = '1'; el.style.clipPath = 'inset(0 100% 0 0)'; }
        else if (kind === 'wipeL') { el.style.opacity = '1'; el.style.clipPath = 'inset(0 0 0 100%)'; }
        else if (kind !== 'fade') el.style.translate = '0 36px';
        this.io.observe(el);
      });
    };
    this.onPar = () => {
      if (reduce) return;
      const vh = window.innerHeight;
      document.querySelectorAll('[data-parallax]').forEach(el => {
        const r = el.getBoundingClientRect();
        el.style.translate = `${((r.top + r.height / 2 - vh / 2) * parseFloat(el.getAttribute('data-parallax'))).toFixed(1)}px 0`;
      });
    };
    let t; this.mo = new MutationObserver(() => { clearTimeout(t); t = setTimeout(() => { this.scan(); this.onPar(); }, 60); });
    this.mo.observe(document.body, { childList: true, subtree: true });
    window.addEventListener('scroll', this.onPar, { passive: true });
    this.scan(); this.onPar();
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('scroll', this.onPar);
    this.io && this.io.disconnect(); this.mo && this.mo.disconnect();
  }
  renderVals() {
    const cur = this.props.current ?? '';
    const mobile = this.state.w < 1080;
    const items = [
      { key: 'about', label: '理念・特色', en: 'ABOUT', href: 'About.dc.html' },
      { key: 'academics', label: '学部・学科', en: 'ACADEMICS', href: 'Academics.dc.html' },
      { key: 'campus', label: 'キャンパスライフ', en: 'CAMPUS LIFE', href: 'CampusLife.dc.html' },
      { key: 'voices', label: '先輩の声', en: 'VOICES', href: 'Voices.dc.html' },
      { key: 'admissions', label: '入試情報', en: 'ADMISSIONS', href: 'Admissions.dc.html' }
    ];
    return {
      desktop: !mobile, mobile,
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
      headerBg: this.state.scrolled || this.state.menuOpen ? 'rgba(255,255,255,.96)' : 'transparent',
      headerShadow: this.state.scrolled ? '0 2px 16px rgba(30,40,60,.08)' : 'none',
      nav: items.map(n => ({ ...n, color: n.key === cur ? '#d63672' : '#222', bar: n.key === cur ? '100%' : '0', aria: n.key === cur ? 'page' : undefined }))
    };
  }
}
</script>
</body>
</html>
