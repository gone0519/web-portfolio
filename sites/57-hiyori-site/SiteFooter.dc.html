<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="background:#141210;border-top:1px solid rgba(179,155,92,.25);color:#ece6da;font-family:'Zen Kaku Gothic New',sans-serif">
  <div style="max-width:1120px;margin:0 auto;padding:72px 24px 40px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:48px">
    <div style="display:flex;flex-direction:column;gap:22px;min-width:260px">
      <a href="Top.dc.html" style="display:flex;align-items:center;gap:14px;color:#ece6da">
        <span style="width:30px;height:30px;background:#9e3b2a;color:#f3e9dc;display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho',serif;font-size:14px;font-weight:600;border-radius:2px">旬</span>
        <span style="font-family:'Shippori Mincho',serif;font-size:18px;letter-spacing:.24em">旬彩 ひより</span>
      </a>
      <div style="display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.9;letter-spacing:.05em;color:#bdb5a6">
        <span>〒000-0000　〇〇県〇〇市〇〇町0-0-0</span>
        <span>TEL　00-0000-0000</span>
        <span>17:00〜23:00（L.O. 22:30）／ 毎週〇曜日定休</span>
      </div>
    </div>
    <nav aria-label="フッターナビゲーション" style="display:grid;grid-template-columns:repeat(3,auto);column-gap:clamp(28px,4vw,56px);row-gap:18px;align-content:start">
      <a href="Top.dc.html" style="display:flex;flex-direction:column;gap:2px;color:#ece6da" style-hover="color:#d2bd84"><span style="font-family:'Shippori Mincho',serif;font-size:14px;letter-spacing:.16em">トップ</span><span style="font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.26em;color:#a8956a">TOP</span></a>
      <a href="Concept.dc.html" style="display:flex;flex-direction:column;gap:2px;color:#ece6da" style-hover="color:#d2bd84"><span style="font-family:'Shippori Mincho',serif;font-size:14px;letter-spacing:.16em">想い</span><span style="font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.26em;color:#a8956a">CONCEPT</span></a>
      <a href="Menu.dc.html" style="display:flex;flex-direction:column;gap:2px;color:#ece6da" style-hover="color:#d2bd84"><span style="font-family:'Shippori Mincho',serif;font-size:14px;letter-spacing:.16em">お品書き</span><span style="font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.26em;color:#a8956a">MENU</span></a>
      <a href="Drink.dc.html" style="display:flex;flex-direction:column;gap:2px;color:#ece6da" style-hover="color:#d2bd84"><span style="font-family:'Shippori Mincho',serif;font-size:14px;letter-spacing:.16em">お飲み物</span><span style="font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.26em;color:#a8956a">DRINK</span></a>
      <a href="Space.dc.html" style="display:flex;flex-direction:column;gap:2px;color:#ece6da" style-hover="color:#d2bd84"><span style="font-family:'Shippori Mincho',serif;font-size:14px;letter-spacing:.16em">店内</span><span style="font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.26em;color:#a8956a">SPACE</span></a>
      <a href="Access.dc.html" style="display:flex;flex-direction:column;gap:2px;color:#ece6da" style-hover="color:#d2bd84"><span style="font-family:'Shippori Mincho',serif;font-size:14px;letter-spacing:.16em">店舗情報・ご予約</span><span style="font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.26em;color:#a8956a">ACCESS</span></a>
    </nav>
  </div>
  <div style="max-width:1120px;margin:0 auto;padding:24px 24px 40px;display:flex;justify-content:space-between;align-items:center;gap:24px;border-top:1px solid rgba(236,230,218,.08)">
    <span style="font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.16em;color:#9a917f">© SHUNSAI HIYORI. ALL RIGHTS RESERVED</span>
    <button onClick="{{ toTop }}" aria-label="ページの先頭へ" style="width:54px;height:54px;border-radius:50%;border:1px solid rgba(179,155,92,.5);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .3s" style-hover="background:rgba(179,155,92,.15)">
      <span style="width:10px;height:10px;border-top:1px solid #d2bd84;border-left:1px solid #d2bd84;transform:translateY(3px) rotate(45deg)"></span>
    </button>
  </div>
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <div style="height:64px"></div>
    <div style="position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:1fr 1fr;height:60px;border-top:1px solid rgba(179,155,92,.35)">
      <a href="tel:00-0000-0000" style="display:flex;align-items:center;justify-content:center;background:rgba(10,9,8,.94);color:#ece6da;font-family:'Shippori Mincho',serif;font-size:14px;letter-spacing:.16em">電話する</a>
      <a href="Access.dc.html#reservation" style="display:flex;align-items:center;justify-content:center;background:#a89968;color:#fff;font-family:'Shippori Mincho',serif;font-size:14px;letter-spacing:.16em">ご予約はこちら</a>
    </div>
  </sc-if>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;320px&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280 };
  componentDidMount() { this.onResize = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.onResize); }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  renderVals() {
    return { isMobile: this.state.w < 1000, toTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }) };
  }
}
</script>
</body>
</html>
