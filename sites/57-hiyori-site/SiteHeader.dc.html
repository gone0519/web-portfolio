<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:fixed;top:0;left:0;right:0;z-index:50;background:{{ headerBg }};transition:background .5s ease;backdrop-filter:{{ headerBlur }}">
  <div style="max-width:1120px;margin:0 auto;padding:0 24px;height:76px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px">
    <a href="Top.dc.html" style="display:flex;align-items:center;gap:12px;color:#ece6da;opacity:{{ logoOpacity }};transition:opacity .4s ease">
      <span style="width:26px;height:26px;background:#9e3b2a;color:#f3e9dc;display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho',serif;font-size:13px;font-weight:600;border-radius:2px">旬</span>
      <span style="font-family:'Shippori Mincho',serif;font-size:17px;letter-spacing:.24em;font-weight:600;white-space:nowrap">旬彩 ひより</span>
    </a>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="メインナビゲーション" style="display:flex;gap:clamp(18px,2.4vw,34px)">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
          <a href="{{ l.href }}" aria-current="{{ l.aria }}" style="color:{{ l.color }};display:flex;flex-direction:column;align-items:center;gap:2px"><span style="font-family:'Shippori Mincho',serif;font-size:14px;letter-spacing:.18em">{{ l.jp }}</span><span style="font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.28em;color:#a8956a">{{ l.en }}</span></a>
        </sc-for>
      </nav>
      <div style="display:flex;justify-content:flex-end">
        <a href="Access.dc.html#reservation" style="display:inline-flex;align-items:center;height:42px;padding:0 22px;white-space:nowrap;border:1px solid #b39b5c;outline:1px solid rgba(179,155,92,.35);outline-offset:3px;color:#ece6da;font-family:'Shippori Mincho',serif;font-size:13px;letter-spacing:.16em;transition:background .3s" style-hover="background:rgba(179,155,92,.18);color:#fff">ご予約</a>
      </div>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <span></span>
      <div style="display:flex;justify-content:flex-end">
        <button onClick="{{ toggleMenu }}" aria-label="メニューを開く" aria-expanded="{{ menuOpen }}" style="width:48px;height:48px;background:transparent;border:1px solid rgba(236,230,218,.5);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;cursor:pointer">
          <span style="width:20px;height:1px;background:#ece6da"></span>
          <span style="width:20px;height:1px;background:#ece6da"></span>
          <span style="width:12px;height:1px;background:#ece6da;margin-left:8px"></span>
        </button>
      </div>
    </sc-if>
  </div>
</header>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:60;background:#0a0908;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px">
    <button onClick="{{ closeMenu }}" aria-label="メニューを閉じる" style="position:absolute;top:14px;right:24px;width:48px;height:48px;background:transparent;border:1px solid rgba(236,230,218,.5);color:#ece6da;font-size:20px;cursor:pointer">×</button>
    <nav style="display:flex;flex-direction:row-reverse;gap:30px;height:280px">
      <a href="Top.dc.html" style="writing-mode:vertical-rl;font-family:'Shippori Mincho',serif;font-size:20px;letter-spacing:.3em;color:#ece6da">トップ</a>
      <a href="Concept.dc.html" style="writing-mode:vertical-rl;font-family:'Shippori Mincho',serif;font-size:20px;letter-spacing:.3em;color:#ece6da">想い</a>
      <a href="Menu.dc.html" style="writing-mode:vertical-rl;font-family:'Shippori Mincho',serif;font-size:20px;letter-spacing:.3em;color:#ece6da">お品書き</a>
      <a href="Drink.dc.html" style="writing-mode:vertical-rl;font-family:'Shippori Mincho',serif;font-size:20px;letter-spacing:.3em;color:#ece6da">お飲み物</a>
      <a href="Space.dc.html" style="writing-mode:vertical-rl;font-family:'Shippori Mincho',serif;font-size:20px;letter-spacing:.3em;color:#ece6da">店内</a>
      <a href="Access.dc.html" style="writing-mode:vertical-rl;font-family:'Shippori Mincho',serif;font-size:20px;letter-spacing:.3em;color:#ece6da">店舗情報</a>
    </nav>
    <a href="Access.dc.html#reservation" style="display:inline-flex;align-items:center;justify-content:center;width:220px;height:56px;background:#a89968;color:#fff;font-family:'Shippori Mincho',serif;font-size:15px;letter-spacing:.16em">ご予約はこちら</a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;120px&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;concept&quot;,&quot;menu&quot;,&quot;drink&quot;,&quot;space&quot;,&quot;access&quot;,&quot;reservation&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, scrolled: false, menuOpen: false };
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth });
    this.onScroll = () => { const s = window.scrollY > 60; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };
    window.addEventListener('resize', this.onResize);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onScroll();
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('scroll', this.onScroll);
  }
  renderVals() {
    const cur = this.props.current ?? 'top';
    const isMobile = this.state.w < 1000;
    const solid = this.state.scrolled;
    const L = [
      ['concept', '想い', 'CONCEPT', 'Concept.dc.html'],
      ['menu', '品書', 'MENU', 'Menu.dc.html'],
      ['drink', '酒', 'DRINK', 'Drink.dc.html'],
      ['space', '空間', 'SPACE', 'Space.dc.html'],
      ['access', '店舗', 'ACCESS', 'Access.dc.html'],
      ['reservation', '予約', 'RESERVATION', 'Access.dc.html#reservation'],
    ];
    return {
      isMobile, isDesktop: !isMobile,
      links: L.map(([k, jp, en, href]) => ({ jp, en, href, color: k === cur ? '#d2bd84' : '#ece6da', aria: k === cur ? 'page' : undefined })),
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
      headerBg: solid ? 'rgba(10,9,8,.86)' : 'transparent',
      headerBlur: solid ? 'blur(8px)' : 'none',
      logoOpacity: cur !== 'top' || solid ? 1 : 0,
    };
  }
}
</script>
</body>
</html>
