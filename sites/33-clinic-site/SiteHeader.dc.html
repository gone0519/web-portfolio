<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<nav aria-label="メインメニュー" style="background:#eef3f7;border-bottom:1px solid #dde6ee;font-family:'Shippori Mincho',serif">
  <div style="max-width:1040px;margin:0 auto;padding:0 clamp(14px,4vw,20px);height:72px;display:flex;align-items:center;justify-content:space-between;gap:clamp(10px,3vw,20px)">
    <a href="Top.dc.html" style="display:flex;align-items:center;gap:clamp(7px,2vw,10px);color:#13396a;text-decoration:none;min-width:0">
      <span style="width:34px;height:34px;flex:none;border-radius:50%;border:2px solid #3a86bd;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#13396a">は</span>
      <span style="display:flex;flex-direction:column;line-height:1.3;min-width:0"><span style="font-size:clamp(9px,2.4vw,10px);letter-spacing:.14em;color:#3a86bd">内科・小児科・アレルギー科</span><span style="font-size:clamp(14px,3.8vw,17px);font-weight:600;letter-spacing:.08em">はるねファミリークリニック</span></span>
    </a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:26px">
        <a href="About.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;font-size:13px;letter-spacing:.1em;color:#13396a;text-decoration:none;transition:color .2s" style-hover="color:#3a86bd">当院について<span style="font-size:9px;color:#3a86bd;letter-spacing:.12em">About</span><sc-if value="{{ onAbout }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:-12px;height:1px;background:#13396a"></span></sc-if></a>
        <a href="Services.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;font-size:13px;letter-spacing:.1em;color:#13396a;text-decoration:none;transition:color .2s" style-hover="color:#3a86bd">診療案内<span style="font-size:9px;color:#3a86bd;letter-spacing:.12em">Treatment</span><sc-if value="{{ onServices }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:-12px;height:1px;background:#13396a"></span></sc-if></a>
        <a href="Doctor.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;font-size:13px;letter-spacing:.1em;color:#13396a;text-decoration:none;transition:color .2s" style-hover="color:#3a86bd">医師・院内紹介<span style="font-size:9px;color:#3a86bd;letter-spacing:.12em">Doctor</span><sc-if value="{{ onDoctor }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:-12px;height:1px;background:#13396a"></span></sc-if></a>
        <a href="Access.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;font-size:13px;letter-spacing:.1em;color:#13396a;text-decoration:none;transition:color .2s" style-hover="color:#3a86bd">アクセス<span style="font-size:9px;color:#3a86bd;letter-spacing:.12em">Access</span><sc-if value="{{ onAccess }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:-12px;height:1px;background:#13396a"></span></sc-if></a>
        <a href="Contact.dc.html" style="padding:10px 18px;background:#13396a;color:#fff;font-size:13px;letter-spacing:.12em;border:1px solid #13396a;text-decoration:none;transition:all .3s" style-hover="background:#fff;color:#13396a">WEB予約</a>
      </div>
    </sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-label="メニュー" aria-expanded="{{ menuOpen }}" style="width:52px;height:44px;border:1px solid #13396a;background:#fff;color:#13396a;font-family:inherit;font-size:11px;letter-spacing:.08em;cursor:pointer">{{ menuLabel }}</button>
    </sc-if>
  </div>
  <sc-if value="{{ showMobileMenu }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;background:#fff;border-top:1px solid #dde6ee">
      <a href="Top.dc.html" style="padding:16px 24px;border-bottom:1px solid #eef3f7;font-size:15px;letter-spacing:.12em;color:#13396a;text-decoration:none">HOME</a>
      <a href="About.dc.html" style="padding:16px 24px;border-bottom:1px solid #eef3f7;font-size:15px;letter-spacing:.12em;color:#13396a;text-decoration:none">当院について</a>
      <a href="Services.dc.html" style="padding:16px 24px;border-bottom:1px solid #eef3f7;font-size:15px;letter-spacing:.12em;color:#13396a;text-decoration:none">診療案内</a>
      <a href="Doctor.dc.html" style="padding:16px 24px;border-bottom:1px solid #eef3f7;font-size:15px;letter-spacing:.12em;color:#13396a;text-decoration:none">医師・院内紹介</a>
      <a href="Access.dc.html" style="padding:16px 24px;border-bottom:1px solid #eef3f7;font-size:15px;letter-spacing:.12em;color:#13396a;text-decoration:none">アクセス</a>
      <a href="Contact.dc.html" style="padding:16px 24px;border-bottom:1px solid #eef3f7;font-size:15px;letter-spacing:.12em;color:#13396a;text-decoration:none">ご予約・お問い合わせ</a>
      <a href="tel:0312345678" style="margin:16px 24px 20px;height:50px;display:flex;align-items:center;justify-content:center;background:#13396a;color:#fff;font-size:17px;letter-spacing:.1em;text-decoration:none">tel.03-1234-5678</a>
    </div>
  </sc-if>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:72},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;about&quot;,&quot;services&quot;,&quot;doctor&quot;,&quot;access&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { mobile: false, menu: false };
  onResize = () => { const m = window.innerWidth < 960; if (m !== this.state.mobile) this.setState({ mobile: m, menu: false }); };
  componentDidMount() {
    this.onResize();
    window.addEventListener('resize', this.onResize);
    this.ro = new ResizeObserver(this.onResize);
    this.ro.observe(document.documentElement);
    this.t = setTimeout(this.onResize, 300);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); this.ro && this.ro.disconnect(); clearTimeout(this.t); }
  renderVals() {
    const c = this.props.current || '';
    const { mobile, menu } = this.state;
    return {
      desktop: !mobile, mobile, menuOpen: menu, showMobileMenu: mobile && menu, menuLabel: menu ? '閉じる' : 'MENU',
      toggleMenu: () => this.setState(s => ({ menu: !s.menu })),
      onAbout: c === 'about', onServices: c === 'services', onDoctor: c === 'doctor', onAccess: c === 'access'
    };
  }
}
</script>
</body>
</html>
