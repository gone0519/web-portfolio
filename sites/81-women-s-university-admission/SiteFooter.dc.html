<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="font-family:'Zen Kaku Gothic New',sans-serif;color:#1E2A3A">
<sc-if value="{{ showCta }}" hint-placeholder-val="{{ true }}">
  <section aria-label="受験生のみなさんへ" style="padding:clamp(56px,7vw,88px) clamp(20px,5vw,48px) 0">
    <div style="max-width:1040px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px">
      <a href="OpenCampus.dc.html" style="display:flex;flex-direction:column;gap:10px;padding:28px 30px;background:#DD4318;color:#fff;border:1.5px solid #1E2A3A;box-shadow:8px 8px 0 #1E2A3A" style-hover="transform:translate(3px,3px);box-shadow:5px 5px 0 #1E2A3A;color:#fff">
        <span style="font-family:Archivo;font-weight:900;font-style:italic;font-size:30px;line-height:1">Open Campus</span>
        <span style="display:flex;justify-content:space-between;font-size:16px;font-weight:900"><span>オープンキャンパスを予約する</span><span style="font-family:Archivo">→</span></span>
      </a>
      <a href="Admissions.dc.html" style="display:flex;flex-direction:column;gap:10px;padding:28px 30px;background:#29B4E6;color:#1E2A3A;border:1.5px solid #1E2A3A;box-shadow:8px 8px 0 #1E2A3A" style-hover="transform:translate(3px,3px);box-shadow:5px 5px 0 #1E2A3A;color:#1E2A3A">
        <span style="font-family:Archivo;font-weight:900;font-style:italic;font-size:30px;line-height:1;color:#fff;-webkit-text-stroke:1px #1E2A3A">Admissions</span>
        <span style="display:flex;justify-content:space-between;font-size:16px;font-weight:900"><span>入試情報・資料請求</span><span style="font-family:Archivo">→</span></span>
      </a>
    </div>
  </section>
</sc-if>
<footer style="padding:clamp(48px,6vw,72px) clamp(16px,4vw,48px)">
  <div style="max-width:1040px;margin:0 auto;background-color:#EEF1F3;background-image:radial-gradient(circle,rgba(30,42,58,.06) 1px,transparent 1.2px);background-size:8px 8px;border:1.5px solid #1E2A3A;padding:clamp(32px,5vw,56px) clamp(20px,4vw,48px);display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center">
    <a href="Top.dc.html" style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;justify-content:center;color:#1E2A3A">
      <span style="font-family:Archivo;font-weight:900;font-size:28px;color:#DD4318;letter-spacing:-.02em">SEIRAN</span>
      <span style="font-size:15px;font-weight:900">青嵐女子大学</span>
    </a>
    <nav aria-label="フッター" style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px 24px">
      <a href="Top.dc.html" style="font-size:13px;font-weight:700;color:#1E2A3A" style-hover="color:#DD4318">トップ</a>
      <a href="About.dc.html" style="font-size:13px;font-weight:700;color:#1E2A3A" style-hover="color:#DD4318">大学紹介</a>
      <a href="Academics.dc.html" style="font-size:13px;font-weight:700;color:#1E2A3A" style-hover="color:#DD4318">学部・学科</a>
      <a href="CampusLife.dc.html" style="font-size:13px;font-weight:700;color:#1E2A3A" style-hover="color:#DD4318">キャンパスライフ</a>
      <a href="Admissions.dc.html" style="font-size:13px;font-weight:700;color:#1E2A3A" style-hover="color:#DD4318">入試情報</a>
      <a href="OpenCampus.dc.html" style="font-size:13px;font-weight:700;color:#1E2A3A" style-hover="color:#DD4318">オープンキャンパス</a>
    </nav>
    <a href="#" style="display:flex;align-items:center;justify-content:space-between;gap:20px;width:min(100%,320px);height:54px;padding:0 26px;border-radius:999px;background:#fff;color:#1E2A3A;font-size:13px;font-weight:700;border:1.5px solid #1E2A3A;box-shadow:4px 4px 0 #1E2A3A" style-hover="background:#1E2A3A;color:#fff"><span>大学公式サイトはこちら</span><span style="font-family:Archivo">↗</span></a>
    <div style="display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:1.8;color:#3a4757">
      <span>入試課（仮）　〒000-0000 所在地は公式情報に差し替え</span>
      <span>TEL 00-0000-0000（仮）　受付 平日 9:00–17:00（仮）</span>
    </div>
    <div style="display:flex;gap:10px">
      <a href="#" aria-label="X" style="width:34px;height:34px;border-radius:50%;background:#1E2A3A;color:#fff;display:grid;place-items:center;font-family:Archivo;font-weight:800;font-size:11px" style-hover="background:#DD4318;color:#fff">X</a>
      <a href="#" aria-label="Instagram" style="width:34px;height:34px;border-radius:50%;background:#1E2A3A;color:#fff;display:grid;place-items:center;font-family:Archivo;font-weight:800;font-size:11px" style-hover="background:#DD4318;color:#fff">IG</a>
      <a href="#" aria-label="YouTube" style="width:34px;height:34px;border-radius:50%;background:#1E2A3A;color:#fff;display:grid;place-items:center;font-family:Archivo;font-weight:800;font-size:11px" style-hover="background:#DD4318;color:#fff">YT</a>
      <a href="#" aria-label="LINE" style="width:34px;height:34px;border-radius:50%;background:#1E2A3A;color:#fff;display:grid;place-items:center;font-family:Archivo;font-weight:800;font-size:11px" style-hover="background:#DD4318;color:#fff">LN</a>
    </div>
    <p style="margin:0;font-size:11px;color:#5b6b7c">※本サイト内の日程・連絡先・沿革等は仮の内容です。公開前に公式情報へ差し替えてください。</p>
    <span style="font-family:Archivo;font-weight:700;font-size:10px;letter-spacing:.08em">© SEIRAN WOMEN'S UNIVERSITY All Rights Reserved.</span>
  </div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;720px&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() { return { showCta: this.props.cta ?? true }; }
}
</script>
</body>
</html>
