<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="padding:10px clamp(10px,1.4vw,16px);display:flex;gap:10px;align-items:stretch;background:rgba(222,240,252,0.86);backdrop-filter:blur(10px);font-family:'Zen Kaku Gothic New',sans-serif">
  <a href="Sora%20Womens%20University.dc.html" aria-label="蒼空女子大学 トップページへ" style="flex:none;width:clamp(58px,6vw,74px);background:#fff;border:2px solid #0b3a91;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-decoration:none" style-focus="outline:3px solid #3fa6ec;outline-offset:2px">
    <div style="display:flex"><div style="width:22px;height:22px;border-radius:50%;border:4px solid #3fa6ec"></div><div style="width:22px;height:22px;border-radius:50%;border:4px solid #0b3a91;margin-left:-9px"></div></div>
    <div style="font-family:Montserrat,sans-serif;font-weight:800;font-size:9px;color:#0b3a91;line-height:1">SORA</div>
  </a>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="メインナビゲーション" style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:6px">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
          <a href="{{ n.href }}" aria-current="{{ n.aria }}" style="display:flex;align-items:center;gap:10px;padding:7px 10px;background:{{ n.bg }};border:1px solid {{ n.bd }};border-radius:6px;text-decoration:none;transition:background .2s,border-color .2s" style-hover="background:#fff;border-color:#0b3a91" style-focus="outline:3px solid #3fa6ec;outline-offset:1px">
            <span style="flex:none;width:26px;height:26px;border:1.5px solid #0b3a91;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:Montserrat,sans-serif;font-size:10px;font-weight:800;color:#0b3a91">{{ n.no }}</span>
            <span style="display:flex;flex-direction:column;line-height:1.2;min-width:0">
              <span style="font-family:Montserrat,sans-serif;font-weight:600;font-size:11px;color:#0b3a91;white-space:nowrap">{{ n.en }}</span>
              <span style="font-size:10px;color:#3d5b8f;white-space:nowrap">{{ n.jp }}</span>
            </span>
          </a>
        </sc-for>
        <a href="Admissions.dc.html#request" style="display:flex;align-items:center;gap:10px;padding:7px 16px;background:#0b3a91;color:#fff;border-radius:6px;font-weight:700;font-size:13px;white-space:nowrap;text-decoration:none;transition:background .2s" style-hover="background:#3fa6ec;color:#fff" style-focus="outline:3px solid #3fa6ec;outline-offset:2px">資料請求<span style="width:18px;height:18px;background:#fff;color:#0b3a91;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:12px">›</span></a>
      </nav>
    </sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;gap:6px;align-items:stretch">
        <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:4px 10px;background:rgba(255,255,255,0.7);border:1px solid #b6d9f2;border-radius:6px;line-height:1.2">
          <span style="font-weight:900;font-size:14px;color:#0b3a91">蒼空女子大学</span>
          <span style="font-family:Montserrat,sans-serif;font-size:9px;font-weight:600;color:#2b86c9">SORA WOMEN'S UNIVERSITY</span>
        </div>
        <button onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" aria-controls="mnav" aria-label="メニューを開閉" style="width:52px;background:#0b3a91;color:#fff;border:0;border-radius:6px;font-family:Montserrat,sans-serif;font-weight:800;font-size:10px;cursor:pointer" style-focus="outline:3px solid #3fa6ec;outline-offset:2px">{{ menuLabel }}</button>
      </div>
    </sc-if>
    <div style="display:flex;gap:6px;align-items:center">
      <div style="flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:5px 10px;background:rgba(255,255,255,0.7);border:1px solid #b6d9f2;border-radius:6px;font-size:11px">
        <span style="font-family:Montserrat,sans-serif;font-weight:600;color:#0b3a91">News</span>
        <a href="OpenCampus.dc.html" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:underline;color:#0b3a91">20XX.XX.XX オープンキャンパス 2027 の予約受付を開始しました（※サンプル）</a>
      </div>
      <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
        <a href="OpenCampus.dc.html#reserve" style="flex:none;width:200px;display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:#fff;border:1px solid #0b3a91;border-radius:6px;font-size:11px;font-weight:700;color:#0b3a91;text-decoration:none" style-hover="background:#e4f2fc">オープンキャンパス予約<span style="width:14px;height:14px;background:#0b3a91;color:#fff;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px">›</span></a>
      </sc-if>
    </div>
  </div>
</header>
<sc-if value="{{ showMobileMenu }}" hint-placeholder-val="{{ false }}">
  <nav id="mnav" aria-label="モバイルナビゲーション" style="position:fixed;top:96px;left:10px;right:10px;z-index:60;background:#fff;border:2px solid #0b3a91;border-radius:10px;padding:10px;display:grid;gap:6px;box-shadow:0 20px 40px rgba(11,58,145,.2);font-family:'Zen Kaku Gothic New',sans-serif">
    <a href="Sora%20Womens%20University.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px;min-height:48px;border-bottom:1px solid #d6e9f7;text-decoration:none;color:#0b2f73;font-weight:700;font-size:15px">トップ</a>
    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
      <a href="{{ n.href }}" style="display:flex;align-items:center;gap:12px;padding:12px;min-height:48px;border-bottom:1px solid #d6e9f7;text-decoration:none;color:#0b2f73">
        <span style="font-family:Montserrat,sans-serif;font-weight:800;font-size:12px;color:#2b86c9">{{ n.no }}</span>
        <span style="font-weight:700;font-size:15px">{{ n.jp }}</span>
        <span style="margin-left:auto;font-family:Montserrat,sans-serif;font-size:10px;color:#6b85b3">{{ n.en }}</span>
      </a>
    </sc-for>
    <a href="Admissions.dc.html#request" style="padding:14px;background:#0b3a91;color:#fff;border-radius:6px;text-align:center;font-weight:700;text-decoration:none">資料請求</a>
  </nav>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:110},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;about&quot;,&quot;academics&quot;,&quot;campus&quot;,&quot;admissions&quot;,&quot;opencampus&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, menuOpen: false };
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth, menuOpen: window.innerWidth >= 1120 ? false : this.state.menuOpen });
    window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  renderVals() {
    const { w, menuOpen } = this.state;
    const cur = this.props.current ?? '';
    const mobile = w < 1120;
    const items = [
      { key: 'about', href: 'About.dc.html', no: '01', en: 'About', jp: '大学について' },
      { key: 'academics', href: 'Academics.dc.html', no: '02', en: 'Academics', jp: '学部・学科' },
      { key: 'campus', href: 'CampusLife.dc.html', no: '03', en: 'Campus Life', jp: 'キャンパスライフ' },
      { key: 'admissions', href: 'Admissions.dc.html', no: '04', en: 'Admissions', jp: '入試情報' },
      { key: 'opencampus', href: 'OpenCampus.dc.html', no: '05', en: 'Open Campus', jp: 'オープンキャンパス' },
    ];
    return {
      mobile, desktop: !mobile, menuOpen, showMobileMenu: mobile && menuOpen, menuLabel: menuOpen ? 'CLOSE' : 'MENU',
      toggleMenu: () => this.setState({ menuOpen: !menuOpen }),
      nav: items.map(n => ({ ...n, aria: n.key === cur ? 'page' : undefined, bg: n.key === cur ? '#fff' : 'rgba(255,255,255,0.7)', bd: n.key === cur ? '#0b3a91' : '#b6d9f2' })),
    };
  }
}
</script>
</body>
</html>
