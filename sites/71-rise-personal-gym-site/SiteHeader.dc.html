<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px)">
  <div style="max-width:1240px;margin:0 auto;padding:14px clamp(20px,4vw,40px);display:flex;align-items:center;gap:32px">
    <a href="Top.dc.html" style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;flex-shrink:0;color:#1A1A1A;text-decoration:none">
      <span style="font-family:Montserrat;font-weight:900;font-style:italic;font-size:34px;letter-spacing:-1px;line-height:1">RISE<span style="color:#E63B24">/</span></span>
      <span style="font-family:Montserrat;font-weight:700;font-size:9px;letter-spacing:2.4px">PERSONAL GYM</span>
    </a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;gap:26px;flex:1;font-size:14px;font-weight:700">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
          <a href="{{ l.href }}" style="position:relative;padding:6px 0;color:#1A1A1A;text-decoration:none;transition:color .2s" style-hover="color:#E63B24">{{ l.label }}<sc-if value="{{ l.active }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:-2px;height:3px;background:linear-gradient(90deg,#E63B24,#EF7A1F)"></span></sc-if></a>
        </sc-for>
      </nav>
      <a href="Contact.dc.html" style="display:flex;align-items:center;gap:10px;padding:14px 26px;border-radius:999px;background:linear-gradient(90deg,#E63B24,#EF7A1F);color:#fff;font-size:13px;font-weight:700;text-decoration:none;transition:transform .25s, box-shadow .25s" style-hover="transform:translateY(-2px);box-shadow:0 10px 24px rgba(230,59,36,.3);color:#fff">無料カウンセリング・体験予約 <span style="font-family:Montserrat">→</span></a>
    </sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <div style="flex:1"></div>
      <button onClick="{{ toggleMenu }}" aria-label="メニュー" style="width:48px;height:48px;border:none;border-radius:50%;background:#1A1A1A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer">
        <span style="width:18px;height:2px;background:#fff"></span><span style="width:18px;height:2px;background:#fff"></span><span style="width:18px;height:2px;background:#fff"></span>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ menuVisible }}" hint-placeholder-val="{{ false }}">
    <nav style="display:flex;flex-direction:column;padding:8px 24px 24px;background:#fff;border-top:1px solid #eee">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
        <a href="{{ l.href }}" style="padding:16px 0;border-bottom:1px solid #eee;font-weight:700;color:#1A1A1A;text-decoration:none;display:flex;justify-content:space-between">{{ l.label }}<span style="font-family:Montserrat;color:#E63B24">→</span></a>
      </sc-for>
      <a href="Contact.dc.html" style="margin-top:20px;padding:16px;border-radius:999px;background:linear-gradient(90deg,#E63B24,#EF7A1F);color:#fff;font-weight:700;text-align:center;text-decoration:none">無料カウンセリング・体験予約 →</a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;100px&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;concept&quot;,&quot;programs&quot;,&quot;results&quot;,&quot;trainers&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;animations&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, menu: false };
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onResize);
    if (this.props.animations === false || !('IntersectionObserver' in window)) return;
    this.io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.translate = '0 0'; this.io.unobserve(e.target); }
    }), { threshold: 0.12 });
    const scan = () => document.querySelectorAll('[data-reveal]:not([data-rv])').forEach(el => {
      el.setAttribute('data-rv', '1');
      if (el.getBoundingClientRect().top < window.innerHeight) return;
      el.style.opacity = '0'; el.style.translate = '0 28px';
      el.style.transition = (el.style.transition ? el.style.transition + ',' : '') + 'opacity .9s cubic-bezier(.2,.7,.2,1), translate .9s cubic-bezier(.2,.7,.2,1)';
      this.io.observe(el);
    });
    let n = 0; this.t = setInterval(() => { scan(); if (++n > 10) clearInterval(this.t); }, 400);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); clearInterval(this.t); this.io && this.io.disconnect(); }
  renderVals() {
    const mobile = this.state.w < 960, cur = this.props.current;
    const links = [['concept','コンセプト','Concept.dc.html'],['programs','プログラム','Programs.dc.html'],['results','お客様の変化','Results.dc.html'],['trainers','トレーナー','Trainers.dc.html'],['contact','予約・アクセス','Contact.dc.html']]
      .map(([k,label,href]) => ({ label, href, active: k === cur }));
    return { links, desktop: !mobile, mobile, menuVisible: mobile && this.state.menu, toggleMenu: () => this.setState(s => ({ menu: !s.menu })) };
  }
}
</script>
</body>
</html>
