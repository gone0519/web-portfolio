<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,700;0,800;0,900;1,900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:#1A1A1A;font-family:"Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#1A1A1A;text-decoration:none}
a:hover{color:#E63B24}
</style>
</helmet>
<dc-import name="SiteHeader" current="trainers" hint-size="100%,86px"></dc-import>
<main>
<section data-screen-label="Trainers hero" style="position:relative;background:#F2F2F2;margin-top:20px;overflow:hidden">
  <div aria-hidden="true" style="position:absolute;right:-2vw;bottom:-2vw;font-family:Montserrat;font-weight:900;font-size:clamp(90px,17vw,260px);line-height:1;color:#E8E8E8;letter-spacing:-4px;white-space:nowrap;pointer-events:none">TRAINERS</div>
  <div style="position:relative;max-width:1240px;margin:0 auto;padding:clamp(40px,6vw,80px) clamp(20px,4vw,40px) clamp(56px,7vw,96px);display:flex;flex-wrap:wrap;gap:40px;align-items:center">
    <div style="flex:1 1 480px;min-width:0">
      <div style="font-family:Montserrat;font-size:12px;font-weight:700;letter-spacing:1px;color:#777"><a href="Top.dc.html" style="color:#777">TOP</a> / TRAINERS</div>
      <h1 data-reveal="1" style="margin:20px 0 0;font-family:Montserrat;font-weight:900;font-size:clamp(40px,6vw,76px);line-height:1;letter-spacing:-1px">TRAINERS</h1>
      <div data-reveal="1" style="margin-top:28px;background:linear-gradient(100deg,#E63B24,#EF7A1F);clip-path:polygon(0 0,100% 0,90% 100%,0 100%);color:#fff;padding:28px 16% 28px 32px">
        <p style="margin:0;font-size:clamp(20px,2.4vw,30px);font-weight:900;letter-spacing:2px;line-height:1.5">経験豊富なトレーナーのみ在籍。</p>
        <p style="margin:10px 0 0;font-size:14px;line-height:1.9;font-weight:500">資格と指導実績、そして人柄。あなたの目標に合う担当者をお選びします。</p>
      </div>
    </div>
    <div data-reveal="1" style="flex:1 1 380px;min-width:0;height:clamp(300px,34vw,440px)"><image-slot id="trainers-hero" mask="polygon(24% 0,100% 0,76% 100%,0 100%)" placeholder="トレーナー集合写真"></image-slot></div>
  </div>
</section>

<section data-screen-label="Trainer list" style="padding:clamp(72px,9vw,120px) 0">
  <div style="max-width:1240px;margin:0 auto;padding:0 clamp(20px,4vw,40px)">
    <div style="display:flex;align-items:center;gap:14px;font-family:Montserrat;font-weight:700;font-size:12px;letter-spacing:1.5px"><span style="width:28px;height:1px;background:#1A1A1A"></span>OUR TEAM</div>
    <h2 data-reveal="1" style="margin:18px 0 0;font-family:Montserrat;font-weight:900;font-size:clamp(32px,4.4vw,54px);line-height:1.2">RISE GYM<br><span style="font-family:'Noto Sans JP';background:linear-gradient(transparent 55%,#EF7A1F 55%);padding:0 4px 0 0">のトレーナー</span></h2>
    <div style="display:flex;flex-direction:column;gap:clamp(56px,7vw,88px);margin-top:56px">
      <sc-for list="{{ trainers }}" as="t" hint-placeholder-count="4">
        <article data-reveal="1" style="display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,48px);align-items:flex-start">
          <div style="flex:0 1 320px;min-width:240px;height:400px;border-radius:6px;overflow:hidden"><image-slot id="trainer-{{ t.key }}" shape="rect" placeholder="トレーナー写真"></image-slot></div>
          <div style="flex:1 1 380px;min-width:0">
            <div style="display:inline-block;background:#1A1A1A;color:#fff;font-size:12px;font-weight:700;padding:6px 16px;border-radius:999px">{{ t.role }}</div>
            <h3 style="margin:18px 0 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;font-size:26px;font-weight:900;border-left:5px solid #E63B24;padding-left:16px">{{ t.name }}<span style="font-family:Montserrat;font-size:11px;font-weight:500;color:#888">{{ t.en }}</span></h3>
            <p style="margin:20px 0 0;font-size:15px;line-height:2.1">{{ t.bio }}</p>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:24px;padding:22px 24px;background:#F2F2F2;border-radius:6px">
              <div>
                <div style="font-size:13px;font-weight:900;display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;background:#1A1A1A"></span>保有資格</div>
                <p style="margin:8px 0 0;font-size:13px;line-height:1.9;color:#333">{{ t.cert }}</p>
              </div>
              <div>
                <div style="font-size:13px;font-weight:900;display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;background:#1A1A1A"></span>得意分野</div>
                <p style="margin:8px 0 0;font-size:13px;line-height:1.9;color:#333">{{ t.spec }}</p>
              </div>
            </div>
            <p style="margin:18px 0 0;font-size:14px;line-height:1.9;font-weight:700"><span style="background:linear-gradient(90deg,#E63B24,#EF7A1F);color:#fff;padding:2px 6px;margin-right:8px">MESSAGE</span>{{ t.msg }}</p>
          </div>
        </article>
      </sc-for>
    </div>
  </div>
</section>
</main>
<dc-import name="SiteFooter" hint-size="100%,520px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      trainers: [
        { key: 't1', role: '代表 / ヘッドトレーナー', name: '高橋 誠', en: 'Makoto Takahashi', bio: 'トレーナー歴15年。延べ3,000名以上のダイエット・ボディメイクを担当。RISEのプログラム設計とトレーナー育成を統括し、現在も現場でお客様を指導しています。', cert: 'NSCA-CSCS / 健康運動指導士', spec: 'ボディメイク、筋力トレーニング', msg: '一度身につけた習慣は、一生の財産になります。' },
        { key: 't2', role: 'シニアトレーナー', name: '中村 さくら', en: 'Sakura Nakamura', bio: '管理栄養士の資格を持つトレーナー。食事とトレーニングの両面から、女性の体づくりをサポート。産後のボディケアにも対応します。', cert: '管理栄養士 / NESTA-PFT', spec: 'ダイエット、食事指導、ヒップライン', msg: '我慢しすぎない食事で、きれいに変わりましょう。' },
        { key: 't3', role: 'トレーナー', name: '佐藤 健太', en: 'Kenta Sato', bio: '元・大学アメフト部のストレングスコーチ。動作分析をもとにした姿勢改善とファンクショナルトレーニングを得意とし、腰痛・肩こりに悩む方を多く担当。', cert: 'NSCA-CPT / 柔道整復師', spec: '姿勢改善、ファンクショナル', msg: '痛みのない体で、毎日を軽くしましょう。' },
        { key: 't4', role: 'トレーナー', name: '小林 美咲', en: 'Misaki Kobayashi', bio: 'フィットネス大会での入賞経験を持つトレーナー。運動初心者の女性を中心に、無理のないペースでのボディメイクを得意としています。', cert: 'NESTA-PFT / JATI-ATI', spec: 'ボディメイク、初心者指導', msg: '運動が苦手な方ほど、一緒に楽しみながら進めます。' },
      ],
    };
  }
}
</script>
</body>
</html>
