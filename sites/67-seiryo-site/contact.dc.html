<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Montserrat:ital,wght@0,700;0,800;0,900;1,800&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./site.css">
<script src="./image-slot.js"></script>
<style>
html{scroll-behavior:smooth}
body{margin:0;font-family:"Noto Sans JP",sans-serif;color:#1f1f1f;background:#fff;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#2f7d2c}
a:hover{color:#1f5e1d}
h1,h2,h3,h4,p{margin:0}
</style>
</helmet>
<dc-import name="SiteHeader" current="contact" hint-size="100%,72px"></dc-import>
<main>
<dc-import name="PageHero" slot="contact" num="PAGE 05" en="FAQ &amp; CONTACT" ja="よくある質問・お問い合わせ" lead="受験生・保護者の方からよくいただくご質問をまとめました。解決しない場合は、資料請求・オープンキャンパス予約・各種お問い合わせのフォームをご利用ください。" img1="入試課の相談窓口" img2="資料・パンフレット" img1-src="img/31-students-three-portrait.jpg" img2-src="img/13-classroom-files.jpg" badge-en="FREE" badge-ja="資料請求は無料です" hint-size="100%,560px"></dc-import>

<section data-screen-label="FAQ" style="padding:clamp(64px,8vw,104px) 24px">
  <div style="max-width:880px;margin:0 auto">
    <div data-reveal="" style="text-align:center;margin-bottom:32px">
      <div class="wm" style="font-family:Montserrat,sans-serif;font-weight:900;font-size:clamp(52px,7vw,88px);line-height:.9;color:#ece8e1">FAQ</div>
      <h2 style="font-size:18px;font-weight:900;margin-top:-22px;position:relative">よくある質問</h2>
      <img src="img/illust/worried-woman.png" alt="" style="display:block;width:min(200px,55%);height:auto;margin:24px auto 0">
    </div>
    <div data-reveal="" style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:28px">
      <sc-for list="{{ cats }}" as="c" hint-placeholder-count="4">
        <button onClick="{{ c.pick }}" style="border:2px solid #1f1f1f;background:{{ c.bg }};color:{{ c.color }};border-radius:999px;padding:8px 18px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer">{{ c.label }}</button>
      </sc-for>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <sc-for list="{{ faqs }}" as="f" hint-placeholder-count="6">
        <div style="border:2px solid #1f1f1f;border-radius:18px;background:{{ f.bg }};overflow:hidden">
          <button onClick="{{ f.toggle }}" style="width:100%;display:flex;align-items:center;gap:14px;padding:16px 20px;background:none;border:0;font-family:inherit;font-size:14px;font-weight:700;text-align:left;cursor:pointer;color:#1f1f1f">
            <span style="width:28px;height:28px;flex:none;border-radius:50%;background:#1a1a1a;color:#fff;display:grid;place-items:center;font-family:Montserrat,sans-serif;font-size:12px;font-weight:800">Q</span>
            <span style="flex:1">{{ f.q }}</span>
            <span style="width:28px;height:28px;flex:none;border-radius:50%;border:1.5px solid #1f1f1f;display:grid;place-items:center;font-size:16px">{{ f.icon }}</span>
          </button>
          <sc-if value="{{ f.open }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;gap:14px;padding:0 20px 20px;font-size:13.5px;line-height:1.95;color:#444">
              <span style="width:28px;height:28px;flex:none;border-radius:50%;background:#3e9a3c;color:#fff;display:grid;place-items:center;font-family:Montserrat,sans-serif;font-size:12px;font-weight:800">A</span>
              <span>{{ f.a }}</span>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>
</section>

<section id="form" data-screen-label="Form" style="background:#f3eada;padding:clamp(64px,8vw,104px) 24px;border-radius:clamp(32px,6vw,80px) clamp(32px,6vw,80px) 0 0;scroll-margin-top:72px">
  <div style="max-width:1040px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(28px,4vw,56px);align-items:start">
    <div data-reveal="">
      <p style="font-family:Montserrat,sans-serif;font-size:12px;font-weight:800;color:#3e9a3c;letter-spacing:.24em">CONTACT</p>
      <h2 style="font-family:'Zen Kaku Gothic New',sans-serif;font-size:clamp(22px,2.6vw,28px);font-weight:900;margin:6px 0 18px">お問い合わせ・資料請求</h2>
      <p style="font-size:13.5px;line-height:2;color:#4a4a4a;margin-bottom:24px">ご用件を選んで必要事項をご入力ください。お電話でのご相談も受け付けています。</p>
      <div style="background:#fff;border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:6px">
        <p style="font-size:12px;font-weight:700;color:#2f7d2c">入試課（平日 9:00〜17:00）</p>
        <p style="font-family:Montserrat,sans-serif;font-weight:900;font-size:26px">☎ 000-000-0000</p>
        <p style="font-size:12px;color:#777">MAIL nyushi@example.ac.jp ※ダミーです</p>
      </div>
      <img src="img/illust/idea-pair.png" alt="" style="display:block;width:min(340px,100%);height:auto;margin:32px auto 0">
    </div>
    <div data-reveal="" style="background:#fff;border-radius:28px;padding:clamp(22px,3vw,32px);box-shadow:0 20px 50px rgba(31,74,30,.1)">
      <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#f3eada;border-radius:16px;padding:5px;margin-bottom:22px">
          <sc-for list="{{ kinds }}" as="k" hint-placeholder-count="3">
            <button onClick="{{ k.pick }}" style="border:0;background:{{ k.bg }};color:{{ k.color }};border-radius:12px;padding:12px 6px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer">{{ k.label }}</button>
          </sc-for>
        </div>
        <form onSubmit="{{ submit }}" style="display:flex;flex-direction:column;gap:14px;font-size:13px">
          <label style="display:flex;flex-direction:column;gap:6px;font-weight:700">お名前 <input required style="padding:13px 14px;border:1.5px solid #ccc;border-radius:12px;font:inherit;font-weight:400"></label>
          <label style="display:flex;flex-direction:column;gap:6px;font-weight:700">メールアドレス<input type="email" required style="padding:13px 14px;border:1.5px solid #ccc;border-radius:12px;font:inherit;font-weight:400"></label>
          <label style="display:flex;flex-direction:column;gap:6px;font-weight:700">ご区分<select style="padding:13px 14px;border:1.5px solid #ccc;border-radius:12px;font:inherit;font-weight:400;background:#fff"><option>高校生・既卒生</option><option>保護者</option><option>高校教員</option></select></label>
          <sc-if value="{{ isDoc }}">
            <label style="display:flex;flex-direction:column;gap:6px;font-weight:700">ご住所（資料送付先）<input required style="padding:13px 14px;border:1.5px solid #ccc;border-radius:12px;font:inherit;font-weight:400"></label>
          </sc-if>
          <sc-if value="{{ isOC }}">
            <label style="display:flex;flex-direction:column;gap:6px;font-weight:700">参加希望日<select style="padding:13px 14px;border:1.5px solid #ccc;border-radius:12px;font:inherit;font-weight:400;background:#fff"><option>○月○日（○）全学部オープンキャンパス</option><option>○月○日（○）入試対策オープンキャンパス</option></select></label>
          </sc-if>
          <sc-if value="{{ isQ }}">
            <label style="display:flex;flex-direction:column;gap:6px;font-weight:700">お問い合わせ内容<textarea required rows="4" style="padding:13px 14px;border:1.5px solid #ccc;border-radius:12px;font:inherit;font-weight:400;resize:vertical"></textarea></label>
          </sc-if>
          <button type="submit" style="margin-top:6px;border:0;background:#3e9a3c;color:#fff;font-family:inherit;font-weight:700;font-size:14px;padding:15px;border-radius:999px;cursor:pointer;box-shadow:0 5px 0 #1f5e1d">{{ submitLabel }}</button>
        </form>
      </sc-if>
      <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
        <div style="text-align:center;padding:28px 0">
          <img src="img/illust/hooray-girl.png" alt="" style="display:block;width:150px;height:auto;margin:0 auto">
          <h3 style="font-family:'Zen Kaku Gothic New',sans-serif;font-size:20px;font-weight:900;margin:16px 0 8px">送信が完了しました</h3>
          <p style="font-size:13px;color:#555;line-height:1.9;margin-bottom:20px">ご入力いただいたメールアドレスに確認メールをお送りします。（サンプル動作）</p>
          <button onClick="{{ reset }}" style="border:2px solid #1f1f1f;background:#fff;border-radius:999px;padding:10px 22px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer">別の内容で送る</button>
        </div>
      </sc-if>
    </div>
  </div>
</section>
</main>
<dc-import name="SiteFooter" slot="contact" hint-size="100%,900px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { cat: 'all', open: 0, kind: 'doc', sent: false };
  componentDidMount() {
    const t = new URLSearchParams(location.search).get('type');
    if (t === 'oc' || t === 'q') { this.setState({ kind: t }); setTimeout(() => { const el = document.getElementById('form'); el && window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 72 }); }, 300); }
  }
  faqs = [
    ['入試', '文系・理系どちらの学部も併願できますか？', '入試方式により異なります。一般選抜では複数学部の併願が可能な日程を設けています。詳しくは学生募集要項をご確認ください。'],
    ['入試', '推薦入試と総合型選抜の違いは何ですか？', '学校推薦型選抜は在籍校の推薦が必要で、学業成績などを重視します。総合型選抜は推薦が不要で、志望理由や活動実績、面接などから総合的に評価します。'],
    ['入試', '過去問題は入手できますか？', '資料請求またはオープンキャンパスで過去問題集をお渡ししています（サンプル）。'],
    ['学費', '奨学金はいつ申し込めますか？', '入学前に予約できる制度と、入学後に申請する制度があります。対象や時期は制度ごとに異なるため、募集要項でご確認ください。'],
    ['学費', '学費の分納はできますか？', '前期・後期の分納制度があります。詳しくは入試課へお問い合わせください。'],
    ['キャンパス', '保護者だけでオープンキャンパスに参加できますか？', 'はい、保護者の方のみのご参加も歓迎しています。保護者向けの説明会もご用意しています。'],
    ['キャンパス', '一人暮らしの学生向けの住まいはありますか？', '提携学生寮や近隣の物件紹介を行っています（内容はサンプル）。'],
    ['入試', '入試について個別に相談できますか？', '入試課で電話・メールによる個別相談を受け付けています。お気軽にお問い合わせください。']
  ];
  renderVals() {
    const s = this.state;
    const list = this.faqs.map((f, i) => ({ i, cat: f[0], q: f[1], a: f[2] })).filter(f => s.cat === 'all' || f.cat === s.cat);
    return {
      cats: ['all', '入試', '学費', 'キャンパス'].map(k => ({ label: k === 'all' ? 'すべて' : k, bg: s.cat === k ? '#1a1a1a' : '#fff', color: s.cat === k ? '#fff' : '#1f1f1f', pick: () => this.setState({ cat: k }) })),
      faqs: list.map(f => ({ ...f, open: s.open === f.i, icon: s.open === f.i ? '−' : '+', bg: s.open === f.i ? '#fbf6ec' : '#fff', toggle: () => this.setState({ open: s.open === f.i ? -1 : f.i }) })),
      kinds: [['doc', '資料請求'], ['oc', 'OC予約'], ['q', 'お問い合わせ']].map(([k, label]) => ({ label, bg: s.kind === k ? '#1a1a1a' : 'transparent', color: s.kind === k ? '#fff' : '#1f1f1f', pick: () => this.setState({ kind: k }) })),
      isDoc: s.kind === 'doc', isOC: s.kind === 'oc', isQ: s.kind === 'q',
      submitLabel: { doc: '資料を請求する', oc: '予約する', q: '送信する' }[s.kind],
      sent: s.sent, notSent: !s.sent,
      submit: (e) => { e.preventDefault(); this.setState({ sent: true }); }, reset: () => this.setState({ sent: false })
    };
  }
}
</script>
</body>
</html>
