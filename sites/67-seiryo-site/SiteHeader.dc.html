<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);box-shadow:0 1px 0 rgba(0,0,0,.06)">
  <div style="max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 0 0 24px;min-height:72px">
    <a href="Top.dc.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:#1f1f1f">
      <span style="width:46px;height:46px;border-radius:50%;background:#3e9a3c;color:#fff;display:grid;place-items:center;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:20px;box-shadow:inset 0 0 0 3px #fff,0 0 0 2px #3e9a3c">清</span>
      <span style="display:flex;flex-direction:column;line-height:1.1">
        <span style="font-family:Montserrat,sans-serif;font-weight:900;font-size:22px;letter-spacing:.01em">Seiryo<span style="color:#d7322b">.</span></span>
        <span style="font-size:10px;font-weight:700;letter-spacing:.12em">清陵大学 入試情報サイト</span>
      </span>
    </a>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:2px;height:72px">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
          <a href="{{ n.href }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 14px;border-radius:10px;text-decoration:none;color:{{ n.color }};background:{{ n.bg }};transition:background .25s,color .25s" style-hover="background:#f3eada;color:#2f7d2c">
            <span style="font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:.06em">{{ n.en }}</span>
            <span style="font-size:10px;font-weight:500;color:#777">{{ n.ja }}</span>
          </a>
        </sc-for>
        <a href="contact.dc.html" style="margin:0 16px 0 10px;background:#1a1a1a;color:#fff;font-weight:700;font-size:13px;padding:14px 22px;border-radius:999px;text-decoration:none;display:flex;align-items:center;gap:10px;transition:background .25s,transform .25s" style-hover="background:#2f7d2c;color:#fff;transform:translateY(-1px)"><span style="width:8px;height:8px;border-radius:50%;background:#7fd36f"></span>資料請求・お問い合わせ</a>
      </nav>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-label="メニュー" style="width:72px;height:72px;border:0;background:#1a1a1a;color:#fff;font-size:11px;font-family:Montserrat,sans-serif;font-weight:800;letter-spacing:.1em;cursor:pointer">{{ menuLabel }}</button>
    </sc-if>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="background:#fff;border-top:1px solid #eee;padding:8px 24px 24px;display:flex;flex-direction:column;max-height:calc(100vh - 72px);overflow-y:auto">
      <sc-for list="{{ nav }}" as="n">
        <a href="{{ n.href }}" style="display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #eee;text-decoration:none;color:#1f1f1f;font-weight:700;font-size:15px">{{ n.ja }}<span style="font-family:Montserrat,sans-serif;font-size:11px;color:#3e9a3c;letter-spacing:.1em">{{ n.en }}</span></a>
      </sc-for>
      <a href="contact.dc.html" style="margin-top:18px;background:#1a1a1a;color:#fff;font-weight:700;font-size:15px;padding:16px;border-radius:999px;text-align:center;text-decoration:none">資料請求・お問い合わせ</a>
    </div>
  </sc-if>
</header>
<div style="height:72px"></div>
<div ref="{{ progressRef }}" style="position:fixed;top:72px;left:0;right:0;height:3px;background:#3e9a3c;transform-origin:left;z-index:51;pointer-events:none"></div>
<div ref="{{ cursorRef }}" style="position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid #3e9a3c;background:rgba(62,154,60,.08);z-index:150;pointer-events:none;opacity:0;transition:width .25s,height .25s,margin .25s,background .25s,opacity .3s"></div>
<div ref="{{ curtainRef }}" style="position:fixed;inset:0;z-index:200;background:#3e9a3c;display:grid;place-items:center;pointer-events:none;transform:translateY(-100%)">
  <span style="display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff">
    <span style="width:72px;height:72px;border-radius:50%;background:#fff;color:#3e9a3c;display:grid;place-items:center;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:32px">清</span>
    <span style="font-family:Montserrat,sans-serif;font-weight:900;font-size:28px;letter-spacing:.04em">Seiryo<span style="color:#ffdcd9">.</span></span>
  </span>
</div>
<sc-if value="{{ showFloat }}" hint-placeholder-val="{{ false }}">
  <a href="contact.dc.html" style="position:fixed;right:20px;bottom:20px;z-index:60;background:#d7322b;color:#fff;font-weight:700;font-size:13px;padding:14px 22px;border-radius:999px;text-decoration:none;box-shadow:0 10px 24px rgba(215,50,43,.4);transition:transform .2s" style-hover="transform:translateY(-3px);color:#fff">無料で資料請求 →</a>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;80px&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;programs&quot;,&quot;exam&quot;,&quot;admission&quot;,&quot;campus&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;top&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, menuOpen: false, scrolled: false };
  progressRef = React.createRef(); cursorRef = React.createRef(); curtainRef = React.createRef();
  motion() {
    const EASE = 'cubic-bezier(.2,.7,.2,1)', POP = 'cubic-bezier(.34,1.56,.64,1)';
    const cur = this.curtainRef.current;
    if (cur) cur.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(0)', offset: .35 }, { transform: 'translateY(-100%)' }], { duration: 1100, easing: 'cubic-bezier(.7,0,.2,1)' });
    this.onClick = (e) => {
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a || e.metaKey || e.ctrlKey || e.shiftKey || a.target) return;
      const href = a.getAttribute('href');
      if (!/\.dc\.html/.test(href) || href.startsWith('#')) return;
      e.preventDefault();
      cur.animate([{ transform: 'translateY(100%)' }, { transform: 'translateY(0)' }], { duration: 550, easing: 'cubic-bezier(.7,0,.2,1)', fill: 'forwards' }).onfinish = () => { location.href = href; };
    };
    document.addEventListener('click', this.onClick, true);
    // hero intro (top page)
    const h1 = document.querySelector('#top h1');
    if (h1) {
      [...document.querySelectorAll('#top [id^="hero-"]')].map(s => s.parentElement).forEach((t, i) => t.animate([{ opacity: 0, scale: .6 }, { opacity: 1, scale: 1 }], { duration: 700, delay: 300 + ((i * 7) % 18) * 45, easing: POP, fill: 'backwards' }));
      [...h1.children].forEach((c, i) => c.animate([{ opacity: 0, translate: '0 50px', filter: 'blur(8px)' }, { opacity: 1, translate: '0 0', filter: 'blur(0)' }], { duration: 900, delay: 700 + i * 140, easing: EASE, fill: 'backwards' }));
      const blob = h1.nextElementSibling;
      if (blob) {
        blob.animate([{ opacity: 0, scale: .3, rotate: '-12deg' }, { opacity: 1, scale: 1, rotate: '0deg' }], { duration: 1000, delay: 1100, easing: POP, fill: 'backwards' });
        blob.firstElementChild && blob.firstElementChild.animate([{ rotate: '0deg', scale: 1 }, { rotate: '6deg', scale: 1.04 }, { rotate: '0deg', scale: 1 }], { duration: 7000, iterations: Infinity, easing: 'ease-in-out' });
        blob.querySelectorAll('a[href]').forEach((b, i) => b.animate([{ opacity: 0, scale: .5 }, { opacity: 1, scale: 1 }], { duration: 600, delay: 1600 + i * 110, easing: POP, fill: 'backwards' }));
      }
      const tiles = [...document.querySelectorAll('#top [id^="hero-"]')];
      tiles.forEach((s, i) => {
        const dir = i % 4, dx = [12, -12, 0, 0][dir], dy = [0, 0, 10, -10][dir];
        s.animate([{ scale: 1, translate: '0 0' }, { scale: 1.18, translate: `${dx}px ${dy}px` }], { duration: 9000 + (i % 5) * 1700, delay: (i % 6) * -1300, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });
      });
      const grid = tiles[0] && tiles[0].parentElement.parentElement;
      if (grid) {
        grid.style.scale = '1.06';
        let mx = 0, my = 0, gx = 0, gy = 0;
        this.onHeroMove = (e) => { mx = (e.clientX / innerWidth - .5) * -24; my = (e.clientY / innerHeight - .5) * -18; };
        document.addEventListener('mousemove', this.onHeroMove);
        const hl = () => { gx += (mx - gx) * .06; gy += (my - gy) * .06; grid.style.translate = `${gx}px ${gy}px`; grid.style.scale = String(1.06 + Math.min(scrollY, 800) * .00025); this.raf3 = requestAnimationFrame(hl); };
        hl();
        this.flash = setInterval(() => {
          const t = tiles[Math.floor(Math.random() * tiles.length)].parentElement;
          t.animate([{ filter: 'brightness(1) saturate(1)', scale: 1 }, { filter: 'brightness(1.25) saturate(1.3)', scale: .94, offset: .4 }, { filter: 'brightness(1) saturate(1)', scale: 1 }], { duration: 1400, easing: 'cubic-bezier(.34,1.56,.64,1)' });
        }, 900);
      }
      const st = document.querySelector('#top > button');
      if (st) { st.animate([{ opacity: 0, scale: 0, rotate: '-180deg' }, { opacity: 1, scale: 1, rotate: '0deg' }], { duration: 1000, delay: 2100, easing: POP, fill: 'backwards' }); st.animate([{ translate: '0 0' }, { translate: '0 -10px' }, { translate: '0 0' }], { duration: 3000, delay: 3100, iterations: Infinity, easing: 'ease-in-out' }); }
    }
    // scroll-triggered: animations are created only when the element enters the viewport,
    // so nothing is ever left hidden if the observer does not fire (fail-safe).
    const io = this.io = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting && typeof e.target.__anims === 'function') { e.target.__anims(); e.target.__anims = true; io.unobserve(e.target); } }), { threshold: 0.01 });
    const prep = (el, make) => { el.__anims = make; io.observe(el); };
    this.drift = [];
    const scan = () => {
      document.querySelectorAll('[data-reveal]').forEach(el => {
        if (el.__anims) return;
        const sib = [...el.parentElement.children].filter(x => x.hasAttribute('data-reveal'));
        const idx = sib.indexOf(el), pd = getComputedStyle(el.parentElement).display;
        let from = { opacity: 0, translate: '0 40px' };
        if (pd === 'grid' && sib.length === 2) from = { opacity: 0, translate: idx ? '60px 0' : '-60px 0' };
        else if (sib.length > 2) from = { opacity: 0, translate: '0 60px', scale: .94 };
        prep(el, () => el.animate([from, { opacity: 1, translate: '0 0', scale: 1 }], { duration: 900, delay: Math.min(idx * 110, 660), easing: EASE, fill: 'backwards' }));
      });
      document.querySelectorAll('image-slot').forEach(s => {
        const w = s.parentElement; if (!w || w.__anims || w.closest('#top > div') || w.style.opacity) return;
        prep(w, () => [
          w.animate([{ clipPath: 'inset(0 0 100% 0)' }, { clipPath: 'inset(0 0 0 0)' }], { duration: 1100, delay: 150, easing: 'cubic-bezier(.7,0,.2,1)', fill: 'backwards' }),
          s.animate([{ scale: 1.25 }, { scale: 1 }], { duration: 1600, delay: 150, easing: EASE, fill: 'backwards' })
        ]);
      });
      document.querySelectorAll('main div, footer div').forEach(el => {
        if (el.__wm || el.children.length > 1) return;
        const cs = getComputedStyle(el);
        if (parseFloat(cs.fontSize) < 48 || !/Montserrat/.test(cs.fontFamily) || !/^[A-Z&\s]+$/.test(el.textContent.trim())) return;
        el.__wm = true; this.drift.push(el);
        prep(el, () => el.animate([{ opacity: 0, letterSpacing: '.35em', filter: 'blur(6px)' }, { opacity: 1, letterSpacing: cs.letterSpacing === 'normal' ? '0em' : cs.letterSpacing, filter: 'blur(0)' }], { duration: 1400, easing: EASE, fill: 'backwards' }));
      });
      document.querySelectorAll('main div').forEach(el => {
        if (el.__dot || !/radial-gradient/.test(el.style.backgroundImage || '')) return;
        el.__dot = true; el.animate([{ translate: '0 0', rotate: '0deg' }, { translate: '12px -14px', rotate: '8deg' }, { translate: '0 0', rotate: '0deg' }], { duration: 9000, iterations: Infinity, easing: 'ease-in-out' });
      });
    };
    scan(); this.mo = new MutationObserver(() => { clearTimeout(this.t); this.t = setTimeout(scan, 80); });
    this.mo.observe(document.body, { childList: true, subtree: true });
    // scroll progress + watermark drift
    const tick = () => {
      const max = document.documentElement.scrollHeight - innerHeight, p = max > 0 ? scrollY / max : 0;
      if (this.progressRef.current) this.progressRef.current.style.scale = `${p} 1`;
      const vh = innerHeight;
      this.drift.forEach((el, i) => { const r = el.getBoundingClientRect(); if (r.bottom < -200 || r.top > vh + 200) return; el.style.translate = `${((r.top + r.height / 2) - vh / 2) * (i % 2 ? .12 : -.12)}px 0`; });
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
    // cursor + magnetic pills
    if (matchMedia('(pointer: fine)').matches) {
      const c = this.cursorRef.current; let x = -100, y = -100, cx = -100, cy = -100, mag = null;
      this.onMove = (e) => {
        x = e.clientX; y = e.clientY; c.style.opacity = 1;
        const t = e.target.closest && e.target.closest('a,button');
        const big = !!t;
        c.style.width = c.style.height = big ? '64px' : '34px'; c.style.margin = big ? '-32px 0 0 -32px' : '-17px 0 0 -17px'; c.style.background = big ? 'rgba(62,154,60,.18)' : 'rgba(62,154,60,.08)';
        const pill = t && parseFloat(getComputedStyle(t).borderTopLeftRadius) >= 100 && t.offsetWidth > 120 ? t : null;
        if (mag && mag !== pill) { mag.animate([{ translate: mag.style.translate || '0 0' }, { translate: '0 0' }], { duration: 400, easing: POP }); mag.style.translate = ''; }
        mag = pill;
        if (pill) { const r = pill.getBoundingClientRect(); pill.style.translate = `${(x - r.left - r.width / 2) * .18}px ${(y - r.top - r.height / 2) * .3}px`; }
      };
      document.addEventListener('mousemove', this.onMove);
      const loop = () => { cx += (x - cx) * .2; cy += (y - cy) * .2; c.style.transform = `translate(${cx}px,${cy}px)`; this.raf2 = requestAnimationFrame(loop); };
      loop();
    }
  }
  componentDidMount() {
    this.onR = () => this.setState({ w: window.innerWidth });
    this.onS = () => { const v = window.scrollY > 500; if (v !== this.state.scrolled) this.setState({ scrolled: v }); };
    window.addEventListener('resize', this.onR); window.addEventListener('scroll', this.onS, { passive: true });
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches && 'IntersectionObserver' in window) this.motion();
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); window.removeEventListener('scroll', this.onS); this.io && this.io.disconnect(); this.mo && this.mo.disconnect(); cancelAnimationFrame(this.raf); cancelAnimationFrame(this.raf2); cancelAnimationFrame(this.raf3); clearInterval(this.flash); this.onHeroMove && document.removeEventListener('mousemove', this.onHeroMove); document.removeEventListener('click', this.onClick, true); this.onMove && document.removeEventListener('mousemove', this.onMove); }
  renderVals() {
    const s = this.state, isMobile = s.w < 960, cur = this.props.current;
    const nav = [
      ['top', 'TOP', 'トップ', 'Top.dc.html'], ['programs', 'PROGRAMS', '学部・学科', 'programs.dc.html'],
      ['exam', 'EXAM', '入試対策', 'exam.dc.html'], ['admission', 'ADMISSION', '出願・学費', 'admission.dc.html'],
      ['campus', 'CAMPUS', 'キャンパス', 'campus.dc.html']
    ].map(([k, en, ja, href]) => ({ en, ja, href, color: k === cur ? '#2f7d2c' : '#1f1f1f', bg: k === cur ? '#f3eada' : 'transparent' }));
    return { progressRef: this.progressRef, cursorRef: this.cursorRef, curtainRef: this.curtainRef, nav, isMobile, isDesktop: !isMobile, menuOpen: isMobile && s.menuOpen, menuLabel: s.menuOpen ? 'CLOSE' : 'MENU', toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }), showFloat: s.scrolled && cur !== 'contact' };
  }
}
</script>
</body>
</html>
